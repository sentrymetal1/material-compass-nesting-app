<!DOCTYPE html>
<html lang="en">
<head>
<script src="/takeoff/mc-token.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Take-off Drawings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="/takeoff/takeoff-store.js?v=1.11"></script>
<!--
  DRAWING WORKSPACE (read-only). v0.4: two panes side by side, a part followed across every drawing
  it is on, and drawings where it is printed but not taken off. Step 1: The project's own drawings in the middle, the take-off
  lines beside them, grouped by drawing; click a line or a drawing and its sheet opens.
  Opened from the review page ("Drawings view"); it never edits or saves the take-off.
  Plan and mock-up: Projects/mc-product-tour/workspace.html. Step 2 adds highlights on the sheet.
-->
<style>
:root{--brand:#5286B4;--bar:#24476b;--ink:#16202a;--mute:#5b6b7a;--line:#dde4ea;--card:#fff;--soft:#eef4fa;--bg:#e9eef3;
--red:#c62828;--redbg:#fdecec;--grn:#1f7a3d;--grnbg:#e8f6ed;--ylw:#a15c00;--ylwbg:#fff6e5}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.45 Inter,"Segoe UI",system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;min-height:34px;padding:0 12px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:1px}
button:disabled{opacity:.5;cursor:default}
.app{display:grid;grid-template-rows:auto auto auto minmax(0,1fr);height:100vh}
/* AI Take-off Assistant: the steps as tabs, and what this take-off has done as a line of chips. */
.atabs{display:flex;gap:2px;padding:0 10px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.atabs button{display:flex;align-items:center;gap:7px;border:0;border-radius:0;background:transparent;min-height:44px;padding:0 12px;font-size:14px;color:#44525f;white-space:nowrap;border-bottom:3px solid transparent}
.atabs button:hover{background:var(--soft)}
.atabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--brand)}
.atabs .n{width:21px;height:21px;border-radius:50%;display:inline-grid;place-items:center;font-size:11.5px;font-weight:700;background:#e3e9ef;color:#44525f}
.atabs button.on .n{background:var(--brand);color:#fff}
.atabs .bd{font-size:11.5px;font-weight:600;border-radius:99px;padding:1px 8px;background:#eef2f5;color:#44525f}
.atabs .bd.ok{background:var(--grnbg);color:#1f6b37}.atabs .bd.warn{background:#fff1dc;color:#8a4b00}.atabs .bd.bad{background:var(--redbg);color:#a32020}
.atabs .ask{margin-left:auto;align-self:center;min-height:34px;border:1px solid var(--brand);border-radius:8px;color:#1d4670;font-weight:600;padding:0 12px;border-bottom-width:1px}
.atabs .ask.on{background:var(--brand);color:#fff}
.savechip{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;white-space:nowrap}
.savechip.ok{color:var(--grn)}.savechip.warn{color:#a26a00}.savechip.bad{color:var(--red)}
.savechip button{font:inherit;font-size:12px;font-weight:700;padding:3px 12px;border-radius:6px;border:1px solid #5286B4;background:#5286B4;color:#fff;cursor:pointer}
.savechip button:disabled{opacity:.5;cursor:default}
.stat{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 14px;background:var(--soft);border-bottom:1px solid var(--line);font-size:12.5px}
.stat b{color:#24476b;margin-right:4px}
.stat button{min-height:26px;border-radius:99px;padding:0 10px;font-size:12px;font-weight:600;border:1px solid}
.stat .ok{background:var(--grnbg);border-color:#b7dfc4;color:#1f6b37}.stat .warn{background:var(--ylwbg);border-color:#f0cf94;color:#8a4b00}
.stat .bad{background:var(--redbg);border-color:#f3b7b7;color:#a32020}.stat .plain{background:#fff;border-color:#c9d3dc;color:#44525f}
.main[hidden],.host[hidden],.host iframe[hidden]{display:none}
.host{display:flex;flex-direction:column;min-height:0;background:#fff}
.host iframe{flex:1;width:100%;border:0;min-height:0}
.host .hosthd{display:none;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.host.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;z-index:30;box-shadow:-12px 0 30px -14px #0007}
.host.drawer .hosthd,.host.ai .hosthd{display:flex}
.phide{float:right;min-height:28px;font-size:12px;padding:0 8px;margin:-4px -4px 6px 8px}
.pshow{position:absolute;right:10px;top:10px;z-index:5;min-height:34px;font-size:13px;font-weight:600;border-color:var(--brand);color:#1d4670;box-shadow:0 4px 14px -6px #0004}
.pshow[hidden]{display:none}
.main.nopanel,.main.notk{grid-template-columns:48px minmax(0,1fr)}.main.nopanel .panel,.main.notk .panel{display:none}
.main.notk .pshow{display:none}
.hostmsg{flex:1;display:grid;place-items:center;padding:24px;text-align:center;color:var(--mute);background:var(--bg)}.hostmsg[hidden]{display:none}
.hostmsg div{max-width:440px;background:#fff;border-radius:12px;padding:18px 22px;box-shadow:0 6px 24px -10px #0004}.hostmsg b{color:var(--ink)}
.bar{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--bar);color:#fff;flex-wrap:wrap}
.bar .job{font-weight:600;line-height:1.2;max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .job small{display:block;font-weight:400;opacity:.8;font-size:12px}
.nav{display:flex;align-items:center;gap:4px;background:#1a3754;border-radius:8px;padding:3px}
.nav button{background:transparent;border:0;color:#fff;min-height:32px;padding:0 10px}
.nav select{background:#fff;color:var(--ink);border:0;border-radius:6px;min-height:32px;padding:0 8px;font-size:14px;font-weight:600;max-width:320px}
.nav .of{font-size:12.5px;opacity:.85;padding:0 6px;white-space:nowrap}
.sp{margin-left:auto}
.bar a{color:#cfe0f0;font-size:13px;text-decoration:none}.bar a:hover{color:#fff}
.mapnote{display:flex;align-items:center;gap:8px;font-size:13px;background:#f3a712;color:#1d1300;border-radius:8px;padding:4px 6px 4px 10px}
.mapnote button{min-height:30px;border:0;background:#1d1300;color:#fff;font-weight:600}
.main{display:grid;grid-template-columns:48px minmax(0,1fr) 310px;min-height:0;position:relative}
.panel{font-size:12.5px}
.tools{display:flex;flex-direction:column;gap:6px;padding:10px 4px;background:var(--card);border-right:1px solid var(--line)}
.tools button{width:40px;height:40px;padding:0;display:grid;place-items:center;border:0;background:transparent}
.tools button:hover{background:var(--soft)}.tools button.on{background:var(--soft);color:#1d4670}
.tools svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stage{position:relative;overflow:hidden;background:#d5dce3;cursor:grab;touch-action:none;flex:1;min-height:0}
.stage.drag{cursor:grabbing}
.stages{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;background:#aab6c1;min-height:0}
.stages.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0}.pane[hidden]{display:none}
.phd{display:flex;align-items:center;gap:8px;padding:3px 6px 3px 12px;background:#eef2f6;border-bottom:1px solid var(--line);font-size:13px;min-height:34px}
.stages:not(.split) .phd{display:none}
.pane.on .phd{background:#dfeaf5;color:#1d4670;font-weight:600;box-shadow:inset 0 -3px 0 var(--brand)}
.phd button{min-height:28px;padding:0 8px;border:0;background:transparent}
.paper{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 6px 30px -8px #0005;background:#fff}
.paper canvas{display:block}
.topctl{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:3;max-width:calc(100% - 20px)}
.follow{display:flex;align-items:center;gap:6px;background:#173450;color:#fff;border-radius:10px;padding:3px 4px 3px 12px;font-size:13px;box-shadow:0 6px 18px -8px #0008;white-space:nowrap}
.follow[hidden]{display:none}.follow button{min-height:30px;border:0;background:#ffffff1f;color:#fff;padding:0 10px;font-size:15px}
.follow button:hover{background:#ffffff38}.follow .k{color:#cfe0f0;font-size:12.5px}
.msg[hidden]{display:none}
.msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--mute)}
.msg div{max-width:420px;background:var(--card);border-radius:12px;padding:18px 20px;box-shadow:0 6px 24px -10px #0004}
.msg b{color:var(--ink)}
.parts{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px;box-shadow:0 4px 14px -6px #0003}
.parts[hidden]{display:none}.parts button{min-height:30px;border:0;font-size:13px}.parts button.on{background:var(--brand);color:#fff;font-weight:600}
.zoomtag{position:absolute;left:10px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:12.5px;color:var(--mute)}
.panel{background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ph{padding:12px 14px;border-bottom:1px solid var(--line)}
.wc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;border-radius:10px;padding:10px 12px;border:1px solid}
.wc.bad{background:var(--redbg);border-color:var(--red)}.wc.ok{background:var(--grnbg);border-color:var(--grn)}.wc.none{background:var(--ylwbg);border-color:#e6b35a}
.wc small{display:block;font-size:12px;color:var(--mute)}.wc b{font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.wc.bad .d{color:var(--red)}.wc.ok .d{color:var(--grn)}
.wc p{grid-column:1/-1;margin:2px 0 0;font-size:12.5px}
.search{margin-top:10px;width:100%;min-height:38px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:#f6f8fa;font-size:15px}
.list{overflow:auto;flex:1;min-height:0}
.grp{display:flex;align-items:baseline;gap:8px;padding:9px 14px;font-size:13px;font-weight:700;background:#f6f8fa;border-bottom:1px solid var(--line);cursor:pointer;position:sticky;top:0;z-index:1}
.grp:hover{background:var(--soft)}.grp.on{background:#dfeaf5;color:#1d4670}
.grp .t{font-weight:400;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.grp .w{font-variant-numeric:tabular-nums;white-space:nowrap}
.grp .nf{color:var(--ylw);font-weight:600;font-size:12px;white-space:nowrap}
.row{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:1px 10px;padding:7px 14px;border-left:4px solid transparent;border-bottom:1px solid #f0f3f6;cursor:pointer}
.row:hover{background:var(--soft)}.row.sel{background:var(--soft);border-left-color:var(--brand)}
.row .m{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13.5px}
.row .w{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;font-size:13.5px}
.row .meta{grid-column:2/4;font-size:12.5px;color:var(--mute)}
.row.flag{border-left-color:var(--red)}.row .fl{grid-column:2/4;font-size:12.5px;color:var(--red);font-weight:600}
.srow{display:flex;gap:8px;align-items:center;margin-top:10px}.srow[hidden]{display:none}.srow .search{margin-top:0;flex:1}
.flagbtn{white-space:nowrap;color:var(--red);border-color:#f1b5b5;background:var(--redbg);font-weight:600;font-size:13px;min-height:38px}
.flagbtn.on{color:var(--ink);background:var(--card);border-color:var(--line)}.flagbtn[hidden]{display:none}
.foot{font-size:12px;color:var(--mute);padding:8px 14px;border-top:1px solid var(--line)}
/* Boxes on the sheet: where a part mark was read off the drawing. */
.ov{position:absolute;inset:0;pointer-events:none}
.ov i{position:absolute;border:2px dashed #1f63b0;background:#5286b42e;border-radius:3px;pointer-events:auto;cursor:pointer;box-shadow:0 0 0 2px #ffffffb0}
.ov i.cur{border-style:solid;border-color:#d97706;background:#f59e0b33;animation:blink 1.3s 2}
@keyframes blink{50%{opacity:.35}}
.ocr{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#cfe0f0}
/* Where used: the selected part across the whole job. */
.used{border-top:1px solid var(--line);background:#f8fafc;max-height:42%;overflow:auto;padding:10px 14px}
.used[hidden]{display:none}
.used h4{margin:0 0 2px;font-size:14px}.used .sub{font-size:12.5px;color:var(--mute);margin-bottom:8px}
.used .tot{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 8px;font-size:13px}.used .tot b{font-size:16px}
.used table{width:100%;border-collapse:collapse;font-size:13px}
.used th{font-size:11.5px;color:var(--mute);font-weight:600;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.used td{padding:5px 6px;border-bottom:1px solid #eef1f4;white-space:nowrap}
.used td.n,.used th.n{text-align:right;font-variant-numeric:tabular-nums}
.used tr.miss td{color:var(--ylw)}.used tr.miss td:first-child{font-weight:600}
.used tr.go{cursor:pointer}.used tr.go:hover td{background:var(--soft)}.used tr.here td{background:#dfeaf5;font-weight:600}
.used .note{font-size:11.5px;color:var(--mute);margin-top:6px}
.used .warn{color:var(--ylw);font-weight:600}
.ed{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13px}
.ed.add{border-color:#e6b35a;background:var(--ylwbg)}
.edh{font-weight:600;margin-bottom:4px}.ed .k{color:var(--mute);font-size:12.5px}
.edrow{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.ed input{font-size:15px;width:96px;min-height:32px;border:1px solid #c9d3dc;border-radius:6px;padding:0 6px;margin-left:4px}
.ed button{min-height:30px;font-size:12.5px;padding:0 10px;margin-left:6px}.ed button.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.edflag{color:var(--red);font-weight:600;margin-top:6px;font-size:12.5px}
.edmsg{font-size:12.5px;margin-top:4px;min-height:1em}.edmsg.ok{color:var(--grn);font-weight:600}.edmsg.bad{color:var(--red)}
/* The lines panel in the Assistant: small and quiet, the drawing is the focus (Mark 11-23:
   "too busy … smaller font"). About 11px text, one line per take-off line, explanations in tooltips. */
.panel{font-size:11px;line-height:1.35}
.panel .ph,.panel .cf{padding:8px 10px}
.panel .phide{min-height:22px;font-size:10.5px;padding:0 6px;margin:-2px -2px 4px 6px}
.panel .wc{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:5px 8px;border-radius:7px}
.panel .wc>div{display:flex;align-items:baseline;gap:4px}.panel .wc small{font-size:10px;display:inline}
.panel .wc b{font-size:11.5px}.panel .wc p{font-size:10.5px;flex-basis:100%;margin:0}.panel .wc.ok p{display:none}
.panel .search{font-size:11.5px;min-height:28px;padding:0 8px}.panel .srow{margin-top:6px}
.panel .flagbtn{font-size:11px;min-height:28px}
.panel .ptabs{margin-top:6px;padding:2px}.panel .ptabs button{font-size:11px;min-height:24px}
.panel .grp{font-size:11px;padding:5px 10px}
.panel .row{padding:3px 10px;grid-template-columns:48px minmax(0,1fr) auto}
.panel .row .m,.panel .row .s,.panel .row .w{font-size:11px}.panel .row .meta,.panel .row .fl{font-size:10px}
.panel .cfh{gap:6px}.panel .cfh h3{font-size:13px}.panel .cfh .t{font-size:10.5px}
.panel .cfs{font-size:9.5px;margin:9px 0 3px}.panel .iss{font-size:10.5px;padding:4px 7px;margin:3px 0}
.panel .cl{font-size:11px;grid-template-columns:12px 44px minmax(0,1fr) auto auto;gap:0 6px;align-items:center;padding:3px 2px}
.panel .cl .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel .cl .q{color:var(--mute);white-space:nowrap;font-size:10.5px;font-variant-numeric:tabular-nums}
.panel .cl .w{font-size:10.5px;min-width:42px}
.panel .cfbtn{font-size:12px;min-height:34px;margin-top:10px;border-radius:8px}.panel .pill{font-size:10px;padding:1px 7px}
.panel .cfdone,.panel .cfask{font-size:11px;padding:7px 8px;margin-top:10px}.panel .cfdone button,.panel .cfask button{min-height:24px;font-size:10.5px}
.panel .cmp{margin-top:6px;padding:4px 6px;gap:6px}.panel .cmp label{font-size:10.5px}
.panel .cmp select{min-height:24px;font-size:11px}.panel .cmp .k{font-size:10.5px}
.panel .cmpnote{font-size:10.5px}.panel .cmpnote button{min-height:22px;font-size:10.5px}
.panel .cmpnew{font-size:11px;padding:6px}.panel .cmpnew input,.panel .cmpnew select{min-height:24px;font-size:11px}.panel .cmpnew button{min-height:24px;font-size:11px}
.panel .ed{font-size:11px;padding:6px 8px;margin:6px 0}.panel .edh{margin-bottom:3px}
.panel .edrow{gap:4px 10px}.panel .ed input{font-size:11.5px;min-height:24px;width:64px}
.panel .ed button{min-height:22px;font-size:10.5px}.panel .edflag,.panel .edmsg{font-size:10.5px}
.panel .used{padding:6px 10px;max-height:46%}.panel .used h4{font-size:12px}
.panel .used .sub{font-size:10.5px;margin-bottom:4px}.panel .used .tot{font-size:11px;gap:10px;margin:3px 0 5px}.panel .used .tot b{font-size:12px}
.panel .used table{font-size:10.5px}.panel .used th{font-size:9.5px;padding:2px 4px}.panel .used td{padding:2px 4px}
.panel .foot{font-size:10px;padding:5px 10px}
.nlbtn{width:100%;margin-top:8px;min-height:28px;border:1px dashed var(--brand);background:#fff;color:#1d4670;font-weight:600;border-radius:7px;font-size:11px}
.nlbtn:hover{background:var(--soft)}
.nl{margin-top:8px;padding:8px;border:1px solid var(--brand);border-radius:8px;background:var(--soft);font-size:11px}
.nlg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 8px;margin:4px 0 6px}.nlg label{display:flex;flex-direction:column;gap:2px;font-size:10px;font-weight:600;color:var(--mute)}
.nlg .w2{grid-column:1/-1}.nlg input,.nlg select{min-height:26px;border:1px solid #c9d3dc;border-radius:6px;padding:0 6px;font-size:11.5px;color:var(--ink);background:#fff;width:100%}
.nlmeas{min-height:24px;font-size:10.5px;margin-bottom:4px}.nlprev{font-size:11px;margin:2px 0 6px}
.nl .edrow button{min-height:26px;font-size:11px}.nl .edrow button.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.mv rect.bx{fill:#7c3aed1f;stroke:#7c3aed;stroke-width:2;stroke-dasharray:6 4}.mv rect.bx.kept{stroke-dasharray:none;fill:#7c3aed14}
.stage.boxing{cursor:crosshair}.nlmk{min-height:22px;font-size:10.5px;padding:0 7px;border-radius:99px;margin:1px 2px}.nlmk.on{background:#7c3aed;border-color:#7c3aed;color:#fff;font-weight:600}.nlread{font-size:10.5px;color:var(--mute);margin:-2px 0 6px}.nlread b{color:var(--ink)}
.also{margin-top:8px;padding:7px 8px;border:1px solid #d8c8f5;background:#f6f1fe;border-radius:8px;font-size:11px}
.also .ar{display:flex;align-items:center;gap:6px;margin-top:4px}.also .ar span{flex:1}.also button{min-height:24px;font-size:10.5px}
@media(prefers-reduced-motion:reduce){.ov i.cur{animation:none}}
/* Material confirmed: progress in the bar, and the per-drawing check in the panel. */
.prog{display:flex;align-items:center;gap:8px;background:#1a3754;border:0;color:#fff;border-radius:8px;min-height:36px;padding:0 12px;font-size:13px}
.prog .pb{width:110px;height:8px;border-radius:5px;background:#ffffff2e;overflow:hidden}.prog .pb i{display:block;height:100%;background:#4ade80}
.prog b{font-variant-numeric:tabular-nums}.prog.all{background:#1f7a3d}
.ptabs{display:flex;gap:4px;margin-top:10px;background:#eef2f6;border-radius:9px;padding:3px}
.ptabs button{flex:1;border:0;background:transparent;min-height:32px;font-size:13.5px;font-weight:600;color:var(--mute);border-radius:7px}
.ptabs button.on{background:#fff;color:#1d4670;box-shadow:0 1px 3px #0002}
.cf{padding:12px 14px}
.cfh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.cfh h3{margin:0;font-size:16px}.cfh .t{color:var(--mute);font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:2px 10px;white-space:nowrap}
.pill.done{background:var(--grnbg);color:var(--grn)}.pill.todo{background:#eef2f6;color:var(--mute)}.pill.changed{background:var(--ylwbg);color:var(--ylw)}
.cfs{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 4px}
.iss{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:8px;margin:4px 0;font-size:13px;cursor:pointer;border:1px solid}
.iss.bad{background:var(--redbg);border-color:#f1b5b5}.iss.miss{background:var(--ylwbg);border-color:#ecc98a}.iss:hover{filter:brightness(.97)}
.iss b{white-space:nowrap;flex:none}.iss span{flex:1}
.cl{display:grid;grid-template-columns:20px 58px minmax(0,1fr) auto;gap:0 8px;align-items:baseline;padding:6px 4px;border-bottom:1px solid #f0f3f6;cursor:pointer;font-size:13.5px}
.cl:hover{background:var(--soft)}.cl.sel{background:var(--soft);box-shadow:inset 3px 0 var(--brand)}
.cl .ic{font-weight:700;text-align:center}.cl .ic.ok{color:var(--grn)}.cl .ic.no{color:#9aa7b4}.cl .ic.bad{color:var(--red)}
.cl .m{font-weight:700;overflow:hidden;text-overflow:ellipsis}.cl .w{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cl .meta{grid-column:3/5;font-size:12px;color:var(--mute)}
.cfbtn{width:100%;margin-top:14px;min-height:44px;font-weight:700;font-size:15px;border:0;border-radius:10px;background:var(--grn);color:#fff}
.cfbtn.warn{background:#b45309}.cmp{display:flex;align-items:center;gap:8px;margin-top:8px;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:#f8fafc}
.cmp.todo{border-color:#f0cf94;background:var(--ylwbg)}.cmp.ok{border-color:#b7dfc4;background:var(--grnbg)}
.cmp label{font-weight:700;font-size:12px}.cmp select{flex:1;min-width:0;min-height:30px;border:1px solid #c9d3dc;border-radius:6px;font-size:12.5px;background:#fff}.cmp .k{font-size:12px;color:var(--mute);white-space:nowrap}
.cmpnote{font-size:12px;color:#8a4b00;margin-top:4px}.cmpnote button{min-height:26px;font-size:12px;margin-left:4px}
.cmpnew{margin-top:6px;padding:8px;border:1px dashed var(--brand);border-radius:8px;background:var(--soft);font-size:12.5px}
.cmpnew input,.cmpnew select{min-height:30px;border:1px solid #c9d3dc;border-radius:6px;padding:0 6px;font-size:13px;margin-left:4px}
.cmpnew button{min-height:30px;font-size:12.5px;margin-right:6px}.cmpnew button.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.cfask{margin-top:10px;font-size:13px;background:var(--ylwbg);border:1px solid #ecc98a;border-radius:8px;padding:10px}
.cfask button{margin:8px 8px 0 0}.cfdone{margin-top:14px;font-size:13px;color:var(--grn);background:var(--grnbg);border-radius:8px;padding:10px}
.cfdone button,.cfnext{min-height:30px;font-size:12.5px;margin-left:6px}
.grp .ok{color:var(--grn);font-weight:700}
/* Ruler */
.stage.meas{cursor:crosshair}
.mv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mv line{stroke:#d9480f;stroke-width:2}.mv line.tk{stroke-width:2}.mv line.cal{stroke:#7048e8}.mv circle{fill:#d9480f}
.mv text{font:600 13px Inter,system-ui,sans-serif;fill:#fff;paint-order:stroke;stroke:#9a3412;stroke-width:3px}
.mbox{position:absolute;left:10px;bottom:40px;z-index:4;width:330px;max-width:calc(100% - 20px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px -10px #0006;padding:10px 12px;font-size:13px}
.mbox[hidden]{display:none}.mbox h4{margin:0 0 4px;font-size:14px}.mbox .k{color:var(--mute);font-size:12.5px}
.mbox select,.mbox input{min-height:32px;border:1px solid #c9d3dc;border-radius:6px;padding:0 6px;font-size:14px}
.mbox button{min-height:30px;font-size:12.5px;padding:0 10px}.mbox button.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.mbox .row2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.mbox .res{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:6px}
.mbox .mtop{display:flex;align-items:center;gap:8px;margin-bottom:4px}.mbox .mtop h4{margin:0;flex:1}
.mbox button.clr{background:var(--redbg);border:1.5px solid var(--red);color:var(--red);font-weight:700;font-size:13px;min-height:32px}
.mbox button.clr:hover{background:var(--red);color:#fff}
.mbox .known{margin-top:8px;padding:8px;border:1px dashed var(--brand);border-radius:8px;background:var(--soft)}
.mbox .warn{color:var(--ylw);font-weight:600}.mbox .ok{color:var(--grn);font-weight:600}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #c9d6e3;border-top-color:var(--brand);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:900px){.app{height:auto}.main{grid-template-columns:1fr}.tools{flex-direction:row;border-right:0;border-bottom:1px solid var(--line)}
.stages{height:62vh;min-height:340px}.stages.split{grid-template-columns:minmax(0,1fr);grid-template-rows:1fr 1fr;height:90vh}.panel{border-left:0}.list{max-height:none}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <svg width="28" height="28" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#fff"/><path d="M20 5l3.2 11.8L35 20l-11.8 3.2L20 35l-3.2-11.8L5 20l11.8-3.2z" fill="#5286B4"/></svg>
    <div class="job" id="job">Loading…<small>AI Take-off Assistant</small></div>
    <div class="nav"><button id="prev" aria-label="Previous drawing">&larr;</button><select id="sheet" aria-label="Drawing"></select><span class="of" id="of"></span><button id="next" aria-label="Next drawing">&rarr;</button></div>
    <button id="prog" class="prog" title="Go to the next drawing not confirmed yet" hidden></button>
    <span id="mapnote"></span>
    <span class="ocr" id="ocrnote"></span>
    <span class="sp"></span>
    <a id="back" href="#" title="The review page, with every tab">Classic view</a>
  </div>
  <nav class="atabs" id="atabs" aria-label="Take-off steps"></nav>
  <div class="stat" id="stat"></div>
  <div class="main" id="main">
    <button class="pshow" id="pshow" hidden title="Show the lines panel">‹ Show lines</button>
    <div class="tools" role="toolbar" aria-label="Drawing tools">
      <button id="zin" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M10 7v6M7 10h6M15 15l5 5"/></svg></button>
      <button id="zout" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M7 10h6M15 15l5 5"/></svg></button>
      <button id="fit" title="Fit the sheet" aria-label="Fit the sheet"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button id="splitBtn" title="Open a second drawing beside this one" aria-label="Open a drawing beside this one"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="16" rx="1"/><rect x="13" y="4" width="8" height="16" rx="1"/></svg></button>
      <button id="measBtn" title="Ruler: measure on the drawing (M)" aria-label="Ruler"><svg viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg></button>
      <button id="boxBtn" title="Box an item the take-off missed: drag a box around it on the drawing (B)" aria-label="Box a missed item"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1" stroke-dasharray="3 2"/><path d="M12 9v6M9 12h6"/></svg></button>
      <button id="find" title="Find a mark or size" aria-label="Find a mark or size"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="17" cy="16" r="3"/><path d="M19.5 18.5L22 21"/></svg></button>
    </div>
    <div class="stages" id="stages"></div>
    <aside class="panel">
      <div class="ph"><button class="phide" id="phide" title="Hide this panel: the drawing gets the full width">Hide ›</button><div id="wcheck"></div>
        <div class="ptabs" role="tablist"><button id="tabConfirm" class="on" role="tab">Confirm material</button><button id="tabLines" role="tab">All lines</button></div>
        <div class="srow" id="srow" hidden><input class="search" id="q" placeholder="Find a mark or size, e.g. p512" aria-label="Find a mark or size"><button id="flagBtn" class="flagbtn" hidden></button></div></div>
      <div class="list" id="list"></div>
      <div class="used" id="used" hidden></div>
      <div class="foot" id="foot">Changes you make here are saved to the project.</div>
    </aside>
  </div>
  <div class="host" id="host" hidden>
    <div class="hosthd"><b style="flex:1">Ask AI about this take-off</b><button id="aiClose" aria-label="Close Ask AI">✕</button></div>
    <div class="hostmsg" id="hostMsg" hidden><div><b>This project has no take-off yet.</b><br>Place the documents and run it on the <a href="#" data-go-setup>Setup</a> tab. The material list, labor, subcontractors and quote fill in from it.</div></div>
    <iframe id="setupFrame" title="Setup" hidden></iframe>
    <iframe id="revFrame" title="Take-off details" hidden></iframe>
  </div>
</div>
<script>
{
const MC_HOST="https://material-compass-nesting-app-production.up.railway.app";
const API=/(^|\.)up\.railway\.app$|^localhost$/.test(location.hostname)?"":MC_HOST;
const VERSION="drawings v1.11 · 2026-11-24 · Save button + saved time on the status bar; Subcontractors choices saved with the take-off";
console.log("Material Compass "+VERSION);
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const q=new URLSearchParams(location.search);
const P={project_id:q.get("project_id")||"",manufacturer_id:q.get("manufacturer_id")||""};
const $=id=>document.getElementById(id);
const arr=a=>Array.isArray(a)?a:[];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key=n=>String(n||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const getJSON=async(u,o)=>{const r=await fetch(API+u,o);return r.json()};

/* ---- weights: the SAME rules as review.html (weightBasis / rowWeight / orderQtyOf), so the two
   pages always show the same total. Keep in step with review.html until both share one file. ---- */
let CAT_WEIGHTS=null,CAT_WNORM=null;
const _wn=s=>String(s==null?"":s).toLowerCase().replace(/[”″]/g,'"').replace(/\s+/g,"");
function catWeightIndex(){ if(CAT_WNORM) return CAT_WNORM; const exact={},anyMat={};
  Object.keys(CAT_WEIGHTS||{}).forEach(k=>{const p=k.split("|"),w=CAT_WEIGHTS[k];exact[_wn(p[0])+"|"+_wn(p[1])+"|"+_wn(p.slice(2).join("|"))]=w;
    const a=_wn(p[0])+"|"+_wn(p.slice(2).join("|"));if(!(a in anyMat))anyMat[a]=w;});
  return (CAT_WNORM={exact,anyMat}); }
const DENS={"carbon steel":0.2836,"stainless":0.289,"aluminum":0.0975,"copper":0.323,"bronze":0.318,"titanium":0.163};
function densityOf(m){m=String(m||"").toLowerCase();for(const k in DENS){if(m.indexOf(k)>-1)return DENS[k]}return DENS["carbon steel"]}
function thicknessIn(size){const s=String(size||"");
  const par=s.match(/\(\s*0?(\.\d+)\s*\)/);if(par)return Number("0"+par[1]);
  const m=s.match(/^\s*(?:(\d+)[\s-]+)?(\d+)\s*\/\s*(\d+)/);if(m)return(m[1]?Number(m[1]):0)+Number(m[2])/Number(m[3]);
  const d=s.match(/^\s*(\d*\.?\d+)\s*["”]?/);return d?Number(d[1]):null}
function weightBasis(r){const area=Number(r.width_ft)>0;
  if(CAT_WEIGHTS){const ix=catWeightIndex();const w=ix.exact[_wn(r.form_type)+"|"+_wn(r.material_type)+"|"+_wn(r.size)]||ix.anyMat[_wn(r.form_type)+"|"+_wn(r.size)];if(w>0)return{per:w,area}}
  const sh=String(r.size||"").match(/^\s*(W|S|HP|M|C|MC|WT|ST|MT)\s*\d+(?:\.\d+)?\s*[xX×]\s*(\d+(?:\.\d+)?)/);if(sh&&!area)return{per:Number(sh[2]),area:false};
  if(area){const t=thicknessIn(r.size);if(t>0)return{per:t*144*densityOf(r.material_type),area:true}}
  return null}
const orderQtyOf=r=>(Number(r&&r.quantity)||0)*Math.max(1,Math.round(Number(r&&r.units)||1));
function rowWeight(r){const b=weightBasis(r),L=Number(r.length_ft)||0;if(!b||!(L>0))return null;return(b.per*L*(b.area?Number(r.width_ft):1))*orderQtyOf(r)}
const fmtLb=n=>n>=100?Math.round(n).toLocaleString():(Math.round(n*10)/10).toLocaleString();
function ftin(ft){const L=Number(ft)||0;if(!(L>0))return"";let f=Math.floor(L),i=Math.round((L-f)*12*16)/16;if(i>=12){f++;i=0}
  const w=Math.floor(i),fr=Math.round((i-w)*16);let t="";if(fr){let n=fr,d=16;while(n%2===0){n/=2;d/=2}t=(w?w+" ":"")+n+"/"+d}else t=String(w);return f+"'-"+t+'"'}

/* ---- state ---- */
// One take-off, up to two drawing panes. The ACTIVE pane (the one last clicked) is the one the
// drawing picker, the arrows, the tools and the list drive.
const S={marks:{},mnow:"",selMark:null,sel:-1,selG:-1,R:null,head:null,files:[],map:null,stale:false,sheets:[],q:"",docs:{},panes:[],active:0,split:false,
  tab:"confirm",tool:"pan",meas:{},lastMeas:null,cal:null,confAsk:false,npages:{}};
// This page saves the take-off itself (takeoff-store.js): the same browser copy and project save as
// the review page, which re-reads it whenever this page changes it.
const STORE=window.TakeoffStore?TakeoffStore.create(P.project_id,{from:"drawings"}):null;
const act=()=>S.panes[S.active];

/* The take-off: this browser's working copy when it has one (it can hold unsaved changes),
   else the copy saved on the project. Same keys review.html uses. */
async function loadTakeoff(){return STORE?STORE.load():null}

/* Drawing number → {file_id, page}. The saved page map first; then a file named after the drawing. */
function locate(num){
  const k=key(num);if(!k)return null;
  // Every page that carries the number: one drawing is often several sheets ("SHEET 1 OF 4").
  if(S.map&&!S.stale){const ss=arr(S.map.sheets).filter(x=>key(x.number)===k);
    if(ss.length)return{file_id:ss[0].file_id,page:ss[0].page||1,how:"map",more:ss.length>1?ss.map(s=>({file_id:s.file_id,page:s.page||1,name:s.title||""})):undefined}}
  // A file named after the drawing: "ML001-...-8065_R0-1 OF 2.pdf". A whole part of the name
  // equal to the number wins over the number merely appearing inside a longer one. A drawing
  // split over several files ("1 OF 2", "2 OF 2") keeps every part, in name order.
  const base=f=>String(f.name).replace(/\.pdf$/i,"");
  let hits=S.files.filter(f=>base(f).split(/[^A-Za-z0-9]+/).map(key).indexOf(k)>-1);
  if(!hits.length)hits=S.files.filter(f=>key(base(f)).indexOf(k)>-1);
  if(hits.length){hits.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
    // Every page of every file: a drawing's PDF often holds all its sheets (MCP-10116: one file,
    // "SHEET 1 OF 4" … "4 OF 4", and only page 1 could be opened). Page counts come from S.npages.
    const more=[];hits.forEach(f=>{const n=S.npages[f.id]||1;for(let i=1;i<=n;i++)more.push({file_id:f.id,page:i,name:f.name+(n>1?" · page "+i:"")})});
    return{file_id:hits[0].id,page:1,how:"name",more}}
  return null}

function buildSheets(){
  const live=arr(S.R&&S.R.rows).filter(r=>r&&!r.deleted&&Number(r.quantity)>0);
  const by={},order=[];
  live.forEach(r=>{const n=String(r.source_sheet||"").trim()||"(no drawing number)";if(!by[n]){by[n]={number:n,rows:[]};order.push(n)}by[n].rows.push(r)});
  // Map order (the order the pages sit in the set) when known; else as the take-off lists them.
  const pos=n=>{const s=S.map&&arr(S.map.sheets).findIndex(x=>key(x.number)===key(n));return s>-1?s:1e6};
  order.sort((a,b)=>pos(a)-pos(b)||a.localeCompare(b,undefined,{numeric:true}));
  S.sheets=order.map(n=>{const g=by[n];g.loc=locate(n);g.title=(S.map&&(arr(S.map.sheets).find(x=>key(x.number)===key(n))||{}).title)||"";
    g.lb=g.rows.reduce((a,r)=>a+(rowWeight(r)||0),0);return g});
}

/* ---- panel ---- */
function renderCheck(){
  const live=arr(S.R&&S.R.rows).filter(r=>r&&!r.deleted&&Number(r.quantity)>0);
  let lb=0,un=0;live.forEach(r=>{const w=rowWeight(r);if(w)lb+=w;else un++});
  const ew=Number(S.R&&S.R.expected_weight_lb)>0?Number(S.R.expected_weight_lb):null;
  const pw=S.head&&Number(S.head.total_weight)>0?Number(S.head.total_weight):null;
  const ref=ew||pw;
  if(!ref){renderProg();$("wcheck").innerHTML=`<div class="wc none"><div><small>Take-off</small><b>${fmtLb(lb)} lb</b></div><div><small>Expected</small><b>none yet</b></div><div><small>Lines not weighed</small><b>${un}</b></div><p>Enter the job's known weight on the review page to check the take-off against it.</p></div>`;return}
  const p=(lb-ref)/ref*100,ok=Math.abs(p)<=3;
  renderProg();
  $("wcheck").innerHTML=`<div class="wc ${ok?"ok":"bad"}"><div><small>Take-off</small><b>${fmtLb(lb)} lb</b></div><div><small>${ew?"Expected (entered)":"Project BOM"}</small><b>${fmtLb(ref)} lb</b></div><div><small>Difference</small><b class="d">${p>=0?"+":""}${p.toFixed(1)}%</b></div><p>${ok?"Within 3% of the expected weight.":"More than 3% off. Find the lines that make up the difference before pricing."}${un?` ${un} line${un>1?"s":""} can't be weighed yet.`:""}</p></div>`;
}
/* Flags — the SAME checks the review page's weight card makes (noteMmMismatch, wcIsDouble), so a
   line flagged there is flagged here, and a fix or a "keep" there (mm_ok, dbl_ok) clears it here. */
function noteMmMismatch(r){
  const note=String(r&&r.note||""),L=Number(r&&r.length_ft)||0;if(!(L>0)||r.mm_ok)return null;
  if(/plate|sheet/i.test(String(r.form_type||"")))return null;
  const mm=[];note.replace(/(\d{2,5}(?:\.\d+)?)\s*mm\b/gi,(_,n)=>{if(Number(n)>=150)mm.push(Number(n));return _});
  if(!mm.length)return null;const inL=L*12;
  if(mm.some(n=>Math.abs(n/25.4-inL)<=Math.max(0.25,inL*0.02)))return null;
  return{mm:mm[0],note_in:mm[0]/25.4,row_in:inL}}
const isDouble=r=>r&&!r.deleted&&Number(r.quantity)>0&&!r.dbl_ok&&Math.round(Number(r.units)||1)>1&&/\(\s*\d+\s*assy|\d+\s*assy\b|assemblies\)|x\s*\d+\s*assy/i.test(String(r.note||""));
function flagsOf(r){const f=[],m=noteMmMismatch(r);
  if(m)f.push(`Length ${Math.round(m.row_in*10)/10}" but its note says ${m.mm} mm = ${Math.round(m.note_in*10)/10}"`);
  if(isDouble(r))f.push("May be counted twice: the Qty already covers the assemblies");
  return f}
function rowMatch(r){if(S.onlyFlags&&!flagsOf(r).length)return false;if(!S.q)return true;const t=(r.member_mark+" "+r.size+" "+r.form_type+" "+r.source_sheet+" "+(r.note||"")).toLowerCase();return t.indexOf(S.q)>-1}
function renderList(){
  if(S.tab==="confirm")return renderConfirm();
  let h="";const cur=act()?act().cur:-1;
  S.sheets.forEach((g,gi)=>{
    const rows=g.rows.filter(rowMatch);if((S.q||S.onlyFlags)&&!rows.length&&(S.onlyFlags||key(g.number).indexOf(key(S.q))<0))return;
    const nf=g.rows.filter(r=>flagsOf(r).length).length;
    const cs=confOf(g).state;
    h+=`<div class="grp ${gi===cur?"on":""}" data-g="${gi}"><span>${cs==="done"?'<span class="ok" title="Material confirmed">✓</span> ':""}${esc(g.number)}</span><span class="t">${esc(g.title)}</span>${nf?`<span class="nf" title="Lines flagged by the weight check">⚠ ${nf}</span>`:""}${g.loc?"":'<span class="nf">page not found</span>'}<span class="w">${g.lb?fmtLb(g.lb)+" lb":""}</span></div>`;
    rows.forEach(r=>{const i=g.rows.indexOf(r),w=rowWeight(r),fl=flagsOf(r);
      h+=`<div class="row ${gi===S.selG&&i===S.sel?"sel":""} ${fl.length?"flag":""}" data-g="${gi}" data-r="${i}" tabindex="0" role="button"><span class="m">${esc(r.member_mark||"–")}</span><span class="s">${esc(r.size||"")} <span style="color:var(--mute)">${esc(r.form_type||"")}</span></span><span class="w">${w?fmtLb(w)+" lb":"–"}</span><span class="meta">${orderQtyOf(r)} × ${esc(ftin(r.length_ft))}${r.component?" · "+esc(r.component):""}</span>${fl.map(t=>`<span class="fl">⚠ ${esc(t)}</span>`).join("")}</div>`});
  });
  $("list").innerHTML=h||`<div style="padding:16px;color:var(--mute)">${S.onlyFlags?"No flagged lines. The weight check has nothing open.":"No lines match."}</div>`;

async function pollMarks(){

    if(d&&d.ok){Object.assign(S.marks,d.pages||{});S.mnow=d.now||S.mnow;
      visiblePanes().forEach(p=>{if(d.pages&&d.pages[p.pageKey]){p.drawBoxes();if(S.selMark&&p.boxI<0&&hitsOn(p.pageKey,S.selMark).length)p.focusBox(0)}p.renderFollow()});
      // Sheets still unread but the server has nothing queued: its queue was lost (a restart drops it —
      // MCP-10116 sat at "0 of 2" for good on 11-23). Ask again, a few times, instead of waiting forever.
      const busy=d.status&&(d.status.running||d.status.queued);
      S.ocrStuck=!busy&&(S.ocrKick||0)>=3;
      renderOcr();renderUsed();if(S.tab==="confirm"&&d.pages&&Object.keys(d.pages).length)renderList();
      if(ocrTargets().some(x=>!S.marks[x.key])){
        if(!busy&&(S.ocrKick||0)<3){S.ocrKick=(S.ocrKick||0)+1;ocrTimer=setTimeout(()=>startOcr(),S.ocrKick*5000);return}
        ocrTimer=setTimeout(pollMarks,busy?4000:15000)}}}
  catch(e){ocrTimer=setTimeout(pollMarks,15000)}
}

function parseLen(s){

    let m=t.match(/^(\d+(?:\.\d+)?)[\s-]+(\d+)\/(\d+)$/);if(m)return +m[1]+ +m[2]/ +m[3];
    m=t.match(/^(\d+)\/(\d+)$/);if(m)return +m[1]/ +m[2];
    m=t.match(/^\d+(?:\.\d+)?$/);return m?+t:NaN};
  const ft=s.match(/^(\d+(?:\.\d+)?)\s*'\s*-?\s*(.*)$/);
  const inch=ft?(+ft[1])*12+num(ft[2]):num(s);

// The box: the words the drawing reader found inside it, a part mark and a size picked out of them,

const SIZE_RES=[/\bL\s*\d+(?:[-\s]\d+\/\d+)?\s*[xX×]\s*\d+(?:[-\s]\d+\/\d+)?\s*[xX×]\s*\d+(?:[-\s]\d+\/\d+|\/\d+)?/,
  /\b(?:W|S|HP|M|C|MC|WT|ST|MT|HSS)\s*\d+(?:\.\d+)?\s*[xX×]\s*[\d.\/-]+(?:\s*[xX×]\s*[\d.\/-]+)?/,
  /\bPL\s*\d+(?:[-\s]\d+)?(?:\/\d+)?(?:\s*["”])?(?:\s*[xX×]\s*[\d.\/-]+(?:\s*["”])?)?/i,

function catFind(size,prefMat){const k=_wn(size).replace(/×/g,"x");if(!k||!CAT_WEIGHTS)return null;let hit=null;

    if(!hit||(prefMat&&c.mat===prefMat))hit=c;if(prefMat&&c.mat===prefMat)break}
  return hit}
function wordsIn(pk,x0,y0,x1,y1){const e=S.marks[pk];if(!e||!e.words)return null;
  return e.words.filter(w=>{const cx=w[1]+w[3]/2,cy=w[2]+w[4]/2;return cx>=x0&&cx<=x1&&cy>=y0&&cy<=y1})
    .sort((a,b)=>Math.abs(a[2]-b[2])<0.004?a[1]-b[1]:a[2]-b[2])}
const isMarkTok=t=>/^[a-z]{1,3}\d{1,5}[a-z]?$/.test(normMark(t));
function boxDone(pane,a,b){

  const ws=wordsIn(pane.pageKey,x0,y0,x1,y1),text=ws?ws.map(w=>w[0]).join(" "):"";
  const markTok=ws?(ws.find(w=>isMarkTok(w[0]))||[])[0]:"";
  let size="";for(const re of SIZE_RES){const m=text.replace(/×/g,"x").match(re);if(m){size=m[0].trim();break}}

  const L=catLists();if(S.addLine.form&&!L[S.addLine.form])S.addLine.form="";
  if(S.addLine.form&&!(L[S.addLine.form]||{})[S.addLine.mat])S.addLine.mat=Object.keys(L[S.addLine.form]||{}).sort()[0]||"";

// After a boxed line is added: every other drawing where its mark (or the size text) is printed with no line.
function textHits(g,needle){let n=0;partsOf(g).forEach(p=>{const e=S.marks[keyOf(p)];if(!e||!e.words)return;
  const all=e.words.map(w=>_wn(w[0]).replace(/×/g,"x")).join("");let i=all.indexOf(needle);while(i>-1){n++;i=all.indexOf(needle,i+needle.length)}});return n}
function alsoOn(g,row){const mk=normMark(row.member_mark),nd=_wn(row.size).replace(/×/g,"x"),out=[];

$("list").addEventListener("change",e=>{if(!S.addLine||!e.target.closest(".nl"))return;nlRead();

/* ---- COMPONENTS, drawing by drawing (Mark 2026-11-23: "put components in with the drawings, so as
   they confirm drawings it can be categorized") ----
   Each drawing's lines carry r.component (the name) and r.units (how many of it the job builds).
   Choosing a component here re-tags every line on the drawing, sets units from the component, and
   files the drawing under that component on the project (Drawing_Details.Components). A name the
   take-off suggested that is not on the project yet is added to the project first (it needs the
   Type of project chosen in Setup). A drawing is "sorted" when all its lines name a project component. */
const cname=s=>String(s==null?"":s).trim();
const projComps=()=>arr(S.scope&&S.scope.components);
const compOnProject=n=>{const k=cname(n).toLowerCase();return k?projComps().find(c=>cname(c.name).toLowerCase()===k)||null:null};
function sheetComps(g){return[...new Set(g.rows.map(r=>cname(r.component)).filter(Boolean))]}

function cmpMsg(html,cls){S.lastMsg={id:"cmpMsg",html,cls:"edmsg "+(cls||""),until:Date.now()+6000};const el=$("cmpMsg");if(el){el.className="edmsg "+(cls||"");el.innerHTML=html}}
// Re-tag the drawing's lines and file the drawing under the component on the project.
async function assignComp(g,comp){

    r.units=comp.quantity;r.quantity_total=(Number(r.quantity)||0)*comp.quantity}})});

    (t.wt?c(t.wt.ok?"ok":"bad",t.wt.ok?"✓ Weight matches the project BOM":"Weight "+(t.wt.p>=0?"+":"")+t.wt.p.toFixed(1)+"% vs project BOM","material","Within 3% of the project BOM is a match")
      :c("warn","No project weight to check against","material"))+
    (t.fits?c(t.fitPriced?"ok":"warn",t.fitPriced?"✓ Fittings priced":t.fits+" fitting line"+(t.fits===1?"":"s")+" not priced","fittings","Price them on the Fittings tab of the Material list"):"")+
    c(t.labor?"ok":"warn",t.labor?"✓ Labor worked out":"Labor not worked out","labor")+
    c("plain","Subcontractors","subs","Work sent outside the shop: galvanizing, painting, bending and the like")+
    c(t.left?"plain":"ok",t.left?"Quote: "+t.left+" item"+(t.left===1?"":"s")+" left":"✓ Ready to quote","quote")+
    `<span class="savechip" id="saveChip"></span>`;renderSaveChip()}
/* SAVE (Mark 11-24: "where is there save on the take-off?"). Every change saves to the project by itself
   (15 s after the last edit, or when the tab is closed); this shows where that stands and saves now on a click. */
function renderSaveChip(){const el=$("saveChip");if(!el||!STORE)return;const st=STORE.status,at=STORE.savedAt(),dirty=st!=="saving"&&STORE.dirty();
  const tm=at?new Date(at).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):"";
  const txt=st==="saving"?"<span class=\"spin\"></span> Saving…":st==="failed"||st==="full"?"⚠ Not saved yet":dirty?"● Changes not saved yet":"✓ Saved"+(tm?" "+tm:"");
  el.className="savechip "+(st==="failed"||st==="full"?"bad":dirty||st==="saving"?"warn":"ok");
  el.innerHTML=`<span title="Every change saves to the project by itself shortly after you make it">${txt}</span><button data-go="save"${st==="saving"?" disabled":""} title="Save every change to the project now">Save</button>`}
setInterval(renderSaveChip,5000);
function panelTo(p){const f=$("revFrame"),sub=p==="material"&&S.msub?S.msub:"";S.msub="";
  if(!f.dataset.loaded){f.dataset.loaded="1";f.src="review.html"+withQ(sub?{panel:p,sub}:{panel:p});return}
  try{f.contentWindow.postMessage({type:"mc-panel",panel:p,sub},location.origin)}catch(e){}}
function layout(){
  const t=S.atab,onDw=t==="drawings",drawer=S.ai&&onDw;
  $("main").hidden=!onDw;$("main").classList.toggle("nopanel",!!S.panelOff);$("pshow").hidden=!S.panelOff;
  const h=$("host");h.hidden=onDw&&!S.ai;h.classList.toggle("drawer",drawer);h.classList.toggle("ai",S.ai&&!onDw);
  // With no take-off yet, the tabs that show it say so (and the review page is not loaded at all).
  const setup=t==="setup"&&!S.ai,none=!setup&&!S.R&&S.noTakeoff;
  $("setupFrame").hidden=!setup;$("revFrame").hidden=setup||none;$("hostMsg").hidden=!none;
  if(setup){const f=$("setupFrame");if(!f.src)f.src="index.html"+withQ({in:"assistant"})}
  else if(none){}
  else if(S.ai)panelTo("ai");else if(!onDw)panelTo(t);
  renderStatus();
  if(onDw)requestAnimationFrame(()=>dispatchEvent(new Event("resize")))}
function setATab(t){if(!ATABS.some(a=>a[0]===t))return;S.atab=t;S.ai=false;layout()}
$("atabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.id==="askBtn"){S.ai=!S.ai;layout();return}setATab(b.dataset.at)});
$("stat").addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(!b)return;const g=b.dataset.go;
  if(g==="save"){if(STORE)STORE.saveNow().then(renderSaveChip);renderSaveChip();return}
  if(g==="next"){setATab("drawings");setTab("confirm");const n=nextTodo(act().cur);if(n>-1&&n!==act().cur){clearPart();act().open(n)}return}
  if(g==="unsorted"){setATab("drawings");setTab("confirm");const n=S.sheets.findIndex(x=>!sheetSorted(x));if(n>-1&&n!==act().cur){clearPart();act().open(n)}return}
  if(g==="fittings"){S.atab="material";S.ai=false;S.msub="fittings";layout();return}
  if(g==="flags"){setATab("drawings");if(S.panelOff){S.panelOff=false;layout()}S.onlyFlags=true;setTab("lines");return}
  setATab(g)});
$("aiClose").onclick=()=>{S.ai=false;layout()};
$("hostMsg").addEventListener("click",e=>{if(e.target.closest("[data-go-setup]")){e.preventDefault();setATab("setup")}});
const panelVis=off=>{S.panelOff=off;try{localStorage.setItem("mc_dw_panel_off",off?"1":"0")}catch(e){}layout()};
$("phide").onclick=()=>panelVis(true);$("pshow").onclick=()=>panelVis(false);
// From the frames: a line clicked in the Material list shows its drawing; a new run reloads the Assistant.
addEventListener("message",e=>{if(e.origin!==location.origin)return;const m=e.data||{};
  if(m.type==="mc-show"){setATab("drawings");if(S.R)showFromReview(m)}
  else if(m.type==="mc-run-done")location.reload()});

/* ---- start ---- */
(async function init(){
  S.panes=[new Pane(0),new Pane(1)];const A=S.panes[0];
  A.msg('<span class="spin"></span>Loading the drawings…');layout();
  if(!P.project_id){A.msg("<b>No project was given.</b><br>Open this page from a take-off's review page.");$("job").firstChild.textContent="AI Take-off Assistant";return}
  if(!window.pdfjsLib){A.msg("<b>The drawing viewer didn't load.</b><br>Check the internet connection and reload the page.");return}
  const [R,map,scope,cat]=await Promise.all([
    loadTakeoff().catch(e=>({__err:String(e.message||e)})),
    getJSON("/api/takeoff/sheet-map/"+encodeURIComponent(P.project_id)).catch(()=>null),
    getJSON("/api/takeoff/project-scope/"+encodeURIComponent(P.project_id)).catch(()=>null),
    getJSON("/api/takeoff/catalog-index").catch(()=>null)]);
  if(cat&&cat.ok)CAT_WEIGHTS=cat.weights||{};
  if(scope&&scope.ok){S.head=scope.project||null;S.scope=scope}
  const name=S.head?[S.head.number,S.head.name].filter(Boolean).join(" · "):((R&&R.project&&R.project.name)||"AI Take-off Assistant");
  $("job").innerHTML=esc(name)+"<small>AI Take-off Assistant</small>";document.title=name+" · AI Take-off Assistant";
  if(map&&map.ok){S.files=arr(map.files);S.map=map.map||null;S.stale=!!map.stale}
  if(R&&R.__err){A.msg("<b>The take-off couldn’t be opened.</b><br>"+esc(R.__err));return}
  // No take-off yet: start on Setup, where the documents are placed and the take-off is run.
  if(!R){S.noTakeoff=true;$("main").classList.add("notk");$("sheet").closest(".nav").style.display="none";
    A.msg("<b>This project has no take-off yet.</b><br>Place the documents and run it on the Setup tab.");setATab("setup");return}
  // Page counts up front on a small set, so every sheet is listed (and read for part marks) from
  // the start. A big set learns them as each file is opened.
  if(S.files.length&&S.files.length<=12&&!(S.map&&!S.stale))await Promise.all(S.files.map(f=>getDoc(f.id).then(d=>{S.npages[f.id]=d.numPages}).catch(()=>{})));
  S.R=R;buildSheets();renderCheck();renderList();renderNav();
  if(!S.sheets.length){A.msg("<b>The take-off has no lines to show.</b>");return}
  // Opened from a ⌖ on the review page: straight to that drawing and part. Else the first drawing.
  const ask={sheet:q.get("sheet")||"",mark:q.get("mark")||""};
  if(!((ask.sheet||ask.mark)&&showFromReview(ask)))await A.open(Math.max(0,S.sheets.findIndex(g=>g.loc)));
  const t0=q.get("tab");if(t0&&t0!=="drawings")setATab(t0);   // e.g. ?tab=setup from "New take-off"
  pollMarks().then(()=>startOcr(A.pageKey,false));
})();
}
</script>
