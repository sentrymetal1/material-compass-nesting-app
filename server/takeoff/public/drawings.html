<!DOCTYPE html>
<html lang="en">
<head>
<script src="/takeoff/mc-token.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Take-off Drawings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!--
  DRAWING WORKSPACE — step 1 (read-only). The project's own drawings in the middle, the take-off
  lines beside them, grouped by drawing; click a line or a drawing and its sheet opens.
  Opened from the review page ("Drawings view"); it never edits or saves the take-off.
  Plan and mock-up: Projects/mc-product-tour/workspace.html. Step 2 adds highlights on the sheet.
-->
<style>
:root{--brand:#5286B4;--bar:#24476b;--ink:#16202a;--mute:#5b6b7a;--line:#dde4ea;--card:#fff;--soft:#eef4fa;--bg:#e9eef3;
--red:#c62828;--redbg:#fdecec;--grn:#1f7a3d;--grnbg:#e8f6ed;--ylw:#a15c00;--ylwbg:#fff6e5}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.45 Inter,"Segoe UI",system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;min-height:34px;padding:0 12px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:1px}
button:disabled{opacity:.5;cursor:default}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh}
.bar{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--bar);color:#fff;flex-wrap:wrap}
.bar .job{font-weight:600;line-height:1.2;max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .job small{display:block;font-weight:400;opacity:.8;font-size:12px}
.nav{display:flex;align-items:center;gap:4px;background:#1a3754;border-radius:8px;padding:3px}
.nav button{background:transparent;border:0;color:#fff;min-height:32px;padding:0 10px}
.nav select{background:#fff;color:var(--ink);border:0;border-radius:6px;min-height:32px;padding:0 8px;font-size:14px;font-weight:600;max-width:320px}
.nav .of{font-size:12.5px;opacity:.85;padding:0 6px;white-space:nowrap}
.sp{margin-left:auto}
.bar a{color:#cfe0f0;font-size:13px;text-decoration:none}.bar a:hover{color:#fff}
.mapnote{display:flex;align-items:center;gap:8px;font-size:13px;background:#f3a712;color:#1d1300;border-radius:8px;padding:4px 6px 4px 10px}
.mapnote button{min-height:30px;border:0;background:#1d1300;color:#fff;font-weight:600}
.main{display:grid;grid-template-columns:48px minmax(0,1fr) 400px;min-height:0}
.tools{display:flex;flex-direction:column;gap:6px;padding:10px 4px;background:var(--card);border-right:1px solid var(--line)}
.tools button{width:40px;height:40px;padding:0;display:grid;place-items:center;border:0;background:transparent}
.tools button:hover{background:var(--soft)}
.tools svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stage{position:relative;overflow:hidden;background:#d5dce3;cursor:grab;touch-action:none}
.stage.drag{cursor:grabbing}
#paper{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 6px 30px -8px #0005;background:#fff}
#paper canvas{display:block}
.msg[hidden]{display:none}
.msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--mute)}
.msg div{max-width:420px;background:var(--card);border-radius:12px;padding:18px 20px;box-shadow:0 6px 24px -10px #0004}
.msg b{color:var(--ink)}
.parts{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px;box-shadow:0 4px 14px -6px #0003}
.parts[hidden]{display:none}.parts button{min-height:30px;border:0;font-size:13px}.parts button.on{background:var(--brand);color:#fff;font-weight:600}
.zoomtag{position:absolute;left:10px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:12.5px;color:var(--mute)}
.panel{background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ph{padding:12px 14px;border-bottom:1px solid var(--line)}
.wc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;border-radius:10px;padding:10px 12px;border:1px solid}
.wc.bad{background:var(--redbg);border-color:var(--red)}.wc.ok{background:var(--grnbg);border-color:var(--grn)}.wc.none{background:var(--ylwbg);border-color:#e6b35a}
.wc small{display:block;font-size:12px;color:var(--mute)}.wc b{font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.wc.bad .d{color:var(--red)}.wc.ok .d{color:var(--grn)}
.wc p{grid-column:1/-1;margin:2px 0 0;font-size:12.5px}
.search{margin-top:10px;width:100%;min-height:38px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:#f6f8fa;font-size:15px}
.list{overflow:auto;flex:1;min-height:0}
.grp{display:flex;align-items:baseline;gap:8px;padding:9px 14px;font-size:13px;font-weight:700;background:#f6f8fa;border-bottom:1px solid var(--line);cursor:pointer;position:sticky;top:0;z-index:1}
.grp:hover{background:var(--soft)}.grp.on{background:#dfeaf5;color:#1d4670}
.grp .t{font-weight:400;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.grp .w{font-variant-numeric:tabular-nums;white-space:nowrap}
.grp .nf{color:var(--ylw);font-weight:600;font-size:12px;white-space:nowrap}
.row{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:1px 10px;padding:7px 14px;border-left:4px solid transparent;border-bottom:1px solid #f0f3f6;cursor:pointer}
.row:hover{background:var(--soft)}.row.sel{background:var(--soft);border-left-color:var(--brand)}
.row .m{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13.5px}
.row .w{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;font-size:13.5px}
.row .meta{grid-column:2/4;font-size:12.5px;color:var(--mute)}
.foot{font-size:12px;color:var(--mute);padding:8px 14px;border-top:1px solid var(--line)}
/* Boxes on the sheet: where a part mark was read off the drawing. */
#ov{position:absolute;inset:0;pointer-events:none}
#ov i{position:absolute;border:2px dashed #1f63b0;background:#5286b42e;border-radius:3px;pointer-events:auto;cursor:pointer;box-shadow:0 0 0 2px #ffffffb0}
#ov i.cur{border-style:solid;border-color:#d97706;background:#f59e0b33;animation:blink 1.3s 2}
@keyframes blink{50%{opacity:.35}}
.ocr{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#cfe0f0}
/* Where used: the selected part across the whole job. */
.used{border-top:1px solid var(--line);background:#f8fafc;max-height:42%;overflow:auto;padding:10px 14px}
.used[hidden]{display:none}
.used h4{margin:0 0 2px;font-size:14px}.used .sub{font-size:12.5px;color:var(--mute);margin-bottom:8px}
.used .tot{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 8px;font-size:13px}.used .tot b{font-size:16px}
.used table{width:100%;border-collapse:collapse;font-size:13px}
.used th{font-size:11.5px;color:var(--mute);font-weight:600;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.used td{padding:5px 6px;border-bottom:1px solid #eef1f4;white-space:nowrap}
.used td.n,.used th.n{text-align:right;font-variant-numeric:tabular-nums}
.used tr.go{cursor:pointer}.used tr.go:hover td{background:var(--soft)}.used tr.here td{background:#dfeaf5;font-weight:600}
.used .note{font-size:11.5px;color:var(--mute);margin-top:6px}
.used .warn{color:var(--ylw);font-weight:600}
@media(prefers-reduced-motion:reduce){#ov i.cur{animation:none}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #c9d6e3;border-top-color:var(--brand);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:900px){.app{height:auto}.main{grid-template-columns:1fr}.tools{flex-direction:row;border-right:0;border-bottom:1px solid var(--line)}
.stage{height:62vh;min-height:340px}.panel{border-left:0}.list{max-height:none}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <svg width="28" height="28" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#fff"/><path d="M20 5l3.2 11.8L35 20l-11.8 3.2L20 35l-3.2-11.8L5 20l11.8-3.2z" fill="#5286B4"/></svg>
    <div class="job" id="job">Loading…<small>AI Take-off · Drawings</small></div>
    <div class="nav"><button id="prev" aria-label="Previous drawing">&larr;</button><select id="sheet" aria-label="Drawing"></select><span class="of" id="of"></span><button id="next" aria-label="Next drawing">&rarr;</button></div>
    <span id="mapnote"></span>
    <span class="ocr" id="ocrnote"></span>
    <span class="sp"></span>
    <a id="back" href="#">Back to the review page</a>
  </div>
  <div class="main">
    <div class="tools" role="toolbar" aria-label="Drawing tools">
      <button id="zin" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M10 7v6M7 10h6M15 15l5 5"/></svg></button>
      <button id="zout" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M7 10h6M15 15l5 5"/></svg></button>
      <button id="fit" title="Fit the sheet" aria-label="Fit the sheet"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button id="find" title="Find a mark or size" aria-label="Find a mark or size"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="17" cy="16" r="3"/><path d="M19.5 18.5L22 21"/></svg></button>
    </div>
    <div class="stage" id="stage">
      <div id="paper"></div>
      <div class="msg" id="msg"><div><span class="spin"></span>Loading the drawings…</div></div>
      <div class="zoomtag" id="zoomtag" hidden></div>
      <div class="parts" id="parts" hidden></div>
    </div>
    <aside class="panel">
      <div class="ph"><div id="wcheck"></div><input class="search" id="q" placeholder="Find a mark or size, e.g. p512" aria-label="Find a mark or size"></div>
      <div class="list" id="list"></div>
      <div class="used" id="used" hidden></div>
      <div class="foot">Read-only view. Make changes on the review page.</div>
    </aside>
  </div>
</div>
<script>
{
const MC_HOST="https://material-compass-nesting-app-production.up.railway.app";
const API=/(^|\.)up\.railway\.app$|^localhost$/.test(location.hostname)?"":MC_HOST;
const VERSION="drawings v0.3 · 2026-11-22 · part marks boxed on the sheet; where-used totals";
console.log("Material Compass "+VERSION);
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const q=new URLSearchParams(location.search);
const P={project_id:q.get("project_id")||"",manufacturer_id:q.get("manufacturer_id")||""};
const $=id=>document.getElementById(id);
const arr=a=>Array.isArray(a)?a:[];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key=n=>String(n||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const getJSON=async(u,o)=>{const r=await fetch(API+u,o);return r.json()};

/* ---- weights: the SAME rules as review.html (weightBasis / rowWeight / orderQtyOf), so the two
   pages always show the same total. Keep in step with review.html until both share one file. ---- */
let CAT_WEIGHTS=null,CAT_WNORM=null;
const _wn=s=>String(s==null?"":s).toLowerCase().replace(/[”″]/g,'"').replace(/\s+/g,"");
function catWeightIndex(){ if(CAT_WNORM) return CAT_WNORM; const exact={},anyMat={};
  Object.keys(CAT_WEIGHTS||{}).forEach(k=>{const p=k.split("|"),w=CAT_WEIGHTS[k];exact[_wn(p[0])+"|"+_wn(p[1])+"|"+_wn(p.slice(2).join("|"))]=w;
    const a=_wn(p[0])+"|"+_wn(p.slice(2).join("|"));if(!(a in anyMat))anyMat[a]=w;});
  return (CAT_WNORM={exact,anyMat}); }
const DENS={"carbon steel":0.2836,"stainless":0.289,"aluminum":0.0975,"copper":0.323,"bronze":0.318,"titanium":0.163};
function densityOf(m){m=String(m||"").toLowerCase();for(const k in DENS){if(m.indexOf(k)>-1)return DENS[k]}return DENS["carbon steel"]}
function thicknessIn(size){const s=String(size||"");
  const par=s.match(/\(\s*0?(\.\d+)\s*\)/);if(par)return Number("0"+par[1]);
  const m=s.match(/^\s*(?:(\d+)[\s-]+)?(\d+)\s*\/\s*(\d+)/);if(m)return(m[1]?Number(m[1]):0)+Number(m[2])/Number(m[3]);
  const d=s.match(/^\s*(\d*\.?\d+)\s*["”]?/);return d?Number(d[1]):null}
function weightBasis(r){const area=Number(r.width_ft)>0;
  if(CAT_WEIGHTS){const ix=catWeightIndex();const w=ix.exact[_wn(r.form_type)+"|"+_wn(r.material_type)+"|"+_wn(r.size)]||ix.anyMat[_wn(r.form_type)+"|"+_wn(r.size)];if(w>0)return{per:w,area}}
  const sh=String(r.size||"").match(/^\s*(W|S|HP|M|C|MC|WT|ST|MT)\s*\d+(?:\.\d+)?\s*[xX×]\s*(\d+(?:\.\d+)?)/);if(sh&&!area)return{per:Number(sh[2]),area:false};
  if(area){const t=thicknessIn(r.size);if(t>0)return{per:t*144*densityOf(r.material_type),area:true}}
  return null}
const orderQtyOf=r=>(Number(r&&r.quantity)||0)*Math.max(1,Math.round(Number(r&&r.units)||1));
function rowWeight(r){const b=weightBasis(r),L=Number(r.length_ft)||0;if(!b||!(L>0))return null;return(b.per*L*(b.area?Number(r.width_ft):1))*orderQtyOf(r)}
const fmtLb=n=>n>=100?Math.round(n).toLocaleString():(Math.round(n*10)/10).toLocaleString();
function ftin(ft){const L=Number(ft)||0;if(!(L>0))return"";let f=Math.floor(L),i=Math.round((L-f)*12*16)/16;if(i>=12){f++;i=0}
  const w=Math.floor(i),fr=Math.round((i-w)*16);let t="";if(fr){let n=fr,d=16;while(n%2===0){n/=2;d/=2}t=(w?w+" ":"")+n+"/"+d}else t=String(w);return f+"'-"+t+'"'}

/* ---- state ---- */
const S={marks:{},mnow:"",pageKey:"",selMark:null,boxI:-1,part:0,R:null,head:null,files:[],map:null,stale:false,sheets:[],cur:-1,sel:-1,q:"",docs:{},view:{s:1,tx:0,ty:0},page:null,render:null,rs:0};

/* The take-off: this browser's working copy when it has one (it can hold unsaved changes),
   else the copy saved on the project. Same keys review.html uses. */
async function loadTakeoff(){
  try{const s=localStorage.getItem("mc_takeoff_"+P.project_id);if(s){const R=JSON.parse(s);if(R&&arr(R.rows).length)return R}}catch(e){}
  const d=await getJSON("/api/takeoff/saved/"+encodeURIComponent(P.project_id));
  return d&&d.ok&&d.found?d.package:null;
}

/* Drawing number → {file_id, page}. The saved page map first; then a file named after the drawing. */
function locate(num){
  const k=key(num);if(!k)return null;
  if(S.map&&!S.stale){const s=arr(S.map.sheets).find(x=>key(x.number)===k);if(s)return{file_id:s.file_id,page:s.page||1,how:"map"}}
  // A file named after the drawing: "ML001-...-8065_R0-1 OF 2.pdf". A whole part of the name
  // equal to the number wins over the number merely appearing inside a longer one. A drawing
  // split over several files ("1 OF 2", "2 OF 2") keeps every part, in name order.
  const base=f=>String(f.name).replace(/\.pdf$/i,"");
  let hits=S.files.filter(f=>base(f).split(/[^A-Za-z0-9]+/).map(key).indexOf(k)>-1);
  if(!hits.length)hits=S.files.filter(f=>key(base(f)).indexOf(k)>-1);
  if(hits.length){hits.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
    return{file_id:hits[0].id,page:1,how:"name",more:hits.map(f=>({file_id:f.id,page:1,name:f.name}))}}
  return null}

function buildSheets(){
  const live=arr(S.R&&S.R.rows).filter(r=>r&&!r.deleted&&Number(r.quantity)>0);
  const by={},order=[];
  live.forEach((r,i)=>{const n=String(r.source_sheet||"").trim()||"(no drawing number)";if(!by[n]){by[n]={number:n,rows:[]};order.push(n)}by[n].rows.push(r)});
  // Map order (the order the pages sit in the set) when known; else as the take-off lists them.
  const pos=n=>{const s=S.map&&arr(S.map.sheets).findIndex(x=>key(x.number)===key(n));return s>-1?s:1e6};
  order.sort((a,b)=>pos(a)-pos(b)||a.localeCompare(b,undefined,{numeric:true}));
  S.sheets=order.map(n=>{const g=by[n];g.loc=locate(n);g.title=(S.map&&(arr(S.map.sheets).find(x=>key(x.number)===key(n))||{}).title)||"";
    g.lb=g.rows.reduce((a,r)=>a+(rowWeight(r)||0),0);return g});
}

/* ---- panel ---- */
function renderCheck(){
  const live=arr(S.R&&S.R.rows).filter(r=>r&&!r.deleted&&Number(r.quantity)>0);
  let lb=0,un=0;live.forEach(r=>{const w=rowWeight(r);if(w)lb+=w;else un++});
  const ew=Number(S.R&&S.R.expected_weight_lb)>0?Number(S.R.expected_weight_lb):null;
  const pw=S.head&&Number(S.head.total_weight)>0?Number(S.head.total_weight):null;
  const ref=ew||pw;
  if(!ref){$("wcheck").innerHTML=`<div class="wc none"><div><small>Take-off</small><b>${fmtLb(lb)} lb</b></div><div><small>Expected</small><b>none yet</b></div><div><small>Lines not weighed</small><b>${un}</b></div><p>Enter the job's known weight on the review page to check the take-off against it.</p></div>`;return}
  const p=(lb-ref)/ref*100,ok=Math.abs(p)<=3;
  $("wcheck").innerHTML=`<div class="wc ${ok?"ok":"bad"}"><div><small>Take-off</small><b>${fmtLb(lb)} lb</b></div><div><small>${ew?"Expected (entered)":"Project BOM"}</small><b>${fmtLb(ref)} lb</b></div><div><small>Difference</small><b class="d">${p>=0?"+":""}${p.toFixed(1)}%</b></div><p>${ok?"Within 3% of the expected weight.":"More than 3% off. Find the lines that make up the difference before pricing."}${un?` ${un} line${un>1?"s":""} can't be weighed yet.`:""}</p></div>`;
}
function rowMatch(r){if(!S.q)return true;const t=(r.member_mark+" "+r.size+" "+r.form_type+" "+r.source_sheet+" "+(r.note||"")).toLowerCase();return t.indexOf(S.q)>-1}
function renderList(){
  let h="";
  S.sheets.forEach((g,gi)=>{
    const rows=g.rows.filter(rowMatch);if(S.q&&!rows.length&&key(g.number).indexOf(key(S.q))<0)return;
    h+=`<div class="grp ${gi===S.cur?"on":""}" data-g="${gi}"><span>${esc(g.number)}</span><span class="t">${esc(g.title)}</span>${g.loc?"":'<span class="nf">page not found</span>'}<span class="w">${g.lb?fmtLb(g.lb)+" lb":""}</span></div>`;
    rows.forEach(r=>{const i=g.rows.indexOf(r),w=rowWeight(r);
      h+=`<div class="row ${gi===S.cur&&i===S.sel?"sel":""}" data-g="${gi}" data-r="${i}" tabindex="0" role="button"><span class="m">${esc(r.member_mark||"–")}</span><span class="s">${esc(r.size||"")} <span style="color:var(--mute)">${esc(r.form_type||"")}</span></span><span class="w">${w?fmtLb(w)+" lb":"–"}</span><span class="meta">${orderQtyOf(r)} × ${esc(ftin(r.length_ft))}${r.component?" · "+esc(r.component):""}</span></div>`});
  });
  $("list").innerHTML=h||'<div style="padding:16px;color:var(--mute)">No lines match.</div>';
}
function renderNav(){
  $("sheet").innerHTML=S.sheets.map((g,i)=>`<option value="${i}">${esc(g.number)}${g.title?" · "+esc(g.title):""}${g.loc?"":" (page not found)"}</option>`).join("");
  $("sheet").value=S.cur<0?0:S.cur;$("of").textContent=S.sheets.length?`${Math.max(0,S.cur)+1} of ${S.sheets.length}`:"";
  const missing=S.sheets.filter(g=>!g.loc).length;
  $("mapnote").innerHTML=S.files.length&&(S.stale||missing)?`<span class="mapnote">${S.stale?"Drawings changed since their pages were found.":missing+" drawing"+(missing>1?"s":"")+" not matched to a page."} <button id="build">Find drawing pages</button></span>`:"";
}

/* ---- viewer ---- */
function msg(html){$("msg").hidden=!html;if(html)$("msg").innerHTML="<div>"+html+"</div>"}
function getDoc(fileId){
  if(!S.docs[fileId])S.docs[fileId]=(async()=>{
    const r=await fetch(API+"/api/files/project/"+encodeURIComponent(P.project_id)+"/"+encodeURIComponent(fileId));
    if(!r.ok)throw new Error("file "+r.status);
    return pdfjsLib.getDocument({data:new Uint8Array(await r.arrayBuffer())}).promise})();
  return S.docs[fileId]}
async function openSheet(gi,keepView,part){
  if(gi<0||gi>=S.sheets.length)return;
  S.part=part||0;
  S.cur=gi;renderNav();renderList();
  const g=S.sheets[gi];S.page=null;S.rs=0;$("paper").innerHTML="";
  document.querySelector(`.grp[data-g="${gi}"]`)?.scrollIntoView({block:"nearest"});
  if(!g.loc){$("paper").innerHTML="";S.page=null;S.pageKey="";renderUsed();$("zoomtag").hidden=true;$("parts").hidden=true;
    msg(`<b>Drawing ${esc(g.number)} isn't matched to a page yet.</b><br><br>`+(S.files.length?`Press <b>Find drawing pages</b> at the top. It reads the drawing number off every page once and remembers it for this project.`:`This project has no drawings saved. Open the take-off once with its drawings so they're kept.`));return}
  // A drawing split over several files ("1 OF 2", "2 OF 2"): a switcher above the sheet.
  const ps=g.loc.more&&g.loc.more.length>1?g.loc.more:null,loc=ps?(ps[S.part]||ps[0]):g.loc;
  S.pageKey=keyOf(loc);S.boxI=-1;renderUsed();
  if(!S.marks[S.pageKey])startOcr(S.pageKey,true);
  $("parts").hidden=!ps;
  if(ps)$("parts").innerHTML=ps.map((p,i)=>`<button data-part="${i}" class="${i===S.part?"on":""}" title="${esc(p.name)}">Sheet ${i+1} of ${ps.length}</button>`).join("");
  msg('<span class="spin"></span>Opening '+esc(g.number)+"…");
  try{
    const doc=await getDoc(loc.file_id);
    const page=await doc.getPage(Math.min(loc.page,doc.numPages));
    if(S.cur!==gi)return;
    S.page=page;S.rs=0;msg("");$("zoomtag").hidden=false;
    if(!keepView)fit();else draw();
    if(S.selMark&&hitsOn(S.pageKey,S.selMark).length)focusBox(0);
  }catch(e){console.error(e);msg(`<b>Couldn't open drawing ${esc(g.number)}.</b><br>${esc(e.message||e)}`)}
}
function fit(){if(!S.page)return;const st=$("stage").getBoundingClientRect(),v=S.page.getViewport({scale:1});
  const s=Math.min((st.width-24)/v.width,(st.height-24)/v.height);S.fitS=s;S.view={s,tx:(st.width-v.width*s)/2,ty:(st.height-v.height*s)/2};draw()}
let rTimer=null;
function draw(){
  if(!S.page)return;const V=S.view,paper=$("paper");
  // Re-render when the zoom has moved well away from the resolution on screen; CSS scales in between.
  if(!S.rs||V.s>S.rs*1.25||V.s<S.rs/2){clearTimeout(rTimer);rTimer=setTimeout(rasterize,S.rs?180:0)}
  const k=S.rs?V.s/S.rs:1;paper.style.transform=`translate(${V.tx}px,${V.ty}px) scale(${k})`;
  $("zoomtag").textContent=Math.round(V.s/(S.fitS||V.s)*100)+"%";
}
async function rasterize(){
  const page=S.page;if(!page)return;const V=S.view,dpr=window.devicePixelRatio||1,v1=page.getViewport({scale:1});
  // Cap the canvas: a 36×24 in sheet at full zoom would be hundreds of megapixels.
  let rs=V.s;const maxSide=8192/dpr,maxPx=36e6/(dpr*dpr);rs=Math.min(rs,maxSide/Math.max(v1.width,v1.height),Math.sqrt(maxPx/(v1.width*v1.height)));
  const vp=page.getViewport({scale:rs*dpr}),c=document.createElement("canvas");c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);
  c.style.width=(vp.width/dpr)+"px";c.style.height=(vp.height/dpr)+"px";
  if(S.render){try{S.render.cancel()}catch(e){}}
  const task=page.render({canvasContext:c.getContext("2d"),viewport:vp});S.render=task;
  try{await task.promise}catch(e){return}
  if(S.page!==page)return;
  const paper=$("paper");paper.innerHTML="";paper.appendChild(c);S.rs=rs;S.render=null;
  drawBoxes();draw()}
function zoomAt(f,cx,cy){if(!S.page)return;const V=S.view,st=$("stage").getBoundingClientRect();cx??=st.width/2;cy??=st.height/2;
  const s=Math.max(.05,Math.min(V.s*f,40));S.view={s,tx:cx-(cx-V.tx)*s/V.s,ty:cy-(cy-V.ty)*s/V.s};draw()}

/* ---- part marks on the sheet (step 2) ----
   Every drawing is read once on the server by OCR (/api/takeoff/marks), in the background, the
   sheet on screen first. Clicking a line boxes every place its mark is printed on the sheet, and
   the panel below the list shows the part across the whole job: total quantity, every drawing it
   is on, and how often it was found printed on each. A count of places is not a quantity — a
   mark appears in several views and in the parts list — so it is shown beside the take-off's
   own quantity, never in place of it. */
const normMark=t=>String(t||"").toLowerCase().replace(/\|/g,"l").replace(/[^a-z0-9]/g,"");
const keyOf=loc=>loc?loc.file_id+":"+(loc.page||1):"";
const partsOf=g=>g&&g.loc?(g.loc.more&&g.loc.more.length?g.loc.more:[g.loc]):[];
function hitsOn(k,m){const e=S.marks[k];if(!e||!e.words||!m)return[];
  const exact=e.words.filter(w=>normMark(w[0])===m);if(exact.length)return exact;
  // The take-off sometimes adds a letter to tell two lengths of one mark apart ("p285b"); the
  // drawing prints the mark itself ("p285"). Fall back to it, and say so in the panel.
  const base=baseMark(m);return base?e.words.filter(w=>normMark(w[0])===base):[]}
const baseMark=m=>{const x=String(m||"").match(/^([a-z]+\d+)[a-z]$/);return x?x[1]:""};
function printedAs(k,m){const e=S.marks[k];if(!e||!e.words||!m)return"";if(e.words.some(w=>normMark(w[0])===m))return"";const b=baseMark(m);return b&&e.words.some(w=>normMark(w[0])===b)?b:""}
function sheetHits(g,m){let n=0,read=0;const ps=partsOf(g);ps.forEach(p=>{const e=S.marks[keyOf(p)];if(e&&e.words){read++;n+=hitsOn(keyOf(p),m).length}});return{n,read,parts:ps.length}}
function drawBoxes(){
  const paper=$("paper");if(!paper.querySelector("canvas"))return;
  let ov=$("ov");if(!ov){ov=document.createElement("div");ov.id="ov";paper.appendChild(ov)}
  const hs=hitsOn(S.pageKey,S.selMark);
  ov.innerHTML=hs.map((w,i)=>`<i data-box="${i}" class="${i===S.boxI?"cur":""}" title="${esc(w[0])}" style="left:${(w[1]*100-0.4).toFixed(3)}%;top:${(w[2]*100-0.5).toFixed(3)}%;width:${(w[3]*100+0.8).toFixed(3)}%;height:${(w[4]*100+1).toFixed(3)}%"></i>`).join("");
}
function focusBox(i){
  const hs=hitsOn(S.pageKey,S.selMark);if(!hs.length||!S.page)return;
  S.boxI=((i||0)+hs.length)%hs.length;const w=hs[S.boxI];
  const st=$("stage").getBoundingClientRect(),v=S.page.getViewport({scale:1});
  const s=Math.min(Math.max(S.fitS*3,S.view.s),S.fitS*6);
  const cx=(w[1]+w[3]/2)*v.width,cy=(w[2]+w[4]/2)*v.height;
  S.view={s,tx:st.width/2-cx*s,ty:st.height/2-cy*s};draw();drawBoxes();renderUsed();
}
function renderUsed(){
  const box=$("used");const m=S.selMark;
  if(!m){box.hidden=true;return}
  const per=[];let qty=0,lb=0;const sizes={};
  S.sheets.forEach((g,gi)=>{const rs=g.rows.filter(r=>normMark(r.member_mark)===m);if(!rs.length)return;
    let q=0,w=0;rs.forEach(r=>{q+=orderQtyOf(r);w+=rowWeight(r)||0;sizes[(r.size||"")+" "+(r.form_type||"")]=1});
    qty+=q;lb+=w;per.push({gi,g,q,w,row:g.rows.indexOf(rs[0]),h:sheetHits(g,m)})});
  const sz=Object.keys(sizes),here=S.sheets[S.cur],hereHits=hitsOn(S.pageKey,m).length;
  const cell=h=>!h.parts?"–":h.read<h.parts?'<span title="Still being read">reading…</span>':String(h.n);
  box.hidden=false;
  box.innerHTML=`<h4>${esc(per[0]?S.sheets[per[0].gi].rows[per[0].row].member_mark:m)}</h4>
   <div class="sub">${esc(sz.join(" · "))}${sz.length>1?' <span class="warn">· '+sz.length+" different sizes use this mark</span>":""}</div>
   <div class="tot"><span>Total in take-off <b>${qty.toLocaleString()}</b> pcs</span><span><b>${lb?fmtLb(lb):"–"}</b> lb</span><span>on <b>${per.length}</b> drawing${per.length===1?"":"s"}</span></div>
   ${here&&S.pageKey?`<div class="sub">${S.marks[S.pageKey]&&S.marks[S.pageKey].words?(hereHits?`Boxed on this sheet: <b>${hereHits}</b> place${hereHits===1?"":"s"}${printedAs(S.pageKey,m)?" (printed as <b>"+esc(printedAs(S.pageKey,m))+"</b>)":""}${hereHits>1?' · <a href="#" data-step="1">next ›</a>':""}`:"Not found printed on this sheet by the drawing reader."):S.marks[S.pageKey]&&S.marks[S.pageKey].err?"This sheet couldn't be read for part marks.":'<span class="spin"></span>This sheet is still being read for part marks.'}</div>`:""}
   <table><thead><tr><th>Drawing</th><th class="n">Qty</th><th class="n">lb</th><th class="n" title="How often the mark is printed on the drawing: views, callouts and the parts list. Not a quantity.">Printed</th></tr></thead><tbody>
   ${per.map(p=>`<tr class="go ${p.gi===S.cur?"here":""}" data-g="${p.gi}" data-r="${p.row}"><td>${esc(p.g.number)}</td><td class="n">${p.q.toLocaleString()}</td><td class="n">${p.w?fmtLb(p.w):"–"}</td><td class="n">${cell(p.h)}</td></tr>`).join("")}
   </tbody></table>
   <div class="note">Qty is the take-off's own count (pieces × assemblies built). Printed is how often the drawing reader found the mark on the sheet (views, callouts, the parts list), shown as a check, not a count.</div>`;
}
function ocrTargets(){const ks={},out=[];S.sheets.forEach(g=>partsOf(g).forEach(p=>{const k=keyOf(p);if(!ks[k]){ks[k]=1;out.push({file_id:p.file_id,page:p.page||1,key:k})}}));return out}
function renderOcr(){
  const t=ocrTargets(),done=t.filter(x=>S.marks[x.key]).length;
  $("ocrnote").innerHTML=!t.length||done>=t.length?"":`<span class="spin"></span>Reading part marks off the drawings: ${done} of ${t.length}`;
}
let ocrTimer=null;
async function pollMarks(){
  clearTimeout(ocrTimer);
  try{const d=await getJSON("/api/takeoff/marks/"+encodeURIComponent(P.project_id)+(S.mnow?"?since="+encodeURIComponent(S.mnow):""));
    if(d&&d.ok){Object.assign(S.marks,d.pages||{});S.mnow=d.now||S.mnow;
      if(d.pages&&d.pages[S.pageKey]){drawBoxes();if(S.selMark&&S.boxI<0)focusBox(0)}
      renderOcr();renderUsed();
      if(ocrTargets().some(x=>!S.marks[x.key]))ocrTimer=setTimeout(pollMarks,d.status&&(d.status.running||d.status.queued)?4000:15000)}}
  catch(e){ocrTimer=setTimeout(pollMarks,15000)}
}
async function startOcr(firstKey,onlyFirst){
  const t=ocrTargets().filter(x=>!S.marks[x.key]||S.marks[x.key].err);
  if(!t.length&&!firstKey)return;
  if(firstKey&&S.marks[firstKey]&&S.marks[firstKey].words&&onlyFirst)return;
  try{await getJSON("/api/takeoff/marks/"+encodeURIComponent(P.project_id)+"/build",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({targets:onlyFirst?t.filter(x=>x.key===firstKey):t,first:firstKey||""})});}catch(e){}
  pollMarks();
}
function selectRow(gi,ri){
  const g=S.sheets[gi],r=g&&g.rows[ri];S.sel=ri;S.selMark=r?normMark(r.member_mark):null;S.boxI=-1;
  // On a drawing split over several files, open the part where the mark is printed.
  let part=gi===S.cur?S.part:0;
  if(S.selMark&&!hitsOn(keyOf(partsOf(g)[part]),S.selMark).length){const k=partsOf(g).findIndex(p=>hitsOn(keyOf(p),S.selMark).length);if(k>-1)part=k}
  if(gi!==S.cur||part!==S.part){
    openSheet(gi,false,part);
  } else {renderList();drawBoxes();if(hitsOn(S.pageKey,S.selMark).length)focusBox(0);renderUsed()}
  document.querySelector(`.row[data-g="${gi}"][data-r="${ri}"]`)?.scrollIntoView({block:"nearest"});
}

/* ---- events ---- */
$("prev").onclick=()=>openSheet((S.cur-1+S.sheets.length)%S.sheets.length);
$("next").onclick=()=>openSheet((S.cur+1)%S.sheets.length);
$("sheet").onchange=e=>{S.sel=-1;S.selMark=null;openSheet(+e.target.value)};
$("zin").onclick=()=>zoomAt(1.4);$("zout").onclick=()=>zoomAt(1/1.4);$("fit").onclick=()=>fit();
$("parts").addEventListener("click",e=>{const b=e.target.closest("[data-part]");if(b)openSheet(S.cur,false,+b.dataset.part)});
$("used").addEventListener("click",e=>{const st=e.target.closest("[data-step]");if(st){e.preventDefault();focusBox(S.boxI+1);return}
  const tr=e.target.closest("tr.go");if(tr)selectRow(+tr.dataset.g,+tr.dataset.r)});
$("find").onclick=()=>$("q").focus();
$("q").oninput=e=>{S.q=e.target.value.trim().toLowerCase();renderList()};
const pick=el=>{const g=+el.dataset.g;if(el.dataset.r!=null)return selectRow(g,+el.dataset.r);S.sel=-1;S.selMark=null;renderUsed();if(g!==S.cur)openSheet(g);else renderList()};
$("list").addEventListener("click",e=>{const el=e.target.closest("[data-g]");if(el)pick(el)});
$("list").addEventListener("keydown",e=>{if(e.key==="Enter"){const el=e.target.closest("[data-g]");if(el)pick(el)}});
$("mapnote").addEventListener("click",async e=>{if(e.target.id!=="build")return;const b=e.target;b.disabled=true;b.innerHTML='<span class="spin"></span>Reading drawing numbers…';
  try{const d=await getJSON("/api/takeoff/sheet-map/"+encodeURIComponent(P.project_id)+"/build",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({manufacturer_id:P.manufacturer_id})});
    if(!d.ok)throw new Error(d.error||"failed");S.map=d.map;S.stale=false;const cur=S.sheets[S.cur]&&S.sheets[S.cur].number;buildSheets();
    const gi=Math.max(0,S.sheets.findIndex(g=>g.number===cur));renderCheck();openSheet(gi)}
  catch(err){b.disabled=false;b.textContent="Try again";b.title=String(err.message||err);msg("<b>Couldn't read the drawing numbers.</b><br>"+esc(err.message||err))}});
const stage=$("stage");let drag=null;
stage.addEventListener("wheel",e=>{e.preventDefault();const r=stage.getBoundingClientRect();zoomAt(e.deltaY>0?1/1.15:1.15,e.clientX-r.left,e.clientY-r.top)},{passive:false});
stage.addEventListener("pointerdown",e=>{const bx=e.target.closest("#ov i");if(bx){const g=S.sheets[S.cur],ri=g?g.rows.findIndex(r=>normMark(r.member_mark)===S.selMark):-1;S.boxI=+bx.dataset.box;drawBoxes();renderUsed();if(ri>-1){S.sel=ri;renderList()}return}
  if(!S.page||e.target.closest("#parts,.msg"))return;drag={x:e.clientX,y:e.clientY,tx:S.view.tx,ty:S.view.ty};stage.setPointerCapture(e.pointerId);stage.classList.add("drag")});
stage.addEventListener("pointermove",e=>{if(!drag)return;S.view.tx=drag.tx+e.clientX-drag.x;S.view.ty=drag.ty+e.clientY-drag.y;draw()});
const end=()=>{drag=null;stage.classList.remove("drag")};stage.addEventListener("pointerup",end);stage.addEventListener("pointercancel",end);
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
  if(e.key==="PageDown"||e.key==="]")$("next").click();else if(e.key==="PageUp"||e.key==="[")$("prev").click();
  else if(e.key==="+"||e.key==="=")zoomAt(1.25);else if(e.key==="-")zoomAt(.8);else if(e.key==="0")fit();});
new ResizeObserver(()=>{if(S.page&&S.cur>-1&&S.view)draw()}).observe(stage);
$("back").onclick=e=>{e.preventDefault();if(history.length>1&&document.referrer)history.back();else location.href="/takeoff/review.html?project_id="+encodeURIComponent(P.project_id)+"&manufacturer_id="+encodeURIComponent(P.manufacturer_id)};

/* ---- start ---- */
(async function init(){
  if(!P.project_id){msg("<b>No project was given.</b><br>Open this page from a take-off's review page.");$("job").firstChild.textContent="AI Take-off";return}
  if(!window.pdfjsLib){msg("<b>The drawing viewer didn't load.</b><br>Check the internet connection and reload the page.");return}
  const [R,map,scope,cat]=await Promise.all([
    loadTakeoff().catch(()=>null),
    getJSON("/api/takeoff/sheet-map/"+encodeURIComponent(P.project_id)).catch(()=>null),
    getJSON("/api/takeoff/project-scope/"+encodeURIComponent(P.project_id)).catch(()=>null),
    getJSON("/api/takeoff/catalog-index").catch(()=>null)]);
  if(cat&&cat.ok)CAT_WEIGHTS=cat.weights||{};
  if(scope&&scope.ok)S.head=scope.project||null;
  const name=S.head?[S.head.number,S.head.name].filter(Boolean).join(" · "):((R&&R.project&&R.project.name)||"AI Take-off");
  $("job").innerHTML=esc(name)+"<small>AI Take-off · Drawings</small>";document.title=name+" · Drawings";
  if(map&&map.ok){S.files=arr(map.files);S.map=map.map||null;S.stale=!!map.stale}
  if(!R){msg("<b>This project has no saved take-off yet.</b><br>Run the take-off first, then open its drawings.");return}
  S.R=R;buildSheets();renderCheck();renderList();renderNav();
  if(!S.sheets.length){msg("<b>The take-off has no lines to show.</b>");return}
  await openSheet(Math.max(0,S.sheets.findIndex(g=>g.loc)));
  pollMarks().then(()=>startOcr(S.pageKey,false));
})();
}
</script>
