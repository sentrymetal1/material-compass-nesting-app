  // ---- the shop's fittings catalog, for the pickers -------------------------
  // A fitting has to resolve to REAL catalog records or it is worthless downstream: no ids means
  // no price and no rollup, and it fails silently rather than loudly
  // ([[feedback_fitting_id_catalog_coverage]]). So the editor offers the catalog rather than a
  // free-text box, and stores the record id alongside the name.
  let FITCAT=null, FITCAT_LOADING=false;
  // The aliases the index route has always sent and this page has never read. The one that
  // matters: the take-off assigns "Wrought - Carbon Steel" to butt-weld fittings, and the
  // detail tables file those under "Carbon Steel" — so that make matched no catalog record,
  // which narrowed the picker to nothing and made every butt-weld size lookup come back empty.
  let FITALIAS={make:{},type:{},end:{}};
  function fitNorm(s){ return String(s==null?"":s).toLowerCase().replace(/[^a-z0-9]+/g," ").trim(); }
  function fitAlias(kind,name){
    const m=(FITALIAS&&FITALIAS[kind])||{};
    return m[fitNorm(name)]||"";
  }
  // Exact, then alias, then normalised — and a normalised name that hits two records is NOT a
  // match. These are the same three steps the server uses in fittingResolve.js, on purpose:
  // if the page and the commit disagree about what a fitting is, one of them is wrong at the
  // worst possible moment. Ambiguity stays a blank for a human to settle.
  function fitIdOf(list,name,kind){
    const v=String(name==null?"":name).trim(); if(!v||!list) return "";
    const hit=list.find(function(o){ return o.name===v; });
    if(hit) return hit.id;
    const al=kind?fitAlias(kind,v):"";
    if(al){
      const byAlias=list.filter(function(o){ return fitNorm(o.name)===fitNorm(al); });
      if(byAlias.length===1) return byAlias[0].id;
    }
    const loose=list.filter(function(o){ return fitNorm(o.name)===fitNorm(v); });
    return loose.length===1?loose[0].id:"";
  }
  function fitChildren(list,key,parentId){
    if(!list) return null;
    if(!parentId) return list;                    // parent not chosen yet — offer everything
    const kids=list.filter(function(o){ return String(o[key]||"")===String(parentId); });
    return kids.length?kids:list;                 // catalog has no children for it: don't strand the user
  }
  let FITCAT_ERR="";
  function loadFittingsCatalog(){
    if(FITCAT||FITCAT_LOADING||FITCAT_ERR) return;
    FITCAT_LOADING=true;
    fetch(RAILWAY_URL+"/api/takeoff/fittings-catalog")
      .then(function(r){return r.json()})
      .then(function(d){
        if(d&&d.ok&&(d.types||[]).length){ FITCAT=d; autoResolveFittings(); }
        else { FITCAT_ERR=catalogErrText(d&&d.error); }   // say WHY, don't sit on "Loading…"
        render();   // whichever of the two lands second is the one that resolves
      })
      .catch(function(e){ FITCAT_ERR=catalogErrText(e&&e.message); render(); })
      .then(function(){ FITCAT_LOADING=false; });
  }

  // ---- the DETAIL rows: sizes, classes and the weight ----------------------
  // The five catalog tables above say what KINDS of fitting exist. They hold no
  // size, no class and no weight — those live in the two detail tables, and a
  // fitting that never resolves to one of their rows reaches Zoho with no weight
  // and no Fitting_ID, which is what was happening to every take-off fitting.
  //
  // fittingIndex.js flattens both detail tables into one searchable list where a
  // fitting is ONE row rather than six independent choices. It is ~10k items but
  // fetched once and cached server-side for 12h, which is exactly what it was
  // built for.
  let FITIDX=null, FITIDX_LOADING=false, FITIDX_ERR="";
  function loadFittingIndex(){
    if(FITIDX||FITIDX_LOADING||FITIDX_ERR) return;
    FITIDX_LOADING=true;
    fetch(RAILWAY_URL+"/api/takeoff/fitting-index")
      .then(function(r){return r.json()})
      .then(function(d){
        if(d&&d.ok&&(d.items||[]).length){ FITIDX=d.items; FITALIAS=d.aliases||FITALIAS; autoResolveFittings(); }
        else FITIDX_ERR=catalogErrText(d&&d.error);
        render();
      })
      .catch(function(e){ FITIDX_ERR=catalogErrText(e&&e.message); render(); })
      .then(function(){ FITIDX_LOADING=false; });
  }

  // The detail rows available to a fitting, given whatever it has been narrowed to.
  // Matching is on the catalog RECORD IDS, never the display names — the same rule
  // the Zoho form's own filtered lookup uses.
  // A take-off fitting arrives with NAMES and no ids — the ids are only stored when a
  // human picks from a dropdown. Treating a missing id as "no constraint" offered every
  // row in both tables, so a cast-iron threaded bushing was being shown 30" SCH 10 pipe
  // schedules. So: use the stored id, else resolve the name through the catalog, and if
  // a name IS set but the catalog does not know it, match nothing rather than everything.
  const NO_MATCH='__no_match__';
  function fitNarrow(f,idField,nameField,list,kind){
    if(f[idField]) return String(f[idField]);
    const nm=String(f[nameField]==null?'':f[nameField]).trim();
    if(!nm) return '';                       // genuinely unconstrained
    if(!FITCAT||!list) return '';            // catalog not loaded yet — cannot narrow
    return fitIdOf(list,nm,kind)||NO_MATCH;
  }
  function fitDetailOptions(f){
    if(!FITIDX) return null;
    const want=function(a,b){ return !a || String(a)===String(b); };
    const t=fitNarrow(f,'fitting_type_id','fitting_type',FITCAT&&FITCAT.types,'type');
    const m=fitNarrow(f,'fitting_make_id','fitting_make',FITCAT&&FITCAT.makes,'make');
    // End type and connection names REPEAT across fitting types: "Threaded - NPT" is a
    // separate record for Bushing, Elbow, Tee and Cap, and "Equal" exists for both Tee
    // and Cross. Resolving either by name alone returns whichever happens to come first,
    // which is then a real id belonging to the wrong fitting — so resolve them WITHIN
    // the type, the same way the pickers above already narrow their options.
    const scoped=function(list){
      return (FITCAT&&t&&t!==NO_MATCH)?fitChildren(list,'typeId',t):list; };
    const e=fitNarrow(f,'end_type_id','end_type',FITCAT&&scoped(FITCAT.ends),'end');
    const c=fitNarrow(f,'connection_type_id','connection_type',FITCAT&&scoped(FITCAT.connections));
    if([t,m,e,c].indexOf(NO_MATCH)>-1) return [];
    return FITIDX.filter(function(it){
      return want(t,it.typeId)&&want(m,it.makeId)&&want(e,it.endId)&&want(c,it.connId);
    }).sort(function(a,b){ return npsNum(a.size)-npsNum(b.size) ||
        String(a.sched||'').localeCompare(String(b.sched||'')); });
  }

  // '1-1/2"' sorts after '1"' and before '2"', which a string compare does not manage:
  // it puts 10", 12" and 30" between 1" and 2".
  function npsNum(s){
    const v=String(s==null?'':s).replace(/["”]/g,'').trim();
    const mixed=v.match(/^(\d+)[\s-](\d+)\/(\d+)$/);
    if(mixed) return Number(mixed[1])+Number(mixed[2])/Number(mixed[3]);
    const frac=v.match(/^(\d+)\/(\d+)$/);
    if(frac) return Number(frac[1])/Number(frac[2]);
    const n=parseFloat(v);
    return Number.isFinite(n)?n:0;
  }

  // '2"', '2 in', '2' all have to compare equal, because the drawing, the model and
  // the catalog each write a size differently.
  function fitSizeKey(s){
    return String(s==null?'':s).toLowerCase().replace(/inch(es)?/g,'').replace(/[^0-9a-z/.-]/g,'');
  }

  // Match what the take-off already said against the catalog, and adopt the row when
  // there is EXACTLY ONE candidate. Ambiguity is left alone deliberately: a confident
  // wrong row carries a real weight for the wrong part, which survives every check
  // downstream — far worse than an obvious blank.
  // ── THE SERVER RESOLVES, THE PAGE APPLIES ────────────────────────────────────────────────
  // Names → ids, fuzzy matching and this shop's learned corrections all live in ONE place
  // (server/fittingResolve.js), which is also what the commit calls. So what you see resolved
  // here is exactly what gets written — the page cannot be right while the commit is wrong.
  //
  // Best-effort: if it fails, the local pass below still runs. It never blocks the estimator.
  let FITRESOLVED=false;
  function resolveFittingsViaServer(){
    if(FITRESOLVED) return;
    const R=loadResult(); const list=arr(R.fittings);
    if(!list.length||R.__demo){ FITRESOLVED=true; return; }
    FITRESOLVED=true;
    fetch(RAILWAY_URL+"/api/takeoff/fitting-resolve",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({manufacturer_id:params.manufacturer_id,fittings:list})})
      .then(function(r){return r.json()})
      .then(function(d){
        if(!d||!d.ok||!Array.isArray(d.rows)) return;
        const R2=loadResult(); const rows=arr(R2.fittings); let n=0;
        d.rows.forEach(function(res,i){
          const f=rows[i]; if(!f||!res) return;
          // Only ever FILLS blanks. A value the estimator has already set outranks anything
          // resolved here, whatever rule produced it.
          Object.keys(res.ids||{}).forEach(function(k){ if(!f[k]){ f[k]=res.ids[k]; n++; } });
          if(res.detail && !f.detail_id){
            f.detail_id=res.detail.id; f.detail_table=res.detail.tbl; f.detail_label=res.detail.label; f.std_label="";
            f.size=res.detail.size||f.size; f.schedule_or_class=res.detail.sched||f.schedule_or_class;
            if(f.weight==null) f.weight=(res.detail.weight==null?null:res.detail.weight);
            f.auto_matched=true; n++;
          }
          // What could not be placed, kept on the row so the picker can offer the near misses
          // instead of leaving the estimator to guess what the catalog calls it.
          f.__unresolved=(res.unresolved&&res.unresolved.length)?res.unresolved:null;
        });
        if(n){ saveResult(R2); render(); }
      })
      .catch(function(){});
  }

  /**
   * The specification is the anchor; the other fields move to meet it.
   *
   * A spec string either exists in this shop's catalog or it does not, and when it does
   * it belongs to exactly one make. So "WPB | ASTM A234" under make "Carbon Steel" is not
   * an unknown specification — it is the right specification filed under the wrong make,
   * because the catalog keeps A234 under "Wrought - Carbon Steel". Leaving that to the
   * estimator means retyping the make on every such row; the row is repaired here and
   * marked in red for confirmation instead, because a field this tool changed is a field
   * a human should still agree with.
   *
   * Unknown or ambiguous specs are left exactly as the model wrote them: the existing
   * warning already asks for a choice, and guessing between two real makes would put the
   * wrong material on a quote.
   */
  function repairFittingMakes(){
    if(!FITCAT) return 0;
    const R=loadResult(); let n=0;
    arr(R.fittings).forEach(function(f){
      const spec=String(f.specification||'').trim(); if(!spec) return;
      const mine=fitChildren(FITCAT.specs,'makeId',fitIdOf(FITCAT.makes,f.fitting_make))||[];
      if(mine.some(function(o){ return o.name===spec; })) return;   // already consistent
      const owners={};
      (FITCAT.specs||[]).forEach(function(o){ if(o.name===spec&&o.makeId) owners[String(o.makeId)]=1; });
      const ids=Object.keys(owners);
      if(ids.length!==1) return;                                    // unknown or shared: leave the warning
      const make=(FITCAT.makes||[]).filter(function(m){ return String(m.id)===ids[0]; })[0];
      if(!make||make.name===f.fitting_make) return;
      f.auto_fix=(f.auto_fix||[]).concat([{field:'Make',from:f.fitting_make||'(blank)',to:make.name,why:spec}]);
      f.fitting_make=make.name;
      f.fitting_make_id=make.id;
      n++;
    });
    if(n){ saveResult(R); console.log('[fittings] moved '+n+' make(s) to match the specification'); }
    return n;
  }

  // ── SPECIFICATION TRUMPS THE OTHER FIELDS ───────────────────────────────────────────────
  // A specification the catalog does not carry for the chosen make is far more likely to mean
  // the MAKE is wrong than the specification. The specification is usually written on the
  // drawing; the make is inferred from it. So when the specification exists under exactly one
  // other make, move the make to it rather than asking for a different specification.
  //
  // Only ever when ONE make carries it - two is a genuine question and is asked, not guessed.
  // What changed is recorded on the row so it can be shown in red and confirmed, and a manual
  // edit to either field clears it (see fitPick).
  function fitReconcileSpecs(){
    if(!FITCAT) return 0;
    const R=loadResult(); let n=0;
    arr(R.fittings).forEach(function(f){
      if(f.__specFix) return;                              // already moved, awaiting confirmation
      const spec=String(f.specification||'').trim();
      if(!spec) return;
      const makeId=fitIdOf(FITCAT.makes,f.fitting_make);
      const here=fitChildren(FITCAT.specs,'makeId',makeId)||[];
      if(here.some(function(o){ return o.name===spec; })) return;   // valid where it is
      // Which makes DO carry it?
      const owners={};
      (FITCAT.specs||[]).forEach(function(o){ if(o.name===spec) owners[String(o.makeId)]=1; });
      const ids=Object.keys(owners);
      if(ids.length!==1) return;                           // none, or ambiguous - leave it alone
      const m=(FITCAT.makes||[]).find(function(x){ return String(x.id)===ids[0]; });
      if(!m||m.name===f.fitting_make) return;
      f.__specFix={from:f.fitting_make,to:m.name,spec:spec};
      f.fitting_make=m.name;
      // The make changed, so anything matched under the old one is no longer trustworthy.
      f.detail_id=null; f.detail_table=null; f.detail_label=null; f.weight=null; f.auto_matched=false; f.std_label="";
      n++;
    });
    if(n) saveResult(R);
    return n;
  }
  function autoResolveFittings(){
    // Specification first: it can change the make, and the make narrows everything after it.
    fitReconcileSpecs();
    resolveFittingsViaServer();
    repairFittingMakes();
    // BOTH are required. The two fetches race, and without the catalog the four
    // narrowing names cannot become ids — every fitting would then match the whole
    // index and auto-adopt the first row of the right size, from any make.
    if(!FITIDX||!FITCAT) return 0;
    const R=loadResult(); let n=0;
    arr(R.fittings).forEach(function(f){
      if(f.detail_id) return;
      const opts=fitDetailOptions(f)||[];
      const want=fitSizeKey(f.size);
      if(!opts.length||!want) return;
      // A reducing pick reads "1/2\" x 1/8\"", but the older rows keep only the RUN in
      // `size` and the pair in `rdims`. Try the pair first: it is the more specific
      // match, and without it no reducing fitting can ever resolve automatically.
      let hits=opts.filter(function(o){ return o.rdims && fitSizeKey(o.rdims)===want; });
      if(!hits.length) hits=opts.filter(function(o){ return fitSizeKey(o.size)===want; });
      // The schedule or class is a REQUIREMENT, not a tie-breaker — the same rule as the
      // server's narrow(). Applied only when there were several rows, a lone row of the right
      // size was adopted whatever its class: a 150# 3" weld-neck came back Class 2500 SCH 10
      // at 94 lb (2026-09-28). The size in another class is a miss; the commit creates the row.
      const sch=fitSizeKey(f.schedule_or_class);
      if(sch){
        hits=hits.filter(function(o){ return fitSizeKey(o.sched).indexOf(sch)>-1; });
      }
      if(hits.length!==1) return;
      const it=hits[0];
      f.detail_id=it.id; f.detail_table=it.tbl; f.detail_label=it.label;
      f.weight=(it.weight==null?null:it.weight);
      f.size=it.size||f.size; f.schedule_or_class=it.sched||f.schedule_or_class;
      f.auto_matched=true;
      n++;
    });
    // No catalog row, but exactly ONE standard size fits what the take-off read: select it, so
    // "1/8" · 3000#" becomes "1/8" | 3000 PSI" — the spelling that weighs — with nothing retyped.
    // Several (a weld neck read as just "Class 150" has five bores) stays a question for a person.
    arr(R.fittings).forEach(function(f){
      if(f.detail_id||f.std_label||f.size_other) return;
      const m=fitStdMatches(f,fitStdOptions(f,fitDetailOptions(f)||[]));
      if(m.length!==1) return;
      fitSetStd(f,m[0]); n++;
    });
    if(n) saveResult(R);
    return n;
  }

  // One cell for size + class + weight. Three states, and the difference matters:
  // the index has not loaded (old free-text boxes), it loaded but nothing matches
  // this combination (free-text boxes AND a warning, because that fitting cannot
  // price), or it matched (a picker, and a weight).
  // ── ONE SHORT NOTE, ON ITS OWN FULL-WIDTH ROW ──────────────────────────────────────────
  // Returns {tone, html} for a fitting that needs the estimator to look at it, or null.
  // Kept to one sentence: the previous wording ran to four lines inside a 176px column and
  // was, in Mark's words, "a bit wordy".
  // Does any candidate row actually carry the size the take-off read? This is the question
  // that decides everything else about the row: if nothing does, the commit CREATES a catalog
  // row from the size and class on screen - so those two have to be editable, and the note
  // has to say so. One definition, used by both, or they drift apart again.
  // The CLASS counts too, exactly as server/fittingResolve.js narrow() counts it: a 3" flange
  // exists at Class 2500, but a 3" Class 150 read is still a miss there, and the commit CREATES
  // the Class 150 row. Size-only here told the estimator "pick one, or no weight" about a row
  // the commit was going to create anyway — and offered a Class 2500 row to pick.
  function fitSchedKey(s){
    return String(s==null?'':s).replace(/\([^)]*\)/g,' ').replace(/\b(sch|schedule|class|cl)\b\.?/gi,' ')
      .replace(/[^a-z0-9]+/gi,' ').trim().toLowerCase();
  }
  function fitSameSched(a,b){
    const A=fitSchedKey(a), B=fitSchedKey(b);
    if(!A||!B) return false;
    if(A===B) return true;
    const ta=A.split(' '), tb=B.split(' ');
    return ta.every(function(w){ return tb.indexOf(w)>-1; }) || tb.every(function(w){ return ta.indexOf(w)>-1; });
  }
  function fitSizeInCatalog(x,opts){
    const want=fitSizeKey(x.size);
    if(!want) return false;
    const sch=String(x.schedule_or_class||'').trim();
    return (opts||[]).some(function(o){
      const sized=(o.rdims && fitSizeKey(o.rdims)===want) || fitSizeKey(o.size)===want;
      return sized && (!sch || fitSameSched(o.sched,sch)); });
  }

  // ── STANDARD SIZES: THE SAME LIST THE PROJECT FORM OFFERS ─────────────────────────────────
  // fittingSizes.js is generated from the Deluge getFittingSizes(), so these labels are spelled
  // exactly as the project form's own dropdown spells them — and getFittingWeight() looks weights
  // up by that literal string. Free text is how "3000#" got into the catalog and weighed zero.
  // Style follows the same rule the commit uses to pick a table (fittingAdd.js tableFor).
  function fitStdAll(x){
    if(!window.MCFittingSizes||!x.fitting_type) return [];
    const style=/butt\s*weld/i.test(x.end_type||'')?'Butt Weld':'Forged';
    return MCFittingSizes.getFittingSizes(x.fitting_type,style,x.connection_type,x.end_type,x.fitting_make);
  }
  function fitSplitStd(label){
    const k=label.indexOf(' | ');
    return k<0?{size:label,sched:''}:{size:label.slice(0,k),sched:label.slice(k+3)};
  }
  // Standard sizes with no catalog row yet. One that a catalog row already carries is left out:
  // it is offered once, as the catalog row, with its weight.
  function fitStdOptions(x,opts){
    return fitStdAll(x).filter(function(l){
      const s=fitSplitStd(l), want=fitSizeKey(s.size), sk=fitSchedKey(s.sched);
      return !(opts||[]).some(function(o){
        const sized=(o.rdims && fitSizeKey(o.rdims)===want) || fitSizeKey(o.size)===want;
        return sized && fitSchedKey(o.sched)===sk; }); });
  }
  // The standard labels that fit what the take-off read. "3000#" finds "3000 PSI"; "Class 150" on
  // a weld neck finds all five bores, which is a real question and is left for a person.
  function fitStdMatches(x,list){
    const want=fitSizeKey(x.size), sch=String(x.schedule_or_class||'').trim();
    if(!want) return [];
    return list.filter(function(l){ const s=fitSplitStd(l);
      return fitSizeKey(s.size)===want && (!sch || fitSameSched(s.sched,sch)); });
  }
  function fitSetStd(f,label){
    const s=fitSplitStd(label);
    f.std_label=label; f.detail_label=label; f.size=s.size; f.schedule_or_class=s.sched;
    f.detail_id=""; f.detail_table=""; f.weight=null; f.size_other=false;
  }
  function fitRowNote(x){
    if(!FITIDX||!FITCAT) return null;
    const opts=fitDetailOptions(x)||[];

    /* A field this tool changed on your behalf. Red, because it is an edit you have not
       seen yet, and the whole row hangs off it: the make chooses the specification list,
       and the pair chooses the catalog row the weight and price come from. */
    const fixed=arr(x.auto_fix);
    if(fixed.length){
      return {tone:'bad', html: fixed.map(function(c){
        return '<b>'+esc(c.field)+' changed to '+esc(c.to)+'</b> (was '+esc(c.from)+') to match the ' +
          'specification <b>'+esc(c.why)+'</b>, which the catalog files under it';
      }).join(' · ')+' — <b>confirm this is right</b>, or pick a different specification.'};
    }

    // A specification the catalog does not carry for this make. It does NOT stop the row -
    // but the field is left unwritten, so the supplier receives a line with no specification
    // on it and cannot quote it properly. That is worth a look, unlike the size.
    // Moved to match its specification. Say so, in red, until it is confirmed.
    if(x.__specFix){
      return {tone:'bad', html:'<b>Make changed</b> from '+esc(x.__specFix.from)+' to <b>'+
        esc(x.__specFix.to)+'</b> because specification <b>'+esc(x.__specFix.spec)+'</b> belongs to it. '+
        'Confirm this is right, or change either field.'};
    }
    const specs=FITCAT?fitChildren(FITCAT.specs,'makeId',fitIdOf(FITCAT.makes,x.fitting_make)):null;
    const specVal=String(x.specification||'').trim();
    if(specVal && specs && !specs.some(function(o){ return o.name===specVal; })){
      return {tone:'bad', html:'<b>'+esc(specVal)+'</b> is not a specification the catalog has for '+
        esc(x.fitting_make||'this make')+' — pick one, or this line reaches the supplier without a specification.'};
    }

    if(x.detail_id) return null;                       // matched; nothing to say

    if(x.std_label){
      return {tone:'warn', html:'Standard size, not in the catalog yet — a catalog row will be created '+
        'when you Approve &amp; Submit, flagged for Material Compass.'};
    }
    const std=fitStdAll(x);
    if(std.length && !x.size_other){
      return {tone:'bad', html:'Pick a size · class from the list — or <b>Other…</b> to type one. '+
        'Left unpicked the line still reaches the project, but with no weight.'};
    }
    if(std.length && x.size_other && !fitStdMatches(x,std).length){
      return {tone:'warn', html:'Typed size — <b>not a standard size for this fitting</b>, so it will '+
        'likely reach the project with no weight. A catalog row is created from it on approve.'};
    }

    // Will the commit CREATE a row? It does when nothing in the catalog carries this size -
    // whether that is because there are no candidate rows at all, or because there are and
    // none of them is this size. Both end the same way, so both read the same way.
    if(!fitSizeInCatalog(x,opts)){
      return {tone:'warn', html:'Not in the catalog yet — <b>confirm the size and class are right</b> '+
        '(edit them if not). A catalog row will be created from them when you Approve &amp; Submit, '+
        'flagged for Material Compass.'};
    }
    // The size IS in the catalog and still nothing is picked, so the class is what is unresolved.
    return {tone:'bad', html:'Pick a size · class — this size exists in the catalog. '+
      'Left unpicked the line still reaches the project, but with no weight.'};
  }
  function detailCell(x,i){
    const box=function(field,val,w){
      return '<input class="fin" style="width:'+w+'" value="'+escAttr(val==null?'':val)+'" '+
        'onchange="fitEdit('+i+',\''+field+'\',this.value)">'; };
    const plain=box('size',x.size,'96px')+box('schedule_or_class',x.schedule_or_class,'70px');
    // Both are needed before a meaningful list can be offered — see fitDetailOptions.
    if(!FITIDX||!FITCAT) return plain+(FITIDX_ERR?'<div class="src" style="color:#9a6400">'+esc(FITIDX_ERR)+'</div>':'');
    const opts=fitDetailOptions(x)||[];
    const std=fitStdOptions(x,opts);
    if(std.length || (fitStdAll(x).length && opts.length)) return detailPicker(x,i,opts,std,plain);
    // No candidate rows at all. The estimator types the size and class; the commit creates
    // the catalog row from them. The explanation lives on the note row below, not in here -
    // this column is 176px and the prose was wrapping to seven lines.
    if(!opts.length) return plain;
    const cur=String(x.detail_id||'');
    // Candidate rows exist, but none is this size. Same outcome as having none at all - the
    // row gets created - so give the same control: the two editable values, with the picker
    // below it in case the size was simply misread and one of the existing rows is right.
    const willCreate = !cur && !fitSizeInCatalog(x,opts);
    let h = willCreate ? plain+'<div style="height:3px"></div>' : '';
    h+='<select class="fin'+((cur||willCreate)?'':' bad')+'" style="width:176px" '+
      'onchange="fitPickDetail('+i+',this.value)">';
    h+='<option value=""'+(cur?'':' selected')+'>'+
      (willCreate?'— or pick an existing row —':'— pick size · class —')+'</option>';
    // Long lists are normal (a common type/make has every size), so cap what is
    // rendered rather than building a 900-option select on every keystroke.
    opts.slice(0,400).forEach(function(o){
      // Older reducing rows put only the RUN size in their description, so three
      // different couplings all read "1/2" | 3000 PSI". Show the pair when the row
      // carries one, or the estimator is picking between identical-looking options.
      const base=o.label||((o.size||'')+' '+(o.sched||''));
      const shown=(o.rdims && base.indexOf(' x ')<0) ? o.rdims+'  ·  '+base : base;
      h+='<option value="'+escAttr(o.id)+'"'+(String(o.id)===cur?' selected':'')+'>'+
        esc(shown)+(o.weight!=null?'  ·  '+o.weight+' lb':'')+'</option>'; });
    h+='</select>';
    if(cur){
      h+='<div class="src">'+(x.weight!=null
        ? '<b>'+Number(x.weight).toFixed(3)+' lb</b> each'
        : '<span style="color:#9a6400">catalog row has no weight</span>')+
        (x.auto_matched?' · matched automatically':'')+'</div>';
    } else if(!willCreate){
      // Only worth saying when there is no editable box on screen showing the same thing.
      const said=[x.size,x.schedule_or_class].filter(Boolean).join(' · ');
      h+='<div class="src">'+(said ? 'take-off read: <b>'+esc(said)+'</b>'
                                    : 'no size read from the drawing')+'</div>';
    }
    return h;
  }

  // ONE control for a fitting the standards list covers: catalog rows (with weights), then the
  // standard sizes that have no row yet (created on approve, spelled so they weigh), then Other…
  // for a genuinely non-standard part — which is the only way back to free text.
  function detailPicker(x,i,opts,std,plain){
    const cur=String(x.detail_id||'');
    const other=!cur && !x.std_label && !!x.size_other;
    const chosen=!!(cur||x.std_label||other);
    let h='<select class="fin'+(chosen?'':' bad')+'" style="width:176px" onchange="fitPickDetail('+i+',this.value)">';
    h+='<option value=""'+(chosen?'':' selected')+'>— pick size · class —</option>';
    if(opts.length){
      h+='<optgroup label="In the catalog">';
      opts.slice(0,400).forEach(function(o){
        const base=o.label||((o.size||'')+' '+(o.sched||''));
        const shown=(o.rdims && base.indexOf(' x ')<0) ? o.rdims+'  ·  '+base : base;
        h+='<option value="'+escAttr(o.id)+'"'+(String(o.id)===cur?' selected':'')+'>'+
          esc(shown)+(o.weight!=null?'  ·  '+o.weight+' lb':'')+'</option>'; });
      h+='</optgroup>';
    }
    if(std.length){
      h+='<optgroup label="Standard size — created on approve">';
      std.slice(0,800).forEach(function(l){
        h+='<option value="'+escAttr('std:'+l)+'"'+(!cur&&x.std_label===l?' selected':'')+'>'+esc(l)+'</option>'; });
      h+='</optgroup>';
    }
    h+='<option value="__other"'+(other?' selected':'')+'>Other… (type size and class)</option>';
    h+='</select>';
    if(other) h+='<div style="height:3px"></div>'+plain;
    if(cur){
      h+='<div class="src">'+(x.weight!=null
        ? '<b>'+Number(x.weight).toFixed(3)+' lb</b> each'
        : '<span style="color:#9a6400">catalog row has no weight</span>')+
        (x.auto_matched?' · matched automatically':'')+'</div>';
    } else if(!chosen){
      const said=[x.size,x.schedule_or_class].filter(Boolean).join(' · ');
      h+='<div class="src">'+(said ? 'take-off read: <b>'+esc(said)+'</b>' : 'no size read from the drawing')+'</div>';
    }
    return h;
  }

  // Picking a detail row is the whole point: it sets the size, the class AND the
  // weight together, and records which row they came from so the weight can be
  // defended later.
  function fitPickDetail(i,detailId){
    const R=loadResult(); const f=arr(R.fittings)[i]; if(!f) return;
    const it=(FITIDX||[]).find(function(x){ return String(x.id)===String(detailId); });
    if(!f.__ai) f.__ai={fitting_type:f.fitting_type,fitting_make:f.fitting_make,
      end_type:f.end_type,connection_type:f.connection_type,specification:f.specification,
      size:f.size,schedule_or_class:f.schedule_or_class};
    const pick=String(detailId||'');
    // Any explicit choice replaces the previous one: a std pick, Other… or a catalog row.
    f.std_label=""; f.size_other=false;
    if(pick.indexOf('std:')===0){
      const label=pick.slice(4);
      const was=[String(f.__ai.size||"").trim(),String(f.__ai.schedule_or_class||"").trim()].filter(Boolean).join(" | ");
      if(was && was!==label) captureCorrection({context:"fitting size",ai_value:was,human_value:label,source:"fitting"});
      fitSetStd(f,label);
      if(!(Number(f.confidence)>0.5)) f.confidence=0.5;
      saveResult(R); render(); return;
    }
    if(pick==='__other'){
      f.detail_id=""; f.detail_table=""; f.weight=null; f.detail_label=""; f.size_other=true;
      saveResult(R); render(); return;
    }
    if(!it){ f.detail_id=""; f.detail_table=""; f.weight=null; f.detail_label=""; }
    else {
      // How this shop writes a size and class, versus how the take-off wrote it. This is the
      // fitting equivalent of the structural "material wording" correction, and it is the one
      // that pays off most: sizes are where the spelling drifts.
      const was=[String(f.__ai.size||"").trim(),String(f.__ai.schedule_or_class||"").trim()]
        .filter(Boolean).join(" | ");
      if(was && it.label && was!==it.label){
        captureCorrection({context:"fitting size",ai_value:was,human_value:it.label,source:"fitting"});
      }
      f.detail_id=it.id; f.detail_table=it.tbl;
      f.size=it.size||f.size; f.schedule_or_class=it.sched||f.schedule_or_class;
      f.detail_label=it.label;
      // A blank weight on the detail row stays blank. A zero would be read as an
      // answer and would understate the job every time it was summed.
      f.weight=(it.weight==null?null:it.weight);
      // The row carries its own ids for all four, so adopt them rather than trusting
      // the names that were there before.
      f.fitting_type_id=it.typeId||f.fitting_type_id;
      f.fitting_make_id=it.makeId||f.fitting_make_id;
      f.end_type_id=it.endId||f.end_type_id;
      f.connection_type_id=it.connId||f.connection_type_id;
      f.fitting_type=it.type||f.fitting_type; f.fitting_make=it.make||f.fitting_make;
      f.end_type=it.end||f.end_type; f.connection_type=it.conn||f.connection_type;
    }
    if(!(Number(f.confidence)>0.5)) f.confidence=0.5;
    saveResult(R); render();
  }

  // Picking from a catalog list stores the NAME and its record id together, and clears any child
  // value the new parent invalidates — a Butt Weld end type left behind on a fitting switched to
  // Threaded is worse than a blank.
  // Which vocabulary each editable field teaches, and the Context string it is stored under.
  // Same Takeoff_Correction table the structural side has always written to.
  const FIT_LEARN_CONTEXT={fitting_type:"fitting type",fitting_make:"fitting make",
    end_type:"fitting end type",connection_type:"fitting connection",
    specification:"fitting specification"};
  function fitPick(i,field,val){
    const R=loadResult(); const f=arr(R.fittings)[i]; if(!f) return;
    const v=String(val==null?"":val).trim();
    // Touching either side of a specification-driven make change IS the confirmation, so the
    // red note clears and fitReconcileSpecs() stops reconsidering the row.
    if(f.__specFix && (field==='fitting_make'||field==='specification')) delete f.__specFix;
    // What the TAKE-OFF said, captured before the first edit overwrites it. After that the row
    // carries the estimator's own words and comparing against them would teach nothing.
    if(!f.__ai) f.__ai={fitting_type:f.fitting_type,fitting_make:f.fitting_make,
      end_type:f.end_type,connection_type:f.connection_type,specification:f.specification,
      size:f.size,schedule_or_class:f.schedule_or_class};
    // A correction, stored the moment it happens, exactly as structural does it: this shop
    // saying what their drawings mean. The resolver trusts it above every other rule, so the
    // next take-off that writes the same word resolves without anyone touching it.
    const was=String(f.__ai[field]==null?"":f.__ai[field]).trim();
    if(FIT_LEARN_CONTEXT[field] && v && was && was!==v){
      captureCorrection({context:FIT_LEARN_CONTEXT[field],ai_value:was,human_value:v,source:"fitting"});
    }
    f[field]=v;
    /* You have now looked at this row and set a field yourself, which is the confirmation
       the red note was asking for. */
    if(f.auto_fix && (field==="fitting_make"||field==="specification"||field==="fitting_type")) delete f.auto_fix;
    if(FITCAT){
      if(field==="fitting_type"){
        f.fitting_type_id=fitIdOf(FITCAT.types,v);
        const ends=fitChildren(FITCAT.ends,'typeId',f.fitting_type_id)||[];
        const conns=fitChildren(FITCAT.connections,'typeId',f.fitting_type_id)||[];
        if(f.end_type && !ends.some(function(o){return o.name===f.end_type;})) { f.end_type=""; f.end_type_id=""; }
        if(f.connection_type && !conns.some(function(o){return o.name===f.connection_type;})) { f.connection_type=""; f.connection_type_id=""; }
      } else if(field==="fitting_make"){
        f.fitting_make_id=fitIdOf(FITCAT.makes,v);
        const specs=fitChildren(FITCAT.specs,'makeId',f.fitting_make_id)||[];
        if(f.specification && !specs.some(function(o){return o.name===f.specification;})) { f.specification=""; f.specification_id=""; }
      // WITHIN THE TYPE. "Threaded - NPT" is a separate record for Bushing, Elbow, Tee and
      // Cap, so resolving the picked name against the whole list returns whichever was created
      // first — a real id belonging to the wrong fitting, which then joins to nothing and
      // prices at $0. The dropdown already only OFFERS this type's children; this makes the
      // id that gets stored agree with what was offered.
      } else if(field==="end_type"){
        f.end_type_id=fitIdOf(fitChildren(FITCAT.ends,'typeId',f.fitting_type_id)||FITCAT.ends,v,'end');
      } else if(field==="connection_type"){
        f.connection_type_id=fitIdOf(fitChildren(FITCAT.connections,'typeId',f.fitting_type_id)||FITCAT.connections,v);
      } else if(field==="specification"){   f.specification_id=fitIdOf(FITCAT.specs,v); }
    }
    // Changing any of the four narrowing fields can invalidate the detail row the
    // size, class and weight came from. Leaving it behind would keep a weight that
    // belongs to a different fitting — the failure this whole path exists to stop.
    if(field!=="specification" && f.detail_id && FITIDX){
      const still=(fitDetailOptions(f)||[]).some(function(o){ return String(o.id)===String(f.detail_id); });
      if(!still){ f.detail_id=""; f.detail_table=""; f.detail_label=""; f.weight=null; }
    }
    // Same for a standard-size pick: a new make or end type can take it off the list.
    if(field!=="specification" && f.std_label && fitStdAll(f).indexOf(f.std_label)<0){
      f.std_label=""; f.detail_label="";
    }
    if(!(Number(f.confidence)>0.5)) f.confidence=0.5;
    saveResult(R);
    render();   // a parent change reshapes its children's lists, so this one does re-render
  }

  // Edits go straight into the stored take-off, with NO re-render — re-rendering on every change
  // would tear the focused input out from under the cursor mid-edit.
  function fitEdit(i,field,val){
    const R=loadResult(); const f=arr(R.fittings)[i]; if(!f) return;
    if(field==="quantity"){
      const q=Math.max(0,Number(val)||0);
      f.quantity=q;
      f.quantity_total=q*Math.max(1,Number(f.units)||1);   // keep the job total in step with the per-unit qty
    } else {
      f[field]=String(val==null?"":val).trim();
      // A typed size or class is what the commit must write, so a label left from an earlier
      // standard pick cannot ride along as the row's description.
      if(field==="size"||field==="schedule_or_class"){ f.std_label=""; if(!f.detail_id) f.detail_label=""; }
    }
    if(!(Number(f.confidence)>0.5)) f.confidence=0.5;      // a human touched it
    saveResult(R);
  }
  function fitDelete(i){
    const R=loadResult(); const f=arr(R.fittings); if(!f[i]) return;
    f.splice(i,1); R.fittings=f; saveResult(R); render();
  }
  function fitAdd(){
    const R=loadResult(); const f=arr(R.fittings);
    // Component is copied from the last row so a fitting added to a one-component job lands
    // somewhere sensible rather than nowhere.
    const last=f[f.length-1]||{};
    f.push({ fitting_type:"", size:"", schedule_or_class:"", end_type:"", connection_type:"",
      fitting_make:"", specification:"", quantity:1, units:Number(last.units)||1,
      quantity_total:Number(last.units)||1, component:last.component||"", source_sheet:"",
      confidence:0.5, note:"added by hand" });
    R.fittings=f; saveResult(R); render();
  }

  // ---- THE BOM EDITOR, ON AN UNCOMMITTED TAKE-OFF -------------------------
  // The estimator already has a BOM grid they know — catalog cascade, live weights,
  // bulk apply, add/delete. Rather than growing a second, worse one here, the same
  // editor is embedded and fed the take-off's rows: /api/takeoff/bom-preview resolves
  // the AI's NAMES to the catalog's record IDs, the editor runs against an in-memory
  // stand-in for Zoho (see tools/make-takeoff-bom-editor.js), and every edit comes
  // back here. NOTHING is written to the project until Approve & Submit — the same
  // gate as before.
  let EDITOR_OPEN = false, EDITOR_UNRESOLVED = [], EDITOR_DIRTY = 0;

  function bomEditorCardHtml(){
    const R = loadResult();
    if (R.__demo) return "";
    const un = EDITOR_UNRESOLVED.length;
    return '<div class="card" id="editorCard"><h2>▤ Edit in the BOM Editor '+
        '<span class="lt">— the same grid as the project, on this take-off, before anything is committed</span></h2>'+
      '<div class="body" id="editorBody">'+
        (EDITOR_OPEN
          ? '<div class="meta" style="margin-bottom:8px">'+
              '<span class="chip">edits apply to this take-off only</span>'+
              (EDITOR_DIRTY?'<span class="chip">'+EDITOR_DIRTY+' change'+(EDITOR_DIRTY===1?'':'s')+' applied</span>':'')+
              (un?'<span class="chip" style="color:var(--ylw)">'+un+' cell'+(un===1?'':'s')+' the catalog didn\'t match — pick them in the grid</span>':'')+
              '<span class="pillbtn" onclick="closeBomEditor()">done editing</span>'+
            '</div>'+
            '<iframe id="bomEditorFrame" style="width:100%;height:620px;border:1px solid #dde3ea;border-radius:8px;background:#fff"></iframe>'
          : '<div style="font-size:13px;color:var(--mut)">Open the full grid to fix materials, dimensions, quantities and '+
            'finishes with the catalog behind them — weights recalculate as you type. Changes stay in this take-off '+
            'until you approve it.<br><button class="applybtn" style="margin-top:9px" onclick="openBomEditor()">▤ Open the BOM Editor</button></div>')+
      '</div></div>';
  }

  async function openBomEditor(){
    const R = loadResult();
    const body = document.getElementById("editorBody");
    if (!params.project_id){ body.innerHTML = '<div style="font-size:13px;color:var(--red)">Open the take-off from the project page — the editor needs project_id to load the catalog.</div>'; return; }
    body.innerHTML = '<div style="font-size:13px;color:var(--mut)"><span class="spin"></span> Matching the take-off to your catalog…</div>';
    let preview;
    try{
      const r = await fetch(RAILWAY_URL+"/api/takeoff/bom-preview",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({project_id:params.project_id, rows:arr(R.rows).filter(function(x){ return !x.deleted; })})});
      preview = await r.json();
      if(!r.ok || preview.ok===false) throw new Error((preview&&preview.error)||("HTTP "+r.status));
    }catch(e){
      body.innerHTML = '<div style="font-size:13px;color:var(--red)">Couldn\'t prepare the grid: '+esc(e.message||e)+
        '<br><button class="applybtn" style="margin-top:8px" onclick="openBomEditor()">try again</button></div>';
      return;
    }
    EDITOR_UNRESOLVED = arr(preview.unresolved);
    EDITOR_OPEN = true; EDITOR_DIRTY = 0;
    document.getElementById("editorCard").outerHTML = bomEditorCardHtml();
    const frame = document.getElementById("bomEditorFrame");
    // The editor tells us when its shim is listening; only then are the rows sent.
    window.__editorRecords = arr(preview.records);
    // The editor is generated into the backend's own /takeoff/ folder, so address it there rather
    // than relatively: the GitHub Pages copy of this page has no bom-editor.html beside it and the
    // frame would 404. Cross-origin is fine — the two talk over postMessage either way.
    frame.src = (RAILWAY_URL||"") + (RAILWAY_URL?"/takeoff/":"") + "bom-editor.html?mode=takeoff&project_id="+
                encodeURIComponent(params.project_id)+
                "&Manufacture_ID="+encodeURIComponent(params.manufacturer_id||"");
  }

  function closeBomEditor(){ EDITOR_OPEN = false; render(); }

  window.addEventListener("message", function(ev){
    const m = ev.data||{};
    if(m.type==="takeoff:ready"){
      const frame=document.getElementById("bomEditorFrame");
      if(frame&&frame.contentWindow) frame.contentWindow.postMessage({type:"takeoff:rows",
        records: window.__editorRecords||[],
        project: {Project_Description:"AI take-off — not yet committed"}},"*");
      return;
    }
    if(m.type==="takeoff:changed"){ applyEditorRecords(arr(m.records)); return; }
  });

  // Editor records → take-off rows. Only fields the editor actually owns are copied
  // back; anything it doesn't touch (confidence, cross-check, notes, disposition) is
  // left exactly as the take-off produced it.
  function applyEditorRecords(records){
    const R = loadResult();
    const rows = arr(R.rows);
    const dv = function(v){ return (v&&typeof v==="object") ? (v.display_value||v.zc_display_value||"") : (v||""); };
    const kept = [];
    records.forEach(function(rec){
      const i = Number(rec._takeoff_index);
      const base = (Number.isFinite(i)&&rows[i]) ? Object.assign({},rows[i]) : {confidence:1,cross_check:"",disposition:"fabricate"};
      const units = Math.max(1, Math.round(Number(rec._units)||Number(base.units)||1));
      const total = Number(rec.Quantity)||0;
      base.units = units;
      base.quantity_total = total;
      base.quantity = units>1 ? Math.round((total/units)*10000)/10000 : total;   // the editor edits the TOTAL
      base.qty_per_unit = base.quantity;
      // Length/width come back as the editor's nest dimensions (inches) when it recomputed
      // them; otherwise the take-off's own value stands.
      if(rec.Length_Nest!=null && rec.Length_Nest!=="") base.length_ft = Math.round((Number(rec.Length_Nest)/12)*10000)/10000;
      if(rec.Width_Nest!=null && rec.Width_Nest!=="")  base.width_ft  = Math.round((Number(rec.Width_Nest)/12)*10000)/10000;
      const f=dv(rec.Form_Type), mt=dv(rec.Material_Type), sp=dv(rec.Specification), mz=dv(rec.Material),
            cp=dv(rec.Component), dw=dv(rec.Scope_LU);
      if(f) base.form_type=f; if(mt) base.material_type=mt; if(sp) base.specification=sp;
      if(mz) base.size=mz;    if(cp) base.component=cp;     if(dw) base.source_sheet=dw;
      if(rec.BOM_Item) base.member_mark=rec.BOM_Item;
      base.galvanized = rec.Galv===true||rec.Galv==="true";
      base.deleted    = rec.DELETE_field===true||rec.DELETE_field==="true";
      base.unit_weight = Number(rec.Unit_Weight)||0;
      base.total_weight = Number(rec.CalcWeight)||0;
      base.weight_per_ft = Number(rec.Weight_Per_Ft)||0;
      kept.push(base);
    });
    R.rows = kept;
    recomputeCsv(R);
    saveResult(R);
    EDITOR_DIRTY++;
    // Don't re-render: that would tear down the iframe mid-edit. Just update the counter.
    const chips=document.querySelectorAll("#editorBody .chip");
    if(chips&&chips[1]) chips[1].textContent = EDITOR_DIRTY+" change"+(EDITOR_DIRTY===1?"":"s")+" applied";
  }

  // ---- LIST vs DRAWINGS ---------------------------------------------------
  // The cross-check, front and centre: what the parts lists said, what the sheets showed, and every
  // place the two didn't agree. Something DRAWN but missing from the shop's own list is the single
  // most valuable thing a take-off can find — it's steel that wouldn't have been ordered.
  function crossCardHtml(rows, rec){
    rec = rec || {};
    const only_list = arr(rec.only_in_list), only_dwg = arr(rec.only_on_drawings), mism = arr(rec.mismatches);
    const tally = { both:0, list_only:0, drawing_only:0, corrected:0, no_list:0, unset:0 };
    arr(rows).forEach(function(r){
      if((Number(r.quantity)||0)<=0) return;                       // gaps are reviewed as gaps
      const k = String(r.cross_check||"").toLowerCase().trim().replace(/[\s-]+/g,"_");
      if(tally[k]===undefined) tally.unset++; else tally[k]++;
    });
    const checked = tally.both + tally.list_only + tally.drawing_only + tally.corrected;
    // Nothing to show if the package had no list at all and the model reported nothing.
    if(!rec.performed && !only_list.length && !only_dwg.length && !mism.length && !checked) return "";
    const TD='padding:5px 8px;border-bottom:1px solid #eceff3;vertical-align:top;font-size:12.5px';
    const tbl=function(title, colour, items, cells){
      if(!items.length) return "";
      return '<details open style="margin-bottom:10px"><summary style="color:'+colour+';font-weight:700">'+
        title+' ('+items.length+')</summary><table style="width:100%;border-collapse:collapse;margin-top:6px">'+
        items.map(function(x){ return '<tr>'+cells(x).map(function(c){ return '<td style="'+TD+'">'+c+'</td>'; }).join("")+'</tr>'; }).join("")+
        '</table></details>';
    };
    const pill=function(n,label,cls){ return n?'<span class="chip'+(cls?' '+cls:'')+'">'+n+' '+label+'</span>':''; };
    // TWO LISTS, COMPARED TO EACH OTHER. A package with a top-level and a sub-assembly BOM (or an old
    // and a new issue) is the case where material goes missing quietly: the take-off counts from one,
    // and whatever only exists on the other is gone without anyone noticing. So the lines that appear
    // on ONLY ONE list lead this block.
    const pairs = arr(rec.lists_compared);
    const pairHtml = pairs.map(function(p){
      const oa=arr(p.only_in_a), ob=arr(p.only_in_b), df=arr(p.differences);
      const rel = {nested:'one is nested inside the other', revision:'two issues of the same list',
                   separate:'genuinely different scopes'}[String(p.relationship||'').toLowerCase()] || 'relationship unclear';
      const list=function(title,items,colour,fmt){
        if(!items.length) return '';
        return '<div style="margin-top:7px"><b style="color:'+colour+'">'+title+' ('+items.length+')</b>'+
          '<ul style="margin:4px 0 0 18px;padding:0">'+items.map(function(x){ return '<li style="font-size:12.5px;margin-bottom:3px">'+fmt(x)+'</li>'; }).join("")+'</ul></div>';
      };
      return '<div style="border:1px solid #e6eaf0;border-radius:8px;padding:11px 13px;margin-bottom:10px">'+
        '<div style="font-size:13px"><b>'+esc(p.list_a||'?')+'</b> vs <b>'+esc(p.list_b||'?')+'</b> '+
          '<span class="src">— '+esc(rel)+
          (p.items_in_common!=null?' · '+p.items_in_common+' lines agree'+
            (arr(p.compared_on).length?' on '+arr(p.compared_on).join(', '):' on item, size, quantity and dimensions'):'')+'</span></div>'+
        (p.counted_from?'<div class="src" style="margin-top:3px">Counted from: '+esc(p.counted_from)+'</div>':'')+
        list('⚠ Only on '+esc(p.list_b||'the second list'), ob, '#b45309', function(x){
          return '<b>'+esc(x.item)+'</b>'+(x.note?' <span class="src">'+esc(x.note)+'</span>':''); })+
        list('Only on '+esc(p.list_a||'the first list'), oa, '#5b6675', function(x){
          return '<b>'+esc(x.item)+'</b>'+(x.note?' <span class="src">'+esc(x.note)+'</span>':''); })+
        list('⚡ They disagree', df, '#b45309', function(x){
          return '<b>'+esc(x.item)+'</b>'+(x.field?' <span class="src">('+esc(x.field)+')</span>':'')+' <span class="src">'+esc(p.list_a||'A')+': '+esc(x.a_says||'—')+
                 ' · '+esc(p.list_b||'B')+': '+esc(x.b_says||'—')+'</span>'+
                 (x.used?' → used <b>'+esc(x.used)+'</b>':''); })+
        (!oa.length&&!ob.length&&!df.length
          ? '<div style="font-size:12.5px;color:var(--grn);margin-top:6px">✓ Nothing differs between them.</div>' : '')+
      '</div>';
    }).join("");

    return '<div class="card"><h2>⚖ Parts list vs drawings <span class="lt">— what was checked against what</span></h2><div class="body">'+
      (pairHtml
        ? '<div style="margin-bottom:12px"><div style="font-weight:700;font-size:11px;text-transform:uppercase;'+
          'letter-spacing:.05em;color:#667;margin-bottom:6px">The parts lists, compared to each other</div>'+pairHtml+'</div>'
        : '')+
      (arr(rec.sources).length
        ? '<div style="font-size:12.5px;color:var(--mut);margin-bottom:8px">Checked against: <b>'+
            arr(rec.sources).map(esc).join("</b>, <b>")+'</b></div>'
        : (rec.performed===false
            ? '<div style="font-size:12.5px;color:var(--mut);margin-bottom:8px">No parts list or material table was found in this package — the BOM is read from the drawings alone.</div>'
            : ''))+
      '<div class="meta" style="margin-bottom:10px">'+
        pill(tally.both,'confirmed by both')+pill(tally.corrected,'corrected')+
        pill(tally.drawing_only,'drawn, not listed')+pill(tally.list_only,'listed, not drawn')+
        pill(tally.no_list,'no list to check')+pill(tally.unset,'unchecked')+
      '</div>'+
      tbl('⚠ Drawn or scheduled but MISSING from the parts list','#b45309',only_dwg,function(x){
        return ['<b>'+esc(x.item)+'</b>', esc(x.where||''), '<span class="src">'+esc(x.why_it_matters||'')+'</span>']; })+
      tbl('⚡ In both, but they disagree','#b45309',mism,function(x){
        return ['<b>'+esc(x.item)+'</b>',
                '<span class="src">list: '+esc(x.list_says||'—')+'<br>drawing: '+esc(x.drawings_say||'—')+'</span>',
                'used <b>'+esc(x.used||'—')+'</b><br><span class="src">'+esc(x.why||'')+'</span>']; })+
      tbl('◷ On the parts list but not found drawn','#7d8aa0',only_list,function(x){
        return ['<b>'+esc(x.item)+'</b>', esc(x.where||''),
                '<span class="src">'+esc(x.quantity?('qty '+x.quantity+' · '):'')+esc(x.action||'kept in the BOM')+'</span>']; })+
      ((only_dwg.length||mism.length||only_list.length)
        ? '<div style="font-size:12px;color:var(--mut)">Everything above is already in the BOM below — this section is the audit trail, not a to-do list. Use <b>Tell the AI</b> if you want any of it changed.</div>'
        : (checked?'<div style="font-size:12.5px;color:var(--grn)">✓ The parts list and the drawings agree throughout — no discrepancies found.</div>':''))+
    '</div></div>';
  }

  function reconCardHtml(){
    if(!params.project_id || loadResult().__demo) return "";
    if(!SCOPE_FETCH_DONE) return '<div class="card"><h2>▸ Scope Reconciliation</h2><div class="body" style="color:var(--mut);font-size:13px"><span class="spin"></span> Checking components &amp; drawings against the project…</div></div>';
    if(!PROJECT_SCOPE || (!arr(PROJECT_SCOPE.components).length && !arr(PROJECT_SCOPE.drawings).length))
      return '<div class="card"><h2>▸ Scope Reconciliation</h2><div class="body" style="color:var(--mut);font-size:13px">No components or drawings are entered on this project — nothing to reconcile. (The BOM is grouped by what the AI read off the sheets.)</div></div>';
    // One table per kind: what the AI read | what's on your project | what to do about it.
    // Ordered actionable-first (≈ rename, ➕ add, ⚠ delete) with agreed rows last.
    const TD='padding:5px 8px;border-bottom:1px solid #eceff3;vertical-align:top;font-size:12.5px';
    const NAMEBOX=function(kind,id,val,idx,type){
      const eid='sc_'+kind+'_'+type+'_'+idx;
      return '<input id="'+eid+'" value="'+escAttr(val)+'" style="font-size:12px;padding:2px 5px;border:1px solid #cdd3da;border-radius:5px;width:96%;max-width:230px" '+
        'onkeydown="if(event.key===\'Enter\'){reconRenameVal(\''+kind+'\',\''+escAttr(id)+'\',\''+eid+'\')}"> '+
        '<button class="applybtn" style="background:#7d8aa0;padding:1px 7px" onclick="reconRenameVal(\''+kind+'\',\''+escAttr(id)+'\',\''+eid+'\')" title="Save this name to the project">save</button>';
    };
    const sec=function(kind,label,noun){
      const r=reconcile(kind); RECON[kind]=r;
      let rows='';
      // ≈ near — NOT counted as matched; renaming one side is what makes the link real.
      r.near.forEach(function(p,i){
        rows+='<tr><td style="'+TD+'"><b style="color:#6b52a8">≈</b> '+esc(p.takeoff.value)+'</td>'+
          '<td style="'+TD+'">'+NAMEBOX(kind,p.entered.id,p.entered.name,i,'near')+'<div class="src">will not link until the names agree</div></td>'+
          '<td style="'+TD+'; white-space:nowrap">'+
            '<button class="applybtn" onclick="reconRenameIdx(\''+kind+'\','+i+')" title="Use the AI\'s wording">✎ use AI name</button> '+
            '<button class="applybtn" style="background:#7d8aa0" onclick="reconMapNearIdx(\''+kind+'\','+i+')" title="Keep yours — retag the BOM rows">keep mine</button> '+
            '<button class="applybtn" style="background:#9aa6b2;padding:1px 7px" onclick="reconUnpairIdx(\''+kind+'\','+i+')">not same</button></td></tr>';
      });
      // ➕ AI read it, not on the project. The "use existing" picker is the third option beyond
      // add/ignore: fold this value into a record you already have, by retagging the BOM rows.
      const entered=reconEntered(kind);
      const optionsHtml=entered.map(function(e){return '<option value="'+escAttr(e.name)+'">'+esc(e.name)+'</option>';}).join("");
      r.takeoffOnly.forEach(function(t,i){
        const dd = entered.length ? '<select onchange="reconMapIdx(\''+kind+'\','+i+',this)" style="font-size:11px;padding:2px 4px;border:1px solid #cdd3da;border-radius:5px;max-width:150px"><option value="">use existing…</option>'+optionsHtml+'</select> ' : '';
        rows+='<tr><td style="'+TD+'"><b style="color:#3a6ea5">➕</b> '+esc(t.value)+
            (t.rows?' <span class="src">'+t.rows+' row'+(t.rows===1?'':'s')+'</span>':' <span class="src">from scope of work</span>')+'</td>'+
          '<td style="'+TD+'"><span class="src">not on the project</span></td>'+
          '<td style="'+TD+'; white-space:nowrap">'+dd+
            '<button class="applybtn" onclick="reconAddIdx(\''+kind+'\','+i+')" title="Create this '+noun+' on the project">＋ add</button> '+
            '<button class="applybtn" style="background:#9aa6b2;padding:1px 7px" onclick="reconIgnoreIdx(\''+kind+'\','+i+')">ignore</button></td></tr>';
      });
      // ⚠ on the project, AI read nothing like it
      // On the project, but no take-off row cites it. For a DRAWING that is routine and not a
      // problem: when a parts list covers the same members, every row cites the list, so the sheet
      // itself ends up with no rows against it. Offering "delete" as the loud first option there
      // invites deleting a perfectly good drawing. Keep leads; delete is the quiet second choice.
      r.enteredOnly.forEach(function(e,i){
        const why = kind==='drawing'
          ? 'no BOM row cites this drawing'
          : 'nothing read from the sheets matches it';
        rows+='<tr><td style="'+TD+'"><span class="src">'+why+'</span></td>'+
          '<td style="'+TD+'"><b style="color:#b6791f">⚠</b> '+NAMEBOX(kind,e.id,e.name,i,'only')+'</td>'+
          '<td style="'+TD+'; white-space:nowrap">'+
            '<button class="applybtn" onclick="reconAckIdx(\''+kind+'\','+i+')" title="Leave it on the project">keep</button> '+
            '<button class="applybtn" style="background:#c8a9a5;padding:1px 7px" onclick="reconDeleteIdx(\''+kind+'\','+i+')" title="Delete from the project — only if it genuinely does not belong">delete</button></td></tr>';
      });
      // ✓ agreed
      r.matched.forEach(function(t){
        rows+='<tr><td style="'+TD+';background:#f8fbf9"><b style="color:#2f8049">✓</b> '+esc(t.value)+'</td>'+
          '<td style="'+TD+';background:#f8fbf9" colspan="2"><span class="src">matches'+(t.rows?' · '+t.rows+' row'+(t.rows===1?'':'s'):'')+'</span></td></tr>';
      });
      if(!rows) rows='<tr><td style="'+TD+'" colspan="3"><span class="src">All '+noun+'s line up. ✓</span></td></tr>';
      const bulk = r.takeoffOnly.length>1
        ? ' <button class="applybtn" style="padding:1px 8px" onclick="reconAddAll(\''+kind+'\')" title="Create all of these on the project">＋ add all '+r.takeoffOnly.length+'</button>'
        : '';
      const hdr=label+' <span class="grp-meta">'+r.matched.length+' agree'+(r.near.length?' · '+r.near.length+' to rename':'')+(r.takeoffOnly.length?' · '+r.takeoffOnly.length+' to add':'')+(r.enteredOnly.length?' · '+r.enteredOnly.length+' unmatched':'')+'</span>'+bulk;
      return '<div style="margin-bottom:14px"><div style="font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#667;margin:2px 0 6px">'+hdr+'</div>'+
        '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">'+
        '<thead><tr>'+
          '<th style="'+TD+';text-align:left;color:#667;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;width:38%">AI read from sheets</th>'+
          '<th style="'+TD+';text-align:left;color:#667;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;width:34%">On your project</th>'+
          '<th style="'+TD+';text-align:left;color:#667;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em">Action</th>'+
        '</tr></thead><tbody>'+rows+'</tbody></table></div>'+reconDismissedHtml(kind)+'</div>';
    };
    return '<div class="card"><h2>▸ Scope Reconciliation <span class="lt">— what the AI read vs. what you entered</span></h2><div class="body">'+
      reconNoticeHtml()+
      sec('component','Components','component')+sec('drawing','Drawings','drawing')+
      '<div class="src" style="margin-top:6px">➕ items import with a blank link unless you <b>add</b> them to the project or <b>map</b> them to an entered value. ≈ near matches will <b>not</b> link until you rename one side. Delete is blocked while drawings or BOM rows are still linked — and a drawing with no rows against it is usually fine, not wrong: when a parts list covers the same members, every row cites the list instead of the sheet. Fixes here update the BOM before it commits.</div>'+
      '</div></div>';
  }

  function render(){
    // Catalog arrives async; the first render just skips the material card and re-renders once
    // it's in. Never blocks the page on a lookup.
    if(CATALOG===null && !CATALOG_LOADING){ CATALOG_LOADING=true; loadCatalog().then(function(){ render(); }); }
    const _aiKeep = (document.getElementById("aiInput")||{}).value;  // preserve in-progress chat text across re-render
    const R = loadResult();
    // AFTER R exists. Putting this above the declaration threw a ReferenceError on every render
    // — R is a const, so it is in its temporal dead zone until that line runs — and the page sat
    // on "Loading take-off…" forever. A parse check cannot catch it; only running it can.
    if(arr(R.fittings).length){ loadFittingsCatalog(); loadFittingIndex(); }   // only fetched when there are fittings to edit
    const rows = arr(R.rows);
    const s = R.synopsis || {};
    DECISIONS = arr(s.decisions).map((d,i)=>({
      id:"dec"+i, item:d.item||"(decision)",
      where:d.where||"", why:d.why_flagged||"", options:arr(d.options).length?d.options:["Include","Skip"],
      rec:d.ai_recommendation||"", sel:(d.selected!=null?d.selected:(d.ai_recommendation||null)),
    }));
    const sw = s.scope_of_work||{}, t=s.totals||{}, conf=s.confidence||{};
    const live = function(r){ return !r.deleted; };            // rows the editor marked for delete are out of the BOM
    const fab = rows.filter(function(r){ return (Number(r.quantity)||0)>0 && live(r); });
    const gaps = arr(s.gaps), conflicts=arr(s.conflicts), comp=arr(s.compliance);
    CONFLICTS = conflicts;
    if(syncQuoteNotes(R)) saveResult(R);
    const overall = conf.overall!=null?conf.overall:0.7;

    const _clean = function(a){ return arr(a).filter(function(x){ return String(x==null?"":x).trim(); }); };
    const streams = [
      ["fab","Fabricate",_clean(sw.fabricate)],["buy","Buyout",_clean(sw.buyout)],
      ["oth","By others",_clean(sw.by_others)],["snd","Send-out",_clean(sw.send_out)],
    ].filter(x=>x[2].length);

    const editable = BOM_EXPANDED;
    const NC = editable ? 7 : 6;  // table columns (Sheet now lives in the drawing group header)
    const fabIdx=[]; rows.forEach(function(r,idx){ if((Number(r.quantity)||0)>0 && live(r)) fabIdx.push(idx); });

    // Group fab rows by Component → Drawing (source_sheet), preserving first-seen order.
    const gKey=function(v){ return (v==null?'':String(v).trim()); };
    const compOrder=[], compMap={};
    fabIdx.forEach(function(idx){
      const r=rows[idx];
      const cN=gKey(r.component)||'— Unassigned —';
      const dN=gKey(r.source_sheet)||'— No sheet —';
      if(!compMap[cN]){ compMap[cN]={dOrder:[],dMap:{}}; compOrder.push(cN); }
      const g=compMap[cN];
      if(!g.dMap[dN]){ g.dMap[dN]=[]; g.dOrder.push(dN); }
      g.dMap[dN].push(idx);
    });
    const sumQty=function(ids){ return ids.reduce(function(a,i){ return a+(Number(rows[i].quantity)||0); },0); };
    // Group headers count the JOB total — that's the number an estimator is looking for.
    const sumTot=function(ids){ return ids.reduce(function(a,i){ return a+totalOf(rows[i]); },0); };

    // Where the row's evidence came from, on the row itself — two sources agreeing is worth more
    // than one, and a row nobody's list mentions is worth a second look.
    const XC={ both:["✓✓","confirmed by both the parts list and the drawings","var(--grn)"],
               corrected:["≠","the list and the drawing disagreed — see Parts list vs drawings","#b45309"],
               drawing_only:["dwg","drawn or scheduled, but NOT on the parts list","#b45309"],
               list_only:["list","on the parts list, not found drawn","#7d8aa0"] };
    const xcTag=function(r){
      const k=String(r.cross_check||"").toLowerCase().trim().replace(/[\s-]+/g,"_");
      const x=XC[k]; if(!x) return "";
      return ' <span title="'+escAttr(x[1])+'" style="font-size:10px;font-weight:700;color:'+x[2]+'">'+x[0]+'</span>';
    };
    // Per unit vs job total. `quantity` is what one unit of the component takes — that's what you
    // check against the drawing. `quantity_total` is what gets ordered. Showing only one of them is
    // how a 4-off job ends up ordering a quarter of the steel (or four times the cost per unit).
    const unitsOf=function(r){ return Math.max(1, Math.round(Number(r.units)||1)); };
    const totalOf=function(r){ const t=Number(r.quantity_total);
      return (Number.isFinite(t)&&t>0)?t:(Number(r.quantity)||0)*unitsOf(r); };
    const anyMulti = rows.some(function(r){ return unitsOf(r)>1; });
    const memberRow=function(idx){
      const r=rows[idx], hasC=Number.isFinite(Number(r.confidence))&&r.confidence!==null&&r.confidence!=="";
      const c=hasC?Number(r.confidence):0, cls=hasC?confClass(c):"md";
      const u=unitsOf(r);
      const qtyCell = editable
        ? '<input type="number" min="0" value="'+(Number(r.quantity)||0)+'" style="width:56px;padding:3px 5px;border:1px solid #cdd3da;border-radius:5px;font-size:12px;" onchange="editQty('+idx+',this.value)">'+
          (u>1?'<div class="src">×'+u+' = <b>'+totalOf(r)+'</b></div>':'')
        : (u>1
            ? esc(r.quantity)+' <span class="src">×'+u+'</span> <b>= '+totalOf(r)+'</b>'
            : esc(r.quantity));
      return '<tr class="'+(cls==="hi"?"":cls)+'">'+
        // No score is shown as "—", not 0.00: a missing number is not a zero, and painting every
        // row red for it buried the rows that really are low.
        '<td title="'+confWhy(r,hasC?c:null)+'"><span class="dot d-'+cls+'"></span>'+(hasC?c.toFixed(2):'<span class="src">—</span>')+xcTag(r)+'</td>'+
        '<td>'+esc(r.form_type)+'</td>'+
        '<td>'+esc(r.size)+(r.galvanized?' <span class="galv">galv</span>':'')+'</td>'+
        '<td>'+esc(r.specification)+'</td><td>'+qtyCell+'</td>'+
        '<td style="white-space:nowrap">'+dimStr(r)+'</td>'+
        (editable?'<td><button class="applybtn" style="background:var(--red);padding:1px 8px" title="Remove row" onclick="removeRow('+idx+')">✕</button></td>':'')+
        '</tr>';
    };
    const bomRows = compOrder.map(function(cN){
      const g=compMap[cN];
      const cIds=[].concat.apply([], g.dOrder.map(function(d){ return g.dMap[d]; }));
      const cU=Math.max.apply(null,[1].concat(cIds.map(function(i){ return unitsOf(rows[i]); })));
      let html='<tr class="grp-comp"><td colspan="'+NC+'">▸ '+esc(cN)+
        (cU>1?' <span class="grp-units">× '+cU+' units</span>':'')+
        ' <span class="grp-meta">'+cIds.length+' item'+(cIds.length===1?'':'s')+' · '+
        (cU>1 ? sumQty(cIds)+' per unit · <b>'+sumTot(cIds)+' total</b>' : sumQty(cIds)+' qty')+
        '</span></td></tr>';
      g.dOrder.forEach(function(dN){
        const ids=g.dMap[dN];
        html+='<tr class="grp-draw"><td colspan="'+NC+'">📄 '+esc(dN)+
          ' <span class="grp-meta">'+ids.length+' item'+(ids.length===1?'':'s')+' · '+
          (Math.max.apply(null,[1].concat(ids.map(function(i){ return unitsOf(rows[i]); })))>1
            ? sumQty(ids)+' per unit · <b>'+sumTot(ids)+' total</b>' : sumQty(ids)+' qty')+
          '</span></td></tr>'+
          ids.map(memberRow).join("");
      });
      return html;
    }).join("");

    const isLive = haveLive();
    document.getElementById("wrap").innerHTML =
      (isLive ? '' :
        '<div class="card" style="background:#fff7ed;border-color:#fcd9a8;"><div class="body" style="padding:12px 16px;color:#b45309;font-size:13px;">'+
        '<b>⚠ Demo data</b> — this is a built-in sample, <b>not your project</b>. Open the take-off widget, upload your drawings, and click <b>Run take-off</b> to see your real project here.</div></div>') +
      // header
      '<div class="card hero"><div class="body">'+ confBadge(overall) +
        '<h1>'+esc(s.project?.name||"AI Take-off")+'</h1>'+
        '<div class="type">'+esc(s.project?.type||"")+(s.project?.summary?" — "+esc(s.project.summary):"")+'</div>'+
        '<div class="meta">'+
          '<span class="chip">📄 '+(arr(s.project?.sheets_read).length||"?")+' sheets/specs</span>'+
          '<span class="chip">🧱 '+fab.length+' fab rows</span>'+
          (t.est_weight_lb?'<span class="chip">⚖ ~'+Number(t.est_weight_lb).toLocaleString()+' lb</span>':'')+
          (R.cost_usd!=null?'<span class="chip">💲 $'+R.cost_usd+'</span>':'')+
          (gaps.length?'<span class="chip">◷ '+gaps.length+' gaps</span>':'')+
        '</div></div></div>'+

      // tabs — one area of the review at a time; the header above and the dock below stay put
      tabStripHtml(R, fab, gaps, conflicts)+

      '<div class="tabpane" data-tab="overview">'+
      // scope — view or edit (add/edit/remove the write-ups)
      ((streams.length||SCOPE_EDIT)?'<div class="card"><h2>▸ Scope of Work'+
        ' <span class="pillbtn" onclick="toggleScopeEdit()">'+(SCOPE_EDIT?'done':'edit')+'</span></h2><div class="body">'+
        (SCOPE_EDIT
          ? scopeEditHtml(sw)
          : (streams.length
              ? streams.map(([k,lbl,items])=>'<div class="stream"><div class="tag '+k+'">'+lbl+'</div>'+
                  '<div class="items">'+items.map(esc).join(" · ")+
                  (k==="buy"?' <span class="pillbtn" onclick="mcAlert(\'Coming soon: this will build the RFQ / outsource list from these buyout items.\',{title:\'AI Take-off\'})">→ build RFQ</span>':'')+
                  '</div></div>').join("")
              : '<div style="color:var(--mut);font-size:13px">No scope items.</div>'))+
        '</div></div>':'')+

      // decisions
      (DECISIONS.length?'<div class="card"><h2>⚠ Decisions — your call <span id="decCount" style="color:var(--ylw);font-weight:700;"></span></h2><div class="body" id="decisions"></div></div>':'')+

      // gaps + conflicts
      ((gaps.length||conflicts.length)?'<div class="card"><h2>◷ Gaps &amp; ⚡ Conflicts</h2><div class="body twoup">'+
        (gaps.length?'<details open><summary>◷ Gaps to verify ('+gaps.length+')</summary><ul>'+
          gaps.map((g,i)=>'<li>'+esc(g.item)+(g.where?' <span class="src">'+esc(g.where)+'</span>':'')+
          ' <button class="applybtn" style="background:#9aa6b2;padding:1px 7px" onclick="dismissGap('+i+')" title="Remove this gap">✕</button>'+
          (g.suggested_action?'<br><span class="src">→ '+esc(g.suggested_action)+'</span>':'')+'</li>').join("")+'</ul></details>':'<div></div>')+
        (conflicts.length?'<details open><summary>⚡ Conflicts ('+conflicts.length+')</summary><ul>'+
          conflicts.map((c,i)=>'<li><b>'+esc(c.topic)+'</b>'+
          ' <button class="applybtn" style="background:#9aa6b2;padding:1px 7px" onclick="dismissConflict('+i+')" title="Remove this conflict (no change to BOM)">✕</button>'+
          (c.drawing_says?' — drawing: '+esc(c.drawing_says):'')+(c.spec_says?' · spec: '+esc(c.spec_says):'')+
          conflictWhereHtml(c)+
          (c.recommendation?'<br><span class="src">→ '+esc(c.recommendation)+'</span> <button class="applybtn" onclick="applyConflict('+i+')">Apply &amp; resolve</button>':'')+'</li>').join("")+'</ul></details>':'<div></div>')+
        '</div></div>':'')+

      // quote clarifications — every conflict, gap and decision, written as quote language
      (arr(R.quote_notes).length?'<div class="card"><h2>📝 Quote clarifications'+
        ' <span class="pillbtn" onclick="copyQuoteNotes()">copy all</span></h2><div class="body" id="quoteNotes"></div></div>':'')+

      // compliance
      (comp.length?'<div class="card"><h2>✓ Compliance &amp; finish</h2><div class="body">'+
        comp.map(c=>'<div class="comp"><span class="ok">'+esc(c.topic)+'</span><span class="src">'+esc(c.note)+'</span></div>').join("")+
        '</div></div>':'')+
      ((!streams.length&&!SCOPE_EDIT&&!DECISIONS.length&&!gaps.length&&!conflicts.length&&!comp.length)
        ?'<div class="card"><div class="body" style="color:var(--mut);font-size:13px">No scope, decisions, gaps or compliance notes on this take-off.</div></div>':'')+
      '</div>'+

      '<div class="tabpane" data-tab="checks">'+
      // material check — rows that can't resolve against the shop's catalog, fixable here
      materialCardHtml(rows)+

      // the cross-check: parts lists / drawing material tables vs what the sheets actually show
      partsListCardHtml(s.parts_list)+
      crossCardHtml(rows, s.reconciliation)+

      // scope reconciliation — AI-read components/drawings vs. what you entered on the project
      reconCardHtml()+
      '</div>'+

      '<div class="tabpane" data-tab="material">'+
      // BOM
      '<div class="card"><h2>▸ Bill of Materials <span class="lt">— '+fab.length+' rows, grouped by component → drawing</span></h2><div class="body" style="padding:0;">'+
        '<table><thead><tr><th>Conf</th><th>Form</th><th>Material</th><th>Spec</th><th>'+(anyMulti?'Qty / unit → total':'Qty')+'</th><th>Dimensions</th>'+(editable?'<th></th>':'')+'</tr></thead><tbody>'+
        (bomRows||'<tr><td colspan="'+NC+'" style="padding:14px;color:var(--mut)">No quantified rows.</td></tr>')+'</tbody></table>'+
        ((fab.length>0)?'<div style="padding:10px 18px;font-size:12px;color:var(--mut)">'+
          (editable
            ? 'Editing all '+fab.length+' rows — change a Qty or remove a row (✕). <span class="pillbtn" onclick="toggleBom()">done</span> &nbsp;·&nbsp; form/spec/size are best changed via “Tell the AI” below.'
            : 'Grouped by component (▸), then drawing (📄) — review one sheet at a time. <span class="pillbtn" onclick="toggleBom()">edit rows</span>')+
        '</div>':'')+
      '</div></div>'+

      // the real grid, on these rows, before they are committed
      bomEditorCardHtml()+
      '</div>'+

      // pipe fittings — their own stream, deliberately outside the BOM
      '<div class="tabpane" data-tab="fittings">'+
      (fittingsCardHtml(R.fittings)||'<div class="card"><div class="body" style="color:var(--mut);font-size:13px">No pipe fittings on this take-off.</div></div>')+
      '</div>'+

      // what each sheet puts in / leaves out of the fabricator's scope
      '<div class="tabpane" data-tab="drawings">'+drawingScopeHtml(R)+'</div>'+

      // what each addendum changed, original vs reissue
      '<div class="tabpane" data-tab="addenda">'+addendaHtml(R)+'</div>'+

      // shop labor — hours for this take-off, at job / component / item level
      '<div class="tabpane" data-tab="labor">'+laborCardHtml(R)+'</div>'+

      // tell-the-AI — conversational thread (3c)
      '<div class="tabpane" data-tab="ai">'+
      '<div class="card" id="chatCard"><h2>💬 Tell the AI <span class="lt">— ask questions or request changes; it remembers the conversation</span></h2>'+
        '<div class="body"><div id="chatThread" class="chatthread">'+chatThreadHtml()+'</div></div></div>'+
      '</div>'+

      // sticky footer: chat input dock + action bar (one pinned block)
      '<div class="footerdock">'+
        '<div class="chatdock">'+
          (REVISE_ATTACHMENTS.length?'<div class="achips">'+attachChipsHtml()+'</div>':'')+
          '<div class="ai">'+
            '<button class="iconbtn" id="attachBtn" title="Attach a BOM sheet, spec, cut list, or marked-up drawing (PDF, image, or CSV)" onclick="document.getElementById(\'reviseFile\').click()">📎</button>'+
            '<input id="aiInput" placeholder=\'Ask or tell the AI… paste a screenshot, or e.g. "galvanize all exterior angles" · "what spec did you use?"\' onkeydown="if(event.key===\'Enter\'){event.preventDefault();sendChat();}" onpaste="handlePaste(event)" />'+
            '<button class="btn go" id="sendBtn" onclick="sendChat()">Send</button>'+
          '</div>'+
          '<input type="file" id="reviseFile" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.csv,.txt" style="display:none" onchange="addReviseFiles(this)">'+
        '</div>'+
        '<div class="bar"><div class="left" id="barLeft"></div>'+
          '<div style="display:flex;gap:8px;align-items:center">'+
            (ACCOUNT?'<span class="balchip" title="Your take-off allowance. Each take-off draws it down: Quick $'+Number((ACCOUNT.price||{}).haiku||1.5).toFixed(2)+', Standard $'+Number((ACCOUNT.price||{}).sonnet||3).toFixed(2)+', Deep $'+Number((ACCOUNT.price||{}).opus||6).toFixed(2)+'. Edits and questions to the AI are free.">💳 Balance $'+Number(ACCOUNT.balance).toFixed(2)+'</span>':'')+
            '<button class="btn ghost" onclick="downloadBom()">↓ BOM CSV</button>'+
            '<button class="btn go" id="approve" onclick="approve()">Approve &amp; Submit Project →</button>'+
          '</div></div>'+
      '</div>'+
      '<div class="commit" id="commit"></div>'+
      '<div class="foot">Material Compass · AI Take-off · '+(haveLive()?'live':'sample data')+' · '+VERSION+'</div>';

    if(_aiKeep){ const _ai=document.getElementById("aiInput"); if(_ai) _ai.value=_aiKeep; }  // restore typed chat text
    renderDecisions();
    renderQuoteNotes();
    applyTab();
  }


  function renderDecisions(){
    const box=document.getElementById("decisions");
    if(box){
      box.innerHTML = DECISIONS.map(d=>{
        const undec=d.sel==null;
        return '<div class="dec '+(undec?'undec':'')+'">'+
          '<div class="q" style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'+
            '<span>'+esc(d.item)+'</span>'+
            '<button class="applybtn" style="background:#9aa6b2;padding:1px 7px;flex:none" onclick="dismissDecision(\''+d.id+'\')" title="Remove this decision (it won\'t apply to the take-off)">✕</button>'+
          '</div>'+
          '<div class="why">'+esc(d.why)+(d.where?' <span class="src">· '+esc(d.where)+'</span>':'')+'</div>'+
          // Pass the option's INDEX, never its text. esc() only escapes "<", so an option
          // containing a double quote — 3" plate, 1/2" base — ended the onclick attribute
          // early and left a truncated handler that silently did nothing when clicked. Every
          // other decision on the page happened to have no quote in it, so only that one was
          // dead. An index cannot break an attribute.
          '<div class="opts">'+d.options.map((o,oi)=>'<span class="opt '+(d.sel===o?'sel ':'')+(d.rec===o?'rec':'')+'" onclick="pick(\''+d.id+'\','+oi+')">'+esc(o)+'</span>').join("")+'</div>'+
          (undec?'<div class="decnote">★ needs your decision.</div>':'')+'</div>';
      }).join("");
    }
    const made=DECISIONS.filter(d=>d.sel!=null).length, left=DECISIONS.length-made;
    const dc=document.getElementById("decCount"); if(dc) dc.textContent = DECISIONS.length?(left?'('+left+' need a decision)':'(all set ✓)'):'';
    const bl=document.getElementById("barLeft");
    if(bl) bl.innerHTML = DECISIONS.length
      ? '<b>'+made+'</b> of <b>'+DECISIONS.length+'</b> decisions · '+(left?'<span style="color:var(--ylw)">'+left+' undecided</span>':'<span style="color:var(--grn)">ready ✓</span>')
      : '<span style="color:var(--grn)">ready ✓</span>';
    const ap=document.getElementById("approve"); if(ap) ap.disabled = left>0;
  }
