<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/takeoff/mc-token.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Take-off — Project Review</title>
<!-- Zoho Creator widget SDK — verified from match-hub-widget (do not change). -->
<script src="https://js.zohostatic.com/creator/widgets/version/1.0/widgetsdk-min.js"></script>
<script src="mc-dialog.js"></script>
<script src="fittingSizes.js"></script>
<!--
  LIVE approval page (build 3b). Renders a real take-off result {rows, import_csv, synopsis}.
  Data source, in order: window.TAKEOFF_RESULT  →  sessionStorage 'takeoff_result'
  (set by the upload widget)  →  built-in SAMPLE (so it opens standalone for design review).
  Approve & Submit commits the BOM via submitToZoho (3a); other section-writes are WIRE-stubbed.
-->
<style>
  :root{
    --blue:#5F94CE; --ink:#1f2a37; --mut:#667; --line:#e3e6ea;
    --grn:#2e7d32; --grnbg:#e8f5e9; --ylw:#b45309; --ylwbg:#fff7ed;
    --red:#b91c1c; --redbg:#fdeeee;
  }
  *{box-sizing:border-box;}
  body{font-family:'Segoe UI',system-ui,sans-serif;margin:0;padding:24px;background:#eef1f5;color:var(--ink);}
  .wrap{max-width:1100px;margin:0 auto;}
  .appbar{max-width:1100px;margin:0 auto 14px;display:flex;align-items:center;gap:10px;padding:2px;}
  .appbar .brand{font-weight:800;font-size:16px;color:var(--blue);letter-spacing:.2px;}
  .appbar .page{font-size:13px;color:var(--mut);border-left:1px solid var(--line);padding-left:10px;}
  .appbar .projhead{font-size:13px;color:var(--ink);border-left:1px solid var(--line);padding-left:10px;min-width:0;max-width:52%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .appbar .projhead b{color:#1f3a5f;} .appbar .projhead .sub{color:var(--mut);}
  .appbar .projhead.wrong{color:var(--red);font-weight:600;white-space:normal;}
  .applybtn{font-size:11px;color:#fff;background:var(--blue);border:0;border-radius:5px;padding:2px 9px;cursor:pointer;margin-left:4px;}
  /* Fittings grid inputs — quiet until touched, so 58 rows don't read as a wall of boxes */
  .fin{font:inherit;font-size:12px;padding:2px 5px;margin:0 3px 2px 0;border:1px solid transparent;
    border-radius:4px;background:#f7f9fb;color:var(--ink);}
  .fin:hover{border-color:#dfe5ec;background:#fff;}
  .fin:focus{border-color:var(--blue);background:#fff;outline:none;}
  /* A value the catalog does not contain. It stays selected and visible rather than being
     quietly swapped for something valid — an unresolvable fitting prices at zero. */
  .fin.bad{border-color:var(--red);background:#fff6f6;color:var(--red);font-weight:600;}
  /* Material check — rows that can't resolve against the shop's catalog */
  .matrow{border-top:1px solid #f2e4e4;padding:9px 0;font-size:13px;}
  .matrow:first-of-type{border-top:0;}
  .matquick{margin-top:5px;font-size:12px;color:var(--mut);}
  .matquick select{font-size:12px;padding:3px 6px;border:1px solid #cdd3da;border-radius:5px;max-width:260px;}
  .applybtn:hover{opacity:.9;}
  .applybtn:disabled{opacity:.5;cursor:default;}
  .busy{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--blue);color:#fff;text-align:center;
        padding:11px;font-size:14px;font-weight:600;display:none;box-shadow:0 2px 10px rgba(0,0,0,.18);}
  .busy.show{display:block;}
  .busy.err{background:var(--red);}
  .busy.ok{background:var(--grn);}
  .busy.warn{background:#b45309;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:14px;overflow:hidden;}
  .card h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0;padding:13px 18px;border-bottom:1px solid var(--line);background:#fafbfc;}
  .card h2 .lt{text-transform:none;letter-spacing:0;font-weight:400;color:var(--mut);}
  .card .body{padding:16px 18px;}
  .hero{background:linear-gradient(180deg,#fff,#f7f9fc);} .hero .body{padding:20px 18px;}
  .hero h1{margin:0 0 4px;font-size:20px;} .hero .type{color:var(--mut);font-size:13px;margin-bottom:14px;}
  .meta{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 11px;color:#334;}
  .conf{float:right;font-weight:700;font-size:13px;padding:5px 12px;border-radius:20px;}
  .c-hi{background:var(--grnbg);color:var(--grn);} .c-md{background:var(--ylwbg);color:var(--ylw);} .c-lo{background:var(--redbg);color:var(--red);}
  .stream{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed #eef1f4;} .stream:last-child{border-bottom:0;}
  .stream .tag{flex:0 0 92px;font-weight:600;font-size:12px;}
  .tag.fab{color:var(--blue);} .tag.buy{color:var(--ylw);} .tag.oth{color:var(--mut);} .tag.snd{color:var(--grn);}
  .stream .items{font-size:13px;color:#2b3340;}
  .dec{padding:12px 0;border-bottom:1px dashed #eef1f4;} .dec:last-child{border-bottom:0;}
  .dscope{padding:9px 0;border-bottom:1px dashed #eef1f4;font-size:13px;line-height:1.5;} .dscope:last-child{border-bottom:0;}
  .dsh{margin-bottom:2px;} .dsin{color:#22673a;} .dsout{color:#7a4b12;}
  .adgrp{margin:6px 0 14px;} .adrow{padding:7px 0;border-bottom:1px dashed #eef1f4;font-size:13px;line-height:1.5;}
  .adch{margin:4px 0 0 18px;padding:0;} .adch li{margin:2px 0;}
  .aovr{margin:0 0 10px;padding:8px 10px;border-radius:6px;background:#eef4fd;border:1px solid #cddcf3;font-size:13px;}
  .qngrp{margin:4px 0 12px;} .qnh{font-weight:700;font-size:13px;margin:0 0 6px;}
  .qn{display:flex;align-items:flex-start;gap:8px;margin:0 0 6px;} .qn input{margin-top:7px;flex:none;}
  .qn textarea{flex:1;min-width:0;padding:6px 9px;border:1px solid #cdd3da;border-radius:7px;font-family:inherit;font-size:12.5px;line-height:1.45;resize:vertical;}
  .qn.off textarea,.qn.off .qnpend{opacity:.45;} .qnpend{flex:1;font-size:12.5px;color:var(--mut);padding-top:5px;}
  .qn a.src{flex:none;padding-top:6px;}
  .dec .q{font-size:14px;font-weight:600;margin-bottom:2px;} .dec .why{font-size:12px;color:var(--mut);margin-bottom:8px;}
  .opts{display:flex;gap:8px;flex-wrap:wrap;}
  .opt{font-size:13px;border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer;background:#fff;user-select:none;transition:.12s;}
  .opt:hover{border-color:var(--blue);} .opt.sel{background:var(--blue);color:#fff;border-color:var(--blue);}
  .opt.rec::after{content:" ★";color:#f2c14e;font-size:11px;} .opt.sel.rec::after{color:#fff;}
  .undec{box-shadow:inset 3px 0 0 var(--ylw);padding-left:10px;border-radius:3px;}
  .decnote{font-size:12px;color:var(--ylw);margin-top:6px;}
  .twoup{display:grid;grid-template-columns:1fr 1fr;gap:14px;} @media(max-width:640px){.twoup{grid-template-columns:1fr;}}
  details{font-size:13px;} details summary{cursor:pointer;font-weight:600;padding:4px 0;}
  details ul{margin:6px 0 0;padding-left:18px;color:#2b3340;} details li{margin:4px 0;}
  .src{color:var(--mut);font-size:11px;}
  .comp{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin-bottom:8px;} .comp .ok{color:var(--grn);font-weight:700;white-space:nowrap;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line);}
  td{padding:7px 8px;border-bottom:1px solid #f1f3f5;}
  tr.lo td{background:var(--redbg);} tr.md td{background:var(--ylwbg);}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
  .d-hi{background:var(--grn);} .d-md{background:var(--ylw);} .d-lo{background:var(--red);}
  .galv{font-size:10px;background:#eef6ee;color:var(--grn);border-radius:4px;padding:1px 5px;}
  tr.grp-comp td{background:#eef2f7;color:#1f3a5f;font-weight:700;font-size:13px;padding:9px 12px;border-top:2px solid #cdd8e6;border-bottom:1px solid #d7e0ec;}
  .grp-units{background:#dbe8f7;color:#2c5c96;border-radius:9px;padding:1px 7px;font-size:11px;font-weight:700;margin-left:4px;}
  tr.grp-draw td{background:#f7f9fb;color:#46566b;font-weight:600;font-size:12px;padding:5px 12px 5px 24px;border-bottom:1px solid #eef1f4;}
  .grp-meta{font-weight:500;color:#8493a4;font-size:11px;margin-left:8px;}
  .pillbtn{font-size:11px;color:var(--blue);border:1px solid #cfe0f2;background:#f3f8fd;border-radius:5px;padding:1px 7px;margin-left:6px;cursor:pointer;}
  .ai{display:flex;gap:8px;} .ai input{flex:1;padding:10px 12px;border:1px solid #cdd3da;border-radius:8px;font-size:13px;}
  .achip{display:inline-flex;align-items:center;gap:6px;font-size:11px;background:#eef4fb;border:1px solid #cfe0f2;color:#2b4a6f;border-radius:6px;padding:3px 8px;}
  .achip b{cursor:pointer;color:#c0392b;font-weight:700;}
  .btn{border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:13px;}
  .btn.ghost{background:#fff;border:1px solid var(--blue);color:var(--blue);} .btn.go{background:var(--blue);color:#fff;} .btn.go:disabled{opacity:.45;cursor:not-allowed;}
  .bar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -2px 8px rgba(0,0,0,.05);}
  .bar .left{font-size:13px;color:var(--mut);} .bar .left b{color:var(--ink);}
  /* conversational Tell-the-AI */
  .chatthread{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto;padding-right:4px;}
  .chathint{color:var(--mut);font-size:13px;line-height:1.5;}
  .cmsg{display:flex;} .cmsg.u{justify-content:flex-end;}
  .cmsg .bub{max-width:82%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word;}
  .cmsg.u .bub{background:var(--blue);color:#fff;border-bottom-right-radius:4px;}
  .cmsg.ai .bub{background:#eef2f7;color:#1f2c3d;border-bottom-left-radius:4px;}
  .cmsg.ai.pending .bub{color:var(--mut);font-style:italic;}
  .cmsg.err .bub{background:var(--redbg);color:var(--red);}
  .cedit{display:block;margin-top:5px;font-size:11px;color:var(--grn);font-weight:600;}
  .cfiles{margin-top:4px;font-size:11px;opacity:.85;}
  .footerdock{position:sticky;bottom:0;z-index:6;display:flex;flex-direction:column;gap:8px;padding-top:8px;background:linear-gradient(to bottom, rgba(238,241,245,0) 0%, #eef1f5 22%);}
  .chatdock{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 -2px 8px rgba(0,0,0,.05);}
  .chatdock .ai{display:flex;gap:8px;align-items:center;}
  .chatdock .ai input{flex:1;padding:10px 12px;border:1px solid #cdd3da;border-radius:8px;font-size:13px;}
  .chatdock .iconbtn{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:8px;padding:9px 11px;font-size:14px;cursor:pointer;line-height:1;}
  .achips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .balchip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--grn);background:var(--grnbg);border:1px solid #bfe3c4;border-radius:8px;padding:7px 11px;}
  .balchip .balsub{font-weight:500;color:#5b8a5e;font-size:11px;}
  .scopearea{flex:1;min-width:0;min-height:80px;padding:9px 12px;border:1px solid #cdd3da;border-radius:8px;font-family:'Segoe UI',system-ui,sans-serif;font-size:12.5px;line-height:1.55;resize:vertical;}
  .commit{margin-top:10px;font-size:13px;background:var(--grnbg);border:1px solid #bfe3c4;border-radius:8px;padding:12px 14px;display:none;} .commit ul{margin:8px 0 0;padding-left:18px;}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #cdd3da;border-top-color:var(--blue);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px;} @keyframes s{to{transform:rotate(360deg);}}
  .foot{text-align:center;color:#9aa6b2;font-size:11px;margin:6px 0 24px;}
  /* Shop labor — job → component → item, all editable, all linked */
  .lab-top{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end;margin-bottom:12px;}
  .lab-top label{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;display:block;}
  .lab-top select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid #cdd3da;border-radius:6px;margin-top:3px;}
  .lab-in{font:inherit;font-size:12.5px;width:78px;text-align:right;padding:3px 6px;border:1px solid #dfe5ec;border-radius:5px;background:#f7f9fb;}
  .lab-in:focus{border-color:var(--blue);background:#fff;outline:none;}
  .lab-in.big{font-size:18px;font-weight:700;width:110px;padding:4px 8px;}
  .lab-in.txt{width:100%;text-align:left;}
  .lab-ball{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#fafbfc;font-size:12.5px;}
  .lab-held td{background:#f3f8fd;}
  tr.lab-item td{font-size:12px;color:#334;padding:4px 8px 4px 26px;}
  tr.lab-item td.n{padding-left:8px;}
  /* Tabs — one area of the review at a time */
  .tabs{display:flex;gap:4px;margin:0 0 14px;border-bottom:2px solid #d7e0ec;overflow-x:auto;position:sticky;top:0;z-index:5;background:#eef1f5;padding-top:4px;}
  .tabs button{font:inherit;font-size:13px;font-weight:600;color:#46566b;background:none;border:0;border-bottom:3px solid transparent;
    margin-bottom:-2px;padding:9px 14px;cursor:pointer;white-space:nowrap;border-radius:6px 6px 0 0;}
  .tabs button:hover{color:var(--blue);background:#f3f8fd;}
  .tabs button.on{color:#fff;background:#5F94CE;border-bottom-color:#5F94CE;}
  .tbadge{display:inline-block;font-size:11px;font-weight:700;border-radius:9px;padding:0 7px;margin-left:4px;background:#dbe8f7;color:#2c5c96;}
  .tabs button.on .tbadge{background:rgba(255,255,255,.25);color:#fff;}
  .tbadge.warn{background:var(--ylwbg);color:var(--ylw);} .tbadge.bad{background:var(--redbg);color:var(--red);}
  .tabpane{display:none;} .tabpane.on{display:block;}
  .tabpane[data-tab="ai"] .chatthread{max-height:62vh;}
  .lab-bk{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;}
  .lab-bk span{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:4px 9px;background:#fafbfc;color:#334;}
  .lab-bk span b{font-size:13px;color:var(--ink);margin-left:4px;}
  .lab-bk span.zero{opacity:.45;}
  .lab-stale{background:var(--ylwbg);border:1px solid #fcd9a8;color:var(--ylw);border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:10px;}
  @media print {
    body{background:#fff;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .wrap,.appbar{max-width:100%;}
    #printBtn,#newRun,.bar,.busy,.commit,#reviseCard,.applybtn,.pillbtn,.footerdock,#chatCard,.tabs{display:none !important;}
    .tabpane{display:block !important;}   /* print the whole package, every tab */
    .card{box-shadow:none;break-inside:avoid;}
    input[type=number]{border:none;padding:0;width:auto;background:transparent;font-size:12.5px;}
  }
</style>
</head>
<body>
<div id="busy" class="busy"></div>
<div class="appbar"><span class="brand">Material Compass</span><span class="page">AI Take-off · Project Review</span><span class="projhead" id="projHead"></span><span id="saveInd" style="font-size:11px;color:var(--mut);margin-left:12px"></span>
  <a id="addBtn" href="#" onclick="document.getElementById('addFile').click();return false;" style="margin-left:auto;font-size:12px;color:var(--blue);text-decoration:none;font-weight:600">➕ Add drawings</a>
  <a id="printBtn" href="#" onclick="printAll();return false;" style="margin-left:14px;font-size:12px;color:var(--blue);text-decoration:none;font-weight:600">🖨 Print</a>
  <a id="newRun" href="#" style="margin-left:14px;font-size:12px;color:var(--blue);text-decoration:none;font-weight:600">↻ New take-off</a></div>
<input type="file" id="addFile" accept="application/pdf" multiple style="display:none" onchange="addDrawings(this)">
<div class="wrap" id="wrap"><div class="card"><div class="body">Loading take-off…</div></div></div>

<script>
  // ---- CONFIG (CONFIRM link names — same Z block as index.html) --------------
  // Same-origin when this page is served by the Material Compass backend (/takeoff/review.html);
  // the absolute host is only needed by the GitHub Pages copy.
  const MC_HOST = "https://material-compass-nesting-app-production.up.railway.app";
  const RAILWAY_URL = /(^|\.)up\.railway\.app$|^localhost$/.test(location.hostname) ? "" : MC_HOST;
  const VERSION = "v0.60 · 2026-10-01";  // bump on every push so you can verify what loaded (Pages CDN caches ~10min)
  console.log("Material Compass review.html " + VERSION);
  const Z = {
    APP:"type-formsheet-2-18-21",            // app link name
    IMPORT_FORM:"Import_BOM_Form",           // CSV Import Tool form (addRecord target)
    IMPORT_REPORT:"Import_BOM_Form_Report",  // its report (uploadFile / updateRecord target)
    REVIEW_PAGE:"https://customer.materialcompassportal.com/#Page:BOM_Staging_Review_Page", // staging review (same page the workflow opens)
    MODE_VALUE:"Append",                     // BOM Import Mode choice — Append keeps existing rows (Replace would wipe them)
    F:{project:"Project_ID",mfg:"MFG_Client_Form",mode:"BOM_Import_Mode",file:"BOM_CSV_File",run:"Run_Import"},
  };

  // ---- params (project_id / manufacturer_id) ---------------------------------
  function getParams(){ const q=new URLSearchParams(location.search);
    return { project_id:q.get("project_id"), manufacturer_id:q.get("manufacturer_id") }; }
  let params = getParams();
  if (window.ZOHO && ZOHO.CREATOR && ZOHO.CREATOR.init) {
    ZOHO.CREATOR.init().then(()=>{ try{ const p=ZOHO.CREATOR.UTIL.getQueryParams();
      params={project_id:p.project_id||params.project_id, manufacturer_id:p.manufacturer_id||params.manufacturer_id};}catch(e){} });
  }

  // ---- data source + persistence ---------------------------------------------
  // Results are saved to localStorage keyed by project, so closing & reopening this
  // page (same browser) restores the last take-off instead of losing a paid run.
  function lsKey(){ return params.project_id ? ("mc_takeoff_"+params.project_id) : null; }
  // window + sessionStorage are GLOBAL (not project-keyed) — a result from another project must
  // never be reused here, or you'd open Schutte and see Alden. Every result is tagged __project.
  function sameProj(R){ return !!(R && params.project_id && String(R.__project||"")===String(params.project_id)); }
  function loadResult(){
    if (window.TAKEOFF_RESULT && sameProj(window.TAKEOFF_RESULT)) return window.TAKEOFF_RESULT;
    try { const s=sessionStorage.getItem("takeoff_result"); if(s){ const R=JSON.parse(s); if(sameProj(R)) return R; } } catch(e){}
    try { const k=lsKey(); if(k){ const s=localStorage.getItem(k); if(s) return JSON.parse(s); } } catch(e){}  // localStorage is already project-keyed
    return SAMPLE;
  }
  function saveResult(result){
    if(result && params.project_id) result.__project = params.project_id;  // tag so it can't leak across projects
    window.TAKEOFF_RESULT = result;
    if(result && result.__demo) return;   // never persist demo/sample data (was polluting localStorage)
    try { sessionStorage.setItem("takeoff_result", JSON.stringify(result)); } catch(e){}
    try { const k=lsKey(); if(k) localStorage.setItem(k, JSON.stringify(result)); } catch(e){}
    scheduleZohoSave();   // also persist to the project record in Zoho (debounced)
  }
  // ---- durable save to Zoho (per project), debounced ----
  let _zohoTimer=null;
  function setSaveInd(txt,color){ const el=document.getElementById("saveInd"); if(el){ el.textContent=txt; el.style.color=color||"var(--mut)"; } }
  function scheduleZohoSave(){ if(_zohoTimer) clearTimeout(_zohoTimer); _zohoTimer=setTimeout(doZohoSave, 2500); }
  async function doZohoSave(){
    const R=loadResult();
    if(!R || R.__demo || !params.project_id || !Array.isArray(R.rows) || !R.rows.length) return;
    setSaveInd("saving…","var(--mut)");
    // drawing_files travels with the package so Approve can still put the PDFs on their
    // drawing records after this take-off is re-opened on another day or another machine.
    // fittings MUST travel too. They were left out, so they lived only in this browser — reopen
    // the take-off anywhere else (or after storage is cleared) and every fitting was gone.
    // labor too, for the same reason: the estimator's hours and Holds must survive a reopen.
    // quote_notes likewise: the clarifications keep every dismissed conflict and gap, which the
    // synopsis no longer holds, so they can't be rebuilt from it on another machine.
    const pkg={ rows:R.rows, fittings:R.fittings, synopsis:R.synopsis, notes:R.notes, cost_usd:R.cost_usd, drawing_files:R.drawing_files||[], labor:R.labor||null, quote_notes:R.quote_notes||[],
                superseded:R.superseded||[], addendum_notices:R.addendum_notices||[], addenda:R.addenda||null };
    try{
      const r=await fetch(RAILWAY_URL+"/api/takeoff/save",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({project_id:params.project_id, package:pkg})});
      const d=await r.json();
      setSaveInd(d.ok?"💾 saved to project":"⚠ save failed", d.ok?"var(--grn)":"var(--red)");
    }catch(e){ setSaveInd("⚠ save failed","var(--red)"); }
  }
  function haveLive(){ try{
    if(window.TAKEOFF_RESULT && sameProj(window.TAKEOFF_RESULT)) return true;
    const s=sessionStorage.getItem("takeoff_result"); if(s && sameProj(JSON.parse(s))) return true;
    const k=lsKey(); if(k && localStorage.getItem(k)) return true;
  }catch(e){} return false; }

  // ---- helpers ---------------------------------------------------------------
  const esc = (s)=>String(s==null?"":s).replace(/</g,"&lt;");
  const escAttr = (s)=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const SCOPE_CATS = [["fabricate","Fabricate","fab"],["buyout","Buyout","buy"],["by_others","By others","oth"],["send_out","Send-out","snd"]];
  const arr = (a)=>Array.isArray(a)?a:[];
  const confClass=(c)=> c>=0.8?"hi":c>=0.5?"md":"lo";
  // ── WHY IS THIS ROW AMBER? ───────────────────────────────────────────────────────────────
  // The model already explains itself per row in `note` (both ROW_ITEM and FITTING_ITEM carry
  // it) - "schedule not stated, assumed to match line", that sort of thing. Until now it was
  // only rendered in the Gaps list, which is a different question: gaps are what the DOCUMENTS
  // do not say, conflicts are where two documents disagree, and this is how sure the model is
  // about one row. Three different things that were all collapsed into a coloured dot.
  function confWhy(r,c){
    const note=String((r&&r.note)||"").trim();
    const band=c>=0.8?"high confidence":c>=0.5?"moderate confidence":"low confidence";
    const head=(c||c===0)?(Math.round(c*100)+"% - "+band):"no confidence score";
    // The source sheet matters as much as the reason: it says WHERE to go and check.
    const from=String((r&&r.source_sheet)||"").trim();
    return escAttr(head+(note?" - "+note:"")+(from?"  (read from "+from+")":""));
  }

  const confBadge=(c)=> '<span class="conf c-'+confClass(c)+'">'+Math.round((c||0)*100)+'% confident</span>';
  const splitFt=(n)=>{const r=Number(n)||0;const ft=Math.max(0,Math.floor(r));return ft+"'"+Math.round((r-ft)*12)+'"';};
  // decimal feet → feet-inches with fractions (nearest 1/16): 0.8→9-5/8", 24→24'-0", 6.33→6'-3-15/16"
  function fmtFtIn(ftVal){
    let v=Number(ftVal)||0; if(v<0) v=0;
    let feet=Math.floor(v);
    let s=Math.round((v-feet)*192);   // 1/16-inch units in the remaining foot (12*16)
    feet+=Math.floor(s/192); s=s%192;
    let inch=Math.floor(s/16), f16=s%16, frac="";
    if(f16>0){ let n=f16,d=16; while(n%2===0){n/=2;d/=2;} frac=n+"/"+d; }
    const inchStr=(inch>0||frac)?(inch+(frac?("-"+frac):"")+'"'):"";
    if(feet>0&&inchStr) return feet+"'-"+inchStr;
    if(feet>0) return feet+"'-0\"";
    return inchStr||'0"';
  }
  // Plates/sheets carry width×length; linear members carry length only.
  function dimStr(r){ return r.width_ft ? (fmtFtIn(r.width_ft)+" × "+fmtFtIn(r.length_ft)) : fmtFtIn(r.length_ft); }

  let DECISIONS = [];   // working copy with .sel
  let CONFLICTS = [];   // for the per-conflict Apply buttons
  let BOM_EXPANDED = false;  // BOM table: show first 8 vs all + editable
  let SCOPE_EDIT = false;    // Scope of Work: edit mode (add/edit/remove write-ups)
  let REVISE_ATTACHMENTS = [];  // reference docs attached to "Tell the AI to revise" [{kind,name,media_type?,data?,text?}]
  let ACCOUNT = null;           // {balance, price:{premium,basic}} — prepaid meter (Phase 0 visual)
  let PROJECT_SCOPE = null;     // {components:[{id,name}], drawings:[{id,number}]} from Zoho; null until fetched
  let SCOPE_FETCH_DONE = false; // true once the project-scope fetch resolves (distinguish "loading" from "none entered")
  let RECON = { component:null, drawing:null };  // last reconcile() result per kind; index-keyed action handlers read this

  // ===== SCOPE RECONCILIATION =================================================
  // Compare what the AI READ (r.component / r.source_sheet) vs. the project's
  // ENTERED components & drawings. Match rule MIRRORS the staging validator
  // (entered-name CONTAINS take-off value, normalized) so this previews what
  // staging will actually resolve. Every fix rewrites r.* → flows into the commit CSV.
  const _norm  = (s)=>String(s==null?"":s).toLowerCase().trim().replace(/\s+/g," ");
  const RECROW = (bd,bg)=>'padding:5px 9px;border-left:3px solid '+bd+';background:'+bg+';border-radius:4px;margin:4px 0;font-size:12.5px';

  // Which job this is, in the app bar: MCP number, name, client, due. The hero card shows the name
  // the AI read off the drawings; this is the project it will be COMMITTED to. A project belonging
  // to another shop says so in red (a reused window can sit on the wrong one).
  function showProjectHeader(p){
    const el=document.getElementById("projHead"); if(!el||!p) return;
    const wrong=p.manufacture&&params.manufacturer_id&&String(p.manufacture)!==String(params.manufacturer_id);
    el.className="projhead"+(wrong?" wrong":"");
    el.title=[p.number,p.name,p.client,p.due?"due "+p.due:""].filter(Boolean).join(" · ");
    el.innerHTML=wrong
      ? "⚠ This project belongs to a different shop than the one this page was opened for. Reopen the take-off from the project page."
      : (p.number?"<b>"+esc(p.number)+"</b> · ":"")+esc(p.name||"(unnamed project)")+
        (p.client?' <span class="sub">· '+esc(p.client)+'</span>':'')+(p.due?' <span class="sub">· due '+esc(p.due)+'</span>':'');
  }
  async function fetchProjectScope(){
    if(!params.project_id || loadResult().__demo){ SCOPE_FETCH_DONE=true; return; }
    try{
      const r=await fetch(RAILWAY_URL+"/api/takeoff/project-scope/"+encodeURIComponent(params.project_id));
      const d=await r.json();
      if(d&&d.ok){ PROJECT_SCOPE={components:arr(d.components),drawings:arr(d.drawings)}; showProjectHeader(d.project); }
    }catch(e){ /* non-fatal — panel shows a soft notice */ }
    SCOPE_FETCH_DONE=true; render();
  }
  function reconEntered(kind){
    if(!PROJECT_SCOPE) return [];
    return kind==='component'
      ? arr(PROJECT_SCOPE.components).map(function(c){return {id:c.id,name:String(c.name==null?"":c.name)};})
      : arr(PROJECT_SCOPE.drawings).map(function(d){return {id:d.id,name:String(d.number==null?"":d.number)};});
  }
  // What the AI read, from BOTH sources:
  //   1. per-row `component` / `source_sheet` tags, and
  //   2. the Scope of Work write-up, which pairs each assembly with its drawing:
  //      "Lid Assembly (top, hinge side, …) – RIS-48300-S2 family"
  // Source 2 matters because the synopsis is often populated when the per-row tags are not —
  // reading only the rows reported "0 matched" while the answer sat in plain sight on the page.
  const DRAW_RE=/\b[A-Za-z]{1,4}[0-9]*(?:-[A-Za-z0-9]+){2,}\b/g;
  function scopeStreams(){
    const sw=(loadResult().synopsis||{}).scope_of_work||{};
    const fab=arr(sw.fabricate);
    return { fab:fab, all:fab.concat(arr(sw.buyout),arr(sw.by_others),arr(sw.send_out)) };
  }
  function scopeComponents(){   // "Upper Frame weldment (W6x25 …) – RIS-…" → "Upper Frame weldment"
    return scopeStreams().fab.map(function(l){
      return String(l).split(/\s[–—-]\s/)[0].replace(/\s*\(.*$/,"").trim();
    }).filter(Boolean);
  }
  function scopeDrawings(){     // every drawing-shaped token across all streams
    const out=[];
    scopeStreams().all.forEach(function(l){ (String(l).match(DRAW_RE)||[]).forEach(function(x){ out.push(x); }); });
    return out;
  }
  // drawing → parent component, straight off the scope line that names both:
  //   "Upper Frame weldment (W6x25 …) – RIS-48300-S1-A-1"  →  {ris-48300-s1-a-1: "Upper Frame weldment"}
  function scopeDrawingParent(){
    const map={};
    scopeStreams().fab.forEach(function(l){
      const s=String(l), name=s.split(/\s[–—-]\s/)[0].replace(/\s*\(.*$/,"").trim();
      if(!name) return;
      (s.match(DRAW_RE)||[]).forEach(function(d){ map[_norm(d)]=name; });
    });
    return map;
  }
  function reconTakeoff(kind){   // distinct AI values → [{norm,value,rows,src}]
    const field=kind==='component'?'component':'source_sheet', map={};
    const push=function(raw,fromRow){
      const v=String(raw==null?"":raw).trim(); if(!v) return;
      const n=_norm(v); if(!map[n]) map[n]={norm:n,value:v,rows:0,src:fromRow?'rows':'scope'};
      if(fromRow){ map[n].rows++; map[n].src='rows'; }
    };
    arr(loadResult().rows).forEach(function(r){ if((Number(r.quantity)||0)>0) push(r[field],true); });
    // The scope-of-work write-up is a FALLBACK, not a second source. It exists for the case where
    // the rows carry no component/sheet tags at all — reading only the rows then reported "0 matched"
    // while the answer sat in plain sight. Now that intake binds every row to a real component, mining
    // the write-up as well proposed eleven "components" like "MC8 structural channels" and
    // "Flat plates": material groups, not assemblies, and pure noise to add to a project.
    if (!Object.keys(map).length) {
      (kind==='component'?scopeComponents():scopeDrawings()).forEach(function(v){ push(v,false); });
    }
    return Object.keys(map).map(function(n){return map[n];});
  }
  function reconState(){ return loadResult().__reconcile||{}; }
  function reconSet(mut){ const R=loadResult(); R.__reconcile=R.__reconcile||{ignored:{component:[],drawing:[]},acked:{component:[],drawing:[]},unpaired:{component:[],drawing:[]}}; mut(R.__reconcile); saveResult(R); render(); }

  // ---- near-match (≈) --------------------------------------------------------
  // A near match is a SUGGESTION TO RENAME, never a match. The strict rule below stays
  // byte-identical to the staging validator, so the panel can never show a green ✓ for a link
  // that then imports blank. Renaming the entered value to the take-off's exact wording is what
  // turns the pair into a real match — which also means the validator needs no change.
  // Prime case: the REVERSE of the strict rule — take-off "Upper Frame weldment" contains
  // entered "Upper Frame". The strict rule misses it; a rename fixes it for good.
  function _tok(s){ return _norm(s).split(/[^a-z0-9]+/).filter(Boolean); }
  function _sim(a,b){
    const A=_tok(a), B=_tok(b).slice(); if(!A.length||!B.length) return 0;
    let hit=0; A.forEach(function(t){ const i=B.indexOf(t); if(i>-1){ hit++; B.splice(i,1); } });
    return hit/Math.max(A.length,_tok(b).length);
  }
  function _near(en,tn){ return tn.indexOf(en)>-1 || _sim(en,tn)>=0.5; }

  function reconcile(kind){
    const entered=reconEntered(kind).map(function(e){return {e:e,n:_norm(e.name)};}).filter(function(x){return x.n;});
    const takeoff=reconTakeoff(kind);
    const rc=reconState(), ign=arr(rc.ignored&&rc.ignored[kind]), ack=arr(rc.acked&&rc.acked[kind]),
          unp=arr(rc.unpaired&&rc.unpaired[kind]);
    const hit=function(en,tn){ return en===tn || en.indexOf(tn)>-1; };  // entered CONTAINS take-off (validator rule)
    const matched=[], takeoffOnly=[];
    takeoff.forEach(function(t){
      if(entered.some(function(x){return hit(x.n,t.norm);})) matched.push(t);
      else if(ign.indexOf(t.norm)<0) takeoffOnly.push(t);
    });
    let enteredOnly=entered.filter(function(x){ return !takeoff.some(function(t){return hit(x.n,t.norm);}) && ack.indexOf(x.n)<0; }).map(function(x){return x.e;});

    // Greedy best-score pairing across the two leftover lists. Each side is consumed at most once,
    // and anything you flag "not the same" is skipped so it falls back to its own section.
    const near=[], usedT={}, usedE={};
    enteredOnly.forEach(function(e){
      if(unp.indexOf(_norm(e.name))>-1) return;
      let best=null, bestScore=0;
      takeoffOnly.forEach(function(t,ti){
        if(usedT[ti] || !_near(_norm(e.name),t.norm)) return;
        const s=_sim(_norm(e.name),t.norm);
        if(s>=bestScore){ bestScore=s; best=ti; }
      });
      if(best!==null){ usedT[best]=1; usedE[_norm(e.name)]=1; near.push({entered:e, takeoff:takeoffOnly[best]}); }
    });
    return {
      enteredTotal:entered.length, matched:matched, near:near,
      takeoffOnly:takeoffOnly.filter(function(t,ti){ return !usedT[ti]; }),
      enteredOnly:enteredOnly.filter(function(e){ return !usedE[_norm(e.name)]; }),
    };
  }
  // ---- actions (index-keyed so no raw strings ride inside onclick attributes) ----
  function reconMap(kind,fromNorm,toName){
    if(!toName) return;
    const field=kind==='component'?'component':'source_sheet', R=loadResult();
    arr(R.rows).forEach(function(r){ if(_norm(r[field])===fromNorm) r[field]=toName; });
    saveResult(R); render();
  }
  function reconMapIdx(kind,i,sel){ const t=RECON[kind]&&RECON[kind].takeoffOnly[i]; if(t) reconMap(kind,t.norm,sel.value); }
  function reconIgnoreIdx(kind,i){ const t=RECON[kind]&&RECON[kind].takeoffOnly[i]; if(t) reconSet(function(rc){ rc.ignored=rc.ignored||{}; rc.ignored[kind]=arr(rc.ignored[kind]).concat([t.norm]); }); }
  // Dismissals must be undoable — an ignored item was otherwise hidden for good, with no way back
  // short of clearing localStorage.
  function reconUnignoreIdx(kind,i){ reconSet(function(rc){ rc.ignored=rc.ignored||{}; rc.ignored[kind]=arr(rc.ignored[kind]).filter(function(_,j){return j!==i;}); }); }
  function reconUnackIdx(kind,i){ reconSet(function(rc){ rc.acked=rc.acked||{}; rc.acked[kind]=arr(rc.acked[kind]).filter(function(_,j){return j!==i;}); }); }
  function reconDismissedHtml(kind){
    const rc=reconState(), ign=arr(rc.ignored&&rc.ignored[kind]), ack=arr(rc.acked&&rc.acked[kind]);
    if(!ign.length && !ack.length) return "";
    const label={}; reconTakeoff(kind).forEach(function(t){ label[t.norm]=t.value; });
    reconEntered(kind).forEach(function(e){ label[_norm(e.name)]=e.name; });
    const chip=function(n,i,fn){ return '<span style="display:inline-block;background:#eef1f5;border-radius:10px;padding:1px 4px 1px 8px;margin:2px 4px 2px 0">'+
      esc(label[n]||n)+' <button class="applybtn" style="background:#9aa6b2;padding:0 6px" onclick="'+fn+'(\''+kind+'\','+i+')" title="Show this again">undo</button></span>'; };
    return '<div class="src" style="margin:2px 0 4px">Dismissed: '+
      ign.map(function(n,i){return chip(n,i,'reconUnignoreIdx');}).join("")+
      ack.map(function(n,i){return chip(n,i,'reconUnackIdx');}).join("")+'</div>';
  }
  function reconAckIdx(kind,i){ const e=RECON[kind]&&RECON[kind].enteredOnly[i]; if(e) reconSet(function(rc){ rc.acked=rc.acked||{}; rc.acked[kind]=arr(rc.acked[kind]).concat([_norm(e.name)]); }); }
  function reconUnpairIdx(kind,i){ const p=RECON[kind]&&RECON[kind].near[i]; if(p) reconSet(function(rc){ rc.unpaired=rc.unpaired||{}; rc.unpaired[kind]=arr(rc.unpaired[kind]).concat([_norm(p.entered.name)]); }); }
  function reconMapNearIdx(kind,i){ const p=RECON[kind]&&RECON[kind].near[i]; if(p) reconMap(kind,p.takeoff.norm,p.entered.name); }

  // The drawing's parent component, resolved from the take-off itself: find a row on this sheet
  // that names a component, then match that name to an entered component record. Without this the
  // new drawing lands on the project unattached to any component.
  function reconParentComponentId(sheetValue){
    const sn=_norm(sheetValue); let compName="";
    arr(loadResult().rows).some(function(r){
      if(_norm(r.source_sheet)===sn && String(r.component||"").trim()){ compName=_norm(r.component); return true; }
      return false;
    });
    // Row tags are often blank; the scope line naming both is the reliable source.
    if(!compName){ const p=scopeDrawingParent()[sn]; if(p) compName=_norm(p); }
    if(!compName) return "";
    const c=reconEntered('component').filter(function(x){ const n=_norm(x.name); return n===compName||n.indexOf(compName)>-1||compName.indexOf(n)>-1; })[0];
    return c?c.id:"";
  }

  async function reconAdd(kind,value){
    if(!params.project_id) throw new Error("No project_id — can't add to project.");
    const body={project_id:params.project_id,kind:kind,value:value};
    if(kind==='drawing'){ const cid=reconParentComponentId(value); if(cid) body.component_id=cid; }
    const r=await fetch(RAILWAY_URL+"/api/takeoff/project-scope/add",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok||d.ok===false) throw new Error(d.error||("HTTP "+r.status));
    if(d.warning) mcAlert("Added, but: "+d.warning,{title:"AI Take-off"});   // e.g. bidirectional link name rejected
    PROJECT_SCOPE=PROJECT_SCOPE||{components:[],drawings:[]};
    if(kind==='component') PROJECT_SCOPE.components.push({id:d.id,name:value});
    else PROJECT_SCOPE.drawings.push({id:d.id,number:value});
    return d.id;
  }
  async function reconAddIdx(kind,i){
    const t=RECON[kind]&&RECON[kind].takeoffOnly[i]; if(!t) return;
    try{ await reconAdd(kind,t.value); render(); }
    catch(e){ mcAlert("Add to project failed: "+e.message,{title:"AI Take-off"}); }
  }
  // Bulk add only. Components go first so drawings can attach to the records just created.
  async function reconAddAll(kind){
    const list=(RECON[kind]&&RECON[kind].takeoffOnly||[]).slice(); if(!list.length) return;
    if(!(await mcConfirm("Add "+list.length+" "+kind+(list.length===1?"":"s")+" to the project?",{title:"AI Take-off",okText:"Add"}))) return;
    const failed=[];
    for(let i=0;i<list.length;i++){ try{ await reconAdd(kind,list[i].value); }catch(e){ failed.push(list[i].value+" — "+e.message); } }
    render();
    if(failed.length) mcAlert("Added "+(list.length-failed.length)+" of "+list.length+".\n\nFailed:\n"+failed.join("\n"),{title:"AI Take-off"});
  }

  // Free-text rename straight from the "On your project" box — the one control that covers
  // "change it to something neither side proposed".
  // Save WAS working — it wrote to the project and said nothing, then re-rendered a row that looked
  // identical, which is indistinguishable from a dead button. Renaming an unmatched drawing usually
  // leaves it unmatched (nothing the take-off read has that name either), so silence was the norm.
  // It now reports what it did, refuses a no-op, and can't be double-clicked mid-save.
  async function reconRenameVal(kind,id,inputId){
    const el=document.getElementById(inputId); if(!el) return;
    const v=String(el.value||"").trim();
    const noun=kind==='component'?'component':'drawing';
    if(!v){ setBusy("Type a name first — an empty "+noun+" name can't be saved.","warn"); clearBusy(2600); return; }
    const list=kind==='component'?arr(PROJECT_SCOPE.components):arr(PROJECT_SCOPE.drawings);
    const rec=list.filter(function(x){ return String(x.id)===String(id); })[0];
    const was=rec?String((kind==='component'?rec.name:rec.number)||""):"";
    if(was && was===v){
      setBusy("That's already its name on the project — nothing to save.","warn"); clearBusy(2600); return;
    }
    const btn=el.parentNode?el.parentNode.querySelector("button"):null;
    if(btn){ btn.disabled=true; btn.textContent="saving…"; }
    setBusy("<span class=\"spin\"></span>Renaming on the project…");
    try{
      const r=await fetch(RAILWAY_URL+"/api/takeoff/project-scope/update",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({kind:kind,id:id,value:v})});
      const d=await r.json();
      if(!r.ok||d.ok===false) throw new Error(d.error||("HTTP "+r.status));
      list.forEach(function(x){ if(String(x.id)===String(id)){ if(kind==='component') x.name=v; else x.number=v; } });
      setBusy('✓ Saved on the project — '+(was?('"'+esc(was)+'" is now '):'')+'"'+esc(v)+'".'+
        (kind==='drawing' ? ' <span style="opacity:.85">If it still shows as unmatched, nothing the take-off read carries that number either.</span>' : ''),"ok");
      clearBusy(4200);
      render();
    }catch(e){
      if(btn){ btn.disabled=false; btn.textContent="save"; }
      setBusy("⚠ Rename failed: "+esc(e.message||e),"err"); clearBusy(6000);
    }
  }

  async function reconRenameIdx(kind,i){
    const p=RECON[kind]&&RECON[kind].near[i]; if(!p) return;
    if(!(await mcConfirm('Rename "'+p.entered.name+'" to "'+p.takeoff.value+'" on the project?',{title:"AI Take-off",okText:"Rename"}))) return;
    try{
      const r=await fetch(RAILWAY_URL+"/api/takeoff/project-scope/update",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({kind:kind,id:p.entered.id,value:p.takeoff.value})});
      const d=await r.json();
      if(!r.ok||d.ok===false) throw new Error(d.error||("HTTP "+r.status));
      const list=kind==='component'?arr(PROJECT_SCOPE.components):arr(PROJECT_SCOPE.drawings);
      list.forEach(function(x){ if(String(x.id)===String(p.entered.id)){ if(kind==='component') x.name=p.takeoff.value; else x.number=p.takeoff.value; } });
      render();
    }catch(e){ mcAlert("Rename failed: "+e.message,{title:"AI Take-off"}); }
  }

  async function reconDeleteIdx(kind,i){
    const e=RECON[kind]&&RECON[kind].enteredOnly[i]; if(!e) return;
    if(!(await mcConfirm('Delete "'+e.name+'" from the project?\n\nThis removes the record permanently. It is blocked if anything is still linked to it.',{title:"AI Take-off",okText:"Delete",danger:true}))) return;
    try{
      const r=await fetch(RAILWAY_URL+"/api/takeoff/project-scope/delete",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({kind:kind,id:e.id})});
      const d=await r.json();
      if(r.status===409){ mcAlert("Can't delete \""+e.name+"\".\n\n"+d.error,{title:"AI Take-off"}); return; }
      if(!r.ok||d.ok===false) throw new Error(d.error||("HTTP "+r.status));
      if(kind==='component') PROJECT_SCOPE.components=arr(PROJECT_SCOPE.components).filter(function(x){return String(x.id)!==String(e.id);});
      else PROJECT_SCOPE.drawings=arr(PROJECT_SCOPE.drawings).filter(function(x){return String(x.id)!==String(e.id);});
      render();
    }catch(e2){ mcAlert("Delete failed: "+e2.message,{title:"AI Take-off"}); }
  }
  // How much of the BOM the take-off actually tagged. When this is zero the panel has nothing to
  // compare against, and "0 matched" reads as a matching failure when it's really an input failure
  // — so say which one, and which fix applies.
  function reconCoverage(){
    const rows=arr(loadResult().rows), live=rows.filter(function(r){return (Number(r.quantity)||0)>0;});
    const filled=function(f){ return live.filter(function(r){return String(r[f]==null?"":r[f]).trim();}).length; };
    const keys=rows.length?Object.keys(rows[0]):[];
    return { rows:rows.length, live:live.length, comp:filled('component'), sheet:filled('source_sheet'),
             hasKeys:keys.indexOf('component')>-1||keys.indexOf('source_sheet')>-1 };
  }
  function reconNoticeHtml(){
    const c=reconCoverage();
    // Only when BOTH sources are empty — the Scope of Work counts as the AI having read something.
    if(!c.rows || c.comp || c.sheet) return "";
    if(reconTakeoff('component').length || reconTakeoff('drawing').length) return "";
    let why;
    if(!c.hasKeys)      why='This saved result predates the component/drawing fields — <b>re-run the take-off</b> and it will tag rows as it reads them.';
    else if(!c.live)    why='All '+c.rows+' rows have a quantity of 0, and only rows with quantity &gt; 0 are read here — check the quantity column.';
    else                why='The AI returned the fields empty. <b>Re-run the take-off</b> now that your components are entered, so it can tag each row as it reads.';
    return '<div style="padding:8px 10px;border-left:3px solid #d9a441;background:#fff9ef;border-radius:4px;margin-bottom:10px;font-size:12.5px">'+
      '<b>Nothing to reconcile against.</b> This take-off tagged <b>0 of '+c.live+'</b> priced rows with a component and <b>0</b> with a drawing, '+
      'so everything below is just your entered list — not a mismatch. '+why+'</div>';
  }

  // ---- PIPE FITTINGS ------------------------------------------------------
  // Fittings are bought complete, quoted separately and rolled up on the component apart from
  // steel (Unit_Fittings_*), so they are deliberately NOT in the BOM or its CSV. Before this they
  // were simply lost: the schema had nowhere to put an elbow, so it either vanished or was forced
  // into a structural form type and arrived in the BOM as steel to fabricate.
  // ---- Shop labor ---------------------------------------------------------------------------
  // Hours for this take-off at three levels that stay linked: the JOB total is the sum of its
  // COMPONENTS, a component is the sum of its ITEMS. Change an item and the totals follow;
  // change a component and its items scale with it; change the job and every component that is
  // not on Hold scales. Hours here are JOB hours (per unit × units) — what gets quoted and what
  // goes on the project. Kept on the take-off (R.labor), so it saves and reloads with it.
  //
  // The standards only price what the take-off can count, so the bottom-up figure runs low;
  // the shop's own reference jobs (hr/ton by job type) sit beside it as the ballpark.
  const LAB_BUCKET = {Cutting_Hrs:"Cutting",CNC_Hrs:"CNC",Assy_Hrs:"Fit & assemble",Fab_Hrs:"Fabrication",
    Weld_Hrs:"Welding",Labor_Hrs:"Handling / labor",Inspection_Hrs:"Inspection",Misc_Hrs:"Misc."};
  let LAB_LOADING=false, LAB_ERR="";
  function labFmt(n,d){ const x=Number(n)||0; return x.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}); }
  function labComp(c){ return arr(c.items).reduce(function(a,i){ return a+(Number(i.hours)||0); },0); }
  function labJob(L){ return arr(L.components).reduce(function(a,c){ return a+labComp(c); },0); }
  function labLive(R){
    const live=function(r){ return r && !r.deleted && Number(r.quantity)>0; };
    return { rows:arr(R.rows).filter(live), fittings:arr(R.fittings).filter(live) };
  }
  // What the labor was worked out from. When the BOM changes afterwards, say so — never
  // silently keep hours for steel that is no longer on the take-off.
  function labSig(R){
    const t=labLive(R);
    return JSON.stringify(t.rows.map(function(r){ return [r.component,r.form_type,r.size,r.quantity,r.units,r.length_ft,r.width_ft,r.disposition]; })
      .concat(t.fittings.map(function(f){ return [f.component,f.fitting_type,f.size,f.end_type,f.quantity,f.units]; })));
  }
  async function labFetch(R, jobType){
    const t=labLive(R);
    const r=await fetch(RAILWAY_URL+"/api/labor/estimate",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({manufacturer_id:params.manufacturer_id||"", job_type:jobType||"", rows:t.rows, fittings:t.fittings})});
    const j=await r.json().catch(function(){ return null; });
    if(!r.ok||!j||!j.ok) throw new Error((j&&j.error)||("server said "+r.status));
    return j.labor;
  }
  function labSnapshot(x){ return { tons:x.tons, unweighed_rows:x.unweighed_rows, bottom_up:x.bottom_up, ballpark:x.ballpark,
    reference_rates:x.reference_rates, job_types:x.job_types, buckets:x.buckets }; }
  // Default job type: the type the shop has the most reference tonnage in, else Misc.
  function labDefaultType(rates){
    const k=Object.keys(rates||{}).sort(function(a,b){ return (rates[b].tons||0)-(rates[a].tons||0); });
    return k[0]||"misc";
  }
  async function laborCalc(replace){
    const R=loadResult();
    if(replace && R.labor && R.labor.edited &&
       !(await mcConfirm("Recalculate from the standards? Every hour you changed or added here is replaced.",{title:"Shop labor",okText:"Recalculate",cancelText:"Keep mine"}))) return;
    LAB_LOADING=true; LAB_ERR=""; render();
    try{
      let x=await labFetch(R, R.labor&&R.labor.job_type);
      const jt=(R.labor&&R.labor.job_type)||labDefaultType(x.reference_rates);
      if(!(R.labor&&R.labor.job_type) && jt) x=await labFetch(R, jt);
      const R2=loadResult();
      // Keep the ids the last approve wrote: without them a re-approve would add rows, not replace.
      const written=arr(R2.labor&&R2.labor.written);
      R2.labor={ job_type:jt, sig:labSig(R2), fetched:new Date().toISOString(), edited:false, server:labSnapshot(x), written:written,
        components:arr(x.components).map(function(c){
          return { name:c.name, units:c.units, tons:c.tons, held:false, missing:arr(c.missing),
            items:arr(c.items).map(function(i){ return Object.assign({},i,{auto:i.hours}); }) };
        }) };
      saveResult(R2);
    }catch(e){ LAB_ERR=e.message; }
    LAB_LOADING=false; render();
  }
  async function laborJobType(v){
    const R=loadResult(); if(!R.labor) return;
    R.labor.job_type=v; saveResult(R); render();
    try{ const x=await labFetch(R, v); const R2=loadResult(); R2.labor.server=labSnapshot(x); saveResult(R2); }
    catch(e){ LAB_ERR=e.message; }
    render();
  }
  function labEdit(fn){ const R=loadResult(); if(!R.labor) return; fn(R.labor); R.labor.edited=true; saveResult(R); render(); }
  function labNum(v){ const n=Number(String(v).replace(/,/g,"")); return Number.isFinite(n)&&n>=0?n:null; }
  function laborItem(ci,ii,v){ const n=labNum(v); if(n==null){ render(); return; }
    labEdit(function(L){ L.components[ci].items[ii].hours=n; }); }
  function laborItemText(ci,ii,k,v){ labEdit(function(L){ L.components[ci].items[ii][k]=String(v||"").slice(0,120); }); }
  // A component total scales its items. One with no items yet gets a single entered line.
  function laborComp(ci,v){ const n=labNum(v); if(n==null){ render(); return; }
    labEdit(function(L){
      const c=L.components[ci], cur=labComp(c);
      if(cur>0) c.items.forEach(function(i){ i.hours=Math.round((Number(i.hours)||0)*n/cur*100)/100; });
      else c.items.push({what:"entered for "+c.name, bucket:"Fab_Hrs", hours:n, entered:true});
    }); }
  // The job total scales every component NOT on Hold. Held ones stay exactly as they are.
  async function laborJob(v){
    const n=labNum(v), R=loadResult(), L=R.labor; if(n==null||!L){ render(); return; }
    const held=L.components.filter(function(c){ return c.held; }).reduce(function(a,c){ return a+labComp(c); },0);
    const free=L.components.filter(function(c){ return !c.held; }).reduce(function(a,c){ return a+labComp(c); },0);
    if(n<held){ await mcAlert("The components on Hold already come to "+labFmt(held,1)+" hrs, more than "+labFmt(n,1)+". Release a Hold or enter a larger total.",{title:"Shop labor"}); render(); return; }
    if(free<=0){ await mcAlert("Every component is on Hold or has no hours yet, so there is nothing to spread the total over. Enter hours on a component first.",{title:"Shop labor"}); render(); return; }
    const k=(n-held)/free;
    labEdit(function(L){ L.components.forEach(function(c){ if(!c.held) c.items.forEach(function(i){ i.hours=Math.round((Number(i.hours)||0)*k*100)/100; }); }); });
  }
  function laborHold(ci,on){ labEdit(function(L){ L.components[ci].held=!!on; }); }
  function laborAddItem(ci){ labEdit(function(L){ L.components[ci].items.push({what:"", bucket:"Fab_Hrs", hours:0, entered:true}); }); }
  function laborDelItem(ci,ii){ labEdit(function(L){ L.components[ci].items.splice(ii,1); }); }
  function laborAddComp(){ labEdit(function(L){ L.components.push({name:"Other work", units:1, tons:0, held:false, missing:[], items:[{what:"", bucket:"Fab_Hrs", hours:0, entered:true}]}); }); }
  function laborCompName(ci,v){ labEdit(function(L){ L.components[ci].name=String(v||"").trim().slice(0,120)||L.components[ci].name; }); }

  function laborCardHtml(R){
    const L=R.labor;
    const setupUrl=RAILWAY_URL+"/takeoff/labor-setup.html?manufacturer_id="+encodeURIComponent(params.manufacturer_id||"")+
      (window.MC_TOKEN?"&t="+encodeURIComponent(window.MC_TOKEN):"");
    const setupLink='<a href="'+escAttr(setupUrl)+'" target="_blank" style="color:var(--blue);font-weight:600;text-decoration:none">Shop labor setup ↗</a>';
    const head='<div class="card" id="laborCard"><h2>⏱ Shop labor <span class="lt">— job, component and item hours, linked</span></h2><div class="body">';
    if(!L){
      // First sight of a take-off with no labor yet: work it out once. The flag goes up before
      // the timer so a render in between cannot queue a second request.
      if(!LAB_LOADING && !LAB_ERR && labLive(R).rows.length){ LAB_LOADING=true; setTimeout(function(){ laborCalc(false); },0); }
      return head+(LAB_ERR
        ? '<div style="color:var(--red);font-size:13px">Could not work out labor: '+esc(LAB_ERR)+' <button class="applybtn" onclick="laborCalc(false)">Try again</button></div>'
        : labLive(R).rows.length ? '<div style="color:var(--mut);font-size:13px"><span class="spin"></span> Working out shop hours…</div>'
        : '<div style="color:var(--mut);font-size:13px">No quantified rows to estimate labor from.</div>')+'</div></div>';
    }
    const S=L.server||{}, bp=S.ballpark||{}, types=S.job_types||{};
    const job=labJob(L), stale=L.sig!==labSig(R);
    const bucketOpts=function(sel){ return Object.keys(LAB_BUCKET).map(function(b){ return '<option value="'+b+'"'+(b===sel?' selected':'')+'>'+LAB_BUCKET[b]+'</option>'; }).join(""); };
    const ball = bp.hours!=null
      ? 'Your '+esc(types[bp.type]||bp.type)+' jobs: <b>'+labFmt(bp.hr_per_ton,1)+' hr/ton</b> × '+labFmt(S.tons,2)+' t = <b>'+labFmt(bp.hours,0)+' hrs</b>'+
        ' <span class="src">('+bp.jobs+' reference job'+(bp.jobs===1?'':'s')+')</span> <button class="applybtn" onclick="laborJob('+bp.hours+')">Use as job total</button>'
      : 'No ballpark: '+esc(bp.reason||'')+'. '+setupLink+' — add a finished job of this type and it shows here.';
    const rows=L.components.map(function(c,ci){
      const tot=labComp(c), miss=arr(c.missing);
      let h='<tr class="grp-comp'+(c.held?' lab-held':'')+'"><td colspan="2">'+
        '<input class="lab-in txt" style="font-weight:700;background:transparent;border-color:transparent;width:auto;min-width:160px" value="'+escAttr(c.name)+'" onchange="laborCompName('+ci+',this.value)">'+
        (c.units>1?' <span class="grp-units">× '+c.units+' units</span>':'')+
        (c.tons?' <span class="grp-meta">'+labFmt(c.tons,2)+' t</span>':'')+'</td>'+
        '<td style="text-align:right"><input class="lab-in" value="'+labFmt(tot,1)+'" onchange="laborComp('+ci+',this.value)" title="Change this and the items below scale with it"></td>'+
        '<td style="white-space:nowrap;font-size:12px"><label title="Hold keeps this component fixed when the job total changes"><input type="checkbox"'+(c.held?' checked':'')+' onchange="laborHold('+ci+',this.checked)"> Hold</label></td></tr>';
      h+=arr(c.items).map(function(it,ii){
        const what = it.entered
          ? '<input class="lab-in txt" placeholder="what the work is" value="'+escAttr(it.what)+'" onchange="laborItemText('+ci+','+ii+',\'what\',this.value)">'
          : esc(it.what)+' <span class="src" title="'+escAttr(it.source_ref||"")+'">'+esc(it.standard||"")+'</span>'+
            (it.derived?' <span class="src" style="color:var(--ylw);font-weight:600" title="'+escAttr(it.note||"")+'">≈ derived</span>':'')+
            (it.auto!=null && Math.abs((Number(it.hours)||0)-it.auto)>0.005?' <span class="src">(standard '+labFmt(it.auto,2)+')</span>':'');
        const bucket = it.entered
          ? '<select style="font-size:12px;padding:2px 4px;border:1px solid #dfe5ec;border-radius:5px" onchange="laborItemText('+ci+','+ii+',\'bucket\',this.value)">'+bucketOpts(it.bucket)+'</select>'
          : esc(LAB_BUCKET[it.bucket]||it.bucket);
        return '<tr class="lab-item"><td>'+what+'</td><td class="n">'+bucket+'</td>'+
          '<td style="text-align:right"><input class="lab-in" value="'+labFmt(it.hours,2)+'" onchange="laborItem('+ci+','+ii+',this.value)"></td>'+
          '<td><button class="applybtn" style="background:#9aa6b2;padding:1px 7px" title="Remove this line" onclick="laborDelItem('+ci+','+ii+')">✕</button></td></tr>';
      }).join("");
      h+='<tr class="lab-item"><td colspan="4"><span class="pillbtn" style="margin-left:0" onclick="laborAddItem('+ci+')">+ add work</span>'+
        (miss.length?' <details style="display:inline-block;margin-left:10px;font-size:12px"><summary style="font-weight:600;color:var(--ylw)">'+miss.length+' not estimated — add hours for these</summary><ul>'+
          miss.map(function(m){ return '<li>'+esc(m.what)+' — <span class="src">'+esc(m.reason)+'</span></li>'; }).join("")+'</ul></details>':'')+
        '</td></tr>';
      return h;
    }).join("");
    return head+
      (stale?'<div class="lab-stale">The BOM has changed since these hours were worked out. <button class="applybtn" onclick="laborCalc(true)">Recalculate</button></div>':'')+
      (LAB_ERR?'<div style="color:var(--red);font-size:12.5px;margin-bottom:8px">'+esc(LAB_ERR)+'</div>':'')+
      '<div class="lab-top">'+
        '<div><label>Job total, hrs</label><input class="lab-in big" value="'+labFmt(job,1)+'" onchange="laborJob(this.value)" title="Change this and every component not on Hold scales with it"></div>'+
        '<div><label>Job type</label><select onchange="laborJobType(this.value)">'+
          Object.keys(types).map(function(k){ return '<option value="'+k+'"'+(k===L.job_type?' selected':'')+'>'+esc(types[k])+'</option>'; }).join("")+'</select></div>'+
        '<div class="lab-ball" style="flex:1;min-width:260px">'+ball+'</div>'+
      '</div>'+
      // Hours per bucket across every item on the job — the same 8 buckets the project's labor rows carry.
      (function(){
        const tot={}; Object.keys(LAB_BUCKET).forEach(function(b){ tot[b]=0; });
        L.components.forEach(function(c){ arr(c.items).forEach(function(i){ if(tot[i.bucket]!=null) tot[i.bucket]+=Number(i.hours)||0; }); });
        return '<div class="lab-bk" id="labBuckets">'+Object.keys(LAB_BUCKET).map(function(b){
          return '<span class="'+(tot[b]>0.005?'':'zero')+'">'+LAB_BUCKET[b]+'<b>'+labFmt(tot[b],1)+'</b></span>'; }).join("")+'</div>';
      })()+
      '<div class="src" style="margin:-4px 0 10px;font-size:12px">From the standards: <b>'+labFmt(S.bottom_up,1)+' hrs</b> — this only prices what the take-off could count, so it runs low; '+
        'each component lists what it could not estimate. '+(S.unweighed_rows?S.unweighed_rows+' row'+(S.unweighed_rows===1?' has':'s have')+' no weight, so the tonnage is short. ':'')+
        'Your own numbers matter most: '+setupLink+'</div>'+
      '<table><thead><tr><th>Work</th><th>Bucket</th><th style="text-align:right">Hours</th><th></th></tr></thead><tbody>'+
        (rows||'<tr><td colspan="4" style="color:var(--mut)">Nothing on this take-off carries shop hours.</td></tr>')+'</tbody></table>'+
      '<div style="margin-top:10px;font-size:12px"><span class="pillbtn" style="margin-left:0" onclick="laborAddComp()">+ add a component</span>'+
        ' <span class="pillbtn" onclick="laborCalc(true)">↻ recalculate from standards</span></div>'+
      '</div></div>';
  }

  // ---- Tabs ---------------------------------------------------------------------------------
  // The review used to be one long column. Now one area at a time; the header and the dock
  // (chat + Approve) stay. Switching only shows and hides panes — no re-render — so the BOM
  // editor iframe, a half-typed edit and every id other code looks up survive a tab change.
  // The chosen tab is remembered per project for this browser tab.
  const TABS=[["overview","Overview"],["checks","Checks"],["drawings","By drawing"],["addenda","Addenda"],["material","Material"],["fittings","Fittings"],["labor","Labor"],["ai","Ask the AI"]];
  function tabKey(){ return "mc_review_tab_"+(params.project_id||"sample"); }
  let TAB=(function(){ try{ return sessionStorage.getItem(tabKey())||"overview"; }catch(e){ return "overview"; } })();
  function setTab(t){
    if(!TABS.some(function(x){ return x[0]===t; })) t="overview";
    TAB=t; try{ sessionStorage.setItem(tabKey(),t); }catch(e){}
    applyTab();
  }
  function applyTab(){
    document.querySelectorAll(".tabpane").forEach(function(p){ p.classList.toggle("on", p.getAttribute("data-tab")===TAB); });
    document.querySelectorAll(".tabs button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-tab")===TAB); });
    if(TAB==="ai") scrollChatToBottom();
  }
  function tabStripHtml(R, fab, gaps, conflicts){
    const open=DECISIONS.filter(function(d){ return d.sel==null; }).length+arr(gaps).length+arr(conflicts).length;
    let probs=0; try{ probs=materialProblems(arr(R.rows)).length; }catch(e){}
    let fprobs=0; try{ fprobs=fittingProblems(arr(R.fittings)).length; }catch(e){}
    const L=R.labor, hrs=L&&arr(L.components).length?labJob(L):null;
    const chat=arr(R.chat).filter(function(m){ return m.role==="user"; }).length;
    const badge={
      overview: open?['warn',open]:null,
      checks: probs?['bad',probs]:null,
      drawings: drawingScopeList(R).length?['',drawingScopeList(R).length]:null,
      addenda: arr(R.superseded).length?[(R.addenda?'':'warn'),arr(R.superseded).length]:null,
      material: ['',arr(fab).length],
      fittings: arr(R.fittings).length?[fprobs?'bad':'',arr(R.fittings).length]:null,
      labor: hrs!=null?['',labFmt(hrs,0)+' h']:null,
      ai: chat?['',chat]:null,
    };
    return '<div class="tabs" role="tablist">'+TABS.map(function(t){
      const b=badge[t[0]];
      return '<button role="tab" data-tab="'+t[0]+'" class="'+(t[0]===TAB?'on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+
        (b?' <span class="tbadge '+b[0]+'">'+esc(b[1])+'</span>':'')+'</button>';
    }).join("")+'</div>';
  }

  // ---- BY DRAWING — what each sheet puts in, and leaves out of, the fabricator's scope ----------
  // The AI's per-sheet read (synopsis.drawing_scope), plus what the BOM actually took off each sheet,
  // counted here rather than asked for. A sheet with BOM rows but no AI entry still gets listed.
  const _sk=function(s){ return String(s==null?"":s).toUpperCase().replace(/[^A-Z0-9]/g,""); };
  function sameSheet(a,b){ a=_sk(a); b=_sk(b); return !!a && !!b && (a===b || a.endsWith(b) || b.endsWith(a)); }
  function drawingScopeList(R){
    const ds=arr((R.synopsis||{}).drawing_scope).filter(function(d){ return d && d.sheet; }).map(function(d){ return Object.assign({},d); });
    arr(R.rows).forEach(function(r){
      if(!r.source_sheet || r.deleted) return;
      if(!ds.some(function(d){ return sameSheet(d.sheet,r.source_sheet); })) ds.push({sheet:r.source_sheet,title:"",included:[],excluded:[],fromRows:true});
    });
    return ds;
  }
  function drawingScopeHtml(R){
    const ds=drawingScopeList(R);
    if(!ds.length) return '<div class="card"><div class="body" style="color:var(--mut);font-size:13px">'+
      'No per-drawing scope on this take-off — take-offs run from today on include it.</div></div>';
    return '<div class="card"><h2>📐 Scope by drawing <span class="lt">— what each sheet puts in your scope, and what it leaves to others</span></h2><div class="body">'+
      ds.map(function(d){
        const rows=arr(R.rows).filter(function(r){ return !r.deleted && (Number(r.quantity)||0)>0 && sameSheet(r.source_sheet,d.sheet); });
        const lf=rows.reduce(function(s,r){ return s+(Number(r.quantity_total||r.quantity)||0)*(Number(r.length_ft)||0); },0);
        const inc=arr(d.included), exc=arr(d.excluded);
        return '<div class="dscope"><div class="dsh"><b>'+esc(d.sheet)+'</b>'+(d.title?' — '+esc(d.title):'')+
            ' <span class="src">· '+rows.length+' BOM row'+(rows.length===1?'':'s')+(lf>0?' · ~'+Math.round(lf).toLocaleString()+' LF':'')+'</span></div>'+
          (inc.length?'<div class="dsin">✓ <b>Included:</b> '+inc.map(esc).join(' · ')+'</div>':'')+
          (exc.length?'<div class="dsout">✕ <b>Not included:</b> '+exc.map(function(x){ return esc(x.item||"")+(x.by?' <span class="src">('+esc(x.by)+')</span>':''); }).join(' · ')+'</div>':'')+
          (d.notes?'<div class="src">'+esc(d.notes)+'</div>':'')+
          (!inc.length&&!exc.length&&d.fromRows?'<div class="src">BOM rows cite this sheet; the AI gave no scope summary for it.</div>':'')+
        '</div>';
      }).join("")+'</div></div>';
  }

  // ---- ADDENDA — what each reissue changed, and what it does to the quote --------------------
  // The take-off screen set aside every sheet a newer addendum replaced, and that list rode along
  // with the run (R.superseded). Comparing is a separate, paid read, so it waits for the button.
  let ADDENDA_BUSY=false;
  function addendaHtml(R){
    const sup=arr(R.superseded), notes=arr(R.addendum_notices), A=R.addenda||null;
    if(!sup.length && !notes.length) return '<div class="card"><div class="body" style="font-size:13px">'+
      '<div style="color:var(--mut);margin-bottom:8px">No addenda recorded with this take-off. When a sheet and its addendum '+
      'reissue are both uploaded, the take-off screen sets the original aside and they can be compared here.</div>'+
      (params.project_id?'<button class="applybtn" onclick="findAddenda()">🔎 Look for addenda in this project\'s files</button>':'')+
      '</div></div>';
    const issues={};
    sup.forEach(function(p){ (issues[p.issue||"Addendum"]=issues[p.issue||"Addendum"]||[]).push(p); });
    const est=(sup.length*0.03+0.05).toFixed(2);
    const resFor=function(sheet){ return A?arr(A.sheets).find(function(x){ return sameSheet(x.sheet,sheet); }):null; };
    const badge=function(i){ return i==="major"?'<span class="tbadge bad">major</span>':i==="minor"?'<span class="tbadge warn">minor</span>':i==="none"?'<span class="tbadge">no steel change</span>':''; };
    return '<div class="card"><h2>📑 Addenda <span class="lt">— what each reissue changed, and what it does to the quote</span></h2><div class="body">'+
      '<div style="margin:0 0 10px"><button class="applybtn" '+(ADDENDA_BUSY?'disabled ':'')+'onclick="runAddenda()">'+
        (ADDENDA_BUSY?'<span class="spin"></span> Comparing…':(A?'↻ Compare again':'🔍 Compare originals with their reissues'))+'</button>'+
        ' <span class="src">reads '+sup.length+' sheet pair'+(sup.length===1?'':'s')+(notes.length?' + '+notes.length+' notice'+(notes.length===1?'':'s'):'')+
        ' · about $'+est+(A&&A.at?' · last compared '+esc(String(A.at).slice(0,16).replace("T"," ")):'')+'</span></div>'+
      (A&&A.overall?'<div class="aovr"><b>Net effect on the quote:</b> '+esc(A.overall)+'</div>':'')+
      Object.keys(issues).map(function(iss){
        return '<div class="adgrp"><div class="qnh">'+esc(iss)+' <span class="src">· '+issues[iss].length+' sheet'+(issues[iss].length===1?'':'s')+' reissued</span></div>'+
          issues[iss].map(function(p){
            const r=resFor(p.sheet);
            return '<div class="adrow"><div><b>'+esc(p.sheet)+'</b> '+(r?badge(r.impact):'')+
                ' <span class="src">'+esc((p.old||{}).name||"")+' → '+esc((p.new||{}).name||"")+'</span></div>'+
              (r&&r.summary?'<div>'+esc(r.summary)+'</div>':'')+
              (r&&arr(r.changes).length?'<ul class="adch">'+arr(r.changes).map(function(c){
                return '<li><b>'+esc(c.change||"")+'</b> '+esc(c.what||"")+(c.location?' <span class="src">@ '+esc(c.location)+'</span>':'')+
                  (c.quantity&&c.quantity!=="n/a"?' · '+esc(c.quantity):'')+(c.quote_effect?' → <i>'+esc(c.quote_effect)+'</i>':'')+'</li>';
              }).join("")+'</ul>':'')+
            '</div>';
          }).join("")+'</div>';
      }).join("")+
      (A&&arr(A.notices).length?'<div class="adgrp"><div class="qnh">Addendum notices</div>'+arr(A.notices).map(function(n){
        return '<div class="adrow"><b>'+esc(n.name||"")+'</b>'+(arr(n.items).length?'<ul class="adch">'+arr(n.items).map(function(t){ return '<li>'+esc(t)+'</li>'; }).join("")+'</ul>':' <span class="src">nothing for steel</span>')+'</div>';
      }).join("")+'</div>':'')+
      (A&&arr(A.missing).length?'<div class="src">Not in the project\'s file store, so not compared: '+esc(A.missing.join(", "))+'</div>':'')+
    '</div></div>';
  }
  // A take-off run before addenda were recorded (or one whose files were added later): pair each
  // stored sheet with its addendum reissue by sheet number, the same rule the take-off screen uses.
  function _sheetId(name){ const m=String(name||"").replace(/\.[a-z0-9]+$/i,"").match(/\b([A-Z]{1,2}-?\d{3}[A-Z]?(?:\.\d{1,2})?)\b/i); return m?m[1].toUpperCase().replace(/-/g,""):""; }
  function _issueNo(name){ const s=String(name||""); const m=s.match(/\badd(?:endum|end)?\.?\s*(?:no\.?\s*)?#?\s*(\d+)/i)||s.match(/\b(?:bulletin|asi|rev(?:ision)?)\.?\s*#?\s*(\d+)/i); return m?Number(m[1])||1:0; }
  function _issueLabel(name){ const s=String(name||""); let m=s.match(/\badd(?:endum|end)?\.?\s*(?:no\.?\s*)?#?\s*(\d+)/i); if(m) return "Addendum "+m[1];
    m=s.match(/\b(bulletin|asi|rev(?:ision)?)\.?\s*#?\s*(\d+)/i); return m?(m[1].toLowerCase()==="asi"?"ASI":m[1].charAt(0).toUpperCase()+m[1].slice(1).toLowerCase())+" "+m[2]:"Addendum"; }
  async function findAddenda(){
    try{
      const l=await (await fetch(RAILWAY_URL+"/api/files/project/"+encodeURIComponent(params.project_id))).json();
      const files=arr(l&&l.files).filter(function(f){ return /\.pdf$/i.test(f.name||"")||/pdf/i.test(f.media_type||""); });
      const byId={};
      files.forEach(function(f){ const id=_sheetId(f.name); if(id) (byId[id]=byId[id]||[]).push(f); });
      const pairs=[];
      Object.keys(byId).forEach(function(id){
        const g=byId[id]; if(g.length<2) return;
        const top=Math.max.apply(null,g.map(function(f){ return _issueNo(f.name); })); if(!top) return;
        const nw=g.find(function(f){ return _issueNo(f.name)===top; });
        g.forEach(function(f){ if(f!==nw && _issueNo(f.name)<top) pairs.push({sheet:id,issue:_issueLabel(nw.name),
          old:{name:f.name,file_id:f.id},new:{name:nw.name,file_id:nw.id}}); });
      });
      const notices=files.filter(function(f){ return /addend|bulletin/i.test(f.name) && !_sheetId(f.name); }).map(function(f){ return {name:f.name,file_id:f.id}; });
      if(!pairs.length && !notices.length){ mcAlert("No addendum reissues found among this project's "+files.length+" stored files.",{title:"Addenda"}); return; }
      const R=loadResult(); R.superseded=pairs; R.addendum_notices=notices; syncQuoteNotes(R); saveResult(R); render();
    }catch(e){ mcAlert("Couldn't read the project's files: "+e.message,{title:"Addenda"}); }
  }
  function compactBom(R){
    return arr(R.rows).filter(function(r){ return !r.deleted; }).slice(0,300).map(function(r){
      return [r.source_sheet||"",r.member_mark||"",r.form_type||"",r.size||"",(r.quantity_total||r.quantity||0)+" pcs",(r.length_ft||"")+" ft"].join(" | ");
    }).join("\n");
  }
  async function runAddenda(){
    if(ADDENDA_BUSY) return;
    const R=loadResult();
    ADDENDA_BUSY=true; render();
    try{
      const r=await fetch(RAILWAY_URL+"/api/takeoff/addenda",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({project_id:params.project_id, pairs:arr(R.superseded), notices:arr(R.addendum_notices), bom:compactBom(R)})});
      const d=await r.json();
      if(!d.ok) throw new Error(d.error||("HTTP "+r.status));
      const R2=loadResult(); R2.addenda={sheets:d.sheets,notices:d.notices,overall:d.overall,missing:d.missing,cost_usd:d.cost_usd,at:d.at};
      syncQuoteNotes(R2); saveResult(R2);
    }catch(e){ mcAlert("Couldn't compare the addenda: "+e.message,{title:"Addenda"}); }
    ADDENDA_BUSY=false; render();
  }

  function fittingsCardHtml(list){
    const f = arr(list);
    if(!f.length) return "";
    const anyMulti = f.some(function(x){ return (Number(x.units)||1) > 1; });
    const tot = function(x){ const t=Number(x.quantity_total);
      return (Number.isFinite(t)&&t>0)?t:(Number(x.quantity)||0)*Math.max(1,Number(x.units)||1); };
    const TD='padding:4px 8px;border-bottom:1px solid #eceff3;font-size:12.5px;vertical-align:top';
    // Carry each fitting's ORIGINAL index through the sort. The table is displayed grouped by
    // component, so a display position is not a position in R.fittings — editing by the wrong
    // one would silently change a different fitting.
    // Grouped by component, then by the order they came in — NOT by fitting type.
    // Sorting on an EDITABLE field means the row you just changed jumps somewhere else
    // mid-edit, because every change re-renders and re-sorts. Component is display-only
    // in this table, so this order holds still while you work down it.
    const rows = f.map(function(x,i){ return {x:x,i:i}; })
      .sort(function(a,b){
        return String(a.x.component||"").localeCompare(String(b.x.component||"")) ||
               (a.i - b.i); })
      .map(function(p){
        const x=p.x, i=p.i;
        const c=Number(x.confidence)||0;
        const inp=function(field,val,w){
          return '<input class="fin" style="width:'+w+'" value="'+escAttr(val==null?'':val)+'" '+
            'onchange="fitEdit('+i+',\''+field+'\',this.value)">'; };
        // A picker bound to a real catalog table. The current value is kept as an option even
        // when the catalog has no such row, so an AI answer is never silently replaced — it
        // shows as "✗ <value>" and has to be dealt with.
        const sel=function(field,val,list,w){
          if(!list) return inp(field,val,w);
          const v=String(val==null?"":val).trim();
          const known=list.some(function(o){ return o.name===v; });
          let h='<select class="fin'+(v&&!known?' bad':'')+'" style="width:'+w+'" '+
            'onchange="fitPick('+i+',\''+field+'\',this.value)">';
          h+='<option value=""'+(v?'':' selected')+'>—</option>';
          if(v&&!known) h+='<option value="'+escAttr(v)+'" selected>✗ '+esc(v)+'</option>';
          list.forEach(function(o){
            h+='<option value="'+escAttr(o.name)+'"'+(o.name===v?' selected':'')+'>'+esc(o.name)+'</option>'; });
          return h+'</select>'; };
        const typeId=FITCAT?fitIdOf(FITCAT.types,x.fitting_type):"";
        const makeId=FITCAT?fitIdOf(FITCAT.makes,x.fitting_make):"";
        return '<tr><td style="'+TD+'" title="'+confWhy(x,c)+'"><span class="dot d-'+confClass(c)+'"></span>'+c.toFixed(2)+'</td>'+
          // The columns run in the order the choices actually depend on each other:
          // type -> make -> end -> connection -> spec -> description. The description
          // is narrowed by all five, so it belongs LAST. It used to sit second, which
          // asked for the answer before any of the questions.
          '<td style="'+TD+'">'+sel('fitting_type',x.fitting_type,FITCAT&&FITCAT.types,'104px')+'</td>'+
          '<td style="'+TD+'">'+sel('fitting_make',x.fitting_make,FITCAT&&FITCAT.makes,'132px')+'</td>'+
          // End type and connection belong to the fitting TYPE, so they narrow to it.
          '<td style="'+TD+'">'+sel('end_type',x.end_type,FITCAT&&fitChildren(FITCAT.ends,'typeId',typeId),'116px')+
            sel('connection_type',x.connection_type,FITCAT&&fitChildren(FITCAT.connections,'typeId',typeId),'110px')+'</td>'+
          // Specification belongs to the MAKE, and needs the room: every value reads
          // "A105 | ASTM A105", so at 116px they all truncated to "A105 | ASTM A1" and
          // A105 was indistinguishable from A182.
          '<td style="'+TD+'">'+sel('specification',x.specification,FITCAT&&fitChildren(FITCAT.specs,'makeId',makeId),'200px')+'</td>'+
          // Last, because it is the one narrowed by everything to its left — and the
          // only one that carries a weight.
          '<td style="'+TD+'">'+detailCell(x,i)+'</td>'+
          '<td style="'+TD+'"><input class="fin" type="number" min="0" step="1" style="width:56px" value="'+
            (Number(x.quantity)||0)+'" onchange="fitEdit('+i+',\'quantity\',this.value)">'+
            (Number(x.units)>1?' <span class="src">×'+x.units+' = <b>'+tot(x)+'</b></span>':'')+'</td>'+
          '<td style="'+TD+'"><span class="src">'+esc(x.component||'')+(x.source_sheet?' · '+esc(x.source_sheet):'')+
            (x.note?'<br>'+esc(x.note):'')+'</span></td>'+
          '<td style="'+TD+'"><button class="applybtn" style="background:#9aa6b2;padding:1px 7px" '+
            'onclick="fitDelete('+i+')" title="Remove this fitting">✕</button></td></tr>'+
          // The explanation spans the whole row rather than being squeezed into the size
          // column. Nine columns, so colspan 9.
          (function(){ const n=fitRowNote(x); if(!n) return '';
            const col = n.tone==='bad' ? 'var(--red)' : '#9a6400';
            const bg  = n.tone==='bad' ? '#fff5f5' : '#fffaf0';
            return '<tr><td colspan="9" style="padding:3px 8px 7px 34px;border-bottom:1px solid #eceff3;'+
              'font-size:12px;color:'+col+';background:'+bg+'">'+n.html+'</td></tr>'; })();
      }).join("");
    return '<div class="card"><h2>⌇ Pipe fittings <span class="lt">— '+f.length+' item'+(f.length===1?'':'s')+
        ', quoted separately from the BOM</span></h2><div class="body" style="padding:0">'+
      '<table><thead><tr><th>Conf</th><th>Type</th><th>Make</th><th>End · connection</th>'+
      '<th>Specification</th><th>Size · class · weight</th>'+
      '<th>'+(anyMulti?'Qty / unit':'Qty')+'</th><th>Where</th><th></th></tr></thead><tbody>'+
      rows+'</tbody></table>'+
      '<div style="padding:10px 18px;font-size:12px;color:var(--mut)">'+
      '<button class="applybtn" onclick="fitAdd()">+ Add a fitting</button> '+
      (FITCAT
        ? 'Work left to right — each column narrows the next. End types and connections narrow to the '+
          '<b>type</b>, specifications narrow to the <b>make</b>, and <b>size · class</b> narrows to all of '+
          'them, which is why it comes last. It is one choice rather than two boxes: it picks the actual '+
          'catalog row and the weight comes with it. A row left unpicked is <b>not</b> dropped — it still '+
          'reaches the project and still quotes, but with no catalog weight behind it, so the job '+
          'totals will read light. Anything marked <b style="color:var(--red)">✗</b> is a word the '+
          'catalog does not know; pick a real one, or it cannot be tied to a record at all.'
        : FITCAT_ERR
          ? '<b style="color:#9a6400">These are free-text boxes right now:</b> '+esc(FITCAT_ERR)+
            ' Until the catalog loads, nothing typed here can be tied to a catalog record.'
          : 'Loading your fittings catalog…')+
      ' These are <b>not</b> in the BOM or its CSV: fittings are bought complete and roll up separately '+
      'on the component.</div>'+
      '</div></div>';
  }

  // NB these inputs use escAttr (line ~207), not esc. A fitting value is full of quotes —
  // 1/2", 2" x 1/2" x 1/2" — and esc() only handles "<", so the raw quote would end the value=
  // attribute and truncate the field. Same trap that killed the decision buttons.
