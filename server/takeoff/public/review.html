<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Take-off — Project Review</title>
<!-- Zoho Creator widget SDK — verified from match-hub-widget (do not change). -->
<script src="https://js.zohostatic.com/creator/widgets/version/1.0/widgetsdk-min.js"></script>
<!--
  LIVE approval page (build 3b). Renders a real take-off result {rows, import_csv, synopsis}.
  Data source, in order: window.TAKEOFF_RESULT  →  sessionStorage 'takeoff_result'
  (set by the upload widget)  →  built-in SAMPLE (so it opens standalone for design review).
  Approve & Submit commits the BOM via submitToZoho (3a); other section-writes are WIRE-stubbed.
-->
<style>
  :root{
    --blue:#5F94CE; --ink:#1f2a37; --mut:#667; --line:#e3e6ea;
    --grn:#2e7d32; --grnbg:#e8f5e9; --ylw:#b45309; --ylwbg:#fff7ed;
    --red:#b91c1c; --redbg:#fdeeee;
  }
  *{box-sizing:border-box;}
  body{font-family:'Segoe UI',system-ui,sans-serif;margin:0;padding:24px;background:#eef1f5;color:var(--ink);}
  .wrap{max-width:1100px;margin:0 auto;}
  .appbar{max-width:1100px;margin:0 auto 14px;display:flex;align-items:center;gap:10px;padding:2px;}
  .appbar .brand{font-weight:800;font-size:16px;color:var(--blue);letter-spacing:.2px;}
  .appbar .page{font-size:13px;color:var(--mut);border-left:1px solid var(--line);padding-left:10px;}
  .applybtn{font-size:11px;color:#fff;background:var(--blue);border:0;border-radius:5px;padding:2px 9px;cursor:pointer;margin-left:4px;}
  /* Material check — rows that can't resolve against the shop's catalog */
  .matrow{border-top:1px solid #f2e4e4;padding:9px 0;font-size:13px;}
  .matrow:first-of-type{border-top:0;}
  .matquick{margin-top:5px;font-size:12px;color:var(--mut);}
  .matquick select{font-size:12px;padding:3px 6px;border:1px solid #cdd3da;border-radius:5px;max-width:260px;}
  .applybtn:hover{opacity:.9;}
  .applybtn:disabled{opacity:.5;cursor:default;}
  .busy{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--blue);color:#fff;text-align:center;
        padding:11px;font-size:14px;font-weight:600;display:none;box-shadow:0 2px 10px rgba(0,0,0,.18);}
  .busy.show{display:block;}
  .busy.err{background:var(--red);}
  .busy.ok{background:var(--grn);}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:14px;overflow:hidden;}
  .card h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0;padding:13px 18px;border-bottom:1px solid var(--line);background:#fafbfc;}
  .card h2 .lt{text-transform:none;letter-spacing:0;font-weight:400;color:var(--mut);}
  .card .body{padding:16px 18px;}
  .hero{background:linear-gradient(180deg,#fff,#f7f9fc);} .hero .body{padding:20px 18px;}
  .hero h1{margin:0 0 4px;font-size:20px;} .hero .type{color:var(--mut);font-size:13px;margin-bottom:14px;}
  .meta{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 11px;color:#334;}
  .conf{float:right;font-weight:700;font-size:13px;padding:5px 12px;border-radius:20px;}
  .c-hi{background:var(--grnbg);color:var(--grn);} .c-md{background:var(--ylwbg);color:var(--ylw);} .c-lo{background:var(--redbg);color:var(--red);}
  .stream{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed #eef1f4;} .stream:last-child{border-bottom:0;}
  .stream .tag{flex:0 0 92px;font-weight:600;font-size:12px;}
  .tag.fab{color:var(--blue);} .tag.buy{color:var(--ylw);} .tag.oth{color:var(--mut);} .tag.snd{color:var(--grn);}
  .stream .items{font-size:13px;color:#2b3340;}
  .dec{padding:12px 0;border-bottom:1px dashed #eef1f4;} .dec:last-child{border-bottom:0;}
  .dec .q{font-size:14px;font-weight:600;margin-bottom:2px;} .dec .why{font-size:12px;color:var(--mut);margin-bottom:8px;}
  .opts{display:flex;gap:8px;flex-wrap:wrap;}
  .opt{font-size:13px;border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer;background:#fff;user-select:none;transition:.12s;}
  .opt:hover{border-color:var(--blue);} .opt.sel{background:var(--blue);color:#fff;border-color:var(--blue);}
  .opt.rec::after{content:" ★";color:#f2c14e;font-size:11px;} .opt.sel.rec::after{color:#fff;}
  .undec{box-shadow:inset 3px 0 0 var(--ylw);padding-left:10px;border-radius:3px;}
  .decnote{font-size:12px;color:var(--ylw);margin-top:6px;}
  .twoup{display:grid;grid-template-columns:1fr 1fr;gap:14px;} @media(max-width:640px){.twoup{grid-template-columns:1fr;}}
  details{font-size:13px;} details summary{cursor:pointer;font-weight:600;padding:4px 0;}
  details ul{margin:6px 0 0;padding-left:18px;color:#2b3340;} details li{margin:4px 0;}
  .src{color:var(--mut);font-size:11px;}
  .comp{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin-bottom:8px;} .comp .ok{color:var(--grn);font-weight:700;white-space:nowrap;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line);}
  td{padding:7px 8px;border-bottom:1px solid #f1f3f5;}
  tr.lo td{background:var(--redbg);} tr.md td{background:var(--ylwbg);}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
  .d-hi{background:var(--grn);} .d-md{background:var(--ylw);} .d-lo{background:var(--red);}
  .galv{font-size:10px;background:#eef6ee;color:var(--grn);border-radius:4px;padding:1px 5px;}
  tr.grp-comp td{background:#eef2f7;color:#1f3a5f;font-weight:700;font-size:13px;padding:9px 12px;border-top:2px solid #cdd8e6;border-bottom:1px solid #d7e0ec;}
  .grp-units{background:#dbe8f7;color:#2c5c96;border-radius:9px;padding:1px 7px;font-size:11px;font-weight:700;margin-left:4px;}
  tr.grp-draw td{background:#f7f9fb;color:#46566b;font-weight:600;font-size:12px;padding:5px 12px 5px 24px;border-bottom:1px solid #eef1f4;}
  .grp-meta{font-weight:500;color:#8493a4;font-size:11px;margin-left:8px;}
  .pillbtn{font-size:11px;color:var(--blue);border:1px solid #cfe0f2;background:#f3f8fd;border-radius:5px;padding:1px 7px;margin-left:6px;cursor:pointer;}
  .ai{display:flex;gap:8px;} .ai input{flex:1;padding:10px 12px;border:1px solid #cdd3da;border-radius:8px;font-size:13px;}
  .achip{display:inline-flex;align-items:center;gap:6px;font-size:11px;background:#eef4fb;border:1px solid #cfe0f2;color:#2b4a6f;border-radius:6px;padding:3px 8px;}
  .achip b{cursor:pointer;color:#c0392b;font-weight:700;}
  .btn{border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:13px;}
  .btn.ghost{background:#fff;border:1px solid var(--blue);color:var(--blue);} .btn.go{background:var(--blue);color:#fff;} .btn.go:disabled{opacity:.45;cursor:not-allowed;}
  .bar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -2px 8px rgba(0,0,0,.05);}
  .bar .left{font-size:13px;color:var(--mut);} .bar .left b{color:var(--ink);}
  /* conversational Tell-the-AI */
  .chatthread{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto;padding-right:4px;}
  .chathint{color:var(--mut);font-size:13px;line-height:1.5;}
  .cmsg{display:flex;} .cmsg.u{justify-content:flex-end;}
  .cmsg .bub{max-width:82%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word;}
  .cmsg.u .bub{background:var(--blue);color:#fff;border-bottom-right-radius:4px;}
  .cmsg.ai .bub{background:#eef2f7;color:#1f2c3d;border-bottom-left-radius:4px;}
  .cmsg.ai.pending .bub{color:var(--mut);font-style:italic;}
  .cmsg.err .bub{background:var(--redbg);color:var(--red);}
  .cedit{display:block;margin-top:5px;font-size:11px;color:var(--grn);font-weight:600;}
  .cfiles{margin-top:4px;font-size:11px;opacity:.85;}
  .footerdock{position:sticky;bottom:0;z-index:6;display:flex;flex-direction:column;gap:8px;padding-top:8px;background:linear-gradient(to bottom, rgba(238,241,245,0) 0%, #eef1f5 22%);}
  .chatdock{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 -2px 8px rgba(0,0,0,.05);}
  .chatdock .ai{display:flex;gap:8px;align-items:center;}
  .chatdock .ai input{flex:1;padding:10px 12px;border:1px solid #cdd3da;border-radius:8px;font-size:13px;}
  .chatdock .iconbtn{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:8px;padding:9px 11px;font-size:14px;cursor:pointer;line-height:1;}
  .achips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .balchip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--grn);background:var(--grnbg);border:1px solid #bfe3c4;border-radius:8px;padding:7px 11px;}
  .balchip .balsub{font-weight:500;color:#5b8a5e;font-size:11px;}
  .scopearea{flex:1;min-width:0;min-height:80px;padding:9px 12px;border:1px solid #cdd3da;border-radius:8px;font-family:'Segoe UI',system-ui,sans-serif;font-size:12.5px;line-height:1.55;resize:vertical;}
  .commit{margin-top:10px;font-size:13px;background:var(--grnbg);border:1px solid #bfe3c4;border-radius:8px;padding:12px 14px;display:none;} .commit ul{margin:8px 0 0;padding-left:18px;}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #cdd3da;border-top-color:var(--blue);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px;} @keyframes s{to{transform:rotate(360deg);}}
  .foot{text-align:center;color:#9aa6b2;font-size:11px;margin:6px 0 24px;}
  @media print {
    body{background:#fff;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .wrap,.appbar{max-width:100%;}
    #printBtn,#newRun,.bar,.busy,.commit,#reviseCard,.applybtn,.pillbtn,.footerdock,#chatCard{display:none !important;}
    .card{box-shadow:none;break-inside:avoid;}
    input[type=number]{border:none;padding:0;width:auto;background:transparent;font-size:12.5px;}
  }
</style>
</head>
<body>
<div id="busy" class="busy"></div>
<div class="appbar"><span class="brand">Material Compass</span><span class="page">AI Take-off · Project Review</span><span id="saveInd" style="font-size:11px;color:var(--mut);margin-left:12px"></span>
  <a id="addBtn" href="#" onclick="document.getElementById('addFile').click();return false;" style="margin-left:auto;font-size:12px;color:var(--blue);text-decoration:none;font-weight:600">➕ Add drawings</a>
  <a id="printBtn" href="#" onclick="printAll();return false;" style="margin-left:14px;font-size:12px;color:var(--blue);text-decoration:none;font-weight:600">🖨 Print</a>
  <a id="newRun" href="#" style="margin-left:14px;font-size:12px;color:var(--blue);text-decoration:none;font-weight:600">↻ New take-off</a></div>
<input type="file" id="addFile" accept="application/pdf" multiple style="display:none" onchange="addDrawings(this)">
<div class="wrap" id="wrap"><div class="card"><div class="body">Loading take-off…</div></div></div>

<script>
  // ---- CONFIG (CONFIRM link names — same Z block as index.html) --------------
  // Same-origin when this page is served by the Material Compass backend (/takeoff/review.html);
  // the absolute host is only needed by the GitHub Pages copy.
  const MC_HOST = "https://material-compass-nesting-app-production.up.railway.app";
  const RAILWAY_URL = /(^|\.)up\.railway\.app$|^localhost$/.test(location.hostname) ? "" : MC_HOST;
  const VERSION = "v0.40 · 2026-07-28";  // bump on every push so you can verify what loaded (Pages CDN caches ~10min)
  console.log("Material Compass review.html " + VERSION);
  const Z = {
    APP:"type-formsheet-2-18-21",            // app link name
    IMPORT_FORM:"Import_BOM_Form",           // CSV Import Tool form (addRecord target)
    IMPORT_REPORT:"Import_BOM_Form_Report",  // its report (uploadFile / updateRecord target)
    REVIEW_PAGE:"https://customer.materialcompassportal.com/#Page:BOM_Staging_Review_Page", // staging review (same page the workflow opens)
    MODE_VALUE:"Append",                     // BOM Import Mode choice — Append keeps existing rows (Replace would wipe them)
    F:{project:"Project_ID",mfg:"MFG_Client_Form",mode:"BOM_Import_Mode",file:"BOM_CSV_File",run:"Run_Import"},
  };

  // ---- params (project_id / manufacturer_id) ---------------------------------
  function getParams(){ const q=new URLSearchParams(location.search);
    return { project_id:q.get("project_id"), manufacturer_id:q.get("manufacturer_id") }; }
  let params = getParams();
  if (window.ZOHO && ZOHO.CREATOR && ZOHO.CREATOR.init) {
    ZOHO.CREATOR.init().then(()=>{ try{ const p=ZOHO.CREATOR.UTIL.getQueryParams();
      params={project_id:p.project_id||params.project_id, manufacturer_id:p.manufacturer_id||params.manufacturer_id};}catch(e){} });
  }

  // ---- data source + persistence ---------------------------------------------
  // Results are saved to localStorage keyed by project, so closing & reopening this
  // page (same browser) restores the last take-off instead of losing a paid run.
  function lsKey(){ return params.project_id ? ("mc_takeoff_"+params.project_id) : null; }
  // window + sessionStorage are GLOBAL (not project-keyed) — a result from another project must
  // never be reused here, or you'd open Schutte and see Alden. Every result is tagged __project.
  function sameProj(R){ return !!(R && params.project_id && String(R.__project||"")===String(params.project_id)); }
  function loadResult(){
    if (window.TAKEOFF_RESULT && sameProj(window.TAKEOFF_RESULT)) return window.TAKEOFF_RESULT;
    try { const s=sessionStorage.getItem("takeoff_result"); if(s){ const R=JSON.parse(s); if(sameProj(R)) return R; } } catch(e){}
    try { const k=lsKey(); if(k){ const s=localStorage.getItem(k); if(s) return JSON.parse(s); } } catch(e){}  // localStorage is already project-keyed
    return SAMPLE;
  }
  function saveResult(result){
    if(result && params.project_id) result.__project = params.project_id;  // tag so it can't leak across projects
    window.TAKEOFF_RESULT = result;
    if(result && result.__demo) return;   // never persist demo/sample data (was polluting localStorage)
    try { sessionStorage.setItem("takeoff_result", JSON.stringify(result)); } catch(e){}
    try { const k=lsKey(); if(k) localStorage.setItem(k, JSON.stringify(result)); } catch(e){}
    scheduleZohoSave();   // also persist to the project record in Zoho (debounced)
  }
  // ---- durable save to Zoho (per project), debounced ----
  let _zohoTimer=null;
  function setSaveInd(txt,color){ const el=document.getElementById("saveInd"); if(el){ el.textContent=txt; el.style.color=color||"var(--mut)"; } }
  function scheduleZohoSave(){ if(_zohoTimer) clearTimeout(_zohoTimer); _zohoTimer=setTimeout(doZohoSave, 2500); }
  async function doZohoSave(){
    const R=loadResult();
    if(!R || R.__demo || !params.project_id || !Array.isArray(R.rows) || !R.rows.length) return;
    setSaveInd("saving…","var(--mut)");
    const pkg={ rows:R.rows, synopsis:R.synopsis, notes:R.notes, cost_usd:R.cost_usd };
    try{
      const r=await fetch(RAILWAY_URL+"/api/takeoff/save",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({project_id:params.project_id, package:pkg})});
      const d=await r.json();
      setSaveInd(d.ok?"💾 saved to project":"⚠ save failed", d.ok?"var(--grn)":"var(--red)");
    }catch(e){ setSaveInd("⚠ save failed","var(--red)"); }
  }
  function haveLive(){ try{
    if(window.TAKEOFF_RESULT && sameProj(window.TAKEOFF_RESULT)) return true;
    const s=sessionStorage.getItem("takeoff_result"); if(s && sameProj(JSON.parse(s))) return true;
    const k=lsKey(); if(k && localStorage.getItem(k)) return true;
  }catch(e){} return false; }

  // ---- helpers ---------------------------------------------------------------
  const esc = (s)=>String(s==null?"":s).replace(/</g,"&lt;");
  const escAttr = (s)=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const SCOPE_CATS = [["fabricate","Fabricate","fab"],["buyout","Buyout","buy"],["by_others","By others","oth"],["send_out","Send-out","snd"]];
  const arr = (a)=>Array.isArray(a)?a:[];
  const confClass=(c)=> c>=0.8?"hi":c>=0.5?"md":"lo";
  const confBadge=(c)=> '<span class="conf c-'+confClass(c)+'">'+Math.round((c||0)*100)+'% confident</span>';
  const splitFt=(n)=>{const r=Number(n)||0;const ft=Math.max(0,Math.floor(r));return ft+"'"+Math.round((r-ft)*12)+'"';};
  // decimal feet → feet-inches with fractions (nearest 1/16): 0.8→9-5/8", 24→24'-0", 6.33→6'-3-15/16"
  function fmtFtIn(ftVal){
    let v=Number(ftVal)||0; if(v<0) v=0;
    let feet=Math.floor(v);
    let s=Math.round((v-feet)*192);   // 1/16-inch units in the remaining foot (12*16)
    feet+=Math.floor(s/192); s=s%192;
    let inch=Math.floor(s/16), f16=s%16, frac="";
    if(f16>0){ let n=f16,d=16; while(n%2===0){n/=2;d/=2;} frac=n+"/"+d; }
    const inchStr=(inch>0||frac)?(inch+(frac?("-"+frac):"")+'"'):"";
    if(feet>0&&inchStr) return feet+"'-"+inchStr;
    if(feet>0) return feet+"'-0\"";
    return inchStr||'0"';
  }
  // Plates/sheets carry width×length; linear members carry length only.
  function dimStr(r){ return r.width_ft ? (fmtFtIn(r.width_ft)+" × "+fmtFtIn(r.length_ft)) : fmtFtIn(r.length_ft); }

  let DECISIONS = [];   // working copy with .sel
  let CONFLICTS = [];   // for the per-conflict Apply buttons
  let BOM_EXPANDED = false;  // BOM table: show first 8 vs all + editable
  let SCOPE_EDIT = false;    // Scope of Work: edit mode (add/edit/remove write-ups)
  let REVISE_ATTACHMENTS = [];  // reference docs attached to "Tell the AI to revise" [{kind,name,media_type?,data?,text?}]
  let ACCOUNT = null;           // {balance, price:{premium,basic}} — prepaid meter (Phase 0 visual)
  let PROJECT_SCOPE = null;     // {components:[{id,name}], drawings:[{id,number}]} from Zoho; null until fetched
  let SCOPE_FETCH_DONE = false; // true once the project-scope fetch resolves (distinguish "loading" from "none entered")
  let RECON = { component:null, drawing:null };  // last reconcile() result per kind; index-keyed action handlers read this

  // ===== SCOPE RECONCILIATION =================================================
  // Compare what the AI READ (r.component / r.source_sheet) vs. the project's
  // ENTERED components & drawings. Match rule MIRRORS the staging validator
  // (entered-name CONTAINS take-off value, normalized) so this previews what
  // staging will actually resolve. Every fix rewrites r.* → flows into the commit CSV.
  const _norm  = (s)=>String(s==null?"":s).toLowerCase().trim().replace(/\s+/g," ");
  const RECROW = (bd,bg)=>'padding:5px 9px;border-left:3px solid '+bd+';background:'+bg+';border-radius:4px;margin:4px 0;font-size:12.5px';

  async function fetchProjectScope(){
    if(!params.project_id || loadResult().__demo){ SCOPE_FETCH_DONE=true; return; }
    try{
      const r=await fetch(RAILWAY_URL+"/api/takeoff/project-scope/"+encodeURIComponent(params.project_id));
      const d=await r.json();
      if(d&&d.ok){ PROJECT_SCOPE={components:arr(d.components),drawings:arr(d.drawings)}; }
    }catch(e){ /* non-fatal — panel shows a soft notice */ }
    SCOPE_FETCH_DONE=true; render();
  }
  function reconEntered(kind){
    if(!PROJECT_SCOPE) return [];
    return kind==='component'
      ? arr(PROJECT_SCOPE.components).map(function(c){return {id:c.id,name:String(c.name==null?"":c.name)};})
      : arr(PROJECT_SCOPE.drawings).map(function(d){return {id:d.id,name:String(d.number==null?"":d.number)};});
  }
  // What the AI read, from BOTH sources:
  //   1. per-row `component` / `source_sheet` tags, and
  //   2. the Scope of Work write-up, which pairs each assembly with its drawing:
  //      "Lid Assembly (top, hinge side, …) – RIS-48300-S2 family"
  // Source 2 matters because the synopsis is often populated when the per-row tags are not —
  // reading only the rows reported "0 matched" while the answer sat in plain sight on the page.
  const DRAW_RE=/\b[A-Za-z]{1,4}[0-9]*(?:-[A-Za-z0-9]+){2,}\b/g;
  function scopeStreams(){
    const sw=(loadResult().synopsis||{}).scope_of_work||{};
    const fab=arr(sw.fabricate);
    return { fab:fab, all:fab.concat(arr(sw.buyout),arr(sw.by_others),arr(sw.send_out)) };
  }
  function scopeComponents(){   // "Upper Frame weldment (W6x25 …) – RIS-…" → "Upper Frame weldment"
    return scopeStreams().fab.map(function(l){
      return String(l).split(/\s[–—-]\s/)[0].replace(/\s*\(.*$/,"").trim();
    }).filter(Boolean);
  }
  function scopeDrawings(){     // every drawing-shaped token across all streams
    const out=[];
    scopeStreams().all.forEach(function(l){ (String(l).match(DRAW_RE)||[]).forEach(function(x){ out.push(x); }); });
    return out;
  }
  // drawing → parent component, straight off the scope line that names both:
  //   "Upper Frame weldment (W6x25 …) – RIS-48300-S1-A-1"  →  {ris-48300-s1-a-1: "Upper Frame weldment"}
  function scopeDrawingParent(){
    const map={};
    scopeStreams().fab.forEach(function(l){
      const s=String(l), name=s.split(/\s[–—-]\s/)[0].replace(/\s*\(.*$/,"").trim();
      if(!name) return;
      (s.match(DRAW_RE)||[]).forEach(function(d){ map[_norm(d)]=name; });
    });
    return map;
  }
  function reconTakeoff(kind){   // distinct AI values → [{norm,value,rows,src}]
    const field=kind==='component'?'component':'source_sheet', map={};
    const push=function(raw,fromRow){
      const v=String(raw==null?"":raw).trim(); if(!v) return;
      const n=_norm(v); if(!map[n]) map[n]={norm:n,value:v,rows:0,src:fromRow?'rows':'scope'};
      if(fromRow){ map[n].rows++; map[n].src='rows'; }
    };
    arr(loadResult().rows).forEach(function(r){ if((Number(r.quantity)||0)>0) push(r[field],true); });
    (kind==='component'?scopeComponents():scopeDrawings()).forEach(function(v){ push(v,false); });
    return Object.keys(map).map(function(n){return map[n];});
  }
  function reconState(){ return loadResult().__reconcile||{}; }
  function reconSet(mut){ const R=loadResult(); R.__reconcile=R.__reconcile||{ignored:{component:[],drawing:[]},acked:{component:[],drawing:[]},unpaired:{component:[],drawing:[]}}; mut(R.__reconcile); saveResult(R); render(); }

  // ---- near-match (≈) --------------------------------------------------------
  // A near match is a SUGGESTION TO RENAME, never a match. The strict rule below stays
  // byte-identical to the staging validator, so the panel can never show a green ✓ for a link
  // that then imports blank. Renaming the entered value to the take-off's exact wording is what
  // turns the pair into a real match — which also means the validator needs no change.
  // Prime case: the REVERSE of the strict rule — take-off "Upper Frame weldment" contains
  // entered "Upper Frame". The strict rule misses it; a rename fixes it for good.
  function _tok(s){ return _norm(s).split(/[^a-z0-9]+/).filter(Boolean); }
  function _sim(a,b){
    const A=_tok(a), B=_tok(b).slice(); if(!A.length||!B.length) return 0;
    let hit=0; A.forEach(function(t){ const i=B.indexOf(t); if(i>-1){ hit++; B.splice(i,1); } });
    return hit/Math.max(A.length,_tok(b).length);
  }
  function _near(en,tn){ return tn.indexOf(en)>-1 || _sim(en,tn)>=0.5; }

  function reconcile(kind){
    const entered=reconEntered(kind).map(function(e){return {e:e,n:_norm(e.name)};}).filter(function(x){return x.n;});
    const takeoff=reconTakeoff(kind);
    const rc=reconState(), ign=arr(rc.ignored&&rc.ignored[kind]), ack=arr(rc.acked&&rc.acked[kind]),
          unp=arr(rc.unpaired&&rc.unpaired[kind]);
    const hit=function(en,tn){ return en===tn || en.indexOf(tn)>-1; };  // entered CONTAINS take-off (validator rule)
    const matched=[], takeoffOnly=[];
    takeoff.forEach(function(t){
      if(entered.some(function(x){return hit(x.n,t.norm);})) matched.push(t);
      else if(ign.indexOf(t.norm)<0) takeoffOnly.push(t);
    });
    let enteredOnly=entered.filter(function(x){ return !takeoff.some(function(t){return hit(x.n,t.norm);}) && ack.indexOf(x.n)<0; }).map(function(x){return x.e;});

    // Greedy best-score pairing across the two leftover lists. Each side is consumed at most once,
    // and anything you flag "not the same" is skipped so it falls back to its own section.
    const near=[], usedT={}, usedE={};
    enteredOnly.forEach(function(e){
      if(unp.indexOf(_norm(e.name))>-1) return;
      let best=null, bestScore=0;
      takeoffOnly.forEach(function(t,ti){
        if(usedT[ti] || !_near(_norm(e.name),t.norm)) return;
        const s=_sim(_norm(e.name),t.norm);
        if(s>=bestScore){ bestScore=s; best=ti; }
      });
      if(best!==null){ usedT[best]=1; usedE[_norm(e.name)]=1; near.push({entered:e, takeoff:takeoffOnly[best]}); }
    });
    return {
      enteredTotal:entered.length, matched:matched, near:near,
      takeoffOnly:takeoffOnly.filter(function(t,ti){ return !usedT[ti]; }),
      enteredOnly:enteredOnly.filter(function(e){ return !usedE[_norm(e.name)]; }),
    };
  }
  // ---- actions (index-keyed so no raw strings ride inside onclick attributes) ----
  function reconMap(kind,fromNorm,toName){
    if(!toName) return;
    const field=kind==='component'?'component':'source_sheet', R=loadResult();
    arr(R.rows).forEach(function(r){ if(_norm(r[field])===fromNorm) r[field]=toName; });
    saveResult(R); render();
  }
  function reconMapIdx(kind,i,sel){ const t=RECON[kind]&&RECON[kind].takeoffOnly[i]; if(t) reconMap(kind,t.norm,sel.value); }
  function reconIgnoreIdx(kind,i){ const t=RECON[kind]&&RECON[kind].takeoffOnly[i]; if(t) reconSet(function(rc){ rc.ignored=rc.ignored||{}; rc.ignored[kind]=arr(rc.ignored[kind]).concat([t.norm]); }); }
  // Dismissals must be undoable — an ignored item was otherwise hidden for good, with no way back
  // short of clearing localStorage.
  function reconUnignoreIdx(kind,i){ reconSet(function(rc){ rc.ignored=rc.ignored||{}; rc.ignored[kind]=arr(rc.ignored[kind]).filter(function(_,j){return j!==i;}); }); }
  function reconUnackIdx(kind,i){ reconSet(function(rc){ rc.acked=rc.acked||{}; rc.acked[kind]=arr(rc.acked[kind]).filter(function(_,j){return j!==i;}); }); }
  function reconDismissedHtml(kind){
    const rc=reconState(), ign=arr(rc.ignored&&rc.ignored[kind]), ack=arr(rc.acked&&rc.acked[kind]);
    if(!ign.length && !ack.length) return "";
    const label={}; reconTakeoff(kind).forEach(function(t){ label[t.norm]=t.value; });
    reconEntered(kind).forEach(function(e){ label[_norm(e.name)]=e.name; });
    const chip=function(n,i,fn){ return '<span style="display:inline-block;background:#eef1f5;border-radius:10px;padding:1px 4px 1px 8px;margin:2px 4px 2px 0">'+
      esc(label[n]||n)+' <button class="applybtn" style="background:#9aa6b2;padding:0 6px" onclick="'+fn+'(\''+kind+'\','+i+')" title="Show this again">undo</button></span>'; };
    return '<div class="src" style="margin:2px 0 4px">Dismissed: '+
      ign.map(function(n,i){return chip(n,i,'reconUnignoreIdx');}).join("")+
      ack.map(function(n,i){return chip(n,i,'reconUnackIdx');}).join("")+'</div>';
  }
  function reconAckIdx(kind,i){ const e=RECON[kind]&&RECON[kind].enteredOnly[i]; if(e) reconSet(function(rc){ rc.acked=rc.acked||{}; rc.acked[kind]=arr(rc.acked[kind]).concat([_norm(e.name)]); }); }
  function reconUnpairIdx(kind,i){ const p=RECON[kind]&&RECON[kind].near[i]; if(p) reconSet(function(rc){ rc.unpaired=rc.unpaired||{}; rc.unpaired[kind]=arr(rc.unpaired[kind]).concat([_norm(p.entered.name)]); }); }
  function reconMapNearIdx(kind,i){ const p=RECON[kind]&&RECON[kind].near[i]; if(p) reconMap(kind,p.takeoff.norm,p.entered.name); }

  // The drawing's parent component, resolved from the take-off itself: find a row on this sheet
  // that names a component, then match that name to an entered component record. Without this the
  // new drawing lands on the project unattached to any component.
  function reconParentComponentId(sheetValue){
    const sn=_norm(sheetValue); let compName="";
    arr(loadResult().rows).some(function(r){
      if(_norm(r.source_sheet)===sn && String(r.component||"").trim()){ compName=_norm(r.component); return true; }
      return false;
    });
    // Row tags are often blank; the scope line naming both is the reliable source.
    if(!compName){ const p=scopeDrawingParent()[sn]; if(p) compName=_norm(p); }
    if(!compName) return "";
    const c=reconEntered('component').filter(function(x){ const n=_norm(x.name); return n===compName||n.indexOf(compName)>-1||compName.indexOf(n)>-1; })[0];
    return c?c.id:"";
  }

  async function reconAdd(kind,value){
    if(!params.project_id) throw new Error("No project_id — can't add to project.");
    const body={project_id:params.project_id,kind:kind,value:value};
    if(kind==='drawing'){ const cid=reconParentComponentId(value); if(cid) body.component_id=cid; }
    const r=await fetch(RAILWAY_URL+"/api/takeoff/project-scope/add",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok||d.ok===false) throw new Error(d.error||("HTTP "+r.status));
    if(d.warning) alert("Added, but: "+d.warning);   // e.g. bidirectional link name rejected
    PROJECT_SCOPE=PROJECT_SCOPE||{components:[],drawings:[]};
    if(kind==='component') PROJECT_SCOPE.components.push({id:d.id,name:value});
    else PROJECT_SCOPE.drawings.push({id:d.id,number:value});
    return d.id;
  }
  async function reconAddIdx(kind,i){
    const t=RECON[kind]&&RECON[kind].takeoffOnly[i]; if(!t) return;
    try{ await reconAdd(kind,t.value); render(); }
    catch(e){ alert("Add to project failed: "+e.message); }
  }
  // Bulk add only. Components go first so drawings can attach to the records just created.
  async function reconAddAll(kind){
    const list=(RECON[kind]&&RECON[kind].takeoffOnly||[]).slice(); if(!list.length) return;
    if(!confirm("Add "+list.length+" "+kind+(list.length===1?"":"s")+" to the project?")) return;
    const failed=[];
    for(let i=0;i<list.length;i++){ try{ await reconAdd(kind,list[i].value); }catch(e){ failed.push(list[i].value+" — "+e.message); } }
    render();
    if(failed.length) alert("Added "+(list.length-failed.length)+" of "+list.length+".\n\nFailed:\n"+failed.join("\n"));
  }

  // Free-text rename straight from the "On your project" box — the one control that covers
  // "change it to something neither side proposed".
  async function reconRenameVal(kind,id,inputId){
    const el=document.getElementById(inputId); if(!el) return;
    const v=String(el.value||"").trim(); if(!v) return;
    try{
      const r=await fetch(RAILWAY_URL+"/api/takeoff/project-scope/update",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({kind:kind,id:id,value:v})});
      const d=await r.json();
      if(!r.ok||d.ok===false) throw new Error(d.error||("HTTP "+r.status));
      const list=kind==='component'?arr(PROJECT_SCOPE.components):arr(PROJECT_SCOPE.drawings);
      list.forEach(function(x){ if(String(x.id)===String(id)){ if(kind==='component') x.name=v; else x.number=v; } });
      render();
    }catch(e){ alert("Rename failed: "+e.message); }
  }

  async function reconRenameIdx(kind,i){
    const p=RECON[kind]&&RECON[kind].near[i]; if(!p) return;
    if(!confirm('Rename "'+p.entered.name+'" to "'+p.takeoff.value+'" on the project?')) return;
    try{
      const r=await fetch(RAILWAY_URL+"/api/takeoff/project-scope/update",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({kind:kind,id:p.entered.id,value:p.takeoff.value})});
      const d=await r.json();
      if(!r.ok||d.ok===false) throw new Error(d.error||("HTTP "+r.status));
      const list=kind==='component'?arr(PROJECT_SCOPE.components):arr(PROJECT_SCOPE.drawings);
      list.forEach(function(x){ if(String(x.id)===String(p.entered.id)){ if(kind==='component') x.name=p.takeoff.value; else x.number=p.takeoff.value; } });
      render();
    }catch(e){ alert("Rename failed: "+e.message); }
  }

  async function reconDeleteIdx(kind,i){
    const e=RECON[kind]&&RECON[kind].enteredOnly[i]; if(!e) return;
    if(!confirm('Delete "'+e.name+'" from the project?\n\nThis removes the record in Zoho. It is blocked if anything is still linked to it.')) return;
    try{
      const r=await fetch(RAILWAY_URL+"/api/takeoff/project-scope/delete",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({kind:kind,id:e.id})});
      const d=await r.json();
      if(r.status===409){ alert("Can't delete \""+e.name+"\".\n\n"+d.error); return; }
      if(!r.ok||d.ok===false) throw new Error(d.error||("HTTP "+r.status));
      if(kind==='component') PROJECT_SCOPE.components=arr(PROJECT_SCOPE.components).filter(function(x){return String(x.id)!==String(e.id);});
      else PROJECT_SCOPE.drawings=arr(PROJECT_SCOPE.drawings).filter(function(x){return String(x.id)!==String(e.id);});
      render();
    }catch(e2){ alert("Delete failed: "+e2.message); }
  }
  // How much of the BOM the take-off actually tagged. When this is zero the panel has nothing to
  // compare against, and "0 matched" reads as a matching failure when it's really an input failure
  // — so say which one, and which fix applies.
  function reconCoverage(){
    const rows=arr(loadResult().rows), live=rows.filter(function(r){return (Number(r.quantity)||0)>0;});
    const filled=function(f){ return live.filter(function(r){return String(r[f]==null?"":r[f]).trim();}).length; };
    const keys=rows.length?Object.keys(rows[0]):[];
    return { rows:rows.length, live:live.length, comp:filled('component'), sheet:filled('source_sheet'),
             hasKeys:keys.indexOf('component')>-1||keys.indexOf('source_sheet')>-1 };
  }
  function reconNoticeHtml(){
    const c=reconCoverage();
    // Only when BOTH sources are empty — the Scope of Work counts as the AI having read something.
    if(!c.rows || c.comp || c.sheet) return "";
    if(reconTakeoff('component').length || reconTakeoff('drawing').length) return "";
    let why;
    if(!c.hasKeys)      why='This saved result predates the component/drawing fields — <b>re-run the take-off</b> and it will tag rows as it reads them.';
    else if(!c.live)    why='All '+c.rows+' rows have a quantity of 0, and only rows with quantity &gt; 0 are read here — check the quantity column.';
    else                why='The AI returned the fields empty. <b>Re-run the take-off</b> now that your components are entered, so it can tag each row as it reads.';
    return '<div style="padding:8px 10px;border-left:3px solid #d9a441;background:#fff9ef;border-radius:4px;margin-bottom:10px;font-size:12.5px">'+
      '<b>Nothing to reconcile against.</b> This take-off tagged <b>0 of '+c.live+'</b> priced rows with a component and <b>0</b> with a drawing, '+
      'so everything below is just your entered list — not a mismatch. '+why+'</div>';
  }

  // ---- LIST vs DRAWINGS ---------------------------------------------------
  // The cross-check, front and centre: what the parts lists said, what the sheets showed, and every
  // place the two didn't agree. Something DRAWN but missing from the shop's own list is the single
  // most valuable thing a take-off can find — it's steel that wouldn't have been ordered.
  function crossCardHtml(rows, rec){
    rec = rec || {};
    const only_list = arr(rec.only_in_list), only_dwg = arr(rec.only_on_drawings), mism = arr(rec.mismatches);
    const tally = { both:0, list_only:0, drawing_only:0, corrected:0, no_list:0, unset:0 };
    arr(rows).forEach(function(r){
      if((Number(r.quantity)||0)<=0) return;                       // gaps are reviewed as gaps
      const k = String(r.cross_check||"").toLowerCase().trim().replace(/[\s-]+/g,"_");
      if(tally[k]===undefined) tally.unset++; else tally[k]++;
    });
    const checked = tally.both + tally.list_only + tally.drawing_only + tally.corrected;
    // Nothing to show if the package had no list at all and the model reported nothing.
    if(!rec.performed && !only_list.length && !only_dwg.length && !mism.length && !checked) return "";
    const TD='padding:5px 8px;border-bottom:1px solid #eceff3;vertical-align:top;font-size:12.5px';
    const tbl=function(title, colour, items, cells){
      if(!items.length) return "";
      return '<details open style="margin-bottom:10px"><summary style="color:'+colour+';font-weight:700">'+
        title+' ('+items.length+')</summary><table style="width:100%;border-collapse:collapse;margin-top:6px">'+
        items.map(function(x){ return '<tr>'+cells(x).map(function(c){ return '<td style="'+TD+'">'+c+'</td>'; }).join("")+'</tr>'; }).join("")+
        '</table></details>';
    };
    const pill=function(n,label,cls){ return n?'<span class="chip'+(cls?' '+cls:'')+'">'+n+' '+label+'</span>':''; };
    return '<div class="card"><h2>⚖ Parts list vs drawings <span class="lt">— what was checked against what</span></h2><div class="body">'+
      (arr(rec.sources).length
        ? '<div style="font-size:12.5px;color:var(--mut);margin-bottom:8px">Checked against: <b>'+
            arr(rec.sources).map(esc).join("</b>, <b>")+'</b></div>'
        : (rec.performed===false
            ? '<div style="font-size:12.5px;color:var(--mut);margin-bottom:8px">No parts list or material table was found in this package — the BOM is read from the drawings alone.</div>'
            : ''))+
      '<div class="meta" style="margin-bottom:10px">'+
        pill(tally.both,'confirmed by both')+pill(tally.corrected,'corrected')+
        pill(tally.drawing_only,'drawn, not listed')+pill(tally.list_only,'listed, not drawn')+
        pill(tally.no_list,'no list to check')+pill(tally.unset,'unchecked')+
      '</div>'+
      tbl('⚠ Drawn or scheduled but MISSING from the parts list','#b45309',only_dwg,function(x){
        return ['<b>'+esc(x.item)+'</b>', esc(x.where||''), '<span class="src">'+esc(x.why_it_matters||'')+'</span>']; })+
      tbl('⚡ In both, but they disagree','#b45309',mism,function(x){
        return ['<b>'+esc(x.item)+'</b>',
                '<span class="src">list: '+esc(x.list_says||'—')+'<br>drawing: '+esc(x.drawings_say||'—')+'</span>',
                'used <b>'+esc(x.used||'—')+'</b><br><span class="src">'+esc(x.why||'')+'</span>']; })+
      tbl('◷ On the parts list but not found drawn','#7d8aa0',only_list,function(x){
        return ['<b>'+esc(x.item)+'</b>', esc(x.where||''),
                '<span class="src">'+esc(x.quantity?('qty '+x.quantity+' · '):'')+esc(x.action||'kept in the BOM')+'</span>']; })+
      ((only_dwg.length||mism.length||only_list.length)
        ? '<div style="font-size:12px;color:var(--mut)">Everything above is already in the BOM below — this section is the audit trail, not a to-do list. Use <b>Tell the AI</b> if you want any of it changed.</div>'
        : (checked?'<div style="font-size:12.5px;color:var(--grn)">✓ The parts list and the drawings agree throughout — no discrepancies found.</div>':''))+
    '</div></div>';
  }

  function reconCardHtml(){
    if(!params.project_id || loadResult().__demo) return "";
    if(!SCOPE_FETCH_DONE) return '<div class="card"><h2>▸ Scope Reconciliation</h2><div class="body" style="color:var(--mut);font-size:13px"><span class="spin"></span> Checking components &amp; drawings against the project…</div></div>';
    if(!PROJECT_SCOPE || (!arr(PROJECT_SCOPE.components).length && !arr(PROJECT_SCOPE.drawings).length))
      return '<div class="card"><h2>▸ Scope Reconciliation</h2><div class="body" style="color:var(--mut);font-size:13px">No components or drawings are entered on this project — nothing to reconcile. (The BOM is grouped by what the AI read off the sheets.)</div></div>';
    // One table per kind: what the AI read | what's on your project | what to do about it.
    // Ordered actionable-first (≈ rename, ➕ add, ⚠ delete) with agreed rows last.
    const TD='padding:5px 8px;border-bottom:1px solid #eceff3;vertical-align:top;font-size:12.5px';
    const NAMEBOX=function(kind,id,val,idx,type){
      const eid='sc_'+kind+'_'+type+'_'+idx;
      return '<input id="'+eid+'" value="'+escAttr(val)+'" style="font-size:12px;padding:2px 5px;border:1px solid #cdd3da;border-radius:5px;width:96%;max-width:230px" '+
        'onkeydown="if(event.key===\'Enter\'){reconRenameVal(\''+kind+'\',\''+escAttr(id)+'\',\''+eid+'\')}"> '+
        '<button class="applybtn" style="background:#7d8aa0;padding:1px 7px" onclick="reconRenameVal(\''+kind+'\',\''+escAttr(id)+'\',\''+eid+'\')" title="Save this name to the project">save</button>';
    };
    const sec=function(kind,label,noun){
      const r=reconcile(kind); RECON[kind]=r;
      let rows='';
      // ≈ near — NOT counted as matched; renaming one side is what makes the link real.
      r.near.forEach(function(p,i){
        rows+='<tr><td style="'+TD+'"><b style="color:#6b52a8">≈</b> '+esc(p.takeoff.value)+'</td>'+
          '<td style="'+TD+'">'+NAMEBOX(kind,p.entered.id,p.entered.name,i,'near')+'<div class="src">will not link until the names agree</div></td>'+
          '<td style="'+TD+'; white-space:nowrap">'+
            '<button class="applybtn" onclick="reconRenameIdx(\''+kind+'\','+i+')" title="Use the AI\'s wording">✎ use AI name</button> '+
            '<button class="applybtn" style="background:#7d8aa0" onclick="reconMapNearIdx(\''+kind+'\','+i+')" title="Keep yours — retag the BOM rows">keep mine</button> '+
            '<button class="applybtn" style="background:#9aa6b2;padding:1px 7px" onclick="reconUnpairIdx(\''+kind+'\','+i+')">not same</button></td></tr>';
      });
      // ➕ AI read it, not on the project. The "use existing" picker is the third option beyond
      // add/ignore: fold this value into a record you already have, by retagging the BOM rows.
      const entered=reconEntered(kind);
      const optionsHtml=entered.map(function(e){return '<option value="'+escAttr(e.name)+'">'+esc(e.name)+'</option>';}).join("");
      r.takeoffOnly.forEach(function(t,i){
        const dd = entered.length ? '<select onchange="reconMapIdx(\''+kind+'\','+i+',this)" style="font-size:11px;padding:2px 4px;border:1px solid #cdd3da;border-radius:5px;max-width:150px"><option value="">use existing…</option>'+optionsHtml+'</select> ' : '';
        rows+='<tr><td style="'+TD+'"><b style="color:#3a6ea5">➕</b> '+esc(t.value)+
            (t.rows?' <span class="src">'+t.rows+' row'+(t.rows===1?'':'s')+'</span>':' <span class="src">from scope of work</span>')+'</td>'+
          '<td style="'+TD+'"><span class="src">not on the project</span></td>'+
          '<td style="'+TD+'; white-space:nowrap">'+dd+
            '<button class="applybtn" onclick="reconAddIdx(\''+kind+'\','+i+')" title="Create this '+noun+' on the project">＋ add</button> '+
            '<button class="applybtn" style="background:#9aa6b2;padding:1px 7px" onclick="reconIgnoreIdx(\''+kind+'\','+i+')">ignore</button></td></tr>';
      });
      // ⚠ on the project, AI read nothing like it
      r.enteredOnly.forEach(function(e,i){
        rows+='<tr><td style="'+TD+'"><span class="src">nothing read from the sheets</span></td>'+
          '<td style="'+TD+'"><b style="color:#b6791f">⚠</b> '+NAMEBOX(kind,e.id,e.name,i,'only')+'</td>'+
          '<td style="'+TD+'; white-space:nowrap">'+
            '<button class="applybtn" style="background:#b4544c" onclick="reconDeleteIdx(\''+kind+'\','+i+')" title="Delete from the project">🗑 delete</button> '+
            '<button class="applybtn" style="background:#9aa6b2;padding:1px 7px" onclick="reconAckIdx(\''+kind+'\','+i+')">keep</button></td></tr>';
      });
      // ✓ agreed
      r.matched.forEach(function(t){
        rows+='<tr><td style="'+TD+';background:#f8fbf9"><b style="color:#2f8049">✓</b> '+esc(t.value)+'</td>'+
          '<td style="'+TD+';background:#f8fbf9" colspan="2"><span class="src">matches'+(t.rows?' · '+t.rows+' row'+(t.rows===1?'':'s'):'')+'</span></td></tr>';
      });
      if(!rows) rows='<tr><td style="'+TD+'" colspan="3"><span class="src">All '+noun+'s line up. ✓</span></td></tr>';
      const bulk = r.takeoffOnly.length>1
        ? ' <button class="applybtn" style="padding:1px 8px" onclick="reconAddAll(\''+kind+'\')" title="Create all of these on the project">＋ add all '+r.takeoffOnly.length+'</button>'
        : '';
      const hdr=label+' <span class="grp-meta">'+r.matched.length+' agree'+(r.near.length?' · '+r.near.length+' to rename':'')+(r.takeoffOnly.length?' · '+r.takeoffOnly.length+' to add':'')+(r.enteredOnly.length?' · '+r.enteredOnly.length+' unmatched':'')+'</span>'+bulk;
      return '<div style="margin-bottom:14px"><div style="font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#667;margin:2px 0 6px">'+hdr+'</div>'+
        '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">'+
        '<thead><tr>'+
          '<th style="'+TD+';text-align:left;color:#667;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;width:38%">AI read from sheets</th>'+
          '<th style="'+TD+';text-align:left;color:#667;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;width:34%">On your project</th>'+
          '<th style="'+TD+';text-align:left;color:#667;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em">Action</th>'+
        '</tr></thead><tbody>'+rows+'</tbody></table></div>'+reconDismissedHtml(kind)+'</div>';
    };
    return '<div class="card"><h2>▸ Scope Reconciliation <span class="lt">— what the AI read vs. what you entered</span></h2><div class="body">'+
      reconNoticeHtml()+
      sec('component','Components','component')+sec('drawing','Drawings','drawing')+
      '<div class="src" style="margin-top:6px">➕ items import with a blank link unless you <b>add</b> them to the project or <b>map</b> them to an entered value. ≈ near matches will <b>not</b> link until you rename one side. 🗑 delete is blocked while drawings or BOM rows are still linked. Fixes here update the BOM before it commits.</div>'+
      '</div></div>';
  }

  function render(){
    // Catalog arrives async; the first render just skips the material card and re-renders once

    if(CATALOG===null && !CATALOG_LOADING){ CATALOG_LOADING=true; loadCatalog().then(function(){ render(); }); }
    const _aiKeep = (document.getElementById("aiInput")||{}).value;  // preserve in-progress chat text across re-render
    const R = loadResult();
    const rows = arr(R.rows);
    const s = R.synopsis || {};
    DECISIONS = arr(s.decisions).map((d,i)=>({
      id:"dec"+i, item:d.item||"(decision)",
      where:d.where||"", why:d.why_flagged||"", options:arr(d.options).length?d.options:["Include","Skip"],
      rec:d.ai_recommendation||"", sel:(d.selected!=null?d.selected:(d.ai_recommendation||null)),
    }));
    const sw = s.scope_of_work||{}, t=s.totals||{}, conf=s.confidence||{};
    const fab = rows.filter(r=>(Number(r.quantity)||0)>0);
    const gaps = arr(s.gaps), conflicts=arr(s.conflicts), comp=arr(s.compliance);
    CONFLICTS = conflicts;
    const overall = conf.overall!=null?conf.overall:0.7;

    const _clean = function(a){ return arr(a).filter(function(x){ return String(x==null?"":x).trim(); }); };
    const streams = [
      ["fab","Fabricate",_clean(sw.fabricate)],["buy","Buyout",_clean(sw.buyout)],
      ["oth","By others",_clean(sw.by_others)],["snd","Send-out",_clean(sw.send_out)],
    ].filter(x=>x[2].length);

    const editable = BOM_EXPANDED;
    const NC = editable ? 7 : 6;  // table columns (Sheet now lives in the drawing group header)
    const fabIdx=[]; rows.forEach(function(r,idx){ if((Number(r.quantity)||0)>0) fabIdx.push(idx); });

    // Group fab rows by Component → Drawing (source_sheet), preserving first-seen order.
    const gKey=function(v){ return (v==null?'':String(v).trim()); };
    const compOrder=[], compMap={};
    fabIdx.forEach(function(idx){
      const r=rows[idx];
      const cN=gKey(r.component)||'— Unassigned —';
      const dN=gKey(r.source_sheet)||'— No sheet —';
      if(!compMap[cN]){ compMap[cN]={dOrder:[],dMap:{}}; compOrder.push(cN); }
      const g=compMap[cN];
      if(!g.dMap[dN]){ g.dMap[dN]=[]; g.dOrder.push(dN); }
      g.dMap[dN].push(idx);
    });
    const sumQty=function(ids){ return ids.reduce(function(a,i){ return a+(Number(rows[i].quantity)||0); },0); };
    // Group headers count the JOB total — that's the number an estimator is looking for.
    const sumTot=function(ids){ return ids.reduce(function(a,i){ return a+totalOf(rows[i]); },0); };

    // Where the row's evidence came from, on the row itself — two sources agreeing is worth more
    // than one, and a row nobody's list mentions is worth a second look.
    const XC={ both:["✓✓","confirmed by both the parts list and the drawings","var(--grn)"],
               corrected:["≠","the list and the drawing disagreed — see Parts list vs drawings","#b45309"],
               drawing_only:["dwg","drawn or scheduled, but NOT on the parts list","#b45309"],
               list_only:["list","on the parts list, not found drawn","#7d8aa0"] };
    const xcTag=function(r){
      const k=String(r.cross_check||"").toLowerCase().trim().replace(/[\s-]+/g,"_");
      const x=XC[k]; if(!x) return "";
      return ' <span title="'+escAttr(x[1])+'" style="font-size:10px;font-weight:700;color:'+x[2]+'">'+x[0]+'</span>';
    };
    // Per unit vs job total. `quantity` is what one unit of the component takes — that's what you
    // check against the drawing. `quantity_total` is what gets ordered. Showing only one of them is
    // how a 4-off job ends up ordering a quarter of the steel (or four times the cost per unit).
    const unitsOf=function(r){ return Math.max(1, Math.round(Number(r.units)||1)); };
    const totalOf=function(r){ const t=Number(r.quantity_total);
      return (Number.isFinite(t)&&t>0)?t:(Number(r.quantity)||0)*unitsOf(r); };
    const anyMulti = rows.some(function(r){ return unitsOf(r)>1; });
    const memberRow=function(idx){
      const r=rows[idx], c=Number(r.confidence)||0, cls=confClass(c);
      const u=unitsOf(r);
      const qtyCell = editable
        ? '<input type="number" min="0" value="'+(Number(r.quantity)||0)+'" style="width:56px;padding:3px 5px;border:1px solid #cdd3da;border-radius:5px;font-size:12px;" onchange="editQty('+idx+',this.value)">'+
          (u>1?'<div class="src">×'+u+' = <b>'+totalOf(r)+'</b></div>':'')
        : (u>1
            ? esc(r.quantity)+' <span class="src">×'+u+'</span> <b>= '+totalOf(r)+'</b>'
            : esc(r.quantity));
      return '<tr class="'+(cls==="hi"?"":cls)+'">'+
        '<td><span class="dot d-'+cls+'"></span>'+c.toFixed(2)+xcTag(r)+'</td>'+
        '<td>'+esc(r.form_type)+'</td>'+
        '<td>'+esc(r.size)+(r.galvanized?' <span class="galv">galv</span>':'')+'</td>'+

    };
    const bomRows = compOrder.map(function(cN){
      const g=compMap[cN];
      const cIds=[].concat.apply([], g.dOrder.map(function(d){ return g.dMap[d]; }));

        '</span></td></tr>';
      g.dOrder.forEach(function(dN){
        const ids=g.dMap[dN];
