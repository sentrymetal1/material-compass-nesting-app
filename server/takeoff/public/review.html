  // `which` is an option index. A string is still accepted, because a stale page rendered by
  // the previous build may call it that way.
  function pick(id,which){
    const d=DECISIONS.find(function(x){return x.id===id;}); if(!d) return;
    const v = (typeof which === "number") ? d.options[which] : which;
    if(v==null) return;
    d.sel=v; renderDecisions();
    const idx=parseInt(String(id).replace("dec",""),10);
    const R=loadResult();
    if(R && R.synopsis && Array.isArray(R.synopsis.decisions) && R.synopsis.decisions[idx]){
      R.synopsis.decisions[idx].selected=v; syncQuoteNotes(R); saveResult(R); renderQuoteNotes();
    }
  }

  // ---- QUOTE CLARIFICATIONS --------------------------------------------------
  // Every conflict, every gap and every decision the take-off raised is something the customer has
  // to be told in the quote: which document the price follows, what isn't included, what was
  // assumed. Each becomes a line of quote language the estimator can edit or leave out, and Approve
  // writes the list onto the project. A conflict or gap ✕'d off the review is NOT dropped from here
  // — dismissing it from the BOM review doesn't make it something the customer needn't hear.
  const NOTE_GROUPS=[["addendum","Addenda","the issue of the documents this quote is based on"],
                     ["conflict","Clarifications","where the documents disagree"],
                     ["gap","Exclusions / items to verify","not fully shown on the documents"],
                     ["decision","Basis of quote","the calls made on this take-off"],
                     ["scope","Scope by drawing","included / not included, sheet by sheet"]];
  function noteKey(src,topic){ return src+":"+String(topic==null?"":topic).toLowerCase().replace(/\s+/g," ").trim().slice(0,160); }
  function _sent(s){ s=String(s==null?"":s).trim(); return s && !/[.!?]$/.test(s) ? s+"." : s; }
  // Where a conflict lives on the PLANS and how much of the member it touches — the detail sheet alone
  // doesn't tell the estimator which runs, or how many feet, the answer moves.
  function conflictLocs(c){
    return arr(c.plan_locations).filter(function(l){ return l && (l.sheet||l.location); }).map(function(l){
      return String(l.sheet||"").trim()+(l.location?" "+String(l.location).trim():"")+
        (Number(l.length_ft)>0?" (~"+Math.round(Number(l.length_ft))+" LF)":"");
    });
  }
  function conflictWhereHtml(c){
    const locs=conflictLocs(c), len=Number(c.est_length_ft)>0?Math.round(Number(c.est_length_ft)):0;
    if(!c.member&&!locs.length&&!len) return "";
    return '<div class="src" style="margin:3px 0 0">'+
      (c.member?'<b>'+esc(c.member)+'</b>'+(locs.length||len?' · ':''):'')+
      (locs.length?'📍 on plans: '+esc(locs.join("; ")):'<i>not located on the plans attached</i>')+
      (len?' · <b>est. '+len.toLocaleString()+' LF</b>'+(c.length_basis?' <span title="'+esc(c.length_basis)+'">ⓘ</span>':''):'')+
      '</div>';
  }
  function conflictNote(c){
    const parts=[];
    if(c.drawing_says) parts.push("the drawings show "+String(c.drawing_says).trim());
    if(c.spec_says) parts.push("the specification calls for "+String(c.spec_says).trim());
    const locs=conflictLocs(c), len=Number(c.est_length_ft)>0?Math.round(Number(c.est_length_ft)):0;
    const mem=c.member?String(c.member).trim():"";
    const where=[mem+(locs.length?(mem?" at ":"")+locs.join("; "):""), len?"approx. "+len.toLocaleString()+" LF total":""]
      .filter(Boolean).join(", ");
    return _sent((c.topic||"Conflict")+(parts.length?": "+parts.join("; "):""))+
      (where?" Affects "+_sent(where):"")+

  function syncQuoteNotes(R){
    const s=R.synopsis||{};
    let changed=!Array.isArray(R.quote_notes);
    const list=changed?[]:R.quote_notes;
    const up=function(src,topic,base){
      const k=noteKey(src,topic);
      const n=list.find(function(x){ return x.key===k; });
      if(!n){ list.push({key:k,source:src,topic:String(topic||""),base:base,text:null,include:true}); changed=true; }
      else if(n.base!==base){ n.base=base; changed=true; }
    };
    arr(s.conflicts).forEach(function(c){ up("conflict",c.topic,conflictNote(c)); });
    arr(s.gaps).forEach(function(g){ up("gap",g.item,gapNote(g)); });
    arr(s.decisions).forEach(function(d){
      up("decision",d.item,decisionNote(d.item,d.selected!=null?d.selected:(d.ai_recommendation||null)));
    });
    // Each addendum the package carries: acknowledged, with its reissued sheets — and, once compared,
    // one line per sheet whose steel actually changed.
    const iss={};
    arr(R.superseded).forEach(function(p){ (iss[p.issue||"Addendum"]=iss[p.issue||"Addendum"]||[]).push(p.sheet); });
    Object.keys(iss).forEach(function(k){

    });

    arr(s.drawing_scope).forEach(function(d){
      if(!d || !d.sheet) return;
      const inc=arr(d.included).filter(Boolean), exc=arr(d.excluded).filter(function(x){ return x && x.item; });
      if(!inc.length && !exc.length) return;
      up("scope",d.sheet,_sent(d.sheet+(d.title?" ("+String(d.title).trim()+")":"")+": "+
        (inc.length?"includes "+inc.join(", "):"no fabricator steel")+
        (exc.length?"; not included: "+exc.map(function(x){ return x.item+(x.by?" ("+x.by+")":""); }).join(", "):"")));
    });
    R.quote_notes=list;
    return changed;
  }

  function setNoteText(i,v){ const R=loadResult(); const n=arr(R.quote_notes)[i]; if(!n) return;

  // ---- Scope of Work editor — one free-text box PER category (no AI) ----------

  // ---- Add more drawings to THIS take-off (additive — merges, doesn't redo) ------------------
  function readB64(f){ return new Promise(function(res,rej){ const r=new FileReader(); r.onerror=function(){rej(new Error("read failed: "+f.name));}; r.onload=function(){ res(String(r.result).split(",")[1]); }; r.readAsDataURL(f); }); }
  function mergeList(a,b){ return (Array.isArray(a)?a:[]).concat(Array.isArray(b)?b:[]); }
  function mergeAddon(cur, addon){
    const out = JSON.parse(JSON.stringify(cur || {}));
    out.rows = mergeList(cur.rows, addon.rows);
    const cs = (cur && cur.synopsis) || {}, as = (addon && addon.synopsis) || {};
    const sw1 = cs.scope_of_work || {}, sw2 = as.scope_of_work || {};
    const proj = cs.project || as.project || {};
    out.synopsis = {
      project: Object.assign({}, proj, { sheets_read: mergeList(proj.sheets_read, as.project && as.project.sheets_read) }),
      scope_of_work: {
        fabricate: mergeList(sw1.fabricate, sw2.fabricate),
        buyout:    mergeList(sw1.buyout, sw2.buyout),
        by_others: mergeList(sw1.by_others, sw2.by_others),
        send_out:  mergeList(sw1.send_out, sw2.send_out),
      },
      decisions:  mergeList(cs.decisions, as.decisions),
      gaps:       mergeList(cs.gaps, as.gaps),
      conflicts:  mergeList(cs.conflicts, as.conflicts),
      compliance: mergeList(cs.compliance, as.compliance),
      drawing_scope: mergeList(cs.drawing_scope, as.drawing_scope),
      totals:     Object.assign({}, cs.totals),
      confidence: cs.confidence || as.confidence,
    };
    out.cost_usd = (Number(cur.cost_usd) || 0) + (Number(addon.cost_usd) || 0);
    return out;
  }
  async function addDrawings(input){
    const files = [].slice.call(input.files).filter(function(f){ return f.type === "application/pdf"; });
    input.value = "";
    if(!files.length || window.__revising) return;
    window.__revising = true;
    document.querySelectorAll(".applybtn,#reviseBtn,#addBtn").forEach(function(b){ b.disabled = true; });
    let secs=0; const fmt=function(){ const m=Math.floor(secs/60),s=secs%60; return m+":"+(s<10?"0":"")+s; };
    const lbl = files.length + " more drawing" + (files.length>1?"s":"");
    setBusy("&#10227; Reading "+lbl+"… 0:00 &nbsp;·&nbsp; please wait, don't close");
    const tick=setInterval(function(){ secs++; setBusy("&#10227; Reading "+lbl+"… "+fmt()+" &nbsp;·&nbsp; please wait, don't close"); }, 1000);
    const stop=function(){ clearInterval(tick); window.__revising=false; };
    const reenable=function(){ document.querySelectorAll(".applybtn,#reviseBtn,#addBtn").forEach(function(b){ b.disabled=false; }); };
    try{
      const pdfs=[]; for(const f of files){ pdfs.push(await readB64(f)); }
      const r=await fetch(RAILWAY_URL+"/api/takeoff",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({project_id:params.project_id,manufacturer_id:params.manufacturer_id,pdfs:pdfs,model:"sonnet"})});
      const data=await r.json();
      if(!r.ok||data.ok===false){ stop(); reenable(); setBusy("⚠ Add failed: "+esc(data.error||("HTTP "+r.status)),"err"); clearBusy(8000); return; }
      const cur=loadResult();
      const merged=mergeAddon(cur, data);
      recomputeCsv(merged); saveResult(merged);
      stop(); render(); window.scrollTo({top:0,behavior:"smooth"});
      const added=(data.rows||[]).filter(function(x){return (Number(x.quantity)||0)>0;}).length;
      const total=merged.rows.filter(function(x){return (Number(x.quantity)||0)>0;}).length;
      setBusy("✓ Added "+added+" rows from "+files.length+" file"+(files.length>1?"s":"")+" — "+total+" total now (cost $"+(data.cost_usd!=null?data.cost_usd:"?")+")","ok"); clearBusy(8000);
    }catch(e){ stop(); reenable(); setBusy("⚠ Error: "+esc(e.message),"err"); clearBusy(8000); }
  }
  function _cell(v){ return String(v==null?"":v).replace(/[,\r\n]+/g," ").trim(); }
  function _pct(c){ const n=Number(c); return Number.isFinite(n)?String(Math.round(n*100)):""; }
  function _sft(n){ const raw=Number(n)||0; const ft=Math.max(0,Math.floor(raw)); const inch=Math.round((raw-ft)*12); return inch>=12?[ft+1,0]:[ft,inch]; }
  // Rebuild the import CSV from the (possibly edited) rows — keeps Approve/export in sync with edits.
  function buildImportCsvJS(rows){
    const H=["MATERIAL COMPASS - BOM Import Template (AI Take-off)","Generated by AI Take-off - review in BOM Staging",
      "Tag,Component,Drawing Number,Form Type,Mat Type,Specification,Material,QTY,FT(L),INCH(L),FT(W),INCH(W),Galv,Surface Area,Confidence",
      "blue = lookup ; green = direct entry ; * = required","",""];
    const out=H.slice();
    (rows||[]).filter(function(r){ return (Number(r.quantity)||0)>0 && !r.deleted; }).forEach(function(r,i){
      const L=_sft(r.length_ft), W=_sft(r.width_ft);
      const tag=_cell(r.member_mark)||("AI-"+String(i+1).padStart(3,"0"));
      // The BOM carries the JOB total (per unit × units built) — the project's own rollups divide
      // BOM sums by Component.Quantity to get per-unit cost. Same rule as the server's builder.
      const u=Math.max(1,Math.round(Number(r.units)||1));
      const tot=Number(r.quantity_total);
      const qty=(Number.isFinite(tot)&&tot>0)?tot:(Number(r.quantity)||0)*u;
      out.push([tag,_cell(r.component),_cell(r.source_sheet),_cell(r.form_type),_cell(r.material_type),_cell(r.specification),
        _cell(r.size),_cell(qty),_cell(L[0]),_cell(L[1]),_cell(W[0]),_cell(W[1]),r.galvanized?"Yes":"","",_pct(r.confidence)].join(","));
    });
    return out.join("\n");
  }
  // ---- MATERIAL CHECK ------------------------------------------------------
  // A row whose Material is blank or isn't in the shop's catalog can't resolve on import — it
  // shows up red here and errors in staging. The model is now given the real size list, but this
  // is the backstop: check every row against that SAME list, and let it be fixed here, before
  // anything is committed. Nearest sizes are offered so a fix is a click, not a hunt.
  let CATALOG = null;                       // { "Form Type|Material Type": [size,...] }; null = not fetched yet
  let CATALOG_LOADING = false;
  // A catalog that FAILED to load looks identical to an empty one, and the material check then
  // blamed every row: "No catalog sizes for Plate · Carbon Steel", seventeen times, when the real
  // cause was Zoho's daily API limit. A failure has to be distinguishable from a finding, or the
  // page sends you hunting for a data problem that does not exist.
  let CATALOG_ERR = "";
  async function loadCatalog(){
    CATALOG_ERR="";
    try{
      const r=await fetch(RAILWAY_URL+"/api/takeoff/catalog-index");
      const d=await r.json();
      if(d && d.ok && d.groups && Object.keys(d.groups).length){ CATALOG=d.groups; }
      else {
        CATALOG={};
        CATALOG_ERR=catalogErrText(d&&d.error);
      }
    }catch(e){ CATALOG={}; CATALOG_ERR=catalogErrText(e&&e.message); }
    return CATALOG;
  }
  // Zoho answers a spent quota with code 4000 rather than an outage, so say which it is — one is
  // over by morning and the other is not.
  function catalogErrText(raw){
    const s=String(raw||"");
    return /4000|API limit|Developer API/i.test(s)
      ? "Your Zoho daily API limit is used up, so the catalog could not be loaded. The rows below are probably fine — re-open this page after the limit resets and check again before committing."
      : "The catalog could not be loaded" + (s?" ("+s+")":"") + ", so nothing here could be checked against it.";
  }
  // Two comparisons on purpose. _mkey is the MEMBERSHIP test: case and padding don't matter, but
  // spacing does — "L5x3x1/4" is not the catalog's "L5 x 3 x 1/4", and that exact drift is what
  // arrives unresolved. _mnorm ignores spacing entirely and is used only to RANK suggestions, so
  // the correctly-spaced string is the first thing offered.
  const _mkey=function(s){ return String(s==null?"":s).trim().toUpperCase().replace(/\s+/g," "); };
  const _mnorm=function(s){ return String(s==null?"":s).toUpperCase().replace(/\s+/g,"").replace(/[^A-Z0-9\/\-."]/g,""); };
  function catGroup(r){
    if(!CATALOG) return null;
    const f=String(r.form_type||"").trim(), m=String(r.material_type||"").trim();
    return CATALOG[f+"|"+m] || CATALOG[f+"|any material"] || null;
  }
  function nearestSizes(r,n){
    const g=catGroup(r); if(!g||!g.length) return [];
    const want=_mnorm(r.size);
    if(!want) return g.slice(0,n||6);
    return g.map(function(s){
      const a=_mnorm(s); let score=0;
      if(a===want) score=1;
      else if(a.indexOf(want)===0||want.indexOf(a)===0) score=0.9;
      else{ const L=Math.max(a.length,want.length); let same=0; for(let i=0;i<Math.min(a.length,want.length);i++) if(a[i]===want[i]) same++; score=same/L; }
      return {s:s,score:score};
    }).sort(function(x,y){ return y.score-x.score; }).slice(0,n||6).map(function(x){ return x.s; });
  }
  // Problems, worst first: no material at all, then a material the catalog doesn't have.
  function materialProblems(rows){
    if(!CATALOG) return [];
    // The catalog failed to load, so every row would "fail" a check that never ran. Report none
    // — the card says why separately, and the approve gate must not warn about phantom faults.
    if(CATALOG_ERR) return [];
    const out=[];
    (rows||[]).forEach(function(r,idx){
      if((Number(r.quantity)||0)<=0) return;                 // gap rows are reviewed as gaps
      const g=catGroup(r);
      const size=String(r.size||"").trim();
      if(!size){ out.push({idx:idx,kind:"empty",row:r,options:g||[]}); return; }
      if(!g){ out.push({idx:idx,kind:"nogroup",row:r,options:[]}); return; }
      const hit=g.some(function(s){ return _mkey(s)===_mkey(size); });
      if(!hit){
        // Same size, different spacing — call it out as the near-miss it is, not a mystery.
        const spacing=g.some(function(s){ return _mnorm(s)===_mnorm(size); });
        out.push({idx:idx,kind:spacing?"spacing":"unknown",row:r,options:g});
      }
    });
    return out;
  }
  // The same gate for fittings, and it checks the ONE thing that cannot be fixed after the
  // fact: a fitting whose TYPE is not in the catalog. Everything else the commit now resolves
  // for itself — names become ids, an existing detail row is matched, a missing one is created
  // — but a type the Fitting_Type table has never heard of has no id to give, so that fitting
  // is refused at commit and never reaches the project. Silently losing a fitting off a quote
  // is the failure this whole chain was built to stop, so it gets named before approve, while
  // the pickers are still on screen and it costs one click to fix.
  function fittingProblems(fittings){
    if(!FITCAT||FITCAT_ERR) return [];       // catalog never loaded — don't warn about phantoms
    const out=[];
    (fittings||[]).forEach(function(f,idx){
      if(f.fitting_type_id) return;
      const nm=String(f.fitting_type==null?"":f.fitting_type).trim();
      if(!nm){ out.push({idx:idx,row:f,why:"no fitting type"}); return; }
      if(!fitIdOf(FITCAT.types,nm,'type')) out.push({idx:idx,row:f,why:'"'+nm+'" is not a fitting type in your catalog'});
    });
    return out;
  }
  function materialCardHtml(rows){
    const probs=materialProblems(rows);
    if(!CATALOG) return "";
    if(!CATALOG_ERR && !probs.length) return "";
    const row=function(p){
      const r=p.row;
      const why = p.kind==="empty" ? "No material — the take-off couldn’t put a size to this member."
        : p.kind==="nogroup" ? "No catalog sizes for <b>"+esc(r.form_type||"(no form type)")+" · "+esc(r.material_type||"(no material type)")+
            "</b> — fix the form/material type first (via “Tell the AI”), then pick a size."
        : p.kind==="spacing" ? "<b>"+esc(r.size)+"</b> is your catalog’s size written differently — the import matches on the "+
            "exact string, so take the catalog spelling below."
        : "<b>"+esc(r.size)+"</b> isn’t in your catalog for "+esc(r.form_type)+" · "+esc(r.material_type)+".";
      const near=nearestSizes(r,5);
      const opts=p.options.length
        ? '<select id="matsel'+p.idx+'">'+p.options.map(function(s){
            return '<option value="'+esc(s)+'"'+(near[0]===s?" selected":"")+">"+esc(s)+"</option>"; }).join("")+"</select>"+
          ' <button class="applybtn" onclick="applyMaterial('+p.idx+')">Use this</button>'
        : "";
      // Same trap as the decision options, and worse here: a size almost always carries a
      // double quote (1/2", 4 x 3 x 5/16"). Only single quotes were escaped, so the double
      // quote ended the onclick attribute and the button did nothing. The value is stashed on
      // the element and read back on click, so nothing depends on quoting at all.
      const quick=near.slice(0,3).map(function(s,qi){
        MATQUICK[p.idx+":"+qi]=s;
        return '<button class="applybtn" style="background:#fff;color:var(--ink);border:1px solid #cdd3da" '+
          'onclick="applyMaterialQuick('+p.idx+','+qi+')">'+esc(s)+"</button>"; }).join(" ");
      return '<div class="matrow"><div><b>'+esc(r.component||"—")+"</b> · "+esc(r.source_sheet||"no sheet")+
        " · qty "+esc(r.quantity)+'</div><div class="src">'+why+"</div>"+
        (quick?'<div class="matquick">Nearest in your catalog: '+quick+"</div>":"")+
        (opts?'<div class="matquick">'+opts+"</div>":"")+"</div>";
    };
    // The catalog never arrived, so NOTHING here was actually checked. Say that once, instead of
    // accusing every row of a fault the catalog would probably have cleared.
    if(CATALOG_ERR){
      return '<div class="card" style="border-color:#f0d3a8"><h2 style="color:#9a6400">⚠ Material check '+
        '<span class="lt">— could not run</span></h2><div class="body"><div class="src">'+
        esc(CATALOG_ERR)+'</div></div></div>';
    }
    return '<div class="card" style="border-color:#f3c2c2"><h2 style="color:var(--red)">⚠ Material check '+
      '<span class="lt">— '+probs.length+" row"+(probs.length===1?"":"s")+" can’t import as-is</span></h2>"+
      '<div class="body"><div class="src" style="margin-bottom:8px">These rows have no material, or a material that isn’t in '+
      "your catalog. Fix them here and they’ll import clean — leave them and they land in staging as errors.</div>"+
      probs.map(row).join("")+"</div></div>";
  }
  // Nearest-size suggestions, keyed "rowIndex:buttonIndex". Holding the value here rather than
  // in the markup is what keeps a size like 4 x 3 x 5/16" from breaking its own button.
  const MATQUICK = {};
  function applyMaterialQuick(idx,qi){
    const v = MATQUICK[idx+":"+qi];
    if(v==null) return;
    applyMaterialValue(idx,v);
  }
  function applyMaterialValue(idx,val){
    const R=loadResult(); if(!R.rows||!R.rows[idx]) return;
    const was=String(R.rows[idx].size||"");
    R.rows[idx].size=val;
    if(!(Number(R.rows[idx].confidence)>0.5)) R.rows[idx].confidence=0.5;   // a human chose it
    recomputeCsv(R); saveResult(R); render();
    // "What the AI called it" → "what this shop calls it", for a real Form × Material. That pair is
    // the same thing the Material_Alias table exists to hold, and it stops the next take-off making
    // the identical miss.
    if(was && val && was!==val){
      captureCorrection({ context: (R.rows[idx].form_type||"") + " · " + (R.rows[idx].material_type||"") + " · " + was,
                          ai_value: was, human_value: val, source: "material" });
    }
  }
  function applyMaterial(idx){
    const sel=document.getElementById("matsel"+idx);
    if(sel) applyMaterialValue(idx,sel.value);
  }

  function recomputeCsv(R){ try{ R.import_csv=buildImportCsvJS(R.rows); }catch(e){} }
  // Editing edits the PER-UNIT quantity — the number you read off the drawing. The job total is
  // derived, never typed, so the two can't drift apart.
  function editQty(idx, val){ const R=loadResult(); if(!R.rows||!R.rows[idx]) return;
    const r=R.rows[idx], u=Math.max(1,Math.round(Number(r.units)||1));
    r.quantity=Math.max(0,Number(val)||0); r.qty_per_unit=r.quantity; r.quantity_total=r.quantity*u;
    recomputeCsv(R); saveResult(R); render(); }
  function removeRow(idx){ const R=loadResult(); if(!R.rows||!R.rows[idx]) return; R.rows.splice(idx,1); recomputeCsv(R); saveResult(R); render(); }

  // Download the (resolved/edited) BOM CSV — use it in the existing BOM import flow today.
  function download(name,text){ const b=new Blob([text||""],{type:"text/csv"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(a.href);},2000); }
  function downloadBom(){ const R=loadResult(); download("takeoff-bom-"+(params.project_id||"project")+".csv", R.import_csv); }

  function setBusy(msg, cls){ const b=document.getElementById("busy"); if(!b) return; b.className="busy show"+(cls?(" "+cls):""); b.innerHTML=msg; }
  function clearBusy(delay){ setTimeout(function(){ const b=document.getElementById("busy"); if(b) b.className="busy"; }, delay||0); }

  function doRevise(){
    const t=document.getElementById("aiInput").value.trim();
    if(!t && !REVISE_ATTACHMENTS.length){ const e=document.getElementById("aiEcho"); if(e) e.textContent="Type an instruction (or attach a file) first."; return; }
    // If a file is attached but no instruction, default to "reconcile against it".
    const instr = t || "Reconcile the current take-off against the attached document(s): add any members I missed, remove extras, and correct quantities, sizes and specs to match.";
    revise(instr, {});
  }

  // ---- Revise attachments (reference docs the AI reconciles against) ----------
  function fileB64(f){ return new Promise(function(res,rej){ const r=new FileReader();
    r.onload=function(){ const s=String(r.result||""); res(s.slice(s.indexOf(",")+1)); };
    r.onerror=function(){ rej(new Error("read failed")); }; r.readAsDataURL(f); }); }
  async function addReviseFiles(input){
    const files=Array.prototype.slice.call(input.files||[]);
    for(const f of files){
      try{
        const ext=(f.name.split(".").pop()||"").toLowerCase();
        const isImg=/^image\//.test(f.type)||["png","jpg","jpeg","webp","gif"].indexOf(ext)>-1;
        const isPdf=f.type==="application/pdf"||ext==="pdf";
        const isText=["csv","txt"].indexOf(ext)>-1||/^text\//.test(f.type);
        if(f.size>20*1024*1024){ mcAlert("“"+f.name+"” is over 20 MB — attach a smaller file.",{title:"AI Take-off"}); continue; }
        if(isText){ REVISE_ATTACHMENTS.push({kind:"text",name:f.name,text:await f.text()}); }
        else if(isImg){ REVISE_ATTACHMENTS.push({kind:"image",name:f.name,media_type:f.type||"image/png",data:await fileB64(f)}); }
        else if(isPdf){ REVISE_ATTACHMENTS.push({kind:"pdf",name:f.name,media_type:"application/pdf",data:await fileB64(f)}); }
        else { mcAlert("“"+f.name+"” — unsupported type. Use PDF, image, or CSV/TXT. (Excel: save as PDF or CSV first.)",{title:"AI Take-off"}); }
      }catch(e){ mcAlert("Could not read “"+f.name+"”: "+e.message,{title:"AI Take-off"}); }
    }
    input.value="";
    render();
  }
  function removeAttach(i){ REVISE_ATTACHMENTS.splice(i,1); render(); }
  // Paste a screenshot straight into the chat — grab image(s) off the clipboard as attachments.
  function handlePaste(e){
    const items=((e.clipboardData||window.clipboardData||{}).items)||[];
    let grabbed=false;
    for(let i=0;i<items.length;i++){
      const it=items[i];
      if(it && it.type && it.type.indexOf("image/")===0){ const f=it.getAsFile(); if(f){ grabbed=true; addPastedImage(f, it.type); } }
    }
    if(grabbed) e.preventDefault();   // don't dump the raw blob into the text box
  }
  async function addPastedImage(f, mime){
    try{
      if(f.size>20*1024*1024){ mcAlert("Pasted image is over 20 MB — paste a smaller crop.",{title:"AI Take-off"}); return; }
      const keep=(document.getElementById("aiInput")||{}).value;
      const data=await fileB64(f);
      const n=REVISE_ATTACHMENTS.filter(function(a){return a.kind==="image";}).length+1;
      REVISE_ATTACHMENTS.push({kind:"image", name:"screenshot-"+n+".png", media_type:mime||f.type||"image/png", data:data});
      render();
      const inp=document.getElementById("aiInput"); if(inp){ inp.value=keep||""; inp.focus(); }
    }catch(err){ mcAlert("Could not read pasted image: "+err.message,{title:"AI Take-off"}); }
  }
  function attachChipsHtml(){
    return REVISE_ATTACHMENTS.map(function(a,i){
      const icon=a.kind==="image"?"🖼":(a.kind==="text"?"📄":"📕");
      return '<span class="achip">'+icon+" "+esc(a.name)+' <b onclick="removeAttach('+i+')" title="Remove">✕</b></span>';
    }).join("");
  }
  // Per-conflict one-click: apply the AI's recommendation, and remove that conflict deterministically.
  function applyConflict(i){
    const c=CONFLICTS[i]; if(!c) return;
    revise('Resolve the conflict on "'+(c.topic||"")+'": '+(c.recommendation||"use the specification")+
      '. Update the affected BOM rows accordingly. Do not change anything else.', { removeConflict:i });
  }
  // Deterministic dismiss — just remove the gap/conflict note locally (no AI, no BOM change). Instant + reliable.
  function dismissGap(i){ const R=loadResult(); if(!R.synopsis||!Array.isArray(R.synopsis.gaps)) return; R.synopsis.gaps.splice(i,1); saveResult(R); render(); }
  function dismissConflict(i){ const R=loadResult(); if(!R.synopsis||!Array.isArray(R.synopsis.conflicts)) return; R.synopsis.conflicts.splice(i,1); saveResult(R); render(); }

  // ---- Conversational "Tell the AI" — multi-turn chat that remembers the thread ----------
  function chatThreadHtml(){
    const R=loadResult(); const ch=(R&&R.chat)||[];
    if(!ch.length) return '<div class="chathint">Ask a question about the take-off, or tell me what to change — e.g. “galvanize all exterior angles,” “drop the davit cranes,” “add 4 bollards @ 6ft,” or “what spec did you use for the angles?” I’ll remember the conversation and apply edits to the BOM as we go.</div>';
    return ch.map(function(m){
      if(m.role==="user"){
        return '<div class="cmsg u"><div class="bub">'+esc(m.text)+
          (m.files&&m.files.length?'<div class="cfiles">📎 '+m.files.map(esc).join(", ")+'</div>':'')+'</div></div>';
      }
      const cls = m.pending?"ai pending":(m.err?"ai err":"ai");
      const badge = m.edited?'<span class="cedit">✎ updated the take-off</span>':'';
      const txt = m.pending?'<span class="spin"></span>AI is thinking…':esc(m.text);
      return '<div class="cmsg '+cls+'"><div class="bub">'+txt+badge+'</div></div>';
    }).join("");
  }
  function scrollChatToBottom(){ const el=document.getElementById("chatThread"); if(el) el.scrollTop=el.scrollHeight; }

  // Prepaid meter (Phase 0 = visual only, no charges). Pull the shop's banked balance for the green bar.
  async function fetchAccount(){
    if(!params.manufacturer_id) return;
    try{
      const r=await fetch(RAILWAY_URL+"/api/takeoff/account/"+encodeURIComponent(params.manufacturer_id));
      const d=await r.json();
      if(d&&d.ok){ ACCOUNT=d; render(); }
    }catch(e){ /* non-fatal — bar just omits the balance chip */ }
  }

  async function sendChat(){
    if(window.__chatting) return;
    const inp=document.getElementById("aiInput");
    const t=(inp?inp.value:"").trim();
    if(!t && !REVISE_ATTACHMENTS.length){ if(inp) inp.focus(); return; }
    window.__chatting=true;
    const atNames = REVISE_ATTACHMENTS.length?REVISE_ATTACHMENTS.map(function(a){return a.name;}):null;
    const sentAttach = REVISE_ATTACHMENTS.slice();   // snapshot for this turn
    const R=loadResult(); R.chat=R.chat||[];
    R.chat.push({role:"user", text: t || "(reconcile against the attached file)", files: atNames});
    R.chat.push({role:"ai", pending:true});
    TAB="ai"; try{ sessionStorage.setItem(tabKey(),TAB); }catch(e){}   // the reply lands where you can see it
    saveResult(R); render(); scrollChatToBottom();
    // history for the model = prior turns + this user turn (text only; current package sent fresh below)
    const hist=(loadResult().chat||[]).filter(function(m){return !m.pending;})
      .map(function(m){ return {role: m.role==="ai"?"assistant":"user", text: m.text||""}; });
    const cur=loadResult();
    try{
      const r=await fetch(RAILWAY_URL+"/api/takeoff/chat",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({project_id:params.project_id,manufacturer_id:params.manufacturer_id,model:"sonnet",
          messages:hist, current:{rows:cur.rows,fittings:cur.fittings,synopsis:cur.synopsis}, attachments:sentAttach})});
      const data=await r.json();
      const R2=loadResult(); R2.chat=(R2.chat||[]).filter(function(m){return !m.pending;});
      if(!r.ok||data.ok===false){
        const m=String(data.error||("HTTP "+r.status));
        const friendly=(m.indexOf("rate_limit")>-1||m.indexOf("429")>-1)?"Material Compass AI is rate limited — wait ~60s and try again.":m;
        R2.chat.push({role:"ai", err:true, text:"⚠ "+friendly}); saveResult(R2); render(); scrollChatToBottom(); window.__chatting=false; return;
      }
      if(data.edited){
        const merged=mergeResult(R2, data, {});               // apply rows/synopsis/csvs
        merged.chat=R2.chat.concat([{role:"ai", edited:true, text: data.reply||data.notes||"Updated the take-off."}]);
        saveResult(merged);
        REVISE_ATTACHMENTS=[];                                  // consumed
        // THE MOST VALUABLE CORRECTION THERE IS, and it used to evaporate with the session. An
        // instruction like "WEIGHT PER FOOT=21.40 means MC8 x 21.4 — apply to all channels" isn't a
        // one-off fix: it's a rule about how THIS customer's documents are written, and it will be
        // true of every package they send. Captured the moment it lands, with what the AI actually
        // did in response, so the next take-off starts from it.
        captureCorrection({ context: t, ai_value: "", human_value: data.reply||data.notes||"", source: "instruction" });
      } else {
        R2.chat.push({role:"ai", text: data.reply||"(no reply)"}); saveResult(R2);
      }
      render(); scrollChatToBottom();
    }catch(e){
      const R3=loadResult(); R3.chat=(R3.chat||[]).filter(function(m){return !m.pending;});
      R3.chat.push({role:"ai", err:true, text:"⚠ Network error: "+e.message}); saveResult(R3); render(); scrollChatToBottom();
    }
    window.__chatting=false;
  }

  // A synopsis section is kept from the revise ONLY if it came back populated; otherwise the original is
  // preserved (the model sometimes omits unchanged sections on a small edit — never let them vanish).
  function _has(v){ return v && (Array.isArray(v) ? v.length>0 : (typeof v==="object" ? Object.values(v).some(function(x){return Array.isArray(x)?x.length:x;}) : true)); }
  // A revise returns the COMPLETE rows, and the model routinely drops `confidence` from rows it
  // didn't change — on 2026-09-28 all 37 came back without one and every row read 0.00, red.
  // Carry the score across from the matching current row; a row with no match keeps none.
  function rowIdentity(r){
    return [r&&r.form_type,r&&r.size,r&&r.specification,r&&r.component,r&&r.source_sheet]
      .map(function(v){ return String(v==null?'':v).trim().toLowerCase(); }).join('|');
  }
  // What the server read straight off a text parts list, and which of the AI's rows that replaced.
  // Shown so a replaced row is never a silent loss: if the AI read something the list does not
  // carry, it is here to see and add back by hand.
  function partsListCardHtml(pl){
    if(!pl||!pl.rows_from_list) return "";
    const rep=arr(pl.replaced), skip=arr(pl.not_steel);
    const dims=function(r){ return (Number(r.quantity)||0)+" × "+(Number(r.length_ft)||0).toFixed(2)+" ft"; };
    return '<div class="card"><h2>📋 Parts list — read directly <span class="src" style="font-weight:400">'+esc(pl.document)+'</span></h2><div class="body">'+
      '<div><b>'+pl.rows_from_list+' steel rows</b> ('+esc(pl.forms.join(", "))+', '+pl.list_feet+' ft) came straight off the parts list — '+
      'item, part number and page are on each row, and they are marked confidence 1.00 because nothing was interpreted. '+
      'Plates and anything not on the list are the AI\'s read of the drawings.</div>'+
      (rep.length?'<details style="margin-top:8px"><summary>'+rep.length+' AI row'+(rep.length===1?'':'s')+' replaced ('+pl.ai_feet_replaced+' ft)</summary><ul>'+
        rep.map(function(r){ return '<li>'+esc(r.form_type)+' '+esc(r.size)+' — '+dims(r)+(r.source_sheet?' <span class="src">'+esc(r.source_sheet)+'</span>':'')+
          (r.note?'<br><span class="src">'+esc(r.note)+'</span>':'')+'</li>'; }).join("")+
        '</ul><div class="src">If one of these is real and not on the parts list, add it back in the BOM editor.</div></details>':'')+
      (skip.length?'<details style="margin-top:6px"><summary>'+skip.length+' raw-stock line'+(skip.length===1?'':'s')+' on the list not taken off as steel</summary><ul>'+
        skip.map(function(x){ return '<li>'+esc(x.item)+' · '+esc(x.qty)+' · '+esc(x.desc)+' <span class="src">p.'+esc(x.page)+'</span></li>'; }).join("")+
        '</ul></details>':'')+
    '</div></div>';
  }
  function carryRowConfidence(curRows,newRows){
    if(!Array.isArray(newRows)) return newRows;
    const pool={};
    arr(curRows).forEach(function(r){ const k=rowIdentity(r); (pool[k]=pool[k]||[]).push(r); });
    return newRows.map(function(r){
      if(r && typeof r.confidence==="number") return r;
      const hit=(pool[rowIdentity(r)]||[]).shift();
      return (hit && typeof hit.confidence==="number") ? Object.assign({},r,{confidence:hit.confidence}) : r;
    });
  }
  function mergeResult(cur, data, opts){
    const os=cur.synopsis||{}, rs=data.synopsis||{};
    let conflicts;
    if(opts.removeConflict!=null && Array.isArray(os.conflicts)){
      conflicts = os.conflicts.filter(function(_,i){ return i!==opts.removeConflict; }); // deterministic removal
    } else {
      conflicts = (rs.conflicts!==undefined) ? rs.conflicts : (os.conflicts||[]);
    }
    const syn={
      project:       _has(rs.project)?rs.project:os.project,
      scope_of_work: _has(rs.scope_of_work)?rs.scope_of_work:os.scope_of_work,
      decisions:     _has(rs.decisions)?rs.decisions:os.decisions,
      reconciliation:_has(rs.reconciliation)?rs.reconciliation:os.reconciliation,
      gaps:          (rs.gaps!==undefined)?rs.gaps:(os.gaps||[]),  // honor an explicit [] (user cleared gaps); fall back only when omitted
      conflicts:     conflicts,
      compliance:    _has(rs.compliance)?rs.compliance:os.compliance,
      totals:        _has(rs.totals)?rs.totals:os.totals,
      confidence:    _has(rs.confidence)?rs.confidence:os.confidence,
      parts_list:    os.parts_list,   // set by the server's parts-list read; the AI never owns it
      drawing_scope: _has(rs.drawing_scope)?rs.drawing_scope:os.drawing_scope,
    };
    return Object.assign({},cur,{rows:carryRowConfidence(cur.rows,data.rows),fittings:mergeFittings(cur.fittings,data.fittings),
      synopsis:syn,import_csv:data.import_csv,verify_csv:data.verify_csv});
  }

  // ---- keeping what the estimator picked, across an AI revise ----------------
  // The AI returns the COMPLETE package, so a naive assignment would throw away every
  // size·class row picked by hand — the slowest work on the page, and the one thing the
  // AI was never shown well enough to re-pick. An omitted `fittings` means the instruction
  // had nothing to do with them, so the current ones stand untouched.
  //
  // When fittings DO come back, each returned one is matched to the current one describing
  // the same fitting, and the resolved catalog row is carried across unless the AI changed
  // something that would invalidate it. Anything left without a pick is re-resolved by
  // autoResolveFittings() on the next render, so a genuine change still re-matches.
  function fitIdentity(f){
    return [f&&f.fitting_type,f&&f.fitting_make,f&&f.end_type,f&&f.connection_type,
            f&&f.specification,f&&f.size,f&&f.schedule_or_class]
      .map(function(v){ return String(v==null?'':v).trim().toLowerCase(); }).join('|');
  }
  function mergeFittings(curFit,newFit){
    if(newFit===undefined||newFit===null) return curFit;      // omitted = unchanged
    if(!Array.isArray(newFit)) return curFit;
    const byId={}; arr(curFit).forEach(function(f){ const k=fitIdentity(f); if(!byId[k]) byId[k]=f; });
    return newFit.map(function(f){
      const was=byId[fitIdentity(f)];
      if(!was||!was.detail_id) return f;
      return Object.assign({},f,{detail_id:was.detail_id,detail_table:was.detail_table,
        detail_label:was.detail_label,
        // The weight belongs to the catalog row, so it travels with the pick — but only when
        // the AI did not state one of its own.
        weight:(f.weight==null?was.weight:f.weight),
        auto_matched:was.auto_matched});
    });
  }

  // The 3c revise loop — global status bar + button locking so it's obvious something is happening.
  async function revise(instruction, opts){
    opts = opts || {};
    if(window.__revising) return;
    window.__revising = true;
    document.querySelectorAll(".applybtn,#reviseBtn").forEach(function(b){ b.disabled=true; });
    let secs=0;
    const fmt=function(){ const m=Math.floor(secs/60), s=secs%60; return m+":"+(s<10?"0":"")+s; };
    const msg=function(){ return "&#10227; Revising your take-off… "+fmt()+" &nbsp;·&nbsp; large projects can take 1–2 min — please wait, don't close"; };
    setBusy(msg());
    const tick=setInterval(function(){ secs++; setBusy(msg()); }, 1000);
    const stop=function(){ clearInterval(tick); window.__revising=false; };
    const reenable=function(){ document.querySelectorAll(".applybtn,#reviseBtn").forEach(function(b){ b.disabled=false; }); };
    const cur=loadResult();
    try{
      const r=await fetch(RAILWAY_URL+"/api/takeoff/revise",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({project_id:params.project_id,manufacturer_id:params.manufacturer_id,
          instruction:instruction,model:"sonnet",current:{rows:cur.rows,fittings:cur.fittings,synopsis:cur.synopsis},
          attachments:REVISE_ATTACHMENTS})});
      const data=await r.json();
      if(!r.ok||data.ok===false){
        stop(); reenable();
        const m=String(data.error||("HTTP "+r.status));
        const friendly = m.indexOf("rate_limit")>-1 || m.indexOf("429")>-1
          ? "Material Compass AI is rate limited — wait ~60s and try again."
          : esc(m);
        setBusy("⚠ Revise failed: "+friendly,"err"); clearBusy(8000); return;
      }
      const merged=mergeResult(cur, data, opts);
      saveResult(merged);
      REVISE_ATTACHMENTS = [];  // consumed — clear so they don't re-send on the next revise
      stop();
      render(); // rebuilds the page (re-enables the buttons)
      window.scrollTo({top:0,behavior:"smooth"});
      const what = (data.notes && String(data.notes).trim()) ? esc(data.notes) : "package updated";
      setBusy("✓ "+what+" &nbsp;·&nbsp; "+fmt()+", $"+(data.cost_usd!=null?data.cost_usd:"?"),"ok"); clearBusy(9000);
    }catch(e){
      stop(); reenable();
      setBusy("⚠ Network error: "+esc(e.message),"err"); clearBusy(8000);
    }
  }

  // ---- 3a Zoho write (BOM → staging) -----------------------------------------
  // Commit via Railway — the widget runs standalone (no Creator SDK context), so the Zoho
  // write (create record → upload CSV → set Run_Import) happens server-side using the app's OAuth.
  async function submitToZoho(importCsv, proj, mfg){
    const r=await fetch(RAILWAY_URL+"/api/takeoff/commit",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({project_id:proj,manufacturer_id:mfg,import_csv:importCsv})});
    const data=await r.json();
    if(!r.ok||data.ok===false) throw new Error(data.error||("HTTP "+r.status));
    return data.import_id;
  }
  // ONE correction, stored the moment it happens. Fire-and-forget on purpose: learning must never
  // be able to interrupt or fail the estimator's work. `source` says what kind it is, because the
  // three kinds are used differently in the next take-off's prompt — a decision is a preference, an
  // instruction is a standing rule, a material fix is this shop's word for a size.
  function captureCorrection(c){
    try{
      if(!params.manufacturer_id || !c || !String(c.context||"").trim()) return;
      const R=loadResult();
      if(R.__demo) return;                                   // never learn from the sample
      const ptype=(R.synopsis && R.synopsis.project && R.synopsis.project.type)||"";
      fetch(RAILWAY_URL+"/api/takeoff/learn",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ manufacturer_id:params.manufacturer_id, project_type:ptype, corrections:[c] })})
        .catch(function(){});
    }catch(e){}
  }

  // Capture this shop's decisions so future take-offs pre-apply their preferences (Tier-3 learning).
  function captureLearning(){
    try{
      if(!params.manufacturer_id) return;
      const R=loadResult();
      const ptype=(R.synopsis && R.synopsis.project && R.synopsis.project.type)||"";
      const corrections=DECISIONS.filter(function(d){return d.sel;}).map(function(d){
        return { context:d.item, ai_value:d.rec||"", human_value:d.sel, source:"decision" };
      });
      if(!corrections.length) return;
      fetch(RAILWAY_URL+"/api/takeoff/learn",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ manufacturer_id:params.manufacturer_id, project_type:ptype, corrections:corrections })}).catch(function(){});
    }catch(e){}
  }

  async function approve(){
    const R=loadResult();
    // Soft-gate: if the drawings reference components not on the project, they'll import with a
    // blank Component link. Warn (don't block) — mirrors the "your call" decisions philosophy.
    if(!R.__demo && params.project_id && PROJECT_SCOPE){
      const un=reconcile('component').takeoffOnly;
      if(un.length){
        const names=un.slice(0,6).map(function(t){return "• "+t.value;}).join("\n")+(un.length>6?"\n…":"");
        if(!(await mcConfirm(un.length+" component"+(un.length===1?"":"s")+" the drawings reference aren't on your project:\n\n"+names+"\n\nTheir material and labor will land without a component link. Map or add them on the Checks tab (Scope Reconciliation), or continue anyway?",{title:"Approve & Submit",okText:"Continue anyway",cancelText:"Go back"}))){ setTab("checks"); return; }
      }
    }
    // Material that can't resolve becomes an error row in staging — say so before committing.
    const matProbs=materialProblems(arr(R.rows));
    if(matProbs.length){
      const list=matProbs.slice(0,6).map(function(p){
        return "• "+(p.row.component||"—")+" · "+(p.row.form_type||"")+" · "+(p.row.size?('"'+p.row.size+'"'):"(no material)");
      }).join("\n")+(matProbs.length>6?"\n…":"");
      if(!(await mcConfirm(matProbs.length+" row"+(matProbs.length===1?"":"s")+" have a material your catalog doesn't have:\n\n"+
        list+"\n\nThey'll land in staging as errors. Fix them on the Checks tab, or continue anyway?",{title:"Approve & Submit",okText:"Continue anyway",cancelText:"Go back"}))){ setTab("checks"); return; }
    }
    // A fitting whose type the catalog does not have cannot be written at all — it would be
    // dropped, not mispriced. Say so plainly, because "continue anyway" means the quote goes
    // out short of those fittings.
    const fitProbs=fittingProblems(arr(R.fittings));
    if(fitProbs.length){
      const flist=fitProbs.slice(0,6).map(function(p){
        return "• "+(p.row.component||"—")+" · "+(p.row.fitting_type||"(no type)")+
               (p.row.size?' '+p.row.size:"")+" — "+p.why;
      }).join("\n")+(fitProbs.length>6?"\n…":"");
      if(!(await mcConfirm(fitProbs.length+" fitting"+(fitProbs.length===1?"":"s")+" cannot be put on the project:\n\n"+
        flist+"\n\nSet the type on the Fittings tab and they'll link themselves. Continue without them?",
        {title:"Approve & Submit",okText:"Continue without them",cancelText:"Go back"}))){ setTab("fittings"); return; }
    }
    const ap=document.getElementById("approve"); ap.disabled=true;
    const c=document.getElementById("commit"); c.style.display="block";
    const picks=DECISIONS.map(d=>'• '+esc(d.item)+'  →  <b>'+esc(d.sel)+'</b>').join("<br>")||"(none)";
    if(!R.__demo && R.import_csv && params.project_id){
      c.innerHTML='<span class="spin"></span>Committing BOM to staging…';
      try{
        const recId = await submitToZoho(R.import_csv, params.project_id, params.manufacturer_id);
        captureLearning();  // store this shop's decisions for future take-offs (best-effort)
        // The drawings move onto the project HERE, at approval — until now they lived in
        // the project's own file store, where the estimator could close this page and come
        // back to them. Each sheet's PDF goes on its own drawing record. Best-effort: the
        // BOM is already committed and a refused upload must not read as a failed approval.
        let att=null;
        try{
          const dmap=arr(R.drawing_files);
          if(dmap.length){
            c.innerHTML='<span class="spin"></span>Putting the drawings on the project…';
            const ar=await fetch(RAILWAY_URL+"/api/takeoff/attach-drawings",{method:"POST",headers:{"Content-Type":"application/json"},
              body:JSON.stringify({project_id:params.project_id, map:dmap})});
            att=await ar.json();
          }
        }catch(e){ console.error("[attach-drawings]",e); }
        // The fittings go on the project HERE too. Until this existed they were found, shown,
        // corrected — and then dropped at approve, which is why nothing downstream of the
        // take-off ever saw a fitting. Best-effort, like the drawings: the BOM is already
        // committed and a refused fitting must not read as a failed approval.
        let fit=null;
        try{
          const fl=arr(R.fittings);
          if(fl.length && params.project_id){
            c.innerHTML='<span class="spin"></span>Putting the fittings on the project…';
            const fr=await fetch(RAILWAY_URL+"/api/takeoff/commit-fittings",{method:"POST",headers:{"Content-Type":"application/json"},
              body:JSON.stringify({project_id:params.project_id, manufacturer_id:params.manufacturer_id, fittings:fl})});
            fit=await fr.json();
          }
        }catch(e){ console.error("[commit-fittings]",e); }
        // Labor hours onto the project, one record per component. Best-effort like the fittings.
        // The ids come back and are kept, so approving again replaces THESE rows and no others.
        let lab=null;
        try{
          const L=R.labor;
          if(L && arr(L.components).length && params.project_id){
            c.innerHTML='<span class="spin"></span>Putting the labor hours on the project…';
            const lr=await fetch(RAILWAY_URL+"/api/takeoff/commit-labor",{method:"POST",headers:{"Content-Type":"application/json"},
              body:JSON.stringify({project_id:params.project_id, manufacturer_id:params.manufacturer_id,
                prior_ids:arr(L.written).map(function(w){ return w.id; }),
                components:L.components.map(function(x){ return {name:x.name, items:arr(x.items).map(function(i){ return {bucket:i.bucket,hours:i.hours}; })}; })})});
            lab=await lr.json();
            if(lab&&lab.ok){ const R3=loadResult(); if(R3.labor){ R3.labor.written=arr(lab.written); saveResult(R3); } }
          }
        }catch(e){ console.error("[commit-labor]",e); lab={ok:false,error:e.message}; }
        window._LAB_COMMIT=lab;
        // Clarifications onto the project, for the quote. Best-effort like the rest.
        let qn=null;
        try{
          const text=quoteNotesText(loadResult());
          if(text && params.project_id){
            c.innerHTML='<span class="spin"></span>Putting the quote clarifications on the project…';
            const qr=await fetch(RAILWAY_URL+"/api/takeoff/commit-clarifications",{method:"POST",headers:{"Content-Type":"application/json"},
              body:JSON.stringify({project_id:params.project_id, text:text})});
            qn=await qr.json();
            qn.count=text.split("\n").filter(function(l){ return /^\d+\. /.test(l); }).length;
          }
        }catch(e){ console.error("[commit-clarifications]",e); qn={ok:false,error:e.message}; }
        window._QN_COMMIT=qn;
        if(Z.REVIEW_PAGE){
          c.innerHTML='<b>✓ BOM sent to staging.</b> Opening the review…'+commitList(picks,att,fit);
          const url=Z.REVIEW_PAGE+"?import_id="+encodeURIComponent(recId||"")+"&project_id="+encodeURIComponent(params.project_id)+"&client_id="+encodeURIComponent(params.manufacturer_id||"");
          setTimeout(()=>window.open(url,"_top"),1200);
        } else {
          c.innerHTML='<b>✓ BOM sent to staging review.</b> Open your project’s BOM staging to review &amp; Import Approved Rows.'+commitList(picks,att,fit);
        }
      }catch(e){ ap.disabled=false; c.innerHTML='<b style="color:var(--red)">Commit failed:</b> '+esc(e.message); }
    } else {
      // standalone / SAMPLE — show what WOULD commit
      c.innerHTML='<b>✓ Approved — this is what would commit:</b>'+commitList(picks)+
        '<div class="src" style="margin-top:8px">(Design preview — not connected to a project, nothing written.)</div>';
    }
    c.scrollIntoView({behavior:"smooth"});
  }
  function commitList(picks,att,fit){
    // Say what actually happened to the drawings rather than claiming it in the abstract:
    // "skipped" means a record already had a file on it and was deliberately left alone.
    let dl='<li><b>Drawings</b> → the PDFs stay on the project\'s file store <span class="src">(none mapped to sheets)</span></li>';
    if(att && att.ok){
      const bits=[];
      if(att.attached) bits.push(att.attached+' PDF'+(att.attached===1?'':'s')+' put on their drawing records');
      if(att.skipped)  bits.push(att.skipped+' already had a file — left alone');
      if(arr(att.failed).length)  bits.push(arr(att.failed).length+' could not be attached');
      if(arr(att.missing).length) bits.push(arr(att.missing).length+' had no drawing record on the project');
      dl='<li><b>Drawings</b> → '+(bits.length?esc(bits.join(' · ')):'nothing to attach')+'</li>';
    }
    return '<ul>'+
      '<li><b>BOM</b> → CSV Import Tool → staging review</li>'+
      dl+
      // Say what actually happened to the fittings, including what was refused and why — a
      // fitting silently missing from the project is the failure this whole thread was about.
      (function(){
        if(!fit) return '<li><b>Fittings</b> → <span class="src">none on this take-off</span></li>';
        if(fit.ok===false) return '<li><b>Fittings</b> → <span style="color:var(--red)">could not be written: '+esc(fit.error||'')+'</span></li>';
        const bits=[];
        if(fit.written) bits.push(fit.written+' written to the project\'s fittings quote');
        // Matched server-side from names alone — these are the ones that used to be dropped
        // because ids only existed when a human picked from a dropdown.
        if(arr(fit.matched).length) bits.push(arr(fit.matched).length+' matched to catalog rows automatically');
        // A catalog row created here is not a warning — it is the fitting becoming priceable.
        // Say it plainly, because these rows are provisional and somebody should confirm them.
        if(arr(fit.provisional).length) bits.push(arr(fit.provisional).length+' new catalog row'+(arr(fit.provisional).length===1?'':'s')+' created so they carry a Fitting ID');
        if(arr(fit.skipped).length) bits.push(arr(fit.skipped).length+' refused (not matched to a catalog fitting)');
        if(arr(fit.failed).length)  bits.push(arr(fit.failed).length+' failed');
        let li='<li><b>Fittings</b> → '+(bits.length?esc(bits.join(' · ')):'nothing to write');
        // Without a Fitting ID a fitting prices at $0 on the component and looks free rather
        // than looks missing. Name them here; this is the only moment anyone is looking.
        const noId=arr(fit.no_fitting_id);
        if(noId.length) li+='<div class="src" style="margin-left:14px;color:var(--amber,#b26b00)">'+
          noId.length+' went on without a Fitting ID — they will price at $0 until one is set:<br>'+
          noId.slice(0,6).map(function(b){ return '• '+esc(b.what||'(unnamed)')+(b.why?' — '+esc(b.why):''); }).join('<br>')+
          (noId.length>6?'<br>…':'')+'</div>';
        const bad=arr(fit.skipped).concat(arr(fit.failed));
        if(bad.length) li+='<div class="src" style="margin-left:14px">'+
          bad.slice(0,6).map(function(b){ return '• '+esc(b.what||'(unnamed)')+(b.why?' — '+esc(b.why):''); }).join('<br>')+
          (bad.length>6?'<br>…':'')+'</div>';
        return li+'</li>';
      })()+
      (function(){
        const L=loadResult().labor, lab=window._LAB_COMMIT;
        if(!L||!arr(L.components).length) return '<li><b>Labor</b> → <span class="src">no hours on this take-off</span></li>';
        if(!lab) return '<li><b>Labor</b> → '+labFmt(labJob(L),1)+' hrs <span class="src">(written on approve for a real project)</span></li>';
        if(lab.ok===false) return '<li><b>Labor</b> → <span style="color:var(--red)">could not be written: '+esc(lab.error||'')+'</span></li>';
        let li='<li><b>Labor</b> → '+labFmt(lab.total_hours,1)+' hrs on '+arr(lab.written).length+' component'+(arr(lab.written).length===1?'':'s')+
          (lab.replaced?' <span class="src">(replaced the '+lab.replaced+' row'+(lab.replaced===1?'':'s')+' the last approve wrote)</span>':'');
        // A rate the rates report does not show stood in at the average — say which, so it gets fixed.
        if(arr(lab.rates_estimated).length) li+='<div class="src" style="margin-left:14px;color:var(--amber,#b26b00)">'+
          esc(arr(lab.rates_estimated).join(', '))+' rate'+(lab.rates_estimated.length===1?'':'s')+' not visible in the shop\'s rates report — priced at the average of the others. Add those columns to All_Manufacture_Labor_Rates.</div>';
        // Hours for a labor type this shop does not perform would sit in a hidden column; they moved.
        if(arr(lab.folded).length) li+='<div class="src" style="margin-left:14px">'+arr(lab.folded).slice(0,6).map(function(m){
          return '• '+esc(m.component)+': '+labFmt(m.hours,1)+' h '+esc(m.from)+' → '+esc(m.to)+' <span class="src">(your shop doesn\'t list '+esc(m.from)+')</span>'; }).join('<br>')+'</div>';
        const bad=arr(lab.skipped).concat(arr(lab.failed));
        if(bad.length) li+='<div class="src" style="margin-left:14px">'+bad.slice(0,6).map(function(b){ return '• '+esc(b.what)+' — '+esc(b.why); }).join('<br>')+(bad.length>6?'<br>…':'')+'</div>';
        return li+'</li>';
      })()+
      '<li><b>Buyout</b> → outsource / RFQ subform <span class="src">(WIRE)</span></li>'+
      '<li><b>Scope of Work</b> → project record <span class="src">(WIRE: Save_Scope_Of_Work)</span></li>'+
      (function(){
        const n=arr(loadResult().quote_notes).filter(function(x){ return x.include && noteText(x); }).length;
        const q=window._QN_COMMIT;
        if(!n) return '<li><b>Quote clarifications</b> → <span class="src">none on this take-off</span></li>';
        if(!q) return '<li><b>Quote clarifications</b> → '+n+' line'+(n===1?'':'s')+' <span class="src">(written to the project on approve)</span></li>';
        if(q.ok===false) return '<li><b>Quote clarifications</b> → <span style="color:var(--red)">not written: '+esc(q.error||'')+'</span>'+
          ' <span class="src">— they\'re saved with the take-off; use "copy all" on the Overview tab meanwhile.</span></li>';
        return '<li><b>Quote clarifications</b> → '+(q.count||n)+' line'+((q.count||n)===1?'':'s')+' written to the project\'s Quote Clarifications</li>';
      })()+
      '<li><b>Totals + confidence</b> → Takeoff_Log <span class="src">(WIRE)</span></li>'+
      '</ul><div style="margin-top:8px">Decisions recorded:<br>'+picks+'</div>';
  }

  // ---- SAMPLE (Alden) — used when no live result is present -------------------
  const SAMPLE = {
    __demo:true,
    cost_usd:0.91,
    import_csv:"(sample — real result carries the generated CSV here)",
    rows:[
      {form_type:"Beam - W",size:"W12 x 26",specification:"A992",quantity:8,length_ft:24,source_sheet:"S-201",confidence:0.95},
      {form_type:"Beam - W",size:"W8 x 24",specification:"A992",quantity:12,length_ft:6.33,source_sheet:"S-204",confidence:0.92,galvanized:true},
      {form_type:"Angle",size:"L4 x 4 x 1/4",specification:"A36",quantity:22,length_ft:3,source_sheet:"S-205",confidence:0.90},
      {form_type:"Channel - MC",size:"MC8 x 8.5",specification:"A36",quantity:4,length_ft:12,source_sheet:"S-203",confidence:0.62},
      {form_type:"Plate",size:'1/2"',specification:"A36",quantity:6,length_ft:1,width_ft:1,source_sheet:"S-501",confidence:0.55},
      {form_type:"Beam - W",size:"W16 x 40",specification:"A992",quantity:5,length_ft:28,source_sheet:"S-201",confidence:0.88},
      {form_type:"Pipe",size:'6" SCH 80 (XS)',specification:"A53 Gr B",quantity:0,length_ft:0,source_sheet:"C-101",confidence:0.30,note:"GAP — bollard count"},
    ],
    synopsis:{
      project:{name:"Alden Intermediate School",type:"K-12 / institutional",
        sheets_read:["S-101","S-201","S-204","A-220","Spec 05 12 00","Spec 05 50 00"],
        summary:"Structural steel + misc metals for a 2-story addition"},
      scope_of_work:{
        fabricate:["Primary W framing","Lintels (12)","Stair stringers & pans","Embed plates"],
        buyout:["Bar grating + frames","Pipe railings"], by_others:["Precast plank","CIP concrete"],
        send_out:["Hot-dip galv: 12 exterior lintels / shelf angles"]},
      decisions:[
        {id:"d1",item:"4 davit cranes on S-301 — in fab scope?",where:"S-301",
          why_flagged:"Could be our fabrication or a vendor-supplied unit.",options:["Include","Skip"],ai_recommendation:"Skip"},
        {id:"d2",item:"Masonry ledger angle — continuous or clips?",where:"S-204 / Spec 05 50 00",
          why_flagged:"Drawing shows continuous; spec permits clip angles.",options:["Continuous","Clips"],ai_recommendation:"Continuous"},
        {id:"d3",item:"Stainless hardware noted on A-220 — our scope?",where:"A-220",
          why_flagged:"Hardware callout with no supplier assigned.",options:["Yes","No"],ai_recommendation:""},
      ],
      gaps:[
        {item:"Loose lintels — L-schedule not in set",where:"A-601",suggested_action:"Pull arch lintel schedule"},
        {item:"OH coiling door frames",where:"A-220",suggested_action:"Confirm frame sizes"},
        {item:"Bollard count + length",where:"C-101",suggested_action:"Confirm from civil"},
      ],
      conflicts:[
        {topic:"Lintel finish",drawing_says:"prime",spec_says:"galvanize (ext)",recommendation:"Galvanize per 05 50 00 §2.3"},
      ],
      compliance:[
        {topic:"BABA / AIS",note:"Domestic content required — Spec 00 73 00 / 7 CFR 1792"},
        {topic:"Finish",note:"Interior = shop prime · exterior = hot-dip galvanized"},
      ],
      totals:{fab_rows:52,est_weight_lb:2140,gap_count:6,low_conf_count:3},
      confidence:{overall:0.84,scope:0.9,bom:0.82,gaps:0.5},
    },
  };

  // Arriving from the uploader the result is in sessionStorage — mirror it to localStorage
  // (keyed by project) so closing & reopening this page restores it instead of losing the run.
  (function(){ try{ const s=sessionStorage.getItem("takeoff_result"); const k=lsKey(); if(s&&k){ const R=JSON.parse(s); if(sameProj(R)) localStorage.setItem(k,s); } }catch(e){} })();
  // "New take-off" link → back to the uploader for this project
  (function(){ const lk=document.getElementById("newRun"); if(lk && params.project_id){ lk.href="index.html?project_id="+encodeURIComponent(params.project_id)+"&manufacturer_id="+encodeURIComponent(params.manufacturer_id||""); } })();
  (async function init(){
    render();                                  // show local/sample immediately
    fetchAccount();                            // prepaid balance for the green bar (Phase 0 visual)
    fetchProjectScope();                       // entered components/drawings for the reconciliation panel
    if(haveLive()){
      scheduleZohoSave();                      // persist the freshly-arrived take-off to the project
    } else if(params.project_id){
      setSaveInd("loading saved…","var(--mut)");
      try{
        const r=await fetch(RAILWAY_URL+"/api/takeoff/saved/"+encodeURIComponent(params.project_id));
        const d=await r.json();
        if(d.ok && d.found && d.package && Array.isArray(d.package.rows) && d.package.rows.length){
          const R=d.package; R.__project=params.project_id; recomputeCsv(R); window.TAKEOFF_RESULT=R;
          try{ sessionStorage.setItem("takeoff_result",JSON.stringify(R)); const k=lsKey(); if(k) localStorage.setItem(k,JSON.stringify(R)); }catch(e){}
          render(); setSaveInd("💾 loaded from project","var(--grn)");
        } else { setSaveInd("",""); }
      }catch(e){ setSaveInd("",""); }
    }
  })();
</script>
