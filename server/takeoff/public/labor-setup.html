<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/takeoff/mc-token.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop Labor Setup</title>
<!--
  Shop labour setup. Reads and saves ONE shop's numbers through /api/labor/shop (Railway volume,
  no Zoho calls). Opened from Material Compass as
    /takeoff/labor-setup.html?manufacturer_id=<MFG record id>&t=<tenant token>

  v0.3 (2026-10-14): every number is per MATERIAL and PROCESS. A shop ticks the materials it works
  and the processes it owns, says which process does which job for each material (routing), and
  can replace any typical value. Blank = the typical value shown as the placeholder. The server
  (labor/processModel.js) re-checks everything and drops anything that is not a positive number;
  this page names those entries before saving instead of letting them vanish.
-->
<style>
  :root{
    --blue:#5F94CE; --ink:#1f2a37; --mut:#667; --line:#e3e6ea;
    --grn:#2e7d32; --grnbg:#e8f5e9; --ylw:#b45309; --ylwbg:#fff7ed;
    --red:#b91c1c; --redbg:#fdeeee;
  }
  *{box-sizing:border-box;}
  body{font-family:'Segoe UI',system-ui,sans-serif;margin:0;padding:24px;background:#eef1f5;color:var(--ink);}
  .wrap{max-width:1120px;margin:0 auto;}
  .appbar{max-width:1120px;margin:0 auto 14px;display:flex;align-items:center;gap:10px;padding:2px;flex-wrap:wrap;}
  .appbar .brand{font-weight:800;font-size:16px;color:var(--blue);letter-spacing:.2px;}
  .appbar .page{font-size:13px;color:var(--mut);border-left:1px solid var(--line);padding-left:10px;}
  .appbar .state{font-size:12px;color:var(--mut);margin-left:auto;}
  .appbar .state.dirty{color:var(--ylw);font-weight:600;}
  .btn{font:inherit;font-size:13px;font-weight:600;color:#fff;background:var(--blue);border:0;border-radius:6px;padding:7px 16px;cursor:pointer;}
  .btn:hover{opacity:.92;} .btn:disabled{opacity:.5;cursor:default;}
  .lnk{font:inherit;font-size:12px;font-weight:600;color:var(--blue);background:none;border:0;cursor:pointer;padding:4px 0;}
  .x{font:inherit;font-size:14px;color:var(--mut);background:none;border:0;cursor:pointer;padding:2px 6px;}
  .x:hover{color:var(--red);}
  .busy{position:fixed;top:0;left:0;right:0;z-index:50;color:#fff;text-align:center;padding:11px;font-size:14px;font-weight:600;display:none;box-shadow:0 2px 10px rgba(0,0,0,.18);background:var(--blue);}
  .busy.show{display:block;} .busy.err{background:var(--red);} .busy.ok{background:var(--grn);}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:14px;overflow:hidden;}
  .card h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0;padding:13px 18px;border-bottom:1px solid var(--line);background:#fafbfc;cursor:pointer;user-select:none;}
  .card h2 .lt{text-transform:none;letter-spacing:0;font-weight:400;}
  .card h2 .car{display:inline-block;width:14px;color:#9aa6b2;}
  .card.closed .body{display:none;}
  .card .body{padding:16px 18px;}
  .hero h2{cursor:default;}
  .hero .body{padding:18px;background:linear-gradient(180deg,#fff,#f7f9fc);}
  .hero h1{margin:0 0 6px;font-size:20px;}
  .hero p{margin:0 0 6px;font-size:13.5px;line-height:1.55;color:#334;max-width:820px;}
  .note{font-size:12.5px;color:var(--mut);line-height:1.5;margin:0 0 12px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 18px;}
  label.f{display:block;font-size:12px;font-weight:600;color:#445;}
  label.f .h{display:block;font-weight:400;color:var(--mut);margin-top:2px;}
  input,select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid #cdd3da;border-radius:6px;background:#fff;color:var(--ink);width:100%;margin-top:4px;}
  input::placeholder{color:#a3adb8;}
  input:focus,select:focus{border-color:var(--blue);outline:none;}
  input.bad{border-color:var(--red);background:#fff6f6;}
  input.mine{border-color:#9cc79f;background:#f6fbf6;}
  input.num{text-align:right;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:5px 5px;border-bottom:1px solid #f0f2f4;vertical-align:middle;}
  td input,td select{margin-top:0;}
  td.sm input{width:70px;} td.xs input{width:56px;}
  tr.grp td{background:#fafbfc;font-weight:700;font-size:12px;color:#445;padding-top:10px;}
  td.ref{font-size:11.5px;color:var(--mut);line-height:1.4;}
  td.r{text-align:right;white-space:nowrap;}
  td.calc{font-size:12px;color:#3d6ea8;white-space:nowrap;text-align:right;}
  .rates{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .rate{border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12.5px;background:#fafbfc;}
  .rate b{font-size:15px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px;}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #cdd3da;border-radius:16px;padding:4px 11px;font-size:12.5px;cursor:pointer;background:#fff;user-select:none;}
  .chip input{width:auto;margin:0;}
  .chip.on{background:#eaf2fb;border-color:var(--blue);color:#1f3a5f;font-weight:600;}
  .fam{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-top:6px;}
  .src{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:9px;white-space:nowrap;}
  .src.yours{background:var(--grnbg);color:var(--grn);} .src.typical{background:var(--ylwbg);color:var(--ylw);} .src.sentry,.src.library{background:#eef3fa;color:#3d6ea8;} .src.missing{background:var(--redbg);color:var(--red);}
  .warn{font-size:12px;color:var(--ylw);}
  .foot{display:flex;align-items:center;gap:14px;justify-content:flex-end;margin:4px 0 30px;}
  .errs{background:var(--redbg);border:1px solid #f3c9c9;color:var(--red);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:none;}
  .errs.show{display:block;} .errs ul{margin:6px 0 0;padding-left:18px;}
  .scroll{overflow-x:auto;}
  .legend{font-size:12px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:6px;}
  @media (max-width:640px){ body{padding:12px 16px;} .card .body{padding:14px;} }
</style>
</head>
<body>
<div id="busy" class="busy"></div>
<div class="appbar"><span class="brand">Material Compass</span><span class="page">Shop Labor Setup</span>
  <span id="state" class="state"></span></div>
<div class="wrap" id="wrap"><div class="card"><div class="body">Loading your shop setup…</div></div></div>

<script>
  const MC_HOST = "https://material-compass-nesting-app-production.up.railway.app";
  const RAILWAY_URL = /(^|\.)up\.railway\.app$|^localhost$/.test(location.hostname) ? "" : MC_HOST;
  const VERSION = "v0.4 · 2026-10-14";  // bump on every push so you can verify what loaded
  console.log("Material Compass labor-setup.html " + VERSION);

  const MFG = (new URLSearchParams(location.search).get("manufacturer_id") || "").trim();
  let SHOP = null;     // last response from the server
  let S = null;        // what is on screen: { settings, rates, model, pipe_anchors, reference_jobs }
  let PV = null;       // live preview of S.model: { params, preview, catalog }
  let dirty = false;
  const CLOSED = {};   // card id -> collapsed

  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const num = (v) => { const s = String(v == null ? "" : v).trim(); if (!s) return null; const n = Number(s); return Number.isFinite(n) ? n : NaN; };
  const fmt = (n, d) => n == null || !Number.isFinite(Number(n)) ? "" : String(Math.round(n * Math.pow(10, d)) / Math.pow(10, d));
  const D = () => SHOP.model_defaults;
  const P = () => (PV && PV.params) || SHOP.model_params;
  const matLabel = (k) => (D().materials.find((m) => m.key === k) || { label: k }).label;
  const procs = (fam) => D().processes.filter((p) => p.family === fam);
  const procLabel = (k) => (D().processes.find((p) => p.key === k) || { label: k }).label;
  const has = (k) => S.model.capabilities.indexOf(k) > -1;
  const mats = () => S.model.materials;

  function busy(msg, kind, ms) {
    const b = $("busy"); b.className = "busy show" + (kind ? " " + kind : ""); b.textContent = msg;
    if (ms) setTimeout(() => { b.className = "busy"; }, ms);
  }
  function markDirty(on) {
    dirty = on;
    const st = $("state");
    st.className = "state" + (on ? " dirty" : "");
    st.textContent = on ? "Unsaved changes" : (SHOP && SHOP.updated ? "Saved " + new Date(SHOP.updated).toLocaleString() : "Not saved yet");
  }
  window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  async function api(path, body) {
    const r = await fetch(RAILWAY_URL + path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
    let j = null; try { j = await r.json(); } catch (e) {}
    if (!r.ok || !j || !j.ok) throw new Error((j && j.error) || ("server said " + r.status));
    return j;
  }

  // ---- load ------------------------------------------------------------------
  async function load() {
    if (!/^\d{6,25}$/.test(MFG)) {
      $("wrap").innerHTML = '<div class="card"><div class="body">This page needs to be opened from Material Compass so it knows which shop it is for.</div></div>';
      return;
    }
    try {
      const j = await api("/api/labor/shop?manufacturer_id=" + encodeURIComponent(MFG));
      take(j.shop); PV = null; render(); markDirty(false);
    } catch (e) {
      $("wrap").innerHTML = '<div class="card"><div class="body">Could not load your shop setup: ' + esc(e.message) + '</div></div>';
    }
  }

  // Server shape → the editable copy. Old single-process settings arrive already mapped onto the
  // model (model_input), so a shop's earlier entries show in their new places.
  function take(shop) {
    SHOP = shop;
    const mi = JSON.parse(JSON.stringify(shop.model_input || {}));
    const p = shop.model_params;
    S = {
      settings: Object.assign({}, shop.settings),
      rates: Object.assign({}, shop.rates),
      model: Object.assign({ weld: {}, cut: {}, saw: {}, cut_handling_min: {}, saw_setup_min: {}, cleanup: {}, fit_factor: {},
        shear_max_t: {}, general: {}, form: {}, routing: {} }, mi,
        { capabilities: (mi.capabilities && mi.capabilities.length ? mi.capabilities : p.capabilities).slice(),
          materials: (mi.materials && mi.materials.length ? mi.materials : p.materials).slice() }),
      pipe_anchors: (shop.pipe_anchors || []).map((a) => Object.assign({}, a)),
      reference_jobs: (shop.reference_jobs || []).map((j) => Object.assign({ material: "CS" }, j)),
    };
  }

  // ---- render ----------------------------------------------------------------
  function card(id, title, sub, body) {
    const closed = !!CLOSED[id];
    return '<div class="card' + (closed ? " closed" : "") + '" id="card_' + id + '"><h2 onclick="togCard(\'' + id + '\')"><span class="car">' + (closed ? "▸" : "▾") + '</span>' +
      title + (sub ? ' <span class="lt">· ' + sub + '</span>' : "") + '</h2><div class="body">' + body + '</div></div>';
  }
  function togCard(id) { CLOSED[id] = !CLOSED[id]; const c = $("card_" + id); c.classList.toggle("closed", CLOSED[id]); c.querySelector(".car").textContent = CLOSED[id] ? "▸" : "▾"; }

  function render() {
    $("wrap").innerHTML =
      '<div class="card hero"><div class="body"><h1>Your shop\'s labor numbers</h1>' +
      '<p><b>What you enter here matters more than anything else in the labor estimate.</b> Hours are worked out from how the work is done — ' +
      'the weld metal and how fast you lay it, the length of cut and how fast your cutter goes, the parts you handle — for each <b>material</b> and <b>process</b> you run.</p>' +
      '<p>Every box shows a starting value in grey. <span class="src sentry">Sentry</span> values come from Sentry\'s own records; <span class="src typical">typical</span> values are ' +
      'general industry figures to replace with your own. Type over any of them and it turns <span class="src yours">yours</span>. Reference jobs (real jobs with real hours) carry the most weight of all. ' +
      'These numbers are private to your shop.</p></div></div>' +
      '<div id="errs" class="errs"></div>' +
      card("caps", "1. What your shop works with", "materials and processes", capsBody()) +
      card("route", "2. Which process does which job", "per material", '<div id="routeBox"></div>') +
      card("weld", "3. Welding", "per process and material", '<div id="weldBox"></div>') +
      card("cut", "4. Cutting", "plate profiles, saws and shears", '<div id="cutBox"></div>') +
      card("fit", "5. Fit-up, handling and frame members", "", '<div id="fitBox"></div>') +
      card("comp", "6. Standard components", "per foot or per piece, by material", '<div id="compBox"></div>') +
      card("form", "7. Forming & machining", "for the processes you ticked", '<div id="formBox"></div>') +
      card("jobs", "8. Reference jobs", "the most important section", jobsBody()) +
      card("pipe", "9. Pipe butt welds", "only if you do pipe work", pipeBody()) +
      '<div class="foot"><span id="footState" class="note" style="margin:0"></span><button class="btn" id="saveBtn" onclick="save()">Save setup</button></div>';
    renderAll();
  }
  function renderAll() { renderRoute(); renderWeld(); renderCut(); renderFit(); renderComponents(); renderForm(); renderJobs(); renderPipe(); }

  // Generic input bound to a path in S.model, e.g. ["weld","MIG|CS","dep"]. Blank deletes it.
  function inp(path, placeholder, opts) {
    const o = opts || {};
    let v = S.model; for (const k of path) v = v == null ? undefined : v[k];
    const shown = v == null ? "" : (o.pct ? fmt(v * 100, 1) : v);
    const typ = placeholder == null || placeholder === "" ? "" : (o.pct ? fmt(placeholder * 100, 1) : fmt(placeholder, o.d == null ? 3 : o.d));
    return '<input class="num' + (v != null && v !== "" ? " mine" : "") + '" inputmode="decimal" data-p="' + esc(JSON.stringify(path)) + '"' + (o.pct ? ' data-pct="1"' : "") +
      ' value="' + esc(shown) + '" placeholder="' + esc(typ) + '" oninput="setM(this)" title="' + esc(o.title || "Blank uses the grey value") + '">';
  }
  function setM(el) {
    const path = JSON.parse(el.dataset.p);
    let o = S.model; for (let i = 0; i < path.length - 1; i++) { o[path[i]] = o[path[i]] || {}; o = o[path[i]]; }
    const last = path[path.length - 1], x = num(el.value);
    if (x == null) delete o[last]; else o[last] = el.dataset.pct ? (Number.isFinite(x) ? x / 100 : NaN) : el.value;
    el.classList.toggle("mine", x != null);
    el.classList.toggle("bad", x != null && (!Number.isFinite(x) || (path[0] === "cleanup" ? x < 0 : !(x > 0)) || (el.dataset.pct && path[0] !== "cleanup" && x > 100)));
    markDirty(true); refresh();
  }
  let pvTimer = null;
  function refresh() { clearTimeout(pvTimer); pvTimer = setTimeout(runPreview, 400); }
  async function runPreview() {
    try {
      PV = await api("/api/labor/model-preview", { manufacturer_id: MFG, model: payload().model, rates: payload().rates, grid: GRID });
      updateCalcs();
      // Component starting values follow the welding and cutting numbers; redraw them unless one is being typed in.
      if (!(document.activeElement && document.activeElement.dataset && document.activeElement.dataset.key)) renderComponents();
    } catch (e) { console.warn("[preview]", e.message); }
  }
  // Only the read-only figures redraw, so a box being typed in keeps its focus.
  function updateCalcs() {
    document.querySelectorAll("[data-calc]").forEach((el) => { el.innerHTML = calcText(el.dataset.calc); });
    renderGrid();
  }
  function calcText(k) {
    const pv = (PV && PV.preview) || SHOP.model_preview;
    const [kind, a, b] = k.split(":");
    if (kind === "weld") { const w = pv.weld[a]; return w ? fmt(w.hr_per_ft, 4) + ' <span class="note">hr/ft</span>' : '<span class="warn">—</span>'; }
    if (kind === "cut") { const c = pv.cut[a]; return c ? [0.25, 0.5, 1].map((t) => c[t] == null ? "—" : fmt(c[t], 1)).join(" / ") : '<span class="warn">—</span>'; }
    if (kind === "member") { const m = pv.member[a]; if (!m) return ""; if (m.missing) return '<span class="warn">' + esc(m.missing) + '</span>';
      return '× <b>' + fmt(m.thin, 2) + '</b> thin wall (' + esc(m.thin_weld || "?") + ') &nbsp; × <b>' + fmt(m.thick, 2) + '</b> heavy (' + esc(m.thick_weld || "?") + ')'; }
    if (kind === "route") { const r = pv.routing[a]; if (!r) return ""; return r.notes.length ? '<span class="warn">' + r.notes.map(esc).join("<br>") + '</span>' : '<span class="note">✓</span>'; }
    if (kind === "comp") { const c = ((PV && PV.catalog) || SHOP.catalog).find((x) => x.key === a); const cell = c && c.by_material && c.by_material[b];
      return cell && cell.library != null ? fmt(cell.library, 3) : '<span class="warn">—</span>'; }
    return "";
  }
  const calc = (k) => '<span data-calc="' + esc(k) + '">' + calcText(k) + '</span>';

  // 1. Capabilities ---------------------------------------------------------------
  function capsBody() {
    const chip = (kind, key, label, on) => '<label class="chip' + (on ? " on" : "") + '"><input type="checkbox"' + (on ? " checked" : "") +
      ' onchange="togCap(\'' + kind + '\',\'' + key + '\',this)">' + esc(label) + '</label>';
    const fams = [["weld", "Welding"], ["cut", "Profile cutting"], ["saw", "Sawing & shearing"], ["form", "Forming"], ["machine", "Machining & drilling"], ["finish", "Finishing in-house"]];
    return '<p class="note">Tick every material you work and every process you own. Only these are asked about below and used in estimates. ' +
      'A process that cannot do a material (oxy-fuel on stainless or aluminum, stick on aluminum) is never chosen for it.</p>' +
      '<div class="fam">Materials</div><div class="chips">' + D().materials.map((m) => chip("mat", m.key, m.label, mats().indexOf(m.key) > -1)).join("") + '</div>' +
      fams.map(([f, l]) => '<div class="fam">' + l + '</div><div class="chips">' + procs(f).map((p) => chip("proc", p.key, p.label, has(p.key))).join("") + '</div>').join("");
  }
  function togCap(kind, key, el) {
    const list = kind === "mat" ? S.model.materials : S.model.capabilities;
    const i = list.indexOf(key);
    if (el.checked && i < 0) list.push(key); if (!el.checked && i > -1) list.splice(i, 1);
    el.parentNode.classList.toggle("on", el.checked);
    markDirty(true); renderAll(); refresh();
  }

  // 2. Routing ---------------------------------------------------------------------
  function sel(path, fam, mat) {
    const cur = (S.model.routing[mat] || {})[path] || (P().routing[mat] || {})[path];
    const opts = procs(fam).filter((p) => has(p.key));
    const known = opts.some((p) => p.key === cur);
    return '<select onchange="setRoute(\'' + mat + '\',\'' + path + '\',this.value)">' +
      (known ? "" : '<option value="' + esc(cur) + '" selected>' + esc(procLabel(cur)) + ' (not ticked)</option>') +
      opts.map((p) => '<option value="' + p.key + '"' + (p.key === cur ? " selected" : "") + '>' + esc(p.label) + '</option>').join("") + '</select>';
  }
  function splitIn(mat, f) {
    const v = (S.model.routing[mat] || {})[f];
    const d = (P().routing[mat] || {})[f];
    return '<input class="num' + (v != null ? " mine" : "") + '" style="width:60px" inputmode="decimal" value="' + esc(v == null ? "" : v) + '" placeholder="' + esc(d) + '" oninput="setRoute(\'' + mat + '\',\'' + f + '\',this.value,this)">';
  }
  function setRoute(mat, f, v, el) {
    S.model.routing[mat] = S.model.routing[mat] || {};
    if (v === "" || v == null) delete S.model.routing[mat][f]; else S.model.routing[mat][f] = v;
    if (el) el.classList.toggle("mine", v !== "");
    markDirty(true); refresh();
  }
  function renderRoute() {
    $("routeBox").innerHTML = '<p class="note">For each material: the welding process for thin work (at or under the split thickness) and for heavier work, the cutter for plate up to the split and above it, and the saw for members and bar. ' +
      'A process you have not ticked is skipped and the nearest one you have is used — shown in orange.</p>' +
      '<div class="scroll"><table><thead><tr><th>Material</th><th>Weld thin</th><th>Split, in</th><th>Weld heavy</th><th>Plate up to</th><th>Split, in</th><th>Plate thicker</th><th>Members & bar</th><th></th></tr></thead><tbody>' +
      mats().map((m) => '<tr><td><b>' + esc(matLabel(m)) + '</b></td><td>' + sel("weld_thin", "weld", m) + '</td><td>' + splitIn(m, "weld_split") + '</td><td>' + sel("weld", "weld", m) + '</td>' +
        '<td>' + sel("plate", "cut", m) + '</td><td>' + splitIn(m, "plate_split") + '</td><td>' + sel("plate_thick", "cut", m) + '</td><td>' + sel("member", "saw", m) + '</td>' +
        '<td class="ref">' + calc("route:" + m) + '</td></tr>').join("") + '</tbody></table></div>';
  }

  // 3. Welding ---------------------------------------------------------------------
  function renderWeld() {
    const ws = procs("weld").filter((p) => has(p.key));
    const dflt = D().weld;
    let rows = "";
    ws.forEach((p) => {
      rows += '<tr class="grp"><td colspan="5">' + esc(p.label) + '</td></tr>';
      mats().forEach((m) => {
        const d = (dflt[p.key] || {})[m];
        const key = p.key + "|" + m, src = d && d[2] === "sentry" ? "sentry" : "typical";
        rows += '<tr><td style="padding-left:18px">' + esc(matLabel(m)) + (d ? ' <span class="src ' + src + '">' + src + '</span>' : "") + '</td>' +
          '<td class="sm">' + inp(["weld", key, "dep"], d && d[0], { d: 2 }) + '</td><td class="sm">' + inp(["weld", key, "of"], d && d[1], { pct: true }) + '</td>' +
          '<td class="calc">' + calc("weld:" + key) + '</td><td class="ref">' + (d ? "" : 'not usually done — enter both numbers if your shop does it') + '</td></tr>';
      });
    });

      (has("SHEAR") ? '<div class="fam" style="margin-top:14px">Shear</div><div class="grid"><label class="f">Minutes per shear cut' + inp(["general", "shear_min"], D().shear_min, { d: 2 }) + '</label>' +

  function setJob(i, k, el) {

      const v = num(j[k]);

    });

  }

  // ---- save ------------------------------------------------------------------
  // Numbers out of the model as numbers; blanks are already deleted by setM.
  function modelOut() {
    const m = JSON.parse(JSON.stringify(S.model));
    const walk = (o) => { for (const k of Object.keys(o)) { const v = o[k];
      if (v && typeof v === "object" && !Array.isArray(v)) walk(v);
      else if (typeof v === "string" && !/^(capabilities|materials)$/.test(k) && num(v) != null && !Number.isNaN(num(v)) && !isProc(v)) o[k] = num(v); } };
    walk(m); return m;
  }
  const isProc = (v) => D().processes.some((p) => p.key === v);
  function payload() {
    const s = S.settings;
    const n = (v) => { const x = num(v); return x == null ? null : x; };
    return {
      manufacturer_id: MFG,
      settings: Object.assign({}, s, { start_from_sentry: SHOP.settings.start_from_sentry === true }),
      rates: Object.fromEntries(Object.entries(S.rates).map(([k, v]) => [k, n(v)])),
      model: modelOut(),
      pipe_anchors: S.pipe_anchors.map((a) => ({ size: a.size, schedule: a.schedule, hours: n(a.hours) })),
      reference_jobs: S.reference_jobs.map((j) => Object.assign({}, j, { tons: n(j.tons), hours: n(j.hours), pieces: n(j.pieces) })),
    };
  }
  // The server drops anything that is not a positive number. Name it here instead.
  function problems() {
    const out = [];
    document.querySelectorAll("#wrap input.bad").forEach((el) => {
      const row = el.closest("tr"), lab = el.closest("label"), cardEl = el.closest(".card");
      let grp = row; while (grp && !(grp.classList && grp.classList.contains("grp"))) grp = grp.previousElementSibling;
      const where = [cardEl ? cardEl.querySelector("h2").innerText.replace(/^[▸▾]\s*/, "").split("·")[0].trim() : "",
        grp && grp !== row ? grp.cells[0].innerText.trim() : "",
        row ? row.cells[0].innerText.replace(/\b(typical|sentry|cannot cut)\b/g, "").trim() : lab ? lab.firstChild.textContent.trim() : ""].filter(Boolean).join(" › ");
      out.push(where + ": \"" + el.value + "\" is not a usable number (blank uses the grey value).");
    });
    const g = S.model.general || {};
    const sh = ["share_cut", "share_fit", "share_weld"].map((k) => g[k]);
    if (sh.some((x) => x != null) && (sh.some((x) => x == null) || Math.abs(sh.reduce((a, b) => a + Number(b || 0), 0) - 1) > 0.02))
      out.push("Frame member split: enter all three percentages adding to 100, or leave all three blank.");
    if (!mats().length) out.push("Section 1: tick at least one material.");
    S.pipe_anchors.forEach((a) => { if (!(num(a.hours) > 0)) out.push("Pipe joint " + a.size + " " + a.schedule + ": hours are needed, or remove the row."); });
    S.reference_jobs.forEach((j, i) => {
      const name = j.name || j.job_number || ("row " + (i + 1));
      if (!(num(j.tons) > 0) || !(num(j.hours) > 0)) out.push("Reference job \"" + name + "\": needs both tons and hours above zero, or remove the row.");
    });
    return out.filter((x, i, a) => a.indexOf(x) === i);
  }
  async function save() {
    const p = problems(), box = $("errs");
    if (p.length) {
      box.innerHTML = "Nothing was saved. Fix these first:<ul>" + p.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul>";
      box.className = "errs show"; box.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    box.className = "errs";
    $("saveBtn").disabled = true; busy("Saving…");
    try {
      const j = await api("/api/labor/shop", payload());
      take(j.shop); PV = null; render(); markDirty(false);
      busy("Saved", "ok", 1800);
    } catch (e) { busy("Save failed: " + e.message, "err", 6000); }
    finally { const b = $("saveBtn"); if (b) b.disabled = false; }
  }

  load();
</script>
