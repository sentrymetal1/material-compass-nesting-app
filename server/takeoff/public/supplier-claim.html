<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Claim your company on Material Compass</title>
<!--
  A supplier claims its Material Compass login from a customer's invite: /takeoff/supplier-claim.html?c=<signed link>.
  No login and no shop token; the signed link is the proof (server/suppliers/claim.js).
-->
<style>
  :root{--blue:#5286B4;--ink:#1f2a37;--mut:#667;--red:#b91c1c;--grn:#2e7d32;}
  *{box-sizing:border-box;}
  body{font-family:'Segoe UI',system-ui,sans-serif;margin:0;background:#eef2f7;color:var(--ink);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:48px 18px;}
  .card{background:#fff;border:1px solid #d9e2ec;border-radius:12px;max-width:560px;width:100%;overflow:hidden;box-shadow:0 8px 30px rgba(20,30,40,.08);}
  .hd{padding:18px 26px;display:flex;align-items:center;gap:10px;} .hd img{width:42px;height:42px;} .hd span{font-family:Georgia,serif;font-size:17px;letter-spacing:4px;color:var(--blue);}
  .band{background:var(--blue);color:#fff;padding:18px 26px;} .band h1{font-size:20px;margin:0;} .band div{font-size:13px;opacity:.92;margin-top:2px;}
  .bd{padding:22px 26px;font-size:14.5px;line-height:1.6;}
  .co{border:1px solid #d9e2ec;border-radius:8px;padding:12px 14px;background:#f7f9fc;margin:10px 0 14px;} .co b{font-size:16px;}
  .btn{font:inherit;font-size:15px;font-weight:700;color:#fff;background:var(--blue);border:0;border-radius:6px;padding:12px 26px;cursor:pointer;} .btn:disabled{opacity:.5;cursor:default;}
  .mut{font-size:12.5px;color:var(--mut);} .err{color:var(--red);font-weight:600;} .ok{color:var(--grn);font-weight:700;font-size:16px;}
  ul{margin:6px 0 0 18px;padding:0;}
</style>
</head>
<body>
<div class="card">
  <div class="hd"><img src="/brand/mc-compass.png" alt=""><span>MATERIAL COMPASS</span></div>
  <div class="band"><h1 id="h">Claim your company</h1><div id="sub">Free for suppliers during early access</div></div>
  <div class="bd" id="bd">Checking your invite…</div>
</div>
<script>
const C = new URLSearchParams(location.search).get("c") || "";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// r: { email, has_admin, ask_admin, admin_notice_sent } from the claim. A rep login never makes anyone the
// company administrator; when there is no company mailbox on file, the rep is asked who manages the account.
function done(email, r) {
  r = r || {};
  let adminPart = "";
  if (r.ask_admin) {
    adminPart = '<div style="border:1px solid #f3c58b;background:#fff7ed;border-radius:8px;padding:12px 14px;margin:12px 0">' +
      "<b>Who manages your company&#39;s account?</b><div class=\"mut\" style=\"margin:4px 0 8px\">Your login is for you as a salesperson. Your company also needs an administrator, who controls who at your company can use Material Compass. " +
      "Enter the owner&#39;s, manager&#39;s or office&#39;s email (a shared one like office@ is best). We will send them a link; nothing changes until they accept.</div>" +
      '<input id="adName" placeholder="Their name (optional)" style="font:inherit;font-size:14px;padding:7px 9px;border:1px solid #cdd3da;border-radius:6px;width:100%;margin-bottom:6px">' +
      '<input id="adEmail" placeholder="Their email, e.g. office@yourcompany.com" style="font:inherit;font-size:14px;padding:7px 9px;border:1px solid #cdd3da;border-radius:6px;width:100%">' +
      '<div style="margin-top:8px"><button class="btn" id="adSend" style="font-size:14px;padding:9px 18px">Send them the administrator link</button> <span class="mut">or skip: you can tell them later.</span></div><div id="adMsg"></div></div>';
  } else if (r.admin_notice_sent) {
    adminPart = "<p>Your company&#39;s administrator is set up separately: we emailed your company&#39;s main address so the right person can take it on.</p>";
  } else {
    adminPart = "<p>Your login lets you see and price requests. Your company&#39;s administrator is set up separately.</p>";
  }
  $("bd").innerHTML = '<div class="ok">✓ Claimed</div>' + adminPart + '<p><b>Next:</b> watch for an email at <b>' + esc(email) + '</b> to set your password. Check your spam or junk folder too, and mark it Not spam so its link works.</p>' +
    "<p>After you set your password, Material Compass activates your login. That is usually within an hour during business hours, and you will get an email when it is done.</p>" +
    '<p>Then sign in at <a href="https://customer.materialcompassportal.com">customer.materialcompassportal.com</a>. Requests keep coming by email as well.</p>';
  if ($("adSend")) $("adSend").addEventListener("click", async () => {
    $("adSend").disabled = true;
    let x;
    try { x = await (await fetch("/api/suppliers/admin-request", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ c: C, email: $("adEmail").value, name: $("adName").value }) })).json(); }
    catch (e) { x = { ok: false, error: "Could not reach Material Compass. Please try again." }; }
    $("adSend").disabled = false;
    if (!x.ok) { $("adMsg").innerHTML = '<p class="err">' + esc(x.error) + "</p>"; return; }
    $("adMsg").innerHTML = x.sent ? '<p class="ok" style="font-size:14px">Sent to ' + esc(x.email) + ".</p>" : '<p style="font-size:14px"><b>Thanks.</b> Material Compass will confirm with your company before sending the administrator link.</p>';
    $("adSend").remove();
  });
}
(async () => {
  if (!C) { $("bd").innerHTML = '<span class="err">This link is not complete. Open it again from the invite email.</span>'; return; }
  let j;
  try { j = await (await fetch("/api/suppliers/claim?c=" + encodeURIComponent(C))).json(); } catch (e) { j = { ok: false, error: "Could not check your invite. Please try again." }; }
  if (!j.ok) { $("bd").innerHTML = '<span class="err">' + esc(j.error) + "</span>"; return; }
  $("h").textContent = "Claim " + j.supplier.name;
  if (j.claimed) { done(j.contact.email); return; }
  $("bd").innerHTML = "<p>Hi " + esc(j.contact.first || "there") + ", " + (j.invited_by ? esc(j.invited_by) + " sends you material quote requests through Material Compass and" : "a customer") +
    " has invited you to claim your company's free login.</p><div>Is this your company?</div><div class=\"co\"><b>" + esc(j.supplier.name) + '</b><div class="mut">' + esc(j.supplier.address) + (j.supplier.phone ? " · " + esc(j.supplier.phone) : "") + "</div></div>" +
    "<div>With a login you can:</div><ul><li>see your customers' requests in one place and price them online,</li><li>keep your company details and contacts current,</li><li>later, list what you stock so matching requests find you.</li></ul>" +
    '<p style="margin-top:16px"><button class="btn" id="acc">Yes, claim ' + esc(j.supplier.name) + '</button></p><p class="mut">For ' + esc(j.contact.email) + ". Not your company? Close this page and nothing changes.</p>";
  $("acc").addEventListener("click", async () => {
    $("acc").disabled = true; $("acc").textContent = "Claiming…";
    let r;
    try { r = await (await fetch("/api/suppliers/claim", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ c: C }) })).json(); }
    catch (e) { r = { ok: false, error: "Could not reach Material Compass. Please try again." }; }
    if (!r.ok) { $("acc").disabled = false; $("acc").textContent = "Yes, claim " + j.supplier.name; $("bd").insertAdjacentHTML("beforeend", '<p class="err">' + esc(r.error) + "</p>"); return; }
    done(r.email, r);
  });
})();
</script>
</body>
</html>
